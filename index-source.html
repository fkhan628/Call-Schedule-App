            <p style={{fontSize:10,color:"#8a94a0",marginTop:6}}>{isScheduler ? "Click a name to copy their subscribe URL." : "Paste this URL into your calendar app to subscribe."} Requires deploying the calendar-sync Edge Function.</p>
          </div>

          {/* Refresh App */}
          <div style={css.card}>
            <div style={css.cardT}>🔄 Refresh App</div>
            <p style={{fontSize:12,color:"#5a6a78",marginBottom:10,lineHeight:1.4}}>If the app seems stuck on an old version or the schedule looks wrong, tap below to clear the cache and reload fresh.</p>
            <button onClick={()=>{
              if (confirmReloadWithPending("Refresh the app? This clears the local cache and reloads the latest version. No data is lost.")) {
                if (typeof window.__dsgHardReset === "function") window.__dsgHardReset();
                else window.location.reload();
              }
            }} style={{...css.btn(true),padding:"8px 16px",fontSize:13,borderRadius:7}}>
              Refresh Now
            </button>
          </div>

          {/* Reset */}
          {isScheduler && <div style={css.card}>
            <div style={css.cardT}>🛟 Data Management</div>

            {/* Manual JSON backup */}
            <p style={{fontSize:12,color:"#5a6a78",marginBottom:10,lineHeight:1.4}}>
              Download a full JSON backup of the current schedule, vacations, APP shifts, and counts. Grab one before any big change — it can be re-imported or used to rebuild the database.
            </p>
            <button onClick={()=>{
              try {
                const backup = {
                  ...buildStateBundle(),
                  _app: "DSG Call Schedule",
                  _exportedAt: new Date().toISOString(),
                  appShifts, // included for a full restore (not part of the saved row)
                  appDayOff, // APP weekday day-offs (app_shifts_data row id="dayoff")
                };
                const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
                const downloaded = downloadJSON(backup, `dsg-call-backup-${stamp}.json`);
                setSaveStatus(downloaded ? "Backup exported" : "Backup opened — use Share → Save to Files");
                setTimeout(()=>setSaveStatus(""),3000);
              } catch(e) {
                alert("Export failed: " + (e && e.message ? e.message : String(e)) +
                  "\n\nMake sure helpers.js was deployed and APP_VERSION was bumped so the new code is loaded.");
              }
            }} style={{...css.btn(true),padding:"8px 16px",fontSize:13,borderRadius:7}}>
              ⬇ Export Backup (JSON)
            </button>

            {/* Danger zone — reset */}
            <div style={{borderTop:"1px solid #f0d8d8",marginTop:16,paddingTop:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#a05050",letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Danger Zone</div>
              <p style={{fontSize:11,color:"#a06868",marginBottom:10,lineHeight:1.4}}>
                Clears the entire saved schedule for everyone. A snapshot is saved automatically, but export a backup above first to be safe. Requires typing <strong>RESET</strong> to confirm.
              </p>
              <button onClick={resetAllData} style={{background:"none",border:"1px solid #e8c0c0",color:"#804040",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:font}}>
                Reset All Data
              </button>
            </div>
          </div>}

          {/* Restore from snapshot — scheduler/admin only */}
          {(isScheduler || userProfile?.role === "admin") && <div style={css.card}>
            <div onClick={()=>toggleSettingsCard("restoreSnap")} style={{...css.cardT,margin:openSettingsCards.restoreSnap?"0 0 12px":0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",userSelect:"none"}}>
              <span>📼 Restore from Snapshot</span>
              <span style={{fontSize:12,color:"#7a8a98"}}>{openSettingsCards.restoreSnap ? "▾" : "▸"}</span>
            </div>
            {openSettingsCards.restoreSnap && <>
            <p style={{fontSize:12,color:"#5a6a78",marginBottom:10,lineHeight:1.4}}>
              Snapshots are saved automatically before destructive actions and periodically. Restoring replaces the current schedule and setup for everyone with the selected copy. A fresh snapshot of the current state is saved first, so a restore can itself be undone.
            </p>
            {snapshotsLoading && <div style={{fontSize:12,color:"#7a8a98"}}>Loading snapshots…</div>}
            {!snapshotsLoading && snapshotLoadFailed && (
              <div style={{fontSize:12,fontWeight:600,color:"#a02020",background:"#fce8e8",border:"1px solid #e0a8a8",borderRadius:6,padding:"6px 10px"}}>
                ⚠ Couldn't load your backups — this does NOT mean none exist. Tap Refresh; if it keeps failing, reload the app (your session may have expired).
              </div>
            )}
            {!snapshotsLoading && !snapshotLoadFailed && (!snapshotList || snapshotList.length === 0) && (
              <div style={{fontSize:12,color:"#7a8a98"}}>No snapshots yet.</div>
            )}
            {!snapshotsLoading && snapshotList && snapshotList.map(sn => (
              <div key={sn.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px solid #f0f2f4"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:"#3a4a58"}}>{snapshotReasonLabel(sn.reason)}</div>
                  <div style={{fontSize:10,color:"#8a94a0",fontFamily:mono}}>{new Date(sn.created_at).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}</div>
                </div>
                <button disabled={!!restoreBusyId} onClick={()=>restoreSnapshot(sn)}
                  style={{background:"none",border:"1px solid #b8cfe0",color:restoreBusyId?"#a8b4c0":"#1a6fa8",borderRadius:6,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:restoreBusyId?"default":"pointer",fontFamily:font}}>
                  {restoreBusyId===sn.id ? "Restoring…" : "Restore"}
                </button>
              </div>
            ))}
            <button onClick={loadSnapshots} disabled={snapshotsLoading} style={{background:"none",border:"none",color:"#1a6fa8",fontSize:11,cursor:"pointer",fontFamily:font,padding:"8px 0 0",fontWeight:600}}>
              ↻ Refresh list
            </button>
            </>}
          </div>}
        </>}
      </div>
      </>}
    </div>
  );
}

const thS = {textAlign:"left",padding:"7px 8px",color:"#5a6a78",fontWeight:600,fontSize:10,textTransform:"uppercase",letterSpacing:0.5};
const thS2 = {textAlign:"left",padding:"4px 8px",color:"#7a8a98",fontWeight:500,fontSize:10,textTransform:"uppercase",letterSpacing:0.3};
const tdS = {padding:"7px 8px",fontFamily:"'JetBrains Mono',monospace",color:"#4a5a68",fontSize:13};

// ─── Error boundary ───
// A render exception anywhere in the tree would otherwise white-screen the whole
// app — the worst possible failure for someone checking who's on call. This
// catches it, logs it, and shows a recoverable screen. Saved data is untouched:
// the DB row is only written by deliberate saves, never by a crashed render.

// ─── Month painter — full-screen bulk-entry sheet (phone-first) ───
// One shared component, two mounts: mode="app" (APP call shifts, opened from
// the APP Call Shifts card) and mode="timeoff" (vacations/no-call, opened
// from the Vacations card). A VERTICAL DAY LIST, not a grid: full-width rows
// keep tap targets comfortably >44pt in portrait and leave room to show who
// is already off each day — which is half the point.
//
// Contract (the part that matters):
//  - Painting NEVER writes per tap. The draft lives HERE; commit happens on
//    explicit Save through the parent's onCommit = ONE network write and ONE
//    audit entry for the whole batch.
//  - A failed commit wrote NOTHING (single upsert / atomic bulk insert): the
//    error box names every pending entry, the draft stays fully populated,
//    the unsaved indicator stays up, and no success signal appears anywhere.
//  - Mis-taps are reversible before save: tap again to undo (app mode),
//    tap a pending start to cancel it, tap inside a drafted range to remove
//    that entry (timeoff mode). Discard asks before dropping a dirty draft;
//    so does the close button.
// Defined at MODULE SCOPE deliberately: inside CallSchedule its identity
// would change every parent render and React would remount it — silently
// resetting the draft (the same stale/lost-state class the conventions
// block warns about). Uses React.* hooks like Collapsible below. Date
// helpers (fmt/parse/addD), DAY_HDR/MO, surgeonColors and APP_PAL are plain
// globals from helpers.js/config.js.
function MonthPainterSheet({ mode, css, dk, surgeons, apps, appShifts, vacations, noCallDays, appDayOff, dayOffId, onCommit, onClose }) {
  const today = new Date();
  const [ym, setYm] = React.useState({ y: today.getFullYear(), m: today.getMonth() });
  const [armedApp, setArmedApp] = React.useState("");
  const [armedPerson, setArmedPerson] = React.useState("");
  const [armedKind, setArmedKind] = React.useState("vacation");
  const [draftApp, setDraftApp] = React.useState({});        // ds -> appId | null (null = clear on save)
  const [draftEntries, setDraftEntries] = React.useState([]); // [{personId, kind, start, end}]
  const [pendingStart, setPendingStart] = React.useState(null); // ds of an armed range start
  const [busy, setBusy] = React.useState(false);
  const [commitError, setCommitError] = React.useState(null);   // { msg, items: [names…] }
  const [savedNote, setSavedNote] = React.useState("");
  const savedTimerRef = React.useRef(null);

  const isApp = mode === "app";
  const dirtyCount = isApp ? Object.keys(draftApp).length : draftEntries.length;

  const personName = (id) => (surgeons.find(s => s.id === id) || apps.find(a => a.id === id) || {}).name || id;
  const pillStyle = (id) => {
    const si = surgeons.findIndex(s => s.id === id);
    if (si >= 0) { const c = surgeonColors(surgeons[si].name, si); return { background: c.tg, color: c.tx, border: `1px solid ${c.bd}` }; }
    const ai = apps.findIndex(a => a.id === id);
    const p = APP_PAL[(ai >= 0 ? ai : 0) % APP_PAL.length];
    return { background: p.tg, color: p.tx, border: `1px solid ${p.bd}` };
  };

  const days = React.useMemo(() => {
    const out = []; const n = new Date(ym.y, ym.m + 1, 0).getDate();
    for (let d = 1; d <= n; d++) out.push(new Date(ym.y, ym.m, d));
    return out;
  }, [ym]);

  // Who's already off, per day of the shown month — vacations + no-call for
  // ALL people, plus APP weekday day-offs. Derived from live props each
  // render, so realtime updates show through while painting.
  const offByDay = React.useMemo(() => {
    const map = {};
    const monthStart = fmt(new Date(ym.y, ym.m, 1));
    const monthEnd = fmt(new Date(ym.y, ym.m + 1, 0));
    const addRange = (id, vs, ve, kind) => {
      if (!vs || !ve || ve < monthStart || vs > monthEnd) return;
      let d = parse(vs < monthStart ? monthStart : vs);
      const stop = ve > monthEnd ? monthEnd : ve;
      while (fmt(d) <= stop) { const ds = fmt(d); (map[ds] = map[ds] || []).push({ id, kind }); d = addD(d, 1); }
    };
    for (const [pid, ranges] of Object.entries(vacations || {})) for (const r of (ranges || [])) { if (Array.isArray(r)) addRange(pid, r[0], r[1], "vacation"); }
    for (const [pid, ranges] of Object.entries(noCallDays || {})) for (const r of (ranges || [])) { if (Array.isArray(r)) addRange(pid, r[0], r[1], "nocall"); }
    for (const [ds, list] of Object.entries(appDayOff || {})) {
      if (ds < monthStart || ds > monthEnd) continue;
      for (const x of (list || [])) { const id = dayOffId(x); if (id) (map[ds] = map[ds] || []).push({ id, kind: "dayoff" }); }
    }
    return map;
  }, [ym, vacations, noCallDays, appDayOff, dayOffId]);

  // Drafted-entry lookups: ALL entries covering a day (display/tint), and the
  // ARMED person's covering entry (tap-to-remove — scoped to the armed person
  // so painting B over A's drafted range can't silently delete A's entry;
  // overlapping vacations are half the point of this sheet).
  const draftCoveringAll = (ds) => draftEntries.map((en, i) => ({ en, i })).filter(x => x.en.start <= ds && ds <= x.en.end);
  const draftCoveringArmed = (ds) => draftEntries.findIndex(en => en.personId === armedPerson && en.start <= ds && ds <= en.end);

  const tapDay = (ds) => {
    setCommitError(null);
    if (isApp) {
      if (!armedApp) return;
      setDraftApp(p => {
        const n = { ...p };
        const saved = appShifts[ds] || null;
        const effective = (ds in n) ? n[ds] : saved;
        const wanted = (effective === armedApp) ? null : armedApp; // tap again = clear
        if (wanted === saved) delete n[ds]; else n[ds] = wanted;   // no-op drafts drop out
        return n;
      });
    } else {
      if (!armedPerson) return;
      const covered = draftCoveringArmed(ds);
      if (covered >= 0) { setDraftEntries(p => p.filter((_, i) => i !== covered)); return; } // remove the armed person's drafted entry
      if (!pendingStart) { setPendingStart(ds); return; }
      // Second tap completes the range; tapping the SAME day paints a
      // single-day entry (start=end) — single-day time off is common.
      // Cancelling a mis-tapped start is the ✕ in the hint line; a wrong
      // entry is removable anyway by tapping it before save.
      const [s, e] = pendingStart <= ds ? [pendingStart, ds] : [ds, pendingStart];
      setDraftEntries(p => [...p, { personId: armedPerson, kind: armedKind, start: s, end: e }]);
      setPendingStart(null);
    }
  };

  const describeDraft = () => isApp
    ? Object.entries(draftApp).sort(([a], [b]) => a.localeCompare(b)).map(([ds, aid]) => `${ds}: ${aid ? personName(aid) : "clear"}`)
    : draftEntries.map(en => `${personName(en.personId)} ${en.kind === "nocall" ? "no-call" : "vacation"} ${en.start}${en.end !== en.start ? " – " + en.end : ""}`);

  const doSave = async () => {
    if (!dirtyCount || busy) return;
    setBusy(true); setCommitError(null); setSavedNote(""); // a stale success note must never outlive the batch it described
    const items = describeDraft();
    let r;
    try { r = await onCommit(isApp ? draftApp : draftEntries); }
    catch (e) { r = { ok: false, error: String(e?.message || e) }; }
    finally { setBusy(false); } // an unexpected throw must never leave Save stuck on "Saving…"
    if (r && r.ok) {
      if (isApp) setDraftApp({}); else { setDraftEntries([]); setPendingStart(null); }
      setSavedNote(`✓ Saved ${items.length} change${items.length === 1 ? "" : "s"}`);
      if (savedTimerRef.current) clearTimeout(savedTimerRef.current);
      savedTimerRef.current = setTimeout(() => setSavedNote(""), 3000);
    } else {
      setCommitError({ msg: (r && r.error) || "unknown error", items });
    }
  };
  const doDiscard = () => {
    if (!dirtyCount) return;
    if (!confirm(`Discard ${dirtyCount} unsaved change${dirtyCount === 1 ? "" : "s"}?`)) return;
    setDraftApp({}); setDraftEntries([]); setPendingStart(null); setCommitError(null); setSavedNote("");
  };
  const doClose = () => {
    if (busy) return; // never close mid-save — the commit would land invisibly
    if (dirtyCount && !confirm(`Discard ${dirtyCount} unsaved change${dirtyCount === 1 ? "" : "s"} and close?`)) return;
    onClose();
  };
  React.useEffect(() => () => { if (savedTimerRef.current) clearTimeout(savedTimerRef.current); }, []);

  const bg = dk ? "#1a1a2e" : "#f0f2f5";
  const panelBg = dk ? "#16213e" : "#fff";
  const border = dk ? "#2a3a5e" : "#e0e4ea";
  const text = dk ? "#e0e0f0" : "#2c3e50";
  const muted = dk ? "#8a8aaa" : "#7a8a98";
  const kindChip = (k, label) => (
    <button key={k} onClick={() => setArmedKind(k)}
      style={{ minHeight: 40, padding: "6px 14px", borderRadius: 8, fontSize: 12, fontWeight: 700, fontFamily: font, cursor: "pointer",
        // gradient (not flat) when armed: the dark-mode global stylesheet
        // recolors flat-background buttons but exempts linear-gradient ones
        background: armedKind === k ? "linear-gradient(135deg,#1a6fa8,#2488c8)" : "transparent", color: armedKind === k ? "#fff" : muted, border: `1px solid ${armedKind === k ? "#1a6fa8" : border}` }}>
      {label}
    </button>
  );

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9300, background: bg, display: "flex", flexDirection: "column", fontFamily: font }}>
      {/* Header — safe-area padded for the installed PWA (env() is 0 elsewhere) */}
      <div style={{ background: panelBg, borderBottom: `1px solid ${border}`, padding: "10px 14px 10px", paddingTop: "calc(env(safe-area-inset-top, 0px) + 10px)", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: text }}>
            {isApp ? "🖌 Paint APP Shifts" : "🖌 Paint Time Off"}
          </div>
          <button onClick={doClose} aria-label="Close"
            style={{ background: "none", border: "none", color: muted, fontSize: 22, cursor: "pointer", padding: "6px 10px", minWidth: 44, minHeight: 44 }}>×</button>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginTop: 2 }}>
          <button onClick={() => setYm(p => { const m = p.m - 1; return m < 0 ? { y: p.y - 1, m: 11 } : { y: p.y, m }; })} aria-label="Previous month"
            style={{ ...css.btn(false), minWidth: 48, minHeight: 44, fontSize: 15 }}>‹</button>
          <span style={{ fontSize: 14, fontWeight: 700, color: text, minWidth: 150, textAlign: "center" }}>{MO[ym.m]} {ym.y}</span>
          <button onClick={() => setYm(p => { const m = p.m + 1; return m > 11 ? { y: p.y + 1, m: 0 } : { y: p.y, m }; })} aria-label="Next month"
            style={{ ...css.btn(false), minWidth: 48, minHeight: 44, fontSize: 15 }}>›</button>
        </div>
        {isApp ? (
          <div style={{ marginTop: 8 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {apps.map((a, i) => {
                const p = APP_PAL[i % APP_PAL.length];
                const on = armedApp === a.id;
                return (
                  <button key={a.id} onClick={() => setArmedApp(on ? "" : a.id)}
                    style={{ minHeight: 44, padding: "8px 16px", borderRadius: 9, fontSize: 13, fontWeight: 800, fontFamily: font, cursor: "pointer",
                      // gradient when armed — see the kind-chip note (dark-mode stylesheet exemption)
                      background: on ? `linear-gradient(135deg, ${p.tx}, ${p.tx})` : "transparent", color: on ? "#fff" : p.tx, border: `2px solid ${on ? p.tx : p.bd}` }}>
                    {a.name}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 11, color: muted, marginTop: 6 }}>
              {armedApp ? `Tap days to assign ${personName(armedApp)} — tap again to clear.` : "Select an APP above, then tap days."}
            </div>
          </div>
        ) : (
          <div style={{ marginTop: 8 }}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
              <select value={armedPerson} onChange={e => { setArmedPerson(e.target.value); setPendingStart(null); }}
                style={{ ...css.inp, ...(dk ? { background: "#0f3460", border: "1px solid #2a3a5e", color: "#e0e0f0" } : {}), minHeight: 40, flex: "1 1 140px" }}>
                <option value="">Select person…</option>
                <optgroup label="Surgeons">{surgeons.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</optgroup>
                <optgroup label="APPs">{apps.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</optgroup>
              </select>
              {kindChip("vacation", "🏖 Vacation")}
              {kindChip("nocall", "🚫 No-call")}
            </div>
            <div style={{ fontSize: 11, color: muted, marginTop: 6, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              {!armedPerson ? "Select a person, then tap a start day and an end day."
                : pendingStart ? <>
                    <span>Start {pendingStart} — tap the end day (same day = just that day).</span>
                    <button onClick={() => setPendingStart(null)}
                      style={{ minHeight: 30, padding: "3px 10px", borderRadius: 7, fontSize: 11, fontWeight: 700, fontFamily: font, cursor: "pointer", background: "transparent", color: "#c04040", border: "1px solid #c05050" }}>✕ cancel start</button>
                  </>
                : `Tap ${personName(armedPerson)}'s start day. Tap a painted range to remove it before saving.`}
            </div>
          </div>
        )}
      </div>

      {/* Day list */}
      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch", padding: "6px 10px 12px" }}>
        {days.map(d => {
          const ds = fmt(d);
          const dow = d.getDay();
          const isWknd = dow === 0 || dow === 6;
          const off = offByDay[ds] || [];
          const saved = appShifts[ds] || null;
          const drafted = ds in draftApp;
          const effective = drafted ? draftApp[ds] : saved;
          const coveredAll = isApp ? [] : draftCoveringAll(ds);
          const isPending = pendingStart === ds;
          const rowBg = isPending ? (dk ? "#1a3a5e" : "#dcecf8")
            : coveredAll.length > 0 ? (dk ? "#1c3050" : "#e6f2ea")
            : drafted ? (dk ? "#1c3050" : "#eaf3fb")
            : isWknd ? (dk ? "#141c30" : "#f6f8fa") : panelBg;
          return (
            <button key={ds} onClick={() => tapDay(ds)}
              style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", minHeight: 52,
                padding: "7px 10px", marginBottom: 4, borderRadius: 9, cursor: "pointer", fontFamily: font,
                background: rowBg, border: `1px solid ${isPending ? "#2488c8" : border}` }}>
              <div style={{ width: 44, flexShrink: 0, textAlign: "center" }}>
                <div style={{ fontSize: 17, fontWeight: 800, color: text, fontFamily: mono }}>{d.getDate()}</div>
                <div style={{ fontSize: 9.5, fontWeight: 700, color: isWknd ? "#a05010" : muted, textTransform: "uppercase" }}>{DAY_HDR[dow]}</div>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                {isApp && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    {effective ? (
                      <span style={{ ...pillStyle(effective), display: "inline-flex", alignItems: "center", padding: "3px 10px", borderRadius: 6, fontSize: 12.5, fontWeight: 800 }}>
                        {personName(effective)}
                      </span>
                    ) : (
                      <span style={{ fontSize: 11.5, color: drafted ? "#a05010" : muted, fontWeight: drafted ? 700 : 400 }}>
                        {drafted ? "will clear" : "—"}
                      </span>
                    )}
                    <span style={{ fontSize: 9.5, color: muted, fontFamily: mono }}>{isWknd ? "7a–7a" : "5p–7a"}</span>
                    {drafted && <span style={{ fontSize: 9.5, fontWeight: 800, color: "#a05010" }}>● unsaved</span>}
                  </div>
                )}
                {!isApp && coveredAll.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 2 }}>
                    {coveredAll.map(({ en }, k) => (
                      <span key={k} style={{ ...pillStyle(en.personId), display: "inline-flex", alignItems: "center", padding: "2px 8px", borderRadius: 6, fontSize: 11.5, fontWeight: 800 }}>
                        {en.kind === "nocall" ? "🚫" : "🏖"} {personName(en.personId)}
                      </span>
                    ))}
                    <span style={{ fontSize: 9.5, fontWeight: 800, color: "#a05010" }}>● unsaved — tap with that person armed to remove</span>
                  </div>
                )}
                {!isApp && isPending && (
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#2488c8", marginBottom: 2 }}>▸ range starts here…</div>
                )}
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {off.length === 0 && !isApp && coveredAll.length === 0 && !isPending && (
                    <span style={{ fontSize: 10.5, color: muted }}>nobody off</span>
                  )}
                  {off.map((o, i) => (
                    <span key={i} title={o.kind}
                      style={{ ...pillStyle(o.id), display: "inline-flex", alignItems: "center", gap: 3, padding: "1px 7px", borderRadius: 5, fontSize: 10, fontWeight: 700, opacity: 0.9 }}>
                      {o.kind === "vacation" ? "🏖" : o.kind === "nocall" ? "🚫" : "☕"}{personName(o.id)}
                    </span>
                  ))}
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* Sticky footer — the unsaved indicator lives here, always visible */}
      <div style={{ background: panelBg, borderTop: `1px solid ${border}`, padding: "10px 14px", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 10px)", flexShrink: 0 }}>
        {commitError && (
          <div role="alert" style={{ marginBottom: 8, padding: "8px 10px", borderRadius: 8, background: dk ? "#3a1a1a" : "#fdeaea", border: "1px solid #c05050", maxHeight: 130, overflowY: "auto" }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: "#c04040" }}>⚠ Nothing was saved — {commitError.items.length} entr{commitError.items.length === 1 ? "y is" : "ies are"} still unsaved:</div>
            {commitError.items.map((it, i) => <div key={i} style={{ fontSize: 11, color: dk ? "#e0b0b0" : "#8a3030", fontFamily: mono }}>• {it}</div>)}
            <div style={{ fontSize: 10.5, color: muted, marginTop: 3 }}>({commitError.msg}) — your taps are kept; fix the connection and Save again.</div>
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ flex: 1, fontSize: 12.5, fontWeight: 800, color: dirtyCount ? "#a05010" : muted }}>
            {dirtyCount ? `● ${dirtyCount} unsaved` : savedNote ? <span style={{ color: "#1a8040" }}>{savedNote}</span> : "No unsaved changes"}
          </div>
          <button onClick={doDiscard} disabled={!dirtyCount || busy}
            style={{ ...css.btn(false), minHeight: 44, opacity: dirtyCount && !busy ? 1 : 0.45 }}>Discard</button>
          <button onClick={doSave} disabled={!dirtyCount || busy}
            style={{ ...css.btn(true), minHeight: 44, minWidth: 110, opacity: dirtyCount && !busy ? 1 : 0.55 }}>
            {busy ? "Saving…" : `Save${dirtyCount ? ` (${dirtyCount})` : ""}`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══ SYNC ENGINE v2 — schedule_weeks (design rev 2, docs/sync-v2) ═══
// One instance per session, held in a ref. It knows nothing about React: it
// reads the schedule through deps.getState() (the synchronous mirror,
// scheduleRef.current) and changes it only through deps.commit(next), BY
// VALUE, built from the LATEST mirror and touching only the weeks it means
// to. It alone owns what the table holds as last confirmed (`known`), so no
// other code keeps a baseline or versions.
//
// Guarantees (design §1):
//   I1 an edit that doesn't land stays pending, visibly, until it does;
//   I2 no write overwrites a row this session hasn't seen: PATCH and DELETE
//      carry the row's (version, updated_at) — the pair the pull uses, so a
//      version-keeping old-build upsert or a delete + re-insert at v1 can't
//      slip under a stale edit; a new week is a plain INSERT;
//   I3 one job at a time (load, push, pull, authoritative, publish) on one
//      chain; every request times out, and a push stops at the first request
//      that never answered, so a dead network can't hold the chain; a job
//      that makes no progress for `stall` is reported (status.stalled), and a
//      caller waiting on a load / clear / restore / publish has its answer by
//      `deadline` (a clear / restore / publish not started by then never runs);
//   I4 an outcome the response BODY doesn't prove is unknown and is READ
//      BACK. The ledger `sent` remembers every body sent and not yet
//      confirmed (keepalive included), so a read-back recognises this
//      session's own write instead of calling it someone else's. A 401 / JWT
//      error is "sign in again" — never "refused", never adopted;
//   I5 other people's changes are pulled (the poll, resume, online) — as anon
//      once the server has refused the stored token, so a skewed clock can't
//      stop them;
//   I6 clear / reset / restore re-read the whole table first and fail closed —
//      one refused puts the screen back to what the table holds, in the job.
//
// deps: getState, commit(next), fetch(url, init), url, writeHeaders(),
//   readHeaders(), anonHeaders() (the anon key's: reads once the server has
//   refused the stored token), canWrite() (false for public / OR-board
//   sessions), token() (the stored access token, or null), userId(), now()
//   (ISO), nowMs(), onStatus(s), onToast(msg, tone), onWipeBlocked(info),
//   onInternalError(e), onAdopted?(weeks) (someone else's copy of these weeks
//   was just put on screen), log(...),
//   timeouts? { read, write, stall, deadline, retry, retryMax } in ms.
function createSchedSync(deps) {
  const d = deps;
  // Request timeouts (A5a), then the stall bound and the caller deadline
  // (A5f/g). Every request is aborted within its timeout, the body read
  // included, so a chain that works settles SOMETHING at least every 15 s:
  // `stall` (3x that, and under the 60-s pull) is how long a job may make no
  // progress before the header says "Sync stalled"; `deadline` (two stall
  // bounds, queue wait included) is when a caller awaiting a load / clear /
  // reset / restore / publish stops waiting. `retry` / `retryMax`: a body
  // the server rejected (a client / schema error, A4) is re-sent unchanged
  // after 1 minute (the poll), then 2, 4, 8, and every 15 at most.
  const T = Object.assign({ read: 10000, write: 15000, stall: 45000, deadline: 90000, retry: 60000, retryMax: 900000 }, d.timeouts || {});
  // ── canonical JSON: keys sorted at every level, JSON's own rules for the
  // rest (an undefined member is dropped, array order kept). jsonb hands keys
  // back in its own order, so plain JSON.stringify equality misfires.
  const canon = (x) => x === undefined ? "∅" : JSON.stringify(x, (k, v) => (v && typeof v === "object" && !Array.isArray(v)) ? Object.keys(v).sort().reduce((o, kk) => (o[kk] = v[kk], o), {}) : v);
  const clone = (x) => (x === undefined ? undefined : JSON.parse(JSON.stringify(x)));
  const log = (...a) => { try { if (d.log) d.log(...a); } catch (e) { /* logging never breaks a job */ } };
  const DEL = "∅";                 // canon of "no row" (a delete)

  let known = {};                  // K -> { data, canon, version, updated_at } as last confirmed
  let seeded = false;              // a whole-table read has succeeded this session (the load gate)
  let loadFailed = false;          // the last load attempt failed while unseeded
  let gen = 0;                     // bumped by reset(): a job from an older generation lands nothing
  const sent = {};                 // K -> [canon] bodies sent and not yet confirmed (chain + keepalive)
  const failed = new Set();        // K whose last attempt didn't land (vs merely "saving")
  const rejected = {};             // K -> { canon, code, reason, at, tries } the server rejected (4xx JSON): re-sent unchanged only with backoff
  const toldCodes = new Set();     // rejection codes already toasted (A4: once per new code, until no week is rejected with it)
  const noPermission = new Set();  // K whose writes match 0 rows while the row is unchanged (RLS)
  const approvedDeletes = new Map(); // K -> the version a delete was authorized at (R7, R9; outstanding only)
  const inFlight = new Set();      // K with a chain request on the wire (the keepalive skips them)
  const lostIns = new Set();       // K whose INSERT went out and its outcome stayed unknown (no trusted answer, and its read-back failed too) — H3
  const resend = new Set();        // K of those a later re-read found NO row for: re-sent, and told once when it lands (H3)
  const putBack = new Set();       // K of those that are a week shown again after a DELETE of ours whose outcome stayed unknown, its row then found gone (I2): told in a deletion's words
  const kaLive = {};               // K -> [{ c, tok, done }] keepalive bodies that may still land: sent at token `tok` (their CAS), so only while known is still at it; and until a read of k sent after the request settled (done: the read sequence then, null while on the wire) is taken in (I3; review r6 fix-1, broke-2/-3)
  let rseq = 0; const readSeen = {}; // every read-back is numbered as it goes out · K -> the latest one of k taken in
  const live = new Set();          // { ctl, start, ms } of requests in flight (aborted when stale on resume)
  const adoptEpoch = {}; let epoch = 0; // never reset (Undo / intents compare against it)
  let conflicts = [];              // [{ k, at }] weeks replaced by someone else's copy, until dismissed
  let chain = Promise.resolve();
  let queuedPush = null, queuedPull = null;
  let authoritativeQueued = 0, busy = null;
  const owners = new Set();        // A11: per queued / running clear, reset, restore, publish: { what, keys (Set, or null = every week), withKnown, state, release }
  let running = false, stalled = false, watch = null; // A5(g): a job is at the chain's head · it has made no progress for T.stall · the watchdog timer
  let deadToken = null;            // the token a 401 / JWT error was answered for: not re-sent
  let blocked = 0, lastBlockSig = "";
  let removalSig = "", staleRemovals = 0; // a wipe-shaped / empty removal seen and not (yet) adopted
  const lastFail = { keys: "", kind: "", at: 0 };

  const fromRow = (r) => ({ data: clone(r.data), canon: canon(r.data), version: (r.version === undefined ? null : r.version), updated_at: r.updated_at || null });
  const base = () => d.url + "/rest/v1/schedule_weeks";
  const wh = (extra) => Object.assign({}, d.writeHeaders(), { "Content-Type": "application/json" }, extra || {});
  const say = (m, tone) => { try { d.onToast(m, tone); } catch (e) { log("onToast threw", e); } };
  const weekLabel = (k) => { try { const [y, m, dd] = k.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch (e) { return k; } };
  const weekList = (ks) => ks.slice(0, 4).map(weekLabel).join(", ") + (ks.length > 4 ? ` and ${ks.length - 4} more` : "");
  const addSent = (k, c) => { (sent[k] = sent[k] || []).push(c); if (sent[k].length > 20) sent[k].shift(); };
  // The ledger of k once it is settled (confirmed, adopted) — or once a read
  // PROVED that none of our bodies for it landed (I1, below): only keepalive
  // bodies that may still land stay in it. One of those may land yet, and its
  // row must then read as ours (review r5 matrix-3: an Undo settled by a
  // re-read before the keepalive landed got its edit back, silently, at the
  // next pull — now the landed row is "ours" and the Undo is sent over it).
  // A keepalive may still land only (review r6) while known is still at the
  // token its CAS names — once known has moved, the row has (updated_at never
  // comes back), and it can't: kept, its body read as ours or out after our
  // own save of the week had landed (a week stuck "Saving…", a false
  // conflict, and another device's Undo of that edit sent over, silently) —
  // and until a read sent AFTER its request settled is taken in: a read on
  // the wire while it landed proves nothing about it (the user's newer edit
  // was replaced by their own older one, as "someone else's").
  const keepLive = (k) => {
    const t = tokOf(known[k]), seen = readSeen[k] || 0;
    const l = (kaLive[k] || []).filter(e => e.tok === t && !(e.done !== null && e.done < seen));
    if (l.length) kaLive[k] = l; else delete kaLive[k];
    if (l.length) sent[k] = l.map(e => e.c); else delete sent[k];
  };
  const settle = (k) => { keepLive(k); failed.delete(k); noPermission.delete(k); delete rejected[k]; lostIns.delete(k); resend.delete(k); putBack.delete(k); };
  const tokenNow = () => { try { return d.token ? d.token() : null; } catch (e) { return null; } };
  const authState = () => { const t = tokenNow(); return !t ? "none" : t === deadToken ? "expired" : "ok"; };
  // Every READ (the pull, its week fetch, read-backs, whole-table reads)
  // goes out with the read headers — the stored token while the device
  // clock calls it fresh, else anon — EXCEPT once the server has refused the
  // stored token (a 401 / JWT error: deadToken). Then as anon (A7, I5): a
  // skewed clock would keep re-sending the dead token, and every pull would
  // 401 until the user signs in again. The table is anon-readable; writes
  // stay refused (auth-needed) until a new token is stored.
  const rh = () => Object.assign({}, authState() === "expired" ? d.anonHeaders() : d.readHeaders());

  // One request, with a timeout that also covers reading the body. Only the
  // fetch itself is an "unknown outcome" — never a bug elsewhere in a job.
  const req = async (url, init, ms) => {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const entry = { ctl, start: d.nowMs(), ms };
    let timer = null;
    if (ctl && ms) { timer = setTimeout(() => { try { ctl.abort(); } catch (e) { /* already done */ } }, ms); live.add(entry); }
    try {
      const r = await d.fetch(url, ctl ? Object.assign({}, init, { signal: ctl.signal }) : init);
      let body = null, json = false;
      try { const t = await r.text(); if (t) { body = JSON.parse(t); json = true; } } catch (e) { body = null; json = false; }
      return { ok: !!r.ok, status: r.status, body, json };
    } catch (e) { return { thrown: e }; }
    finally { if (timer) clearTimeout(timer); live.delete(entry); progress(); }
  };
  // Classify a write's answer on its BODY (A4): only what the body proves is
  // known. 401 or a JWT error = sign in again; a PostgREST 403 / 42501 = the
  // server refused this change (permission); another PostgREST 4xx = the
  // content was rejected (a client / schema error: kept and pending, re-sent
  // unchanged only with backoff); everything else —
  // 0 rows, a 23505 duplicate, 404/408/413/429, 5xx, a gateway's HTML,
  // thrown, timed out — is UNKNOWN and is read back.
  const kindOf = (r) => {
    if (r.thrown) return "unknown";
    if (r.ok) return "ok";
    const code = r.json && r.body && typeof r.body === "object" ? String(r.body.code || "") : "";
    const msg = r.json && r.body && typeof r.body === "object" ? String(r.body.message || "") : "";
    if (r.status === 401 || /^PGRST30[123]$/.test(code) || /JWT expired/i.test(msg)) return "auth";
    if (r.status === 403) return code === "42501" ? "refused" : "unknown";
    if ([404, 408, 413, 429].includes(r.status) || r.status >= 500 || r.status < 400) return "unknown";
    if (r.status === 409 && code === "23505") return "unknown";
    return code ? "rejected" : "unknown";
  };
  // The CAS filter: the (version, updated_at) pair the pull uses as its token.
  const cas = (kn) => `version=${kn.version === null ? "is.null" : "eq." + kn.version}&updated_at=${kn.updated_at === null ? "is.null" : "eq." + encodeURIComponent(kn.updated_at)}`;
  // …and as one string, for telling whether a week's saved copy has moved
  // (E7) — DEL when there is no row.
  const tokOf = (kn) => (kn ? `${kn.version}|${kn.updated_at}` : DEL);

  // Which weeks the target differs on from what the table holds.
  const diff = (target) => {
    const changed = [], deletes = [];
    Object.keys(target).sort().forEach(k => { if (!known[k] || canon(target[k]) !== known[k].canon) changed.push(k); });
    Object.keys(known).sort().forEach(k => { if (!(k in target)) deletes.push(k); });
    return { changed, deletes };
  };
  const unconfirmed = (k) => !!(sent[k] && sent[k].length);
  const pendingKeys = () => {
    if (!seeded) return [];
    const { changed, deletes } = diff(d.getState() || {});
    return [...new Set([...changed, ...deletes, ...Object.keys(sent).filter(unconfirmed)])].sort();
  };
  // A11(4): a week a queued or running clear / reset / restore / publish
  // will write is not reported as pending: the header says Clearing… /
  // Restoring… for it, never "not saved". (api.pending(), which the reload
  // and sign-out guards ask, still counts it: leaving now cuts that job short.)
  const ownedKey = (k) => { for (const o of owners) { if (!o.keys || o.keys.has(k) || (o.withKnown && known[k])) return true; } return false; };
  const headOwner = () => { for (const o of owners) return o.what; return null; };
  const status = () => {
    const p = pendingKeys().filter(k => !ownedKey(k));
    const failing = p.filter(k => failed.has(k));
    const rej = Object.keys(rejected).filter(k => p.includes(k)).sort();
    const a = authState();
    return { seeded, loadFailed: !seeded && loadFailed, pending: p.length, pendingKeys: p,
      saving: p.length - failing.length, failing: failing.length, auth: a,
      authNeeded: a !== "ok" && (p.length > 0 || a === "expired"),
      rejected: rej, rejectCodes: [...new Set(rej.map(k => rejected[k].code))].sort(),
      noPermission: [...noPermission].filter(k => p.includes(k)),
      blockedDeletes: blocked, staleRemovals, conflicts: conflicts.slice(), busy: busy || headOwner(), stalled };
  };
  const report = () => { try { d.onStatus(status()); } catch (e) { log("onStatus threw", e); } };

  // A5(g) the watchdog. Progress is a job starting or ending, or any request
  // settling (each one does within its timeout). A job that makes none for
  // T.stall is STALLED — reported, so the header says so — until the next
  // progress. Only progress re-arms the timer: a job stuck for good leaves
  // no timer behind.
  const progress = () => {
    if (watch) { clearTimeout(watch); watch = null; }
    if (running) watch = setTimeout(() => { watch = null; if (running && !stalled) { stalled = true; report(); } }, T.stall);
    if (stalled) { stalled = false; report(); }
  };
  // Jobs: one at a time; a job that throws (a bug, not the network) is
  // reported and stops without poisoning the chain.
  const enqueue = (fn) => {
    const p = chain.then(async () => {
      running = true; progress();
      try { return await fn(); }
      catch (e) { try { if (d.onInternalError) d.onInternalError(e); } catch (e2) { /* nothing more to do */ } report(); return { ok: false, internal: String(e && e.message || e) }; }
      finally { running = false; progress(); }
    });
    chain = p.then(() => {}, () => {});
    return p;
  };

  // A5(f): the caller's promise settles by T.deadline (queue wait included)
  // even when the chain is stuck — with late()'s answer then.
  const settleBy = (p, late) => new Promise((resolve) => {
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve(late()); } }, T.deadline);
    const fin = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
    p.then(fin, (e) => fin({ ok: false, internal: String(e && e.message || e) }));
  });
  const JOB_LABEL = { clear: "Clearing the schedule", reset: "Clearing the schedule", restore: "Restoring the snapshot", publish: "Publishing the new weeks" };
  const jobLabel = (what) => JOB_LABEL[what] || "Saving the schedule";
  // One toast for a job that ended after its caller stopped waiting (A5f) —
  // with the job's own detail (its notice: which weeks, and why) in it.
  const lateOutcome = (what, r) => {
    if (r && (r.skipped === "reset" || r.skipped === "cancelled")) return; // another session now, or it never ran
    const extra = r && r.notice ? " " + r.notice : "";
    if (r && r.ok) { say(`${jobLabel(what)} has finished — every week is saved.${extra}`, extra ? "error" : "success"); return; }
    const n = ((r && r.results) || []).filter(x => x.outcome !== "saved").length;
    say(r && r.error ? `${jobLabel(what)} stopped — ${r.error}` : extra ? `${jobLabel(what)} has finished, but not every week is saved.${extra}` : `${jobLabel(what)} has finished, but ${n ? n + " week" + (n === 1 ? " isn't" : "s aren't") : "not every week is"} saved yet — retrying automatically.`, "error");
  };
  // E8: …in the CALLER's words when it gave authoritative() opts.late(r) — a
  // factory reset or a restore knows what it did before the weeks job (the
  // setup written), which the engine's generic text can't say. Called once,
  // with the job's result; its text is the one toast. One that's missing,
  // throws or returns no text: the engine's own. Never for a job fenced by a
  // sign-out (another session now) — nothing is said for it.
  const tellLate = (what, r, late) => {
    if (late && !(r && (r.skipped === "reset" || r.skipped === "cancelled"))) {
      let m = null;
      try { m = late(r); } catch (e) { log("opts.late threw", e); m = null; }
      if (typeof m === "string" && m) { say(m, r && r.ok && !r.notice ? "success" : "error"); return; }
    }
    lateOutcome(what, r);
  };

  // ONE engine read (the pull's version list, readAll, readSome, readBack —
  // so load, pull, a clear / restore / publish and a read-back all behave the
  // same). A read sent WITH the stored token that the server refuses for it
  // (kindOf's auth class: a 401, PGRST301–303, "JWT expired" — never a 42501
  // permission error, RLS refusing the role) marks that token dead, as a
  // write's 401 does: reported at once, so authNeeded — the edit gate and
  // "Sign in again" — follows even with nothing pending; then the read is
  // sent once more as anon, so a device clock that still calls the token
  // fresh can't stop the pull (I5). A read that went out as anon already
  // isn't the token's to blame: its answer stands.
  const readReq = async (url) => {
    const g = gen, tok = tokenNow(), h = rh();
    const r = await req(url, { method: "GET", headers: h }, T.read);
    const perm = r.json && r.body && typeof r.body === "object" && String(r.body.code || "") === "42501";
    if (gen !== g || !tok || kindOf(r) !== "auth" || perm || canon(h) === canon(Object.assign({}, d.anonHeaders()))) return r;
    deadToken = tok; report();
    return req(url, { method: "GET", headers: Object.assign({}, d.anonHeaders()) }, T.read);
  };
  // (Numbered as it goes out; its answer, taken in, proves what it can about
  // a keepalive that had settled before it went out — keepLive, review r6.
  // Its caller classifies it at once, with no await between.)
  const readBack = async (k) => {
    const s = ++rseq;
    const r = await readReq(`${base()}?week_monday=eq.${k}&select=week_monday,data,version,updated_at`);
    if (r.thrown || !r.ok || !Array.isArray(r.body)) return { ok: false };
    if (s > (readSeen[k] || 0)) readSeen[k] = s;
    return { ok: true, row: r.body[0] || null };
  };
  const readAll = async () => {
    const r = await readReq(`${base()}?select=week_monday,data,version,updated_at&order=week_monday.asc&limit=5000`);
    return (r.thrown || !r.ok || !Array.isArray(r.body)) ? null : r.body;
  };
  const readSome = async (keys) => {
    const out = [];
    for (let i = 0; i < keys.length; i += 60) {
      const chunk = keys.slice(i, i + 60);
      const r = await readReq(`${base()}?week_monday=in.(${chunk.join(",")})&select=week_monday,data,version,updated_at`);
      if (r.thrown || !r.ok || !Array.isArray(r.body)) return null;
      out.push(...r.body);
    }
    return out;
  };

  // Put the server's copy of these weeks into the mirror (A3): ONE commit, by
  // value, built from the LATEST mirror, touching only these weeks — and only
  // a week whose mirror copy is still what the decision was based on
  // (`expect[k]`: a canon, or DEL). A week the user changed while the request
  // was out is left alone (mirror AND known); the next pull / push settles
  // it. The epoch moves only when what's on screen actually changes.
  const adoptInto = (rowsByKey, why, expect) => {
    const cur = d.getState() || {};
    const next = Object.assign({}, cur);
    const changed = [], taken = [];
    Object.keys(rowsByKey).forEach(k => {
      const shown = k in cur ? canon(cur[k]) : DEL;
      if (expect && k in expect && expect[k] !== shown) return;
      const r = rowsByKey[k];
      if ((r ? canon(r.data) : DEL) !== shown) { adoptEpoch[k] = ++epoch; changed.push(k); }
      if (r) { known[k] = fromRow(r); next[k] = clone(r.data); } else { delete known[k]; delete next[k]; }
      settle(k); approvedDeletes.delete(k); taken.push(k);
    });
    if (changed.length) d.commit(next);
    if (why === "conflict" && changed.length) { const at = d.nowMs(); changed.forEach(k => { conflicts = conflicts.filter(c => c.k !== k).concat([{ k, at }]); }); }
    // A13: the weeks that now show someone else's copy (their epoch moved),
    // after the commit — an open week editor on one of them says so at once.
    if (changed.length && d.onAdopted) { try { d.onAdopted(changed.slice()); } catch (e) { log("onAdopted threw", e); } }
    return taken;
  };

  // What a row read back (or pulled) for k means. → "mirror" (the table
  // already holds what's on screen) | "ours" (an earlier body of ours landed;
  // the screen has moved on since) | "unchanged" (nothing of ours landed) |
  // "refreshed" (the data we knew, under a new token: nobody changed it) |
  // "theirs" (someone else wrote it). `missed`: the canon of OUR body just
  // answered with 0 rows (writeWeek's own read-back: its CAS matched nothing,
  // so that body did not land).
  const classify = (k, row, missed) => {
    const c = row ? canon(row.data) : DEL;
    const cur = d.getState() || {};
    if (c === (k in cur ? canon(cur[k]) : DEL)) return "mirror";
    if (sent[k] && sent[k].includes(c)) return "ours";
    const kn = known[k];
    if (kn ? (!!row && (row.version === undefined ? null : row.version) === kn.version && (row.updated_at || null) === kn.updated_at && c === kn.canon) : !row) return "unchanged";
    // The data we knew, under a new (version, updated_at): an old build's tab
    // re-sent the week unchanged (its keepalive upsert keeps the version and
    // moves updated_at), or it was deleted and re-inserted as it was. Nothing
    // anyone changed is lost by writing over it, so it isn't a conflict: take
    // the new token and retry (A2) — else every old tab closing would cost the
    // open sessions their unsaved edits to those weeks.
    // H1 (review r4 branch-1): …but not while a body of ours that may have
    // landed is unconfirmed (sent, its answer lost). Then the data we knew can
    // be someone's REVERT of our landed write — X0, ours X1 lands (the answer
    // lost), another device puts X0 back — and re-sending ours over it
    // overwrote their change silently (a DELETE of ours, then the week put
    // back as it was, likewise). Then it is theirs: a conflict, their copy
    // shown and told.
    // I1 (review r5 matrix-1, CRITICAL): the VERSION is never proof that our
    // body didn't land. 21/n still called it "refreshed" while one was out
    // when the row's version was the known one (not 1) — but a deletion and a
    // re-insert restart it at 1, and edits after that climb back to exactly
    // the version we knew (an Undo of a deletion, or a Clear + Restore, then a
    // revert in the editor): our lost write overwrote that revert, silently.
    // An old build's unchanged re-send and such a revert look the same in
    // every column we read. So it is "refreshed" only when NO body of ours
    // that may have landed is out — each one proven not to have landed: the
    // body just answered with 0 rows (`missed`: its CAS matched nothing), or
    // any body a later read found the week UNCHANGED after (disproved: taken
    // out of the ledger, keepLive). Otherwise theirs. The cost, accepted: an
    // old build re-sending a week unchanged while a lost write of ours that
    // never landed is out (and unproven) is a LOUD false conflict — never a
    // silent overwrite.
    if (kn && row && c === kn.canon) {
      const out = (sent[k] || []).filter((x, i, a) => !(missed !== undefined && x === missed && i === a.lastIndexOf(x)));
      if (!out.length) return "refreshed";
    }
    return "theirs";
  };
  // `mine`: the row is the answer to our own write. A row read back is ours
  // when it holds a body we sent (the ledger, before settle() forgets it).
  // `how`: classify()'s word for a row read back.
  const confirm = (k, row, mine, how) => {
    const ours = !!mine || (!!sent[k] && sent[k].includes(row ? canon(row.data) : DEL));
    if (row) known[k] = fromRow(row); else delete known[k];
    // E7: a clear / reset / restore waiting to put back `before` records
    // which saved copies are OURS — so its refusal never takes our own body,
    // landing meanwhile, for someone else's change.
    owners.forEach(o => { if (o.knownAt) { if (ours) o.knownAt.landed[k] = tokOf(known[k]); else delete o.knownAt.landed[k]; } });
    // …and which were taken as "refreshed" — the data known, under a new
    // token, with every body of ours PROVEN not to have landed (I1): nobody
    // changed it, so its refusal puts `before` back over it (savedMoved).
    owners.forEach(o => { if (o.knownAt) { if (how === "refreshed") o.knownAt.refreshed[k] = tokOf(known[k]); else delete o.knownAt.refreshed[k]; } });
    settle(k);
    const ad = approvedDeletes.get(k);
    if (!row || !known[k] || ad !== known[k].version) approvedDeletes.delete(k);
  };

  // ── one week's write: CAS PATCH / INSERT / CAS DELETE, then read-back ──
  // → { k, outcome: "saved" | "pending" | "auth" | "rejected" | "refused" | "conflict"
  //   | "superseded" (our earlier body landed, and the screen has moved on since:
  //   still pending — the next push sends the newer copy)
  //   | "stale" (the session was reset mid-job: nothing more is sent),
  //   row?, sent?, thrown?, code?, reason? }
  // mode "force" (clear / restore / publish): a conflict is rewritten at the
  // server's version, and a week found deleted is re-inserted.
  // I3 (review r5 matrix-3): a force DELETE carries the CAS too — of the row
  // the job just read. Sent with none, one the server applied late (after our
  // timeout gave up on it) deleted a week re-created or rewritten after it.
  // Its 0 rows now mean someone changed the week since that read: read back,
  // then deleted again at the server's token (attempt 1), as a force PATCH is.
  const writeWeek = async (k, target, mode, by, g) => {
    const del = target === undefined;
    for (let attempt = 0; attempt < 2; attempt++) {
      if (gen !== g) return { k, outcome: "stale" }; // the session was reset: issue nothing more (A8)
      const kn = known[k];
      if (del && !kn) return { k, outcome: "saved" };
      // (Review r6 matrix-2: the force DELETE sent again at the server's token
      // keeps its job's grant at that token — its approval was taken at the
      // version the job read. If this one's answer is lost, the follow-up push
      // took the delete for a new one: the wipe guard blocked it, for good.)
      if (del && mode === "force" && attempt === 1) approvedDeletes.set(k, kn.version);
      const c = del ? DEL : canon(target), ts = d.now(), tok = tokenNow();
      let url, init;
      if (del) { url = `${base()}?week_monday=eq.${k}&${cas(kn)}`; init = { method: "DELETE", headers: wh({ Prefer: "return=representation" }) }; }
      else if (kn) { url = `${base()}?week_monday=eq.${k}&${cas(kn)}`; init = { method: "PATCH", headers: wh({ Prefer: "return=representation" }), body: JSON.stringify({ data: target, version: (kn.version || 0) + 1, updated_by: by, updated_at: ts }) }; }
      else { url = base(); init = { method: "POST", headers: wh({ Prefer: "return=representation" }), body: JSON.stringify({ week_monday: k, data: target, version: 1, updated_by: by, updated_at: ts }) }; }
      addSent(k, c);
      inFlight.add(k);
      const r = await req(url, init, T.write);
      inFlight.delete(k);
      const kind = kindOf(r);
      if (kind === "ok" && Array.isArray(r.body) && r.body.length === 1) {
        const row = del ? null : r.body[0];
        confirm(k, row, true);
        // The server stored something other than what we sent (it
        // normalised it): show that, so the week doesn't re-send forever.
        if (row && canon(row.data) !== c && canon((d.getState() || {})[k]) === c) d.commit(Object.assign({}, d.getState() || {}, { [k]: clone(row.data) }));
        return { k, outcome: "saved" };
      }
      if (kind === "auth") { deadToken = tok; failed.add(k); return { k, outcome: "auth" }; }
      // A client / schema error (A4): kept on screen and pending, never
      // adopted; the same body is re-sent only with backoff (`tries`).
      if (kind === "rejected") {
        const prev = rejected[k];
        rejected[k] = { canon: c, code: String((r.body && r.body.code) || r.status), reason: writeFailReason(r.body), at: d.nowMs(), tries: prev && prev.canon === c ? prev.tries + 1 : 1 };
        failed.add(k);
        return { k, outcome: "rejected", code: rejected[k].code, reason: rejected[k].reason };
      }
      if (gen !== g) return { k, outcome: "stale" };
      if (kind === "refused") { const rb = await readBack(k); return { k, outcome: "refused", sent: c, row: rb.ok ? rb.row : undefined }; }
      // unknown: read it back
      const rb = await readBack(k);
      // H3: an INSERT whose outcome stays unknown — its read-back failed too —
      // may have landed (and be deleted elsewhere before we look again):
      // lostIns. One whose read-back finds no row didn't land.
      if (!rb.ok) { failed.add(k); if (!del && !kn) lostIns.add(k); return { k, outcome: "pending", thrown: !!r.thrown }; }
      const how = classify(k, rb.row, kind === "ok" && Array.isArray(r.body) && r.body.length === 0 ? c : undefined); // (0 rows: this body did not land — H1)
      if (how === "mirror") { confirm(k, rb.row); return { k, outcome: "saved" }; }
      // Our earlier body landed (or the row only took a new token, our data
      // under it unchanged): send this one at the new token — unless the
      // screen has moved on since (e.g. an Undo during the read-back); then
      // the week stays pending and the next push sends the newer copy.
      if (how === "ours" || how === "refreshed") { confirm(k, rb.row, false, how); if (mode !== "force" && canon((d.getState() || {})[k]) !== c) return { k, outcome: "superseded" }; continue; }
      // Unchanged: nothing of ours landed — this body, and every earlier one
      // (each had its answer, or timed out, before this read): none of them
      // counts as out any more (I1), nor as ours (I2: a DELETE of ours that
      // didn't land never takes a later deletion elsewhere for its own).
      if (how === "unchanged") { if (kind === "ok") noPermission.add(k); failed.add(k); keepLive(k); return { k, outcome: "pending", thrown: !!r.thrown }; }
      if (mode === "force" && attempt === 0) { if (rb.row) known[k] = fromRow(rb.row); else delete known[k]; continue; } // rewrite at the server's version / re-insert
      return { k, outcome: "conflict", sent: c, row: rb.row };
    }
    failed.add(k);
    return { k, outcome: "pending" };
  };

  // A16: a "replaced by someone else's change" item stays until it's
  // dismissed, the session resets, or the user edits that week again — seen
  // here, at the start of the ordinary push every edit requests, as the
  // screen no longer showing the copy that was adopted (mirror ≠ known). A
  // clear / restore / publish isn't the user editing it again: the item
  // stays past that job's success toast.
  const dropEditedConflicts = () => {
    if (!conflicts.length) return;
    const cur = d.getState() || {};
    const keep = conflicts.filter(c => (c.k in cur ? canon(cur[c.k]) : DEL) === (known[c.k] ? known[c.k].canon : DEL));
    if (keep.length !== conflicts.length) { conflicts = keep; report(); }
  };
  // A rejected body (A4) is re-sent unchanged once its backoff has passed:
  // T.retry after the rejection, doubling per rejection of that same body,
  // at most T.retryMax. A changed body goes out at once.
  const heldBack = (k, body) => {
    const x = rejected[k];
    return !!x && x.canon === canon(body) && d.nowMs() - x.at < Math.min(T.retry * Math.pow(2, x.tries - 1), T.retryMax);
  };

  // ── PUSH: send every week the mirror (or an authoritative target) differs on ──
  // job: { mode: "normal" | "force", target?, grant?, keys? (publish: only
  // these weeks, never a delete), quiet? (an authoritative job: the toast
  // comes back as `notice` instead) }
  const runPush = async (job) => {
    const g = gen;
    // What's pending is reported as the push starts — "Saving N weeks…" until
    // they land, never the "Synced" of an earlier report (A16): a pull that
    // failed early, a load, a job ahead in the queue report nothing about an
    // edit made since.
    report();
    if (!seeded) { report(); return { ok: false, skipped: "not-loaded" }; }
    if (!d.canWrite()) { report(); return { ok: false, skipped: "read-only" }; }
    if (job.mode !== "force" && authoritativeQueued > 0) return { ok: false, skipped: "authoritative-queued" };
    if (job.mode !== "force") dropEditedConflicts();
    if (authState() !== "ok") {
      const p = pendingKeys();
      p.forEach(k => failed.add(k));
      if (job.target === undefined && p.length) toasts(p.map(k => ({ k, outcome: "auth" })));
      report(); return { ok: false, skipped: "auth" };
    }
    const by = d.userId ? d.userId() : null;
    const results = [], unread = new Set(); // (unread: a lost INSERT's week whose re-read failed — not re-sent this time, H3)
    // Unconfirmed weeks are re-read first: what the table holds for them is unknown.
    for (const k of Object.keys(sent).filter(unconfirmed)) {
      const rb = await readBack(k);
      if (gen !== g) return { ok: false, skipped: "reset" };
      // H3 (review r4 branch-3 — a decision, flagged in the PR): no row for a
      // week whose INSERT went out with its outcome unknown. Never landed, or
      // landed and deleted elsewhere (a clear, a restore) — there are no
      // tombstones to tell them apart. It is the user's own intended week, so
      // it is sent again (below, as before) — but no longer silently: once it
      // lands, the job's one message says so, once for that week. While its
      // re-read FAILS it isn't re-sent at all (nothing is known: it waits,
      // pending, for a re-read that works).
      // Review r6 (fix-2): …nor a week whose DELETE of ours has its outcome
      // unknown (I2): sent without a re-read, a re-add went out as a PATCH,
      // met the deletion (0 rows), and its read-back took the missing row for
      // ours — POSTed, the deletion elsewhere undone without I2's message.
      if (!rb.ok && known[k] && (sent[k] || []).includes(DEL)) { unread.add(k); continue; }
      if (!rb.ok) { if (lostIns.has(k) && !known[k]) unread.add(k); continue; }
      if (!rb.row && !known[k] && lostIns.has(k)) resend.add(k);
      // I2 (review r5 matrix-2 — the same decision as H3): no row for a week
      // whose DELETE of ours went out with its outcome unknown (still in the
      // ledger: no read has proven it didn't land), while the screen shows the
      // week again (an Undo, a re-add). Our deletion landed, or another
      // device's (a clear, a restore, a delete) — no tombstones tell which.
      // Taken for ours it went out as a plain INSERT and undid their deletion
      // without a word. It is the user's own intended week, so it is put back
      // (below, as before) — told once, in a deletion's words. (One PROVEN
      // not to have landed is out of the ledger: then the missing row is
      // theirs — adopted and told as a conflict, as for an edit of ours.)
      const delBack = !rb.row && !!known[k] && (sent[k] || []).includes(DEL); // (classify() says "ours" for it only while the screen shows the week)
      const how = classify(k, rb.row);
      // I7 (review r5 fix-2): a re-sent week (H3 / I2) whose re-send landed
      // with its answer lost too is told here, as it is confirmed — settle()
      // would forget it before anything said so, and the deletion elsewhere
      // stayed undone without a word.
      if (resend.has(k) && rb.row && (how === "mirror" || how === "ours")) results.push({ k, outcome: "saved", resent: true, putBack: putBack.has(k) });
      if (how === "mirror" || how === "ours" || how === "refreshed") confirm(k, rb.row, false, how);
      // Unchanged: none of our bodies for k landed (each had its answer, or
      // timed out, before this read) — none counts as out or ours any more (I1).
      else if (how === "unchanged") keepLive(k);
      // Someone else's copy. A force job takes it as known (and so rewrites
      // over it) only for a week it OWNS — a publish only its period's. Any
      // other week is a conflict exactly as in a normal push: their copy is
      // shown and told, so no later push can overwrite it under a CAS taken
      // from their row (I2).
      else if (how === "theirs" && (job.mode !== "force" || (job.keys && !job.keys.has(k)))) { const cur = d.getState() || {}; if (adoptInto({ [k]: rb.row }, "conflict", { [k]: k in cur ? canon(cur[k]) : DEL }).length) results.push({ k, outcome: "conflict" }); }
      else if (how === "theirs") { if (rb.row) known[k] = fromRow(rb.row); else delete known[k]; settle(k); }
      if (delBack && how === "ours") { resend.add(k); putBack.add(k); } // (after confirm(): settle() clears both)
    }
    // A11 again, after the re-read's awaits: a clear / reset / restore /
    // publish requested meanwhile owns the weeks now, and the mirror holds ITS
    // target — read as this push's, a clear tripped the wipe guard, and a
    // restore's writes went out (and landed) before the job's own read could
    // refuse it. Stop here; the job's follow-up push sends what's edited
    // meanwhile. (A conflict the re-read adopted is still told.)
    if (job.mode !== "force" && authoritativeQueued > 0) { if (results.length) toasts(results); report(); return { ok: false, skipped: "authoritative-queued", results }; }
    // The target is read only NOW: the re-read above may have adopted someone
    // else's copy of a week into the mirror, and that must not be re-sent over.
    const target = job.target !== undefined ? job.target : (d.getState() || {});
    let { changed, deletes } = diff(target);
    if (job.keys) { changed = changed.filter(k => job.keys.has(k)); deletes = []; }
    // A body the server rejected (4xx) waits out its backoff (A4).
    const sendable = changed.filter(k => !heldBack(k, target[k]));
    // Wipe guard on NEW deletes only (R7, R9, R10). An authoritative job
    // carries its own grant. An approval holds only while the delete is still
    // outstanding at the version it was approved at (A12). A blocked push
    // still sends its other writes — only the deletes wait.
    [...approvedDeletes.keys()].forEach(k => { if (!deletes.includes(k) || !known[k] || approvedDeletes.get(k) !== known[k].version) approvedDeletes.delete(k); });
    const newDeletes = deletes.filter(k => !approvedDeletes.has(k));
    const baseCount = Object.keys(known).length, curCount = Object.keys(target).length;
    const wipingAll = !job.keys && curCount === 0 && baseCount > 0 && newDeletes.length > 0;
    const wipingMost = !job.keys && baseCount >= 4 && newDeletes.length >= Math.ceil(baseCount / 2);
    let sendDeletes = deletes;
    if ((wipingAll || wipingMost) && !job.grant) {
      sendDeletes = deletes.filter(k => approvedDeletes.has(k));
      blocked = newDeletes.length;
      const sig = newDeletes.join(",");
      if (sig !== lastBlockSig) { lastBlockSig = sig; try { d.onWipeBlocked({ curCount, baseCount, deletes: newDeletes.length }); } catch (e) { log("onWipeBlocked threw", e); } }
    } else {
      blocked = 0; lastBlockSig = "";
      deletes.forEach(k => { if (!approvedDeletes.has(k)) approvedDeletes.set(k, known[k].version); });
    }
    // Weeks in job order; a normal push skips a week the user changed again
    // since this job started (it's still pending — the next push sends the
    // newer copy) and stops at the first request that never answered (the
    // network is likely gone: the rest wait for the next push).
    const startCanon = {};
    if (job.target === undefined) [...sendable, ...sendDeletes].forEach(k => { startCanon[k] = canon(target[k]); });
    const moved = (k) => job.target === undefined && canon((d.getState() || {})[k]) !== startCanon[k];
    let stop = false;
    for (const k of sendable) {
      if (gen !== g) return { ok: false, skipped: "reset" };

      const back = putBack.has(k); // (I2: …or for a week shown again after its lost DELETE)

  // ONE toast per job (the app's toast slot holds one message, A16): every

  // reset / restore / publish): its CALLER tells the outcome, so the message
  // isn't said here — it's returned (uncapped) as the job's `notice`, for the

  const toasts = (results, quiet) => {

    const tell = (m) => { if (!quiet) say(m, "error"); return m; };

  // ── PULL: adopt other people's changes to weeks this session hasn't edited ──

  // ── LOAD: the whole table. First time: seed the mirror. Later (signing in
  // again, a failed first read repaired): a pull, so unsaved edits survive.

    rows.forEach(x => { known[x.week_monday] = fromRow(x); next[x.week_monday] = clone(x.data); });

  // ── AUTHORITATIVE (clear / reset / restore): re-read the whole table, then
  // make it equal `target` — deletes carry no version, conflicts are
  // rewritten. Fails closed: if the table can't be read, nothing is written.
  // PUBLISH (regenerate / accept-preview): the same, limited to the period's
  // weeks — re-read just those, write them (a week deleted elsewhere is
  // re-inserted), never a delete. Afterwards every week the user hasn't
  // touched since shows exactly what was written (A11).
  // A clear / reset / restore that writes NOTHING (read-only, signed out, the
  // table unreadable, cancelled at its deadline) puts the screen back as it
  // was before the caller committed the target — here, in the job, with no
  // await before the follow-up push can read the mirror: left to the caller,
  // that push ran first and sent the refused target as an ordinary push (a
  // refused restore's weeks written anyway; a refused clear tripping the wipe
  // guard). A publish keeps its weeks on screen, pending (A14) — and its
  // refusals say so: they are saved automatically (or once signed in again);
  // nobody was notified.
  // showKnown: for these weeks, only where the screen still shows what it
  // showed when the job was requested (the target — an edit made since
  // stays, and is pushed), put back `before[k]` — the screen as it was before
  // the caller committed the target (`opts.before`): edits pending from
  // before the tap and new local weeks stay pending and go out in the
  // follow-up push, and a slow save's landed edit isn't reverted by it —
  // or, without `before`, what the table holds (known). One commit.
  // E7 (with `before`, and knownAt — the saved copy of each week as the job
  // was requested): only where that saved copy hasn't moved since to SOMEONE

  // write of it was out, and the read-back, compared with the job's target
  // on screen, made the engine take it), `before[k]` would bring back an

  // deleted, unseen. Their copy is adopted over it instead, as a conflict

  // "replaced by someone else's change", onAdopted), and those weeks are

  const showKnown = (startShown, only, before, knownAt) => {

  // E7: has the saved copy of k moved, since the job was requested, to

  // G6 (review r3; 18/n open item 1): a clear / reset / restore that writes

  // behind a refused clear kept the clear's put-back on screen, and the
  // follow-up push re-inserted the weeks the restore had just deleted.) It

        if (authState() !== "ok") return refuse({ ok: false, wrote: false, error: signIn });
        if (!rows) return refuse({ ok: false, wrote: false, error: "Couldn't read the saved schedule — nothing was changed." });

  // ── keepalive (pagehide / beforeunload only, A9): CAS PATCHes for unsaved

  // deleted later) and never a delete; weeks with a chain request on the

  // the CAS keeps it harmless if that earlier body landed after all). Every
