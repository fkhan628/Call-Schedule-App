          if (yes) setSaveStatus("Restoring snapshot…");
          return yes;
        },
        // Asked after the before_restore snapshot, right before the blob is
        // written: still this session — else nothing is written as the next account.
        proceed: () => sessionEpochRef.current === ep,
      });
    } finally { setRestoreBusyId(null); } // never left busy (A5(f))
    // Another session now (review r3 regress-3; and r3-regress-1: a refused
    // weeks leg hands back the restored blob — never adopted on the next
    // account's screen, never written as that account by its autosave):
    // nothing adopted, nothing said.
    if (sessionEpochRef.current !== ep) { setSaveStatus(""); return; }
    if (r.cancelled) { setSaveStatus(""); return; }
    // The weeks job fenced by a sign-out: another session now — nothing is adopted, or said, on its screen.
    if (weeksR && (weeksR.skipped === "reset" || weeksR.skipped === "cancelled")) { setSaveStatus(""); return; }
    // Failed BEFORE the setup was written (the snapshot unreadable, the
    // before_restore capture or the blob write refused): nothing changed.
    if (!r.ok && !r.running && !r.blobRestored) {
      showToast("Restore failed: " + (r.error || "unknown error"), "error");
      setSaveStatus("");
      return;
    }
    // Adopt the restored blob into local state (same field-by-field shape as
    // the initial loader) so the next autosave writes restored values instead
    // of clobbering the just-restored blob with pre-restore state — also when
    // the weeks job was refused or didn't fully land (review r2 fixes-1: the
    // blob is back either way; left un-adopted, the next autosave wrote the
    // pre-restore setup over it). Vacations / no-call are NOT adopted — the
    // time_off table is their source of truth.
    const d = r.blob || {};
    if (d.surgeons) setSurgeons(d.surgeons);
    if (d.apps) setApps(d.apps);
    if (d.backupMondays) setBackupMondaySet(new Set(d.backupMondays));
    if (d.fierceBackup) setFierceBackupSet(new Set(d.fierceBackup));
    if (d.appShifts) setAppShifts(d.appShifts);
    if (d.priorCounts) setPriorCounts(d.priorCounts);
    if (d.year1Counts) setYear1Counts(d.year1Counts);
    if (d.startMonth !== undefined) setStartMonth(d.startMonth);
    if (d.startYear !== undefined) setStartYear(d.startYear);
    if (d.numWeeks) setNumWeeks(d.numWeeks);
    if (d.startMondayOverride !== undefined) setStartMondayOverride(d.startMondayOverride || "");
    if (d.holidayAssignments) setHolidayAssignments(d.holidayAssignments);
    if (Array.isArray(d.pendingLocks)) setPendingLocks(d.pendingLocks);
    setSilvisRule(d.silvisRule ? sfRule(d.silvisRule) : SF_RULE_DEFAULT); // a pre-Silvis snapshot resets the rule to its default
    setDismissedWarnings(Array.isArray(d.dismissedWarnings) ? d.dismissedWarnings : []); // a snapshot's dismissals come back with it
    lastSyncRef.current = r.ts;        // our own write — don't let the poll treat it as foreign
    everHadRealDataRef.current = true; // restored data is real data
    logAudit("system.restore_snapshot", `Restored snapshot "${snapshotReasonLabel(snap.reason)}" from ${when}`, { snapshot_id: snap.id, reason: snap.reason, created_at: snap.created_at, weeks: r.ok ? "restored" : r.running ? "still being written" : "not all restored" });
    loadSnapshots(); // refresh — the just-added before_restore row should appear
    // The setup is back; the schedule's job is still writing (A5(f)) — the engine toasts how it ended (weeksNotRestored's words if it doesn't land).
    if (r.running) { setSaveStatus(""); showToast("The roster and setup are restored. " + r.error, "info"); return; }
    // The setup is back; the weeks job was refused or didn't fully land: ONE message saying so.
    if (!r.ok) { setSaveStatus(""); showToast(weeksNotRestored(weeksR || { ok: false, error: r.error }), "error"); return; }
    setSaveStatus("Snapshot restored");
    setTimeout(() => setSaveStatus(""), 3000);
    // Post-restore report — say plainly what came back and what didn't.
    // Snapshots now CONTAIN vacations/no-call (the capture time_off fold),
    // but restore deliberately does not write them back to time_off (see the
    // adoption comment above). Whoever reaches for restore on a bad day must
    // hear that HERE, not discover it when vacations are missing a week later.
    const weekCt = Object.keys(r.schedule || {}).length;
    const toCount = (m) => Object.values(m || {}).reduce((n, arr) => n + (Array.isArray(arr) ? arr.length : 0), 0);
    const vacCt = toCount(r.blob?.vacations);
    const ncCt = toCount(r.blob?.noCallDays);
    alert(
      `Snapshot restored.\n\n` +
      `RESTORED: ${weekCt} schedule week${weekCt === 1 ? "" : "s"}, roster, and setup.\n\n` +
      `NOT RESTORED: vacations and no-call days — restore never changes them (they live in their own table). ` +
      (vacCt || ncCt
        ? `This snapshot holds ${vacCt} vacation entr${vacCt === 1 ? "y" : "ies"} and ${ncCt} no-call entr${ncCt === 1 ? "y" : "ies"}; if time off needs recovery it must be re-entered or recovered manually from the snapshot.`
        : `This snapshot predates time-off capture and holds none; current time off was left untouched.`)
    );
    showToast("Snapshot restored — other devices will pick it up on their next sync.", "success");
  };

  // ─── Roll forward counts: a published period's shifts into priorCounts ───
  // Called on every publish (Accept & Publish, Generate & Publish) so the next
  // generation uses up-to-date totals. NET (owner 2026-10-12): `replaced` is
  // the currently published version of any week being published again; its
  // counts come OFF before the new week's go on, so publishing a period twice
  // counts it once (re-publishing used to add the whole period again). Returns
  // { delta, delta1yr, replacedCounted } — the net per surgeon after the
  // floor, and how many replaced weeks came off — or null (nothing above the
  // floor). The weeks are replaced as they are stored NOW (the owner's rule):
  // swaps, edits and flag changes never move the counts, so a week edited
  // after its first publish nets against the edited version.
  const countsOfWeeks = (weeks, pick) => {
    const c = {};
    surgeons.forEach(s => { c[s.id] = { dc:0, nights:0, wknd:0, off:0, dcB:0, nightsB:0, wkndB:0, offB:0 }; });
    Object.entries(weeks || {}).forEach(([mStr, wk]) => {
      if (!wk || (pick && !pick(mStr))) return;
      const bk = wk.isBackup;
      if (wk.dayCall && c[wk.dayCall]) c[wk.dayCall][bk?"dcB":"dc"]++;
      if (wk.off && c[wk.off]) c[wk.off][bk?"offB":"off"]++;
      Object.entries(wk.nights||{}).forEach(([sh, sid]) => {
        if (!sid || !c[sid]) return;
        if (sh === "wknd") c[sid][bk?"wkndB":"wknd"]++;
        else c[sid][bk?"nightsB":"nights"]++;
      });
    });
    return c;
  };
  // counts + a delta → the new counts (day totals: dc*7 + nights + wknd*3 —
  // the approximation of days worked). One function for the state update and
  // for the immediate save, so they can't disagree.
  const applyCountsDelta = (prev, delta) => {
    const addDays = (c) => (c.dc||0)*7 + (c.nights||0) + (c.wknd||0)*3 + (c.svcAdj7||0);
    const addDaysB = (c) => (c.dcB||0)*7 + (c.nightsB||0) + (c.wkndB||0)*3;
    const next = { ...(prev || {}) };
    Object.keys(delta || {}).forEach(id => {
      const p = next[id] || {}, d = delta[id];
      next[id] = {
        ...p,
        dc: (p.dc||0) + d.dc, nights: (p.nights||0) + d.nights, wknd: (p.wknd||0) + d.wknd, off: (p.off||0) + d.off,
        dcB: (p.dcB||0) + d.dcB, nightsB: (p.nightsB||0) + d.nightsB, wkndB: (p.wkndB||0) + d.wkndB, offB: (p.offB||0) + d.offB,
        totalDays: (p.totalDays||0) + addDays(d), totalDaysB: (p.totalDaysB||0) + addDaysB(d),
      };
    });
    return next;
  };
  const netCounts = (add, sub) => {
    const out = {};
    Object.keys(add).forEach(id => { out[id] = {}; Object.keys(add[id]).forEach(k => { out[id][k] = add[id][k] - ((sub[id] || {})[k] || 0); }); });
    return out;
  };
  const rollForwardCounts = useCallback((sched, replaced) => {
    if (!sched || Object.keys(sched).length === 0) return null;
    // COUNTS FLOOR: everything through April 2026 is already inside the
    // multi-year aggregates (the 45-month PDF-parse era) AND, since the
    // 2026-08 historical import, also in schedule_weeks. Rolling a
    // (re)published historical range forward would double-count those months
    // into counts that already contain them. Nobody publishes the past on
    // purpose — this makes sure an accidental publish can't.
    const COUNTS_FLOOR = "2026-05-04";
    sched = Object.fromEntries(Object.entries(sched).filter(([mStr]) => mStr >= COUNTS_FLOOR));
    if (Object.keys(sched).length === 0) return null;
    // Only a replaced week that is itself being published again comes off
    // (and only above the floor, like the new weeks).
    const old = Object.fromEntries(Object.entries(replaced || {}).filter(([mStr]) => mStr >= COUNTS_FLOOR && sched[mStr]));
    const delta = netCounts(countsOfWeeks(sched), countsOfWeeks(old));
    // Merge into priorCounts (Multi-Year — used by generator).
    // (The year2Counts mirror-merge that used to sit here was retired
    // 2026-08-06 with the tier itself.)
    setPriorCounts(prev => applyCountsDelta(prev, delta));
    // And into year1Counts (1-Year) — only for shifts in the current year
    const currentYear = new Date().getFullYear();
    const inYear = (mStr) => parse(mStr).getFullYear() === currentYear;
    const delta1yr = netCounts(countsOfWeeks(sched, inYear), countsOfWeeks(old, inYear));
    setYear1Counts(prev => applyCountsDelta(prev, delta1yr));
    return { delta, delta1yr, replacedCounted: Object.keys(old).length };
  }, [surgeons]);

  // "Needs your OK" (owner decision 2026-10-11): every bend, empty slot,
  // time-off placement and crowded day in the preview, from generator.js
  // listScheduleBends — the same function scoreOf ranks candidates with —
  // judged with the generator's own availability map. Designed holiday
  // patterns are never listed. Non-empty → Accept & Publish needs the
  // checkbox, and the publish audit entry records the count.
  const previewNeedsOk = useMemo(() => {
    if (!previewSchedule) return { cost: 0, items: [] };
    try {
      const keys = Object.keys(previewSchedule).sort();
      return listScheduleBends(previewSchedule, {
        surgeons, mondays: keys, vac: buildGenAvailability(), vacationsOnly: vacations,
        holAssignments: holidayAssignments,
        prevWeekSeed: keys.length ? buildPrevWeekSeed(parse(keys[0])) : null, // the generator's own seed (2026-10-12)
        locks: pendingLocks, // a lock the schedule doesn't honor is listed too
        silvisPrimary: buildSilvisPrimary(), // FAK's Davenport night next to his Silvis 24h: his last resort
      });
    } catch (e) {
      // Fail LOUD: a preview whose check failed must never look clean.
      console.error("Needs-your-OK list failed:", e);
      return { cost: 0, items: [{ kind: "error", key: "error", cost: 0, text: "⚠ The bend check itself failed (" + ((e && e.message) || e) + ") — review the calendar by hand before publishing." }] };
    }
  }, [previewSchedule, schedule, surgeons, vacations, noCallDays, holidayAssignments, silvisActive, silvisFakId, silvisDays, pendingLocks]);
  const acceptPreview = async () => {
    // A Generate & Publish search publishes its own schedule when it ends —
    // never two publishes racing (its button and this one are disabled meanwhile).
    if (publishSearchRunning()) { showToast("Generate & Publish is still searching — wait for it to finish.", "error"); return; }
    cancelSearch(); // a running "Search more" / Re-roll is dropped — its result can't reopen a published preview
    // The checkbox is the gate (the button is disabled too; this is the backstop).
    if (previewSchedule && previewNeedsOk.items.length > 0 && !previewAck) { showToast("Tick \"I've reviewed these items\" first.", "error"); return; }
    if (previewSchedule) {
      if (publishingRef.current) { showToast("A publish is already in progress — wait for it to finish.", "error"); return; }
      if (!schedEditable("job")) return; // (and no other clear / reset / restore / publish queued or running — P7)
      // A preview can sit for minutes: if someone else changed one of its
      // weeks since it was generated, publishing it would overwrite that
      // change with a copy made before it (sync v2, stale intents). Refuse.
      const moved = schedSyncRef.current.changedSince(Object.keys(previewSchedule), previewEpochRef.current);
      if (moved.length) { showToast(`The week${moved.length === 1 ? "" : "s"} of ${moved.join(", ")} changed since this preview was generated — nothing was published. Generate the preview again.`, "error"); return; }
      const needsOkN = previewNeedsOk.items.length;
      const weeks = previewSchedule, origin = previewOrigin, sM = startMonth, sY = startYear, nW = numWeeks, bend = previewNeedsOk.cost;
      publishingRef.current = true; setPublishing(true);
      // This session, at the tap (review r3 regress-3): a sign-out / another
      // account during an await below ends the publish there, silently.
      const ep = sessionEpochRef.current;
      try {
        // A backup snapshot first, fail closed (A14 — as Generate & Publish):
        // no backup, nothing published.
        setSaveStatus("Saving backup snapshot…");
        const snap = await snapshots.capture("regenerate", { minWeeks: Object.keys(schedSyncRef.current.knownSchedule()).length ? 1 : 0 });
        if (sessionEpochRef.current !== ep) { setSaveStatus(""); return; } // nothing published as the next session, nothing said on its screen
        if (!snap.ok) { showToast("Couldn't save a backup snapshot — nothing was published.", "error"); setSaveStatus(""); return; }
        // …and the checks again after its await: still signed in, no other job requested meanwhile (P7), still the same preview, none of its weeks changed by someone else
        if (!schedEditable("job") || previewSchedRef.current !== weeks) { setSaveStatus(""); return; }
        const moved2 = schedSyncRef.current.changedSince(Object.keys(weeks), previewEpochRef.current);
        if (moved2.length) { showToast(`The week${moved2.length === 1 ? "" : "s"} of ${moved2.join(", ")} changed since this preview was generated — nothing was published. Generate the preview again.`, "error"); setSaveStatus(""); return; }
        // Weeks already published get their counts replaced, not added again;
        // the published period merges into the existing schedule so prior
        // periods are preserved.
        publishWeeks(weeks, {
          label: `${nW} weeks from ${MO[sM]} ${sY}${origin === "json" ? ", loaded from JSON" : ""}`,
          extra: needsOkN ? ` — ${needsOkN} item${needsOkN === 1 ? "" : "s"} reviewed in Needs your OK` : "",
          meta: { startMonth: sM, startYear: sY, numWeeks: nW, needsOk: needsOkN, bendCost: bend, origin },
        });
        const job = runPublish(weeks); // the period's weeks → the table, as ONE engine job (A14) — registered now, before any await
        setPreviewSchedule(null); setShowPreview(false);
        setCalMonth(sM);
        setCalYear(sY);
        setView("calendar");
        setSaveStatus(""); // the snapshot's status ends: while the job runs, the engine's "Publishing… keep the app open" is the header's ONE line (A16)
        const pr = await job;
        if (sessionEpochRef.current !== ep) return; // another session now: nothing said on its screen
        if (pr && pr.ok) { setSaveStatus("Published — totals updated"); setTimeout(() => setSaveStatus(""), 3000); if (pr.notice) showToast(pr.notice, "error"); } // (a notice here: another week someone else changed)
        else { setSaveStatus(""); publishNotLanded(pr, "Published on this screen"); }
      } finally { publishingRef.current = false; setPublishing(false); }
    }
  };

  const discardPreview = () => {
    cancelSearch(); setSearchStats(null);
    setPreviewSchedule(null); setShowPreview(false);
  };

  // 🔍 Search more (owner 2026-10-12, item 5): another SEARCH_MS of searching
  // that STARTS FROM the schedule in the preview (generated or loaded) and
  // replaces it only with a strictly better one by the same ranking. It reads
  // today's inputs, so a time-off or lock change since the preview counts. A
  // late result is dropped if the preview was accepted, discarded, re-rolled
  // or reloaded meanwhile.
  const searchMore = async () => {
    const base = previewSchedRef.current;
    if (!base || searchRef.current || publishingRef.current) return;
    const keys = Object.keys(base).sort();
    if (!keys.length) return;
    const ms = keys.map(parse);
    const search = createScheduleSearch(surgeons, ms, buildGenAvailability(), backupMondaySet, priorCounts, buildPrefs(), fierceBackupSet, holidayAssignments, pendingLocks, buildPrevWeekSeed(ms[0]), vacations, year1Counts, { silvisPrimary: buildSilvisPrimary() });
    search.seed(base);
    const done = await runSearch(search, "more", SEARCH_MS);
    if (!done || previewSchedRef.current !== base) return;
    const st = done.session.status();
    setSearchStats({ checked: st.checked, starts: st.starts, ms: done.ms, purpose: "more", improved: st.improved });
    if (st.improved) {
      const better = done.session.best();
      setPreviewSchedule(better); setPreviewOrigin("generated");
      showToast(`Found a better schedule — ${st.checked.toLocaleString()} more schedules checked.`);
    } else showToast(`No better schedule in ${st.checked.toLocaleString()} more checked — this one stays.`);
  };

  // ONE publish step for both publish paths (owner 2026-10-12). Reads the
  // weeks it replaces from the LATEST schedule (scheduleRef — never a copy
  // taken at the click, before an await); puts the counts as they were on the
  // undo step (↩ Undo of a publish takes its counts back off); rolls the
  // counts forward by the net change; writes the audit line; commits the
  // merged schedule. Returns { merged, prior, y1 }: the schedule and the
  // counts after, for an immediate save.
  const publishWeeks = (newWeeks, how) => {
    const cur = scheduleRef.current || {};
    const replacedWeeks = Object.fromEntries(Object.keys(newWeeks).filter(m => cur[m]).map(m => [m, cur[m]]));
    if (Object.keys(cur).length > 0) pushUndo({ prior: priorCounts, y1: year1Counts }); // the step snapshots the mirror (= cur) and the engine epoch
    const r = rollForwardCounts(newWeeks, replacedWeeks);
    const merged = { ...cur, ...newWeeks };
    commitSchedule(merged); // the schedule's ONE writer (sync v2 §2.1): the mirror first — a publish right after this one sees it before the next render
    const nRep = r ? r.replacedCounted : 0;
    const t1 = r ? netCountsText(r.delta1yr) : "no change", tAll = r ? netCountsText(r.delta) : "no change";
    logAudit("schedule.publish", `Published schedule (${how.label})${how.extra || ""}${nRep ? ` — ${nRep} week${nRep === 1 ? "" : "s"} replaced a published version` : ""} — counts net: ${tAll}${t1 !== tAll ? ` (this year's tally: ${t1})` : ""}`,
      Object.assign({}, how.meta || {}, { weeks: Object.keys(newWeeks).length, replaced: nRep, net: r ? r.delta : null, net1yr: r ? r.delta1yr : null }));
    return { merged, prior: r ? applyCountsDelta(priorCounts, r.delta) : priorCounts, y1: r ? applyCountsDelta(year1Counts, r.delta1yr) : year1Counts };
  };

  // The net count change of a publish, in plain words: "DJA service +1,
  // nights −1; KJH weekends +1" — or "no change" (the same assignments again).
  const netCountsText = (net) => {
    if (!net) return "no change";
    const parts = [];
    surgeons.forEach(sg => {
      const d = net[sg.id]; if (!d) return;
      const bits = [["dc", "service"], ["nights", "nights"], ["wknd", "weekends"], ["off", "off"], ["dcB", "backup service"], ["nightsB", "backup nights"], ["wkndB", "backup weekends"], ["offB", "backup off"]]
        .filter(([k]) => d[k]).map(([k, l]) => `${l} ${d[k] > 0 ? "+" : "−"}${Math.abs(d[k])}`);
      if (bits.length) parts.push(`${sg.name} ${bits.join(", ")}`);
    });
    return parts.length ? parts.join("; ") : "no change";
  };

  // ─── Load a schedule from JSON into the preview (benchmark loader, owner 2026-10-12) ───
  // Scheduler-only. The file's weeks must be EXACTLY the Mondays of the
  // current Generate settings and every id a roster id, or the whole load is
  // refused with the reason (validateScheduleJson, generator.js). Each week is
  // then shaped by generator.js's own shapeScheduleWeeks — off, the backup
  // flags from the sets, holiday coverage from the holiday cards — so Needs
  // your OK, the Fairness Summary and Accept & Publish treat it exactly like
  // a generated preview. Nothing is written until ✓ Accept & Publish.
  const loadScheduleJson = (text, fileName) => {
    if (publishSearchRunning()) { showToast("Generate & Publish is still searching — wait for it to finish, then load the file.", "error"); return false; }
    cancelSearch(); setSearchStats(null); // a file replaces the preview — a running search's result is dropped, and its count no longer applies
    const refuse = (why) => { showToast(`Not loaded — ${why}. Nothing was changed.`, "error"); return false; };
    let o;
    // (a byte-order mark, which Windows editors often write, is not JSON)
    try { o = JSON.parse(String(text).replace(/^﻿/, "")); } catch (e) { return refuse("the file isn't valid JSON"); }
    let v, shaped;
    try {
      v = validateScheduleJson(o, mondays.map(fmt), surgeons.map(sg => sg.id), Object.fromEntries(surgeons.map(sg => [sg.id, sg.name])));
      if (!v.ok) return refuse(v.error);
      shaped = shapeScheduleWeeks(v.weeks, surgeons, backupMondaySet, fierceBackupSet, holidayAssignments);
    } catch (e) { console.error("schedule JSON load failed:", e); return refuse(`the file could not be checked (${(e && e.message) || e})`); }
    previewEpochRef.current = schedSyncRef.current.epochNow(); // judged from the load (sync v2): Accept refuses if one of its weeks is adopted after
    setPreviewSchedule(shaped); setPreviewOrigin("json"); setPreviewCalMonth(0); setShowPreview(true);
    showToast(`Loaded ${fileName || "the file"} into the preview (${Object.keys(shaped).length} weeks) — nothing is published until ✓ Accept & Publish.`, "success");
    return true;
  };
  const onLoadJsonFile = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = ""; // the same file can be chosen again
    if (!f) return;
    const r = new FileReader();
    r.onload = () => loadScheduleJson(String(r.result || ""), f.name);
    r.onerror = () => showToast("Couldn't read that file — nothing was changed.", "error");
    r.readAsText(f);
  };

  // ─── Holiday Assignment Generator ───
  // RULE (owner 2026-10-13): FAK takes Christmas Eve + Christmas Day, both
  // slots, every year — his major AND his minor. Every other partner takes ONE
  // minor a year (Memorial Day, July 4th, Labor Day: 3 × 2 = 6 slots for 6)
  // and at most ONE major (New Year's, Thanksgiving: 4 slots for 6 — two sit
  // out a major each year and get one the next). Nobody gets the same holiday
  // as last year; the holidays rotate (helpers.js planHolidayPairs).
  const generateHolidayAssignments = useCallback((year) => {
    setHolidayLockWarning(""); // a healthy run clears any stale lock warning
    const holidays = getHolidays(year);
    const ids = surgeons.map(s => s.id);
    const nameMap = {}; surgeons.forEach(s => nameMap[s.id] = s.name);
    const DAYNAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    // Lifetime holiday counts across all stored years for overall fairness,
    // plus TENURE ELIGIBILITY (2026-08-07): eligibleCt[id][type] = stored
    // holidays of that type dated on/after the surgeon's start date. Start
    // dates come from INIT_SURGEONS (the live blob roster doesn't carry
    // them); no start = predates the seeded window = eligible for all.
    // Absorbed holidays (no assignment stored — July 4 2023/2024) are absent
    // from the arrays, so they're out of the DENOMINATOR by construction:
    // nobody was eligible for a holiday that didn't exist. Same
    // skip-the-current-year rule as the counts, and the comparison is
    // against each holiday's actual DATE, so a mid-year start (ARW,
    // 2023-09-01: missed Memorial Day, eligible for Labor Day) counts
    // correctly — a per-year divisor can't see that.
    const startOf = {};
    ids.forEach(id => {
      const rosterStart = surgeons.find(s => s.id === id)?.start;
      startOf[id] = rosterStart || INIT_SURGEONS.find(s => s.id === id)?.start || null;
    });
    const lifetimeCt = {};
    const eligibleCt = {};
    ids.forEach(id => { lifetimeCt[id] = { major: 0, minor: 0 }; eligibleCt[id] = { major: 0, minor: 0 }; });
    Object.entries(holidayAssignments).forEach(([yr, arr]) => {
      if (String(yr) === String(year)) return; // skip current year (we're regenerating it)
      if (!Array.isArray(arr)) return;
      arr.forEach(h => {
        if (h.surgeonA && lifetimeCt[h.surgeonA]) lifetimeCt[h.surgeonA][h.type]++;
        // Dedupe collapsed pairs (2026-08-06): sA === sB — the Christmas
        // standing rule, or pickPair's `avail[1] || avail[0]` fallback — is
        // ONE assignment, not two. Counting both halves charged the collapsed
        // surgeon double for the same days while a normal two-surgeon holiday
        // charged each one.
        if (h.surgeonB && h.surgeonB !== h.surgeonA && lifetimeCt[h.surgeonB]) lifetimeCt[h.surgeonB][h.type]++;
        if (h.date && (h.type === "major" || h.type === "minor")) {
          ids.forEach(id => {
            if (!startOf[id] || h.date >= startOf[id]) eligibleCt[id][h.type]++;
          });
        }
      });
    });

    const fakId = ids.find(id => (nameMap[id] || "").toUpperCase() === "FAK") || null;

    // Helper: build coverage days from a holiday + assigned pair
    // Always includes: Night Before (B) → Holiday Day (A) → Day After (B) (minimum 3 days)
    // Night-before defaults to Surgeon B; at display time it's replaced by the actual night-shift person from the schedule
    const buildCoverage = (hol, sA, sB) => {
      const holDate = parse(hol.date);
      const holDow = holDate.getDay();
      const coverage = [];

      // Night before — defaults to Surgeon B (replaced at display time by actual night-shift person;
      // a weekend night of FAK's Christmas design week is resolved live — generator.js holidayEveHolder)
      const evDate = addD(holDate, -1);
      coverage.push({ date: fmt(evDate), surgeon: sB, label: hol.name + " Night Before", day: DAYNAMES[evDate.getDay()], isEve: true });

      // Holiday day — Surgeon A
      coverage.push({ date: hol.date, surgeon: sA, label: hol.name + " 24h", day: DAYNAMES[holDow] });

      // CHRISTMAS TWO-DAY CAP (standing rule 2026-08-06): when one surgeon
      // holds both halves (the FAK Eve+Day rule), coverage is Eve + the day
      // itself and NOTHING more. Without this cap the mid-week walk below
      // alternates sB/sA through Saturday, and with sA === sB that collapses
      // into one name: a Tuesday Christmas (2029) would print SIX consecutive
      // solo days, 2030 five, 2031 four. Days after Christmas revert to the
      // normal service-week doctor — which is how 2024/2025 actually ran.
      if (hol.name === "Christmas Day" && sA === sB) return coverage;

      if (hol.endDate && hol.endDate !== hol.date) {
        // New Year's: Dec 31 (A) + Jan 1 (B), then continue alternating
        coverage.push({ date: hol.endDate, surgeon: sB, label: "New Year's Day 24h", day: DAYNAMES[parse(hol.endDate).getDay()] });
        let next = addD(parse(hol.endDate), 1);
        let toggle = true;
        while (next.getDay() !== 0 && next.getDay() !== 1) {
          coverage.push({ date: fmt(next), surgeon: toggle ? sA : sB, label: DAYNAMES[next.getDay()] + " 24h", day: DAYNAMES[next.getDay()] });
          toggle = !toggle;
          next = addD(next, 1);
        }
      } else if (holDow === 1) {
        // Monday holiday (Memorial Day, Labor Day): Only Monday is 24h
        // Night before (Sun) = Surgeon B (Eve entry already added above)
        // Holiday Monday = Surgeon A 24h (already added above)
        // Tuesday onward = regular service week doctor takes over (no holiday override)
      } else if (holDow === 5) {
        // Friday holiday: Eve (Thu), Fri (A), Sat (B)
        coverage.push({ date: fmt(addD(holDate, 1)), surgeon: sB, label: "Sat 24h", day: "Sat" });
      } else if (holDow === 6) {
        // Saturday holiday: Eve (Fri), Sat (A), Sun (B)
        coverage.push({ date: fmt(addD(holDate, 1)), surgeon: sB, label: "Sun 24h", day: "Sun" });
      } else if (holDow === 0) {
        // Sunday holiday: Eve (Sat), Sun (A), Mon (B)
        const dayAfter = addD(holDate, 1);
        coverage.push({ date: fmt(dayAfter), surgeon: sB, label: DAYNAMES[dayAfter.getDay()] + " 24h", day: DAYNAMES[dayAfter.getDay()] });
      } else {
        // Mid-week (Tue-Thu): Eve already added, holiday (A), then alternate B, A through Sat
        let next = addD(holDate, 1);
        let toggle = false; // false=B, true=A
        while (next.getDay() !== 0 && next.getDay() !== 1) {
          coverage.push({ date: fmt(next), surgeon: toggle ? sA : sB, label: DAYNAMES[next.getDay()] + " 24h", day: DAYNAMES[next.getDay()] });
          toggle = !toggle;
          next = addD(next, 1);
        }
      }
      return coverage;
    };

    // silvisBusy: the DATES a holiday assignment actually hands a surgeon in
    // one role — the non-Eve coverage rows for that role (A = even index,
    // B = odd, the mapping swapHolidaySurgeon uses; "both" = the collapsed
    // Christmas pair) PLUS the weekend legs the generator implies: a Fri or
    // Sun 24h holder is given the WHOLE weekend (generator.js
    // holidayWkndOverride), so Fri → its Sun, Sun → its Fri. Checking only
    // hol.date + the day after missed Sat/Sun/mid-week walk days.
    const holDatesFor = (hol, id, role) => {
      const sA = role === "B" ? "_other" : id, sB = role === "A" ? "_other" : id;
      const cov = buildCoverage(hol, sA, sB).filter(c => !c.isEve && c.surgeon === id);
      const days = new Set(cov.map(c => c.date));
      cov.forEach(c => { const dow = parse(c.date).getDay(); if (dow === 5) days.add(fmt(addD(parse(c.date), 2))); if (dow === 0) days.add(fmt(addD(parse(c.date), -2))); });
      return [...days];
    };

    // ─── The pairs ───
    // Presets (hand-written) are facts and count; FAK's Christmas is the
    // standing rule; everything else is planned by helpers.js
    // planHolidayPairs, which ranks every way to fill each group: time off,
    // one per group, nobody sitting out a group twice running, no repeat of
    // last year's (then two years ago's) holiday, the holiday each has had
    // least, the 3-year major cycle, the lifetime rate, new pairings, A / B.
    const presets = (typeof HOLIDAY_PRESETS !== "undefined") ? HOLIDAY_PRESETS[String(year)] : null;
    const allHols = [...holidays.major.map(h => ({ ...h, type: "major" })), ...holidays.minor.map(h => ({ ...h, type: "minor" }))];
    const assignments = [], fixedCards = [], toPlan = [];
    const card = (hol, sA, sB) => ({ name: hol.name, date: hol.date, type: hol.type, emoji: hol.emoji || "📅", surgeonA: sA, surgeonB: sB, coverage: buildCoverage(hol, sA, sB) });
    // A holiday of this year already worked (dated before today) is history —
    // kept as it is on a re-generate, like a preset (the rotation reads it).
    const todayStr = fmt(new Date());
    const stored = holidayAssignments[String(year)] || [];
    allHols.forEach(hol => {
      const kept = stored.find(h => h && h.name === hol.name && h.date && h.date < todayStr);
      if (kept) { assignments.push(kept); fixedCards.push(kept); return; }
      // Check for pre-set assignments (e.g., handwritten schedule for this year)
      if (presets && presets[hol.name]) {
        const [sA, sB] = presets[hol.name];
        // silvisBusy: a hand-written preset is a fact, so it is kept — but
        // an overlap with FAK's Silvis primary days is said out loud.
        if (silvisActive) {
          const ph = [];
          if (sA === silvisFakId) { const h = sfConflictDay(silvisDays.primary, holDatesFor(hol, sA, "A")); if (h) ph.push(h); }
          if (sB === silvisFakId) { const h = sfConflictDay(silvisDays.primary, holDatesFor(hol, sB, "B")); if (h) ph.push(h); }
          if (ph.length) setHolidayLockWarning(`⚠ ${hol.name} ${year} preset puts ${nameMap[silvisFakId]} on a Silvis PRIMARY day (${ph.join(", ")}) — kept as written; resolve with Silvis or change it via the swap controls.`);
        }
        const c = card(hol, sA, sB);
        assignments.push(c); fixedCards.push(c);
        return;
      }

      // CHRISTMAS STANDING RULE (2026-08-06): FAK covers BOTH Christmas Eve
      // and Christmas Day, every year — formalizing what the 2024 and 2025
      // schedules already did. No partner is selected; coverage is capped
      // to the two days in buildCoverage, and the lifetimeCt dedupe counts
      // the collapsed pair as ONE assignment.
      if (hol.name === "Christmas Day") {
        if (!fakId) {
          // FAIL LOUDLY (wipe-guard doctrine): if the designated Christmas
          // surgeon can't be resolved (renamed, departed), the lock must
          // not silently dissolve into the normal rotation with nobody
          // told. Surface it and leave Christmas UNASSIGNED for the
          // scheduler to fill by hand.
          console.error(`Christmas lock: designated surgeon "FAK" not found in the roster — Christmas ${year} left unassigned.`);
          setHolidayLockWarning(`⚠ Christmas ${year} was NOT auto-assigned: the designated surgeon (FAK) isn't in the roster. Assign it manually via the swap controls.`);
          return;
        }
        // silvisBusy: the standing rule is FAK, so check HIS dates (Eve is
        // display-only; the 24h day, plus its weekend leg when Dec 25 is a
        // Fri/Sun). Same fail-LOUD shape as the missing-roster case above:
        // leave Christmas unassigned and say why — never assign silently.
        if (silvisActive && fakId === silvisFakId) {
          const hit = sfConflictDay(silvisDays.primary, holDatesFor(hol, fakId, "both"));
          if (hit) {
            console.error(`Christmas lock: ${nameMap[fakId]} is Silvis PRIMARY on ${hit} — Christmas ${year} left unassigned.`);
            setHolidayLockWarning(`⚠ Christmas ${year} was NOT auto-assigned: ${nameMap[fakId]} is Silvis PRIMARY on ${hit} (rule silvisBusy). Resolve it with Silvis or assign manually via the swap controls.`);
            return;
          }
        }
        assignments.push(card(hol, fakId, fakId));
        return;
      }
      toPlan.push(hol);
    });
    // Time off on the dates each ROLE holds — its 24h rows (+ the weekend leg a
    // Fri / Sun row implies) and surgeon B's eve night when it is his — as the
    // generator's floor sees it: vacation OR no-call; and a night ends 07:00
    // the next morning, so a vacation starting then is too late (Warnings'
    // into-vac rule). silvisBusy should FAK ever be planned. Ranks first.
    const unavailable = (id, hol, role) => {
      const days = holDatesFor(hol, id, role);
      if (role === "B") {
        const xc = assignments.find(h => h.name === "Christmas Day"), eve = fmt(addD(parse(hol.date), -1));
        const takes = (mon) => { const p = holidayDesign({ [year]: xc ? [xc] : [] }, [mon], fakId, christmasSlotOk(buildGenAvailability(), vacations, buildSilvisPrimary())).pins[mon]; return !!p && p.wknd === fakId; };
        if (holidayEveHolder({ ...hol, surgeonB: id }, eve, { [year]: xc ? [xc] : [] }, fakId, takes) === id) days.push(eve);
      }
      if (days.some(ds => onVac(id, ds, vacations) || onVac(id, ds, noCallDays))) return true;
      if (days.some(ds => onVac(id, fmt(addD(parse(ds), 1)), vacations))) return true;
      return !!(silvisActive && id === silvisFakId && sfConflictDay(silvisDays.primary, holDatesFor(hol, id, role)) !== null);
    };
    // The lifetime RATE of the group — assignments ÷ holidays they were
    // eligible for (tenure-normalized, 2026-08-07). Raw counts under-served
    // partial tenure: ARW's 1 major from 9 eligible read as "less burdened"
    // than MCC's 2 from 12. holidayRate (config.js) guards the zero-eligible
    // new hire: rate 0, never 0/0 = NaN.
    const rateOf = (id, type) => holidayRate(lifetimeCt[id]?.[type] || 0, eligibleCt[id]?.[type] || 0);
    const plan = planHolidayPairs({ year, holidays: toPlan, partners: ids.filter(id => id !== fakId), history: holidayAssignments, fixed: fixedCards, unavailable, rate: rateOf, nameOf: (id) => nameMap[id] || id });
    toPlan.forEach(hol => { const pk = plan.picks[hol.name]; if (pk) assignments.push(card(hol, pk.surgeonA, pk.surgeonB)); });
    if (plan.notes.length) setHolidayLockWarning(prev => [prev, ...plan.notes.map(n => "⚠ " + n)].filter(Boolean).join(" · "));

    // Sort final assignments by date for display
    assignments.sort((a, b) => a.date.localeCompare(b.date));
    setHolidayAssignments(prev => ({ ...prev, [String(year)]: assignments }));
    logAudit("holiday.generate", `Generated holiday assignments for ${year} (${assignments.length} holidays)`, { year, count: assignments.length });
  }, [surgeons, vacations, noCallDays, holidayAssignments, silvisActive, silvisFakId, silvisDays]);

  // ─── Swap a holiday surgeon ───
  const swapHolidaySurgeon = useCallback((year, holidayIdx, slot, newSurgeonId) => {
    // Check distinct-pair constraint: is this surgeon already assigned to another holiday in the same group?
    const arr = holidayAssignments[String(year)] || [];
    const targetHol = arr[holidayIdx];
    if (targetHol) {
      const sameGroup = arr.filter((h, i) => i !== holidayIdx && h.type === targetHol.type);
      const usedInGroup = new Set();
      sameGroup.forEach(h => { usedInGroup.add(h.surgeonA); usedInGroup.add(h.surgeonB); });
      const fakSwap = surgeons.find(s => (s.name || "").toUpperCase() === "FAK")?.id;
      if (usedInGroup.has(newSurgeonId) && newSurgeonId !== fakSwap) { // FAK gets his own question below
        const conflictHol = sameGroup.find(h => h.surgeonA === newSurgeonId || h.surgeonB === newSurgeonId);
        const surgeonName = surgeons.find(s => s.id === newSurgeonId)?.name || newSurgeonId;
        if (!confirm(`⚠️ ${surgeonName} is already assigned to ${conflictHol?.name} (${targetHol.type} group).\n\nEach partner takes at most one ${targetHol.type} holiday a year. Assign anyway?`)) return;
      }
      // FAK's holidays are Christmas Eve + Christmas Day — his major and his minor (owner 2026-10-13)
      if (newSurgeonId && newSurgeonId === fakSwap && targetHol.name !== "Christmas Day"
        && !confirm(`${nameOf(newSurgeonId)}'s holidays are Christmas Eve + Christmas Day (his major and his minor). Put him on ${targetHol.name} too?`)) return;
      // silvisBusy: holiday 24h on a Silvis primary day — same confirm-to-
      // override idiom, on the dates THIS slot will actually hold (the
      // non-Eve coverage rows this role maps to, plus the weekend leg the
      // generator implies for a Fri/Sun 24h holder).
      if (silvisActive && newSurgeonId === silvisFakId) {
        const nonEve = effectiveHolidayCoverage(targetHol).filter(c => !c.isEve);
        const mine = nonEve.filter((c, i) => (slot === "surgeonA" ? i % 2 === 0 : i % 2 === 1)).map(c => c.date);
        const days = new Set(mine);
        mine.forEach(ds => { const dow = parse(ds).getDay(); if (dow === 5) days.add(fmt(addD(parse(ds), 2))); if (dow === 0) days.add(fmt(addD(parse(ds), -2))); });
        const hit = sfConflictDay(silvisDays.primary, [...days]);
        if (hit && silvisRefuse([`${nameOf(newSurgeonId)} is Silvis PRIMARY on ${hit}, which overlaps ${targetHol.name} 24h coverage (${slot === "surgeonA" ? "surgeon A" : "surgeon B"})`])) return;
      }
    }
    logAudit("holiday.swap", `Changed ${targetHol?.name || "holiday"} ${slot === "surgeonA" ? "surgeon A" : "surgeon B"} to ${nameOf(newSurgeonId)} (${year})`, { year, holiday: targetHol?.name, slot, newSurgeonId });
    setHolidayAssignments(prev => {
      const n = { ...prev };
      const arr = [...(n[String(year)] || [])];
      const hol = { ...arr[holidayIdx] };
      const sA = slot === "surgeonA" ? newSurgeonId : hol.surgeonA;
      const sB = slot === "surgeonB" ? newSurgeonId : hol.surgeonB;
      hol.surgeonA = sA;
      hol.surgeonB = sB;
      let nonEveIdx = 0;
      hol.coverage = hol.coverage.map((c) => {
        if (c.isEve) return { ...c, surgeon: sB };
        const surgeon = nonEveIdx % 2 === 0 ? sA : sB;
        nonEveIdx++;
        return { ...c, surgeon };
      });
      arr[holidayIdx] = hol;
      n[String(year)] = arr;
      return n;
    });
  }, [holidayAssignments, surgeons, silvisActive, silvisFakId, silvisDays, silvisRefuse]);

  const swapShift = (mStr, shift, newId, expectOldId) => {
    if (!schedEditable()) return;
    // The slot as the MIRROR holds it (sync v2 §2.1): the holder the notices
    // name and the week the Silvis check reads — a render's `schedule` can be
    // a pull behind the latest.
    const cur = scheduleRef.current;
    const oldId = shift === "dayCall" ? cur[mStr]?.dayCall : cur[mStr]?.nights?.[shift];
    // A swap chosen from suggestions made earlier: the slot must still hold
    // the surgeon it was suggested for (sync v2, stale intents).
    if (expectOldId !== undefined && (oldId || "") !== (expectOldId || "")) {
      showToast("This swap is out of date — that shift changed since the suggestions were made. Nothing was changed; find swaps again.", "error");
      setSwapSuggestions(null); setSwapTarget(null); // they describe a schedule that's gone (A13)
      return;
    }
    // silvisBusy (see acceptTradeRequest). swapShift is a manual edit path, so
    // the scheduler override applies.
    if (silvisActive) { const r = silvisBlock(newId, mStr, shift, cur[mStr]); if (silvisRefuse(r ? [r] : [])) return; }
    pushUndo();
    updateSchedule(p => {
      const wk = {...p[mStr]};
      if(shift==="dayCall") wk.dayCall=newId;
      else wk.nights={...wk.nights,[shift]:newId};
      const assigned = new Set([wk.dayCall,...Object.values(wk.nights)].filter(Boolean));
      wk.off = surgeons.map(s=>s.id).find(id=>!assigned.has(id))||null;
      return {...p,[mStr]:wk};
    });
    setEditShift(null); setEditingWeek(null);
    setSwapSuggestions(null); setSwapTarget(null);
    // Notify about the change — only the affected surgeons and the scheduler/admin
    const oldName = sMap[oldId]?.name || "—";
    const newName = sMap[newId]?.name || "—";
    const shiftLabel = SHIFT_LABELS[shift] || shift;
    const editTargets = [...new Set([oldId, newId, ...schedulerAdminIds].filter(Boolean))];
    addNotification("schedule_changed", "Shift Reassigned",
      `${shiftLabel} (wk of ${mStr}): ${oldName} → ${newName}`,
      { week: mStr }, editTargets);
    sendEmailNotif("schedule_changed", { shift: shiftLabel, week: mStr, old_surgeon: oldName, new_surgeon: newName }, editTargets);
  };

  // ─── Smart Swap Suggestions ───
  const [swapTarget, setSwapTarget] = useState(null); // { mondayStr, shift, surgeonId }
  const [swapSuggestions, setSwapSuggestions] = useState(null); // [{ candidateId, score, reasons, returnSwaps }]
  const [editWeekModal, setEditWeekModal] = useState(null); // { mondayStr, appsBase, appsLoaded, openWeek, openEpoch, draft: { dayCall, nights, dayCallOverrides, apps, reason }, adoptedAway? } or null
  const [editWeekPick, setEditWeekPick] = useState(""); // dropdown selection on the Manual Adjustments card
  // Clear stale selection when the user navigates to a different month
  useEffect(() => { setEditWeekPick(""); }, [calMonth, calYear]);

  const findSwapSuggestions = useCallback((mondayStr, shift, currentSurgeonId) => {
    if (!schedule[mondayStr]) return;
    const currentName = sMap[currentSurgeonId]?.name || "?";
    const mon = parse(mondayStr);
    const ids = surgeons.map(s => s.id).filter(id => id !== currentSurgeonId);

    // Current shift counts from schedule
    const sCounts = {};
    surgeons.forEach(s => { sCounts[s.id] = { dc: 0, nights: 0, wknd: 0 }; });
    Object.values(schedule).forEach(wk => {
      if (wk.dayCall && sCounts[wk.dayCall]) sCounts[wk.dayCall].dc++;
      Object.entries(wk.nights || {}).forEach(([sk, sid]) => {
        if (!sid || !sCounts[sid]) return;
        if (sk === "wknd") sCounts[sid].wknd++;
        else sCounts[sid].nights++;
      });
    });

    // Determine shift type for counting
    const shiftType = shift === "dayCall" ? "dc" : shift === "wknd" ? "wknd" : "nights";

    // Check each candidate
    const candidates = [];
    ids.forEach(candId => {
      const candName = sMap[candId]?.name || "?";
      const reasons = [];
      let eligible = true;

      // 1. Check vacation conflict
      const dayOffset = { dayCall: 0, mon: 0, tue: 1, wed: 2, thu: 3, wknd: 4 }[shift] || 0;
      const shiftDate = fmt(addD(mon, dayOffset));
      if (shift === "dayCall") {
        for (let i = 0; i < 6; i++) {
          if (onVac(candId, fmt(addD(mon, i)), vacations)) { eligible = false; break; }
        }
      } else if (shift === "wknd") {
        const friDate = fmt(addD(mon, 4));
        const sunDate = fmt(addD(mon, 6));
        const nextMonDate = fmt(addD(mon, 7));
        if (onVac(candId, friDate, vacations) || onVac(candId, sunDate, vacations) || onVac(candId, nextMonDate, vacations)) eligible = false;
      } else {
        const nextDay = fmt(addD(mon, dayOffset + 1));
        if (onVac(candId, shiftDate, vacations) || onVac(candId, nextDay, vacations)) eligible = false;
      }
      // silvisBusy: never even suggest FAK for a slot on a Silvis primary day.
      if (eligible && silvisActive && candId === silvisFakId && sfConflict(silvisDays.primary, mondayStr, shift)) eligible = false;
      if (!eligible) return;

      // 2. Check if candidate is already assigned DC that week (can't do night + DC)
      const wk = schedule[mondayStr];
      if (shift !== "dayCall" && wk.dayCall === candId) {
        // No reason push here ON PURPOSE: this exclusion is HARD — the next
        // line drops the candidate entirely, so anything pushed onto
        // reasons is written and then discarded along with it (an
        // effect-unobservable write, which is exactly what used to sit
        // here — NOT unreachable code; the push did run). If this is ever
        // softened to a warning that still LISTS the candidate, the reason
        // push belongs back at this point.
        return; // can't take a night/weekend if on DC
      }

      // 3. Check if candidate already has a shift that week they'd need to keep
      const candShiftsThisWeek = [];
      if (wk.dayCall === candId) candShiftsThisWeek.push(slotLabel(mondayStr, "dayCall"));
      Object.entries(wk.nights || {}).forEach(([sk, sid]) => {
        if (sid === candId) candShiftsThisWeek.push(slotLabel(mondayStr, sk));
      });

      // 4. Calculate fairness score — lower is better (candidate has fewer of this type)
      const currentCount = sCounts[currentSurgeonId]?.[shiftType] || 0;
      const candCount = sCounts[candId]?.[shiftType] || 0;
      const countDiff = currentCount - candCount; // positive = current has more → good swap

      // Include prior counts for total fairness
      const priorCurr = priorCounts[currentSurgeonId] || {};
      const priorCand = priorCounts[candId] || {};
      const totalCurrType = (priorCurr[shiftType === "dc" ? "dc" : shiftType === "wknd" ? "wknd" : "nights"] || 0) + (sCounts[currentSurgeonId]?.[shiftType] || 0);
      const totalCandType = (priorCand[shiftType === "dc" ? "dc" : shiftType === "wknd" ? "wknd" : "nights"] || 0) + (sCounts[candId]?.[shiftType] || 0);
      const totalDiff = totalCurrType - totalCandType;

      if (countDiff > 0) reasons.push(`${candName} has ${countDiff} fewer ${shiftType === "dc" ? "service weeks" : shiftType === "wknd" ? "weekends" : "nights"} this period`);
      else if (countDiff === 0) reasons.push(`Equal ${shiftType === "dc" ? "service weeks" : shiftType === "wknd" ? "weekends" : "nights"} this period`);
      else reasons.push(`${candName} has ${Math.abs(countDiff)} more ${shiftType === "dc" ? "service weeks" : shiftType === "wknd" ? "weekends" : "nights"} — less ideal`);

      if (totalDiff > 1) reasons.push(`${totalDiff} fewer overall (good for balance)`);

      if (candShiftsThisWeek.length > 0) reasons.push(`Already assigned: ${candShiftsThisWeek.join(", ")}`);

      // 5. Find possible return swaps — shifts the current surgeon could take from the candidate in another week
      // Upcoming only (2026-08-31 nav cleanup): a return shift in the past is
      // a dead offer — nobody can take back a night that already happened.
      // Same start-date rules as the picker builders: night = its own date,
      // weekend = its Friday, service week = its Monday (a partially-elapsed
      // week is excluded — the swap writes the WHOLE week's dayCall).
      const rsTodayStr = fmt(new Date());
      // silvisBusy: never offer FAK a return leg on his own Silvis primary day
      // (executeTwoWaySwap would only refuse it a click later).
      const silvisRet = (m, slot) => silvisActive && currentSurgeonId === silvisFakId && !!sfConflict(silvisDays.primary, m, slot);
      const returnSwaps = [];
      Object.entries(schedule).forEach(([otherMon, otherWk]) => {
        if (otherMon === mondayStr) return;
        // Check if candidate has a shift of the same type in another week
        if (shiftType === "dc" && otherWk.dayCall === candId) {
          // Check current surgeon can do DC that week
          const otherMonDate = parse(otherMon);
          let canDo = true;
          for (let i = 0; i < 6; i++) { if (onVac(currentSurgeonId, fmt(addD(otherMonDate, i)), vacations)) { canDo = false; break; } }
          if (canDo && otherMon >= rsTodayStr && !silvisRet(otherMon, "dayCall")) returnSwaps.push({ mondayStr: otherMon, shift: "dayCall", label: slotLabel(otherMon, "dayCall") });
        }
        if (shiftType === "nights") {
          NIGHT_KEYS.forEach((sk, i) => {
            if (otherWk.nights?.[sk] === candId && otherWk.dayCall !== currentSurgeonId) {
              const otherMonDate = parse(otherMon);
              const sd = fmt(addD(otherMonDate, i));
              const nd = fmt(addD(otherMonDate, i + 1));
              if (sd >= rsTodayStr && !onVac(currentSurgeonId, sd, vacations) && !onVac(currentSurgeonId, nd, vacations) && !silvisRet(otherMon, sk)) {
                returnSwaps.push({ mondayStr: otherMon, shift: sk, label: slotLabel(otherMon, sk) });
              }
            }
          });
        }
        if (shiftType === "wknd" && otherWk.nights?.wknd === candId) {
          const otherMonDate = parse(otherMon);
          const f = fmt(addD(otherMonDate, 4)), su = fmt(addD(otherMonDate, 6)), nm = fmt(addD(otherMonDate, 7));
          if (f >= rsTodayStr && !onVac(currentSurgeonId, f, vacations) && !onVac(currentSurgeonId, su, vacations) && !onVac(currentSurgeonId, nm, vacations) && otherWk.dayCall !== currentSurgeonId && !silvisRet(otherMon, "wknd")) {
            returnSwaps.push({ mondayStr: otherMon, shift: "wknd", label: slotLabel(otherMon, "wknd") });
          }
        }
      });

      // Score: higher = better swap. Favor candidates with fewer shifts of this type.
      const score = (countDiff * 10) + (totalDiff * 5) + (returnSwaps.length > 0 ? 20 : 0) + (candShiftsThisWeek.length === 0 ? 10 : -5);

      candidates.push({ candidateId: candId, candidateName: candName, score, reasons, returnSwaps, countDiff, totalDiff, candShiftsThisWeek });
    });

    // Sort by score descending (best first)
    candidates.sort((a, b) => b.score - a.score);
    setSwapTarget({ mondayStr, shift, surgeonId: currentSurgeonId, surgeonName: currentName });
    setSwapSuggestions(candidates);
  }, [schedule, surgeons, sMap, vacations, priorCounts, silvisActive, silvisFakId, silvisDays]);

  // ─── Execute a two-way swap ───
  const executeTwoWaySwap = useCallback((targetMon, targetShift, targetOldId, candId, returnMon, returnShift) => {
    // Same accept-time re-validation as acceptTradeRequest: suggestions can
    // sit in a stale tab past midnight (or longer). Either leg elapsed →
    // refuse loudly, zero writes. Record corrections are the week editor's
    // job, not the swap tool's.
    const swapToday = fmt(new Date());
    if (shiftStartDate(targetMon, targetShift) < swapToday
      || (returnMon && returnShift && shiftStartDate(returnMon, returnShift) < swapToday)) {
      showToast("This trade's shift has already passed — propose a new one.", "error");
      return;
    }
    if (!schedEditable()) return;
    // The suggestion must still describe the schedule (sync v2, stale
    // intents): the target slot still held by the surgeon it was made for,
    // the return slot still the candidate's. Otherwise refuse, zero writes.
    {
      const cur = scheduleRef.current;
      const holder = (w, k) => (k === "dayCall" ? cur[w]?.dayCall : cur[w]?.nights?.[k]) || "";
      if (holder(targetMon, targetShift) !== (targetOldId || "") || (returnMon && returnShift && holder(returnMon, returnShift) !== (candId || ""))) {
        showToast("This swap is out of date — those shifts changed since the suggestions were made. Nothing was changed; find swaps again.", "error");
        setSwapSuggestions(null); setSwapTarget(null); // they describe a schedule that's gone (A13)
        return;
      }
    }
    // silvisBusy on both legs (see acceptTradeRequest). The mirror, not
    // `schedule`: this callback's deps omit schedule, so its closure is stale.
    if (silvisActive) {
      const hits = [], cur = scheduleRef.current;
      const r1 = silvisBlock(candId, targetMon, targetShift, cur[targetMon]); if (r1) hits.push(r1);
      if (returnMon && returnShift) { const r2 = silvisBlock(targetOldId, returnMon, returnShift, cur[returnMon]); if (r2) hits.push(r2); }
      if (silvisRefuse(hits)) return;
    }
    pushUndo();
    updateSchedule(p => {
      const n = { ...p };
      // Swap 1: candidate takes the target shift
      const wk1 = { ...n[targetMon] };
      if (targetShift === "dayCall") wk1.dayCall = candId;
      else wk1.nights = { ...wk1.nights, [targetShift]: candId };
      let assigned1 = new Set([wk1.dayCall, ...Object.values(wk1.nights)].filter(Boolean));
      wk1.off = surgeons.map(s => s.id).find(id => !assigned1.has(id)) || null;
      n[targetMon] = wk1;

      // Swap 2: original surgeon takes the candidate's return shift
      if (returnMon && returnShift) {
        const wk2 = { ...n[returnMon] };
        if (returnShift === "dayCall") wk2.dayCall = targetOldId;
        else wk2.nights = { ...wk2.nights, [returnShift]: targetOldId };
        let assigned2 = new Set([wk2.dayCall, ...Object.values(wk2.nights)].filter(Boolean));
        wk2.off = surgeons.map(s => s.id).find(id => !assigned2.has(id)) || null;
        n[returnMon] = wk2;
      }
      return n;
    });

    const oldName = sMap[targetOldId]?.name || "—";
    const newName = sMap[candId]?.name || "—";
    const shiftLabel = SHIFT_LABELS[targetShift] || targetShift;
    const swapTargets = [...new Set([targetOldId, candId, ...schedulerAdminIds].filter(Boolean))];
    // ONE composition for in-app + push + email (helpers.js): both legs,
    // each dated via slotLabel; one-way swaps say so explicitly.
    const swapDetail = swapMsg({ targetMon, targetShift, oldName, newName, returnMon, returnShift });
    addNotification("schedule_changed", "Shift Swap", swapDetail, { week: targetMon }, swapTargets);
    sendEmailNotif("schedule_changed", { shift: shiftLabel, week: targetMon, old_surgeon: oldName, new_surgeon: newName, detail: swapDetail }, swapTargets);
    setSwapSuggestions(null); setSwapTarget(null);
  }, [surgeons, sMap, addNotification, sendEmailNotif, schedulerAdminIds, silvisActive, silvisBlock, silvisRefuse]);

  // ─── Manual Weekly Edit (scheduler/admin) ───
  const openWeekEditor = useCallback((mondayStr) => {
    // wk may be undefined — that's OK. We're allowing the scheduler to create
    // a brand-new week entry (for ad-hoc coverage in periods the algorithm
    // doesn't cover, e.g. before the hand-written schedule starts).
    const wk = scheduleRef.current[mondayStr] || {};
    const mon = parse(mondayStr);
    // Snapshot current APP assignments for each day of this week
    const appsDraft = {};
    for (let i = 0; i < 7; i++) {
      const d = addD(mon, i);
      const ds = fmt(d);
      appsDraft[ds] = appShifts[ds] || "";
    }
    setEditWeekModal({
      mondayStr,
      // What the APP rows showed when the editor OPENED (2026-10-11): saving
      // writes only the days edited against this, so an editor opened before
      // the APP-shift row loaded (all blanks) can never clear real assignments.
      appsBase: { ...appsDraft },
      // Opened before the row loaded: the APP rows show blanks that may not be
      // blank — they are locked (re-review 2026-10-11); reopening picks up the map.
      appsLoaded: appShiftsLoaded,
      // The week as the editor OPENED it, and the sync engine's epoch then
      // (sync v2, R15; design §2.6): the save writes only the slots edited
      // against this copy, onto the latest week — and if someone else's change
      // to an edited slot was adopted meanwhile, it is refused (mergeEditorEdits).
      openWeek: scheduleRef.current[mondayStr] ? JSON.parse(JSON.stringify(wk)) : null,
      openEpoch: schedSyncRef.current.epochNow(),
      draft: {
        dayCall: wk.dayCall || "",
        nights: { ...(wk.nights || {}) },
        dayCallOverrides: { ...(wk.dayCallOverrides || {}) },
        apps: appsDraft,
        reason: "",
      },
    });
  }, [appShifts, appShiftsLoaded]);

  const saveWeekEdits = useCallback((openAfter) => {
    if (!editWeekModal) return;
    if (!schedEditable()) return;
    const { mondayStr, draft } = editWeekModal;
    const oldWk = scheduleRef.current[mondayStr] || {};
    // ONLY the slots edited in THIS editor go onto the LATEST week (design
    // §2.6, A17(a) — mergeEditorEdits, pure, beside the sync engine): a change
    // someone else made to another slot of this week while the editor was open
    // is kept, never reverted by the old draft. One they made to a slot edited
    // here refuses the whole save, naming it (the open epoch, sync v2 R15).
    const m = mergeEditorEdits({ week: editWeekModal.openWeek, apps: editWeekModal.appsBase || {} }, draft, scheduleRef.current[mondayStr], editWeekModal.openEpoch || 0, schedSyncRef.current.epochOf(mondayStr),
      { surgeonIds: surgeons.map(s => s.id), flags: { isBackup: backupMondaySet.has(mondayStr), isFierceBackup: fierceBackupSet.has(mondayStr) } });
    if (!m.ok) {
      const slotName = (x) => x.kind === "override" ? `Service Day ${x.key}` : (SHIFT_LABELS[x.key] || x.key);
      showToast(`This week was changed by someone else while the editor was open — nothing was saved (surgeon slots or APP days). They changed the ${m.slots.map(slotName).join(", ")} you edited here. Close the editor and reopen it to start from the latest.`, "error");
      return; // the editor stays open, so the draft can still be read
    }
    const next = m.week; // the week as this save writes it
    // APP days the user actually edited in THIS editor, against what it showed
    // when it opened (2026-10-11, appsBase) — only these are written. Before the APP-shift
    // row has loaded this session the whole map can't be trusted: the APP part
    // is refused, with the reason, while the surgeon edits still save (3a).
    const appEdits = m.appEdits;
    const appRefused = appEdits.length > 0 && !appShiftsLoaded;

    // Build diff list of changes: the week as written vs as it is now
    const changes = []; // { slotLabel, oldId, newId, isApp, date }
    if ((oldWk.dayCall || "") !== (next.dayCall || "")) {
      changes.push({ slotLabel: `Service Week`, oldId: oldWk.dayCall || "", newId: next.dayCall || "", isApp: false });
    }
    ["mon","tue","wed","thu","wknd"].forEach(nk => {
      const oldId = oldWk.nights?.[nk] || "";
      const newId = next.nights?.[nk] || "";
      if (oldId !== newId) {
        changes.push({ slotLabel: SHIFT_LABELS[nk] || nk, oldId, newId, isApp: false });
      }
    });
    // Single-day service coverage overrides
    {
      const oldOv = oldWk.dayCallOverrides || {};
      const newOv = next.dayCallOverrides || {};
      const ovDates = new Set([...Object.keys(oldOv), ...Object.keys(newOv)]);
      ovDates.forEach(ds => {
        const oldId = oldOv[ds] || (oldWk.dayCall || "");
        const newId = newOv[ds] || (next.dayCall || "");
        if (oldId !== newId) {
          changes.push({ slotLabel: `Service Day ${ds}`, oldId, newId, isApp: false, date: ds });
        }
      });
    }
    // Refused APP edits never reach the confirm, the audit or the notifications.
    if (!appRefused) appEdits.forEach(([ds, newAppId]) => {
      const oldAppId = appShifts[ds] || "";
      if (oldAppId !== (newAppId || "")) {
        changes.push({ slotLabel: `APP ${ds}`, oldId: oldAppId, newId: newAppId, isApp: true, date: ds });
      }
    });

    if (changes.length === 0) {
      // Only refused APP edits: say so and keep the editor open.
      if (appRefused) { showToast("The APP changes were NOT saved: " + APP_SHIFTS_NOT_LOADED, "error"); return; }
      if (openAfter) openWeekEditor(openAfter); else setEditWeekModal(null);
      return;
    }
    // silvisBusy: any change that puts FAK on a Silvis primary day is refused
    // (scheduler override with the reason on screen). Checked from the week
    // as written vs the old week so only NEW placements trigger it.
    if (silvisActive) {
      const hits = [];
      // Service days FAK COVERS before vs after this draft: Mon..Sat where
      // the effective holder (a Service Day override if present, else
      // dayCall) is him, minus a holiday 24h held by someone else. Every
      // NEWLY covered day on a Silvis primary date is a hit — that catches
      // a new service week, an override TO him, and REMOVING an override
      // that had released a Silvis day to someone else (the case a
      // "did dayCall change?" test could not see).
      const hc = oldWk.holidayCoverage || {};
      const coveredBy = (dc, ov) => new Set(sfSlotDays(mondayStr, "dayCall").filter(ds => {
        const c = hc[ds]; if (c && c.surgeonId && c.surgeonId !== silvisFakId) return false;
        const o = (ov || {})[ds];
        return ((o != null && o !== "") ? o : (dc || "")) === silvisFakId;
      }));
      const before = coveredBy(oldWk.dayCall, oldWk.dayCallOverrides);
      coveredBy(next.dayCall, next.dayCallOverrides).forEach(ds => {
        if (!before.has(ds) && silvisDays.primary.has(ds)) hits.push(`${nameOf(silvisFakId)} is Silvis PRIMARY on ${ds} (07:00 → 07:00 next day), which overlaps Service Day ${ds}`);
      });
      ["mon","tue","wed","thu","wknd"].forEach(nk => {
        if (next.nights?.[nk] === silvisFakId && oldWk.nights?.[nk] !== silvisFakId) { const r = silvisBlock(silvisFakId, mondayStr, nk, oldWk); if (r) hits.push(r); }
      });
      if (silvisRefuse(hits)) return;
    }
    // Safety confirmation if many changes at once
    if (changes.length >= 3) {
      if (!confirm(`You are changing ${changes.length} shifts in the week of ${mondayStr}. Continue?`)) return;
    }

    // Commit — the merged week (a brand-new hand-created week carries its
    // backup / fierce flags from the sets; 'off' recomputed, coverers
    // included). Only when a surgeon slot changed: an APP-only save writes the
    // APP map, never a schedule week (it used to create an empty one).
    if (changes.some(c => !c.isApp)) {
      pushUndo();
      updateSchedule(p => ({ ...p, [mondayStr]: next }));
    }
    // APP changes (2026-10-11): only the days edited in this editor, applied to
    // the LATEST map; never before the APP-shift row has loaded this session —
    // the whole map is upserted, so a write from a failed load would replace
    // every APP's assignments. The surgeon edits above save either way (3a).
    if (appRefused) {
      showToast("The surgeon changes went through, but the APP changes were NOT saved: " + APP_SHIFTS_NOT_LOADED, "error");
    } else if (appEdits.length) {
      setAppShifts(p => {
        const n = { ...p };
        appEdits.forEach(([ds, aid]) => {
          if (aid) n[ds] = aid;
          else delete n[ds];
        });
        saveAppShifts(n); // persist APP changes to their own table
        return n;
      });
    }

    logAudit("schedule.week_edit", `Edited ${changes.length} shift${changes.length === 1 ? "" : "s"} in week of ${mondayStr}${draft.reason ? " (" + draft.reason + ")" : ""}`, { mondayStr, changes: changes.map(c => ({ slot: c.slotLabel, from: nameOf(c.oldId), to: nameOf(c.newId) })) });

    // Notifications — COALESCED per recipient so a bulk save of 4 shifts
    // produces 1 notification set per affected person instead of 4. Massive
    // reduction in email/push noise on multi-shift edits.
    //
    // Email uses the existing schedule_changed template; for n>=2 we pass a
    // summarized payload that fits the template shape. The in-app title+body
    // (which we control fully) carries the detailed per-shift breakdown.
    const reasonSuffix = draft.reason ? ` (${draft.reason})` : "";

    // Build per-person change list: every affected person gets their own set
    // of changes (filtered to only shifts they're involved in). Scheduler and
    // admin get the full list across all changes.
    const perPerson = new Map(); // person_id -> [{slotLabel, oldName, newName}]
    const enrichedChanges = changes.map(c => ({
      slotLabel: c.slotLabel,
      oldId: c.oldId,
      newId: c.newId,
      oldName: c.isApp ? (aMap[c.oldId]?.name || "—") : (sMap[c.oldId]?.name || "—"),
      newName: c.isApp ? (aMap[c.newId]?.name || "—") : (sMap[c.newId]?.name || "—"),
    }));
    enrichedChanges.forEach(ec => {
      [ec.oldId, ec.newId].filter(Boolean).forEach(pid => {
        if (!perPerson.has(pid)) perPerson.set(pid, []);
        perPerson.get(pid).push({ slotLabel: ec.slotLabel, oldName: ec.oldName, newName: ec.newName });
      });
    });
    // Scheduler and admin see every change regardless of personal involvement
    schedulerAdminIds.forEach(pid => {
      if (!pid) return;
      if (!perPerson.has(pid)) {
        perPerson.set(pid, enrichedChanges.map(ec => ({ slotLabel: ec.slotLabel, oldName: ec.oldName, newName: ec.newName })));
      } else {
        // Already a direct-affected person; ensure they see ALL changes (not just their own)
        const existingLabels = new Set(perPerson.get(pid).map(x => x.slotLabel));
        enrichedChanges.forEach(ec => {
          if (!existingLabels.has(ec.slotLabel)) {
            perPerson.get(pid).push({ slotLabel: ec.slotLabel, oldName: ec.oldName, newName: ec.newName });
          }
        });
      }
    });

    // One in-app notification + one push/email batch for the whole change set.
    // (Previously this looped per-person, inserting one identical-looking row
    // per affected person — a single REH→DJA swap produced two rows in the
    // shared notification panel. perPerson.keys() already holds every affected
    // person plus schedulers, so we reuse it for push/email targeting.)
    const allTargets = [...perPerson.keys()].filter(Boolean);
    let title, msg, emailPayload;
    if (enrichedChanges.length === 1) {
      const c = enrichedChanges[0];
      title = "Schedule Change";
      msg = `${c.slotLabel}: ${c.oldName} → ${c.newName}${reasonSuffix}`;
      emailPayload = { shift: c.slotLabel, week: mondayStr, old_surgeon: c.oldName, new_surgeon: c.newName };
    } else {
      title = `${enrichedChanges.length} Shifts Updated`;
      const bullets = enrichedChanges.map(c => `${c.slotLabel}: ${c.oldName} → ${c.newName}`).join("; ");
      msg = `Week of ${mondayStr} — ${bullets}${reasonSuffix}`;
      emailPayload = {
        shift: `${enrichedChanges.length} shifts`,
        week: mondayStr,
        old_surgeon: "multiple",
        new_surgeon: "open app for details",
      };
    }
    addNotification("schedule_changed", title, msg, { week: mondayStr }, allTargets);
    sendEmailNotif("schedule_changed", emailPayload, allTargets);

    setEditWeekModal(null);
    if (openAfter) {
      // Defer to next tick so state updates flush before re-opening
      setTimeout(() => openWeekEditor(openAfter), 0);
    }
  }, [editWeekModal, schedule, appShifts, appShiftsLoaded, surgeons, sMap, aMap, addNotification, sendEmailNotif, pushUndo, schedulerAdminIds, openWeekEditor, backupMondaySet, fierceBackupSet, silvisActive, silvisFakId, silvisDays, silvisBlock, silvisRefuse]);

  // ─── Backup / Fierce week marking (Settings card) ───
  // backupMondaySet/fierceBackupSet (persisted as blob arrays) and the
  // per-week schedule[m].isBackup/isFierceBackup flags (persisted per-row in
  // schedule_weeks) are two representations of one fact. Until 2026-08 these
  // handlers wrote only the sets, so already-generated weeks kept their
  // generation-time flags forever (the 9/14→9/28 trade divergence). They now
  // write both in the same action. Constraints that are easy to break:
  //  - Only flip EXISTING weeks. A set Monday with no generated week is a
  //    legitimate "pending" state (the generator stamps flags from the sets,
  //    generator.js:346/698); creating a flag-only week here would INSERT a
  //    real phantom schedule_weeks row on every device.
  //  - No pushUndo: Undo snapshots only `schedule`, so undoing would revert
  //    the flag but not the set — manufacturing the exact divergence this
  //    code exists to prevent. (The set edit was never undoable.)
  //  - No direct sync call, no wipe-ref touches: the plain state set rides
  //    the schedule_weeks push (sync engine v2) like any shift edit.
  //  - The edit gate (load + sign-in) first, before the set changes: a mark
  //    made before the schedule has loaded could miss the week it should flip,
  //    and with the sign-in expired the flag could only wait in memory — the
  //    set and the week flag go together, or neither does.
  const setWeekFlag = (monday, flagKey, val) => {
    updateSchedule(p => {
      const wk = p[monday];
      if (!wk || wk[flagKey] === val) return p;
      return { ...p, [monday]: { ...wk, [flagKey]: val } };
    });
  };
  const markBackupWeek = () => {
    if (!bkMonday) return;
    if (!schedEditable()) return;
    setBackupMondaySet(p => { const n = new Set(p); n.add(bkMonday); return n; });
    setWeekFlag(bkMonday, "isBackup", true);
    logAudit("schedule.backup_mark", `Marked week of ${bkMonday} as Backup (Fierce primary)`, { week: bkMonday });
    setBkMonday(mondayOfToday());
  };
  const unmarkBackupWeek = (m) => {
    if (!schedEditable()) return;
    setBackupMondaySet(p => { const n = new Set(p); n.delete(m); return n; });
    setWeekFlag(m, "isBackup", false);
    logAudit("schedule.backup_unmark", `Removed Backup mark from week of ${m}`, { week: m });
  };
  const markFierceBackupWeek = () => {
    if (!bkMonday) return;
    if (!schedEditable()) return;
    setFierceBackupSet(p => { const n = new Set(p); n.add(bkMonday); return n; });
    setWeekFlag(bkMonday, "isFierceBackup", true);
    logAudit("schedule.fierce_mark", `Marked week of ${bkMonday} as Fierce Backup`, { week: bkMonday });
    setBkMonday(mondayOfToday());
  };
  const unmarkFierceBackupWeek = (m) => {
    if (!schedEditable()) return;
    setFierceBackupSet(p => { const n = new Set(p); n.delete(m); return n; });
    setWeekFlag(m, "isFierceBackup", false);
    logAudit("schedule.fierce_unmark", `Removed Fierce Backup mark from week of ${m}`, { week: m });
  };

  // Generate shareable read-only HTML with calendar grid view
  const generateShareHTML = () => {
    const colors = surgeons.map((s,i) => { const c = surgeonColors(s.name, i); return {name:s.name, tx:c.tx, bg:c.tg, bd:c.bd}; });
    const colorMap = {}; surgeons.forEach((s,i) => colorMap[s.id] = colors[i]);
    const appColors = {}; apps.forEach((a,i) => appColors[a.id] = {name:a.name, tx:APP_PAL[i%APP_PAL.length].tx, bg:APP_PAL[i%APP_PAL.length].tg, bd:APP_PAL[i%APP_PAL.length].bd});

    // Pre-generate ICS content per surgeon + full
    const icsMap = {};
    surgeons.forEach(s => {
      const ev = buildICSEvents(schedule, s.id, s.name, { nameOf });
      icsMap[s.name] = generateICS(ev, "Call Schedule - " + s.name);
    });
    const allEv = [];
    surgeons.forEach(s => allEv.push(...buildICSEvents(schedule, s.id, s.name, { withCode: true, nameOf })));
    allEv.push(...buildAppICSEvents(appShifts, aMap));
    icsMap["__full__"] = generateICS(allEv, "Full Call Schedule");

    let calBtns = surgeons.map(s => {
      const c = colorMap[s.id];
      return `<button onclick="dlCal('${s.name.replace(/'/g,"\\'")}')" class="cal-btn" style="background:${c.bg};color:${c.tx};border-color:${c.bd}">📅 ${c.name}</button>`;
    }).join("") + `<button onclick="dlCal('__full__')" class="cal-btn full-btn">📅 Full Schedule</button>`;

    // Build calendar grid data
    const buildCalData = () => {
      const d = {};
      Object.entries(schedule).forEach(([mStr,wk]) => {
        const mon = parse(mStr);
        const pfx = wk.isBackup ? "B-" : "";
        if(wk.dayCall){
          for(let i=0;i<5;i++){ const ds=fmt(addD(mon,i)); d[ds]=[...(d[ds]||[]),{type:pfx+"Svc",sid:(wk.dayCallOverrides&&wk.dayCallOverrides[ds])||wk.dayCall}]; }
          const sat=fmt(addD(mon,5)); d[sat]=[...(d[sat]||[]),{type:pfx+"Wknd",sid:(wk.dayCallOverrides&&wk.dayCallOverrides[sat])||wk.dayCall,note:"Sat 7a–7a"}];
        }
        NIGHT_KEYS.forEach((sk,i)=>{
          const sid=wk.nights?.[sk]; if(!sid) return;
          const ds=fmt(addD(mon,i)); d[ds]=[...(d[ds]||[]),{type:pfx+"Ngt",sid}];
        });
        const ws=wk.nights?.wknd;
        if(ws){
          d[fmt(addD(mon,4))]=[...(d[fmt(addD(mon,4))]||[]),{type:pfx+"Wknd",sid:ws}];
          d[fmt(addD(mon,6))]=[...(d[fmt(addD(mon,6))]||[]),{type:pfx+"Wknd",sid:ws}];
        }
        if(wk.isBackup){ for(let i=0;i<7;i++){ const ds=fmt(addD(mon,i)); d[ds]=[...(d[ds]||[]),{type:"Fierce"}]; }}

  const calcShifts = (s) => (s.dc||0)*6 + (s.nights||0) + (s.wknd||0)*2 + (s.svcAdj6||0);
