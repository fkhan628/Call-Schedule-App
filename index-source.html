      if (!isScheduler) {
        alert("A return swap is required. All trades must be two-way — select the week and shift you'll take in return.");
        return;
      }
      if (!confirm("⚠️ No return swap specified.\n\nOne-way trades should only be used for emergencies (illness, family emergency).\n\nSubmit anyway?")) return;
    }
    // silvisBusy: don't send a proposal that can never be accepted (both
    // legs; cascades are shown in the card's preview — detectCascadeChanges
    // is declared below this hook, so it is not read here). Member: refused
    // with the reasons; scheduler/admin: confirm. The weeks as the MIRROR
    // holds them (sync v2 §2.1), not this render's copy.
    if (silvisActive) {
      const hits = [], cur = scheduleRef.current;
      const r1 = silvisBlock(tradeTo, tradeWeek, tradeShift, cur[tradeWeek]); if (r1) hits.push(r1);
      if (tradeReturnWeek && tradeReturnShift) { const r2 = silvisBlock(tradeFrom, tradeReturnWeek, tradeReturnShift, cur[tradeReturnWeek]); if (r2) hits.push(r2); }
      if (silvisRefuse(hits)) return;
    }
    const fromName = surgeons.find(s => s.id === tradeFrom)?.name || tradeFrom;
    const toName = surgeons.find(s => s.id === tradeTo)?.name || tradeTo;
    const shiftLabel = SHIFT_LABELS[tradeShift] || tradeShift;
    tradeSubmitBusyRef.current = true;
    // This session, at the tap (review r5 fix-1 — as the vacation submit): the
    // proposal is sent with this account's headers; after a session change
    // during it, it is recorded as this account (its audit line, with the
    // tap's headers) and nothing more of it is done, sent or said in the next
    // session — no list update, no form cleared, no toast, no notice or e-mail.
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    try {
      const req = {
        from_surgeon_id: tradeFrom, from_surgeon_name: fromName,
        to_surgeon_id: tradeTo, to_surgeon_name: toName,
        week_monday: tradeWeek, shift_key: tradeShift, shift_label: shiftLabel,
        return_week: tradeReturnWeek || null, return_shift: tradeReturnShift || null,
        return_shift_label: tradeReturnShift ? (SHIFT_LABELS[tradeReturnShift]||tradeReturnShift) : null,
        status: "pending", submitted_at: new Date().toISOString(),
      };
      // HTTP failures come back as { data:null, error } (fail-loud, 2026-10-11):
      // say why and keep the form, never clear it silently.
      const { data: inserted, error: insertErr } = await db.insert("shift_trade_requests", req);
      if (!live()) { // (review r5 fix-1) another session now
        if (inserted) logAudit("trade.propose", tradeProposeMsg(req), { from: tradeFrom, to: tradeTo, shift: tradeShift, week: tradeWeek }, tapH);
        else console.error("trade request insert failed:", insertErr);
        return;
      }
      if (!inserted) {
        console.error("trade request insert failed:", insertErr);
        showToast(`Couldn't propose the trade — ${writeFailReason(insertErr)}. Nothing was sent; your choices are still here.`, "error");
        return;
      }
      {
        setTradeRequests(prev => [inserted, ...prev]);
        // Filed: clear the form and say so BEFORE notifying (same reason as
        // the vacation submit — a notification failure is the last toast).
        setTradeWeek(""); setTradeShift(""); setTradeReturnWeek(""); setTradeReturnShift("");
        showToast(`Trade proposed — ${toName} will be asked to accept or decline.`, "success");
        // ONE composition for audit + in-app + push + email (helpers.js):
        // names BOTH legs, every date via slotLabel. `detail` is the new
        // email field; the legacy fields stay for deploy-order safety.
        const proposeMsg = tradeProposeMsg(req);
        logAudit("trade.propose", proposeMsg, { from: tradeFrom, to: tradeTo, shift: tradeShift, week: tradeWeek });
        await addNotification("trade_submitted", "Shift Trade Proposed",
          proposeMsg,
          { from_surgeon_id: tradeFrom, to_surgeon_id: tradeTo },
          [tradeFrom, tradeTo], ep);
        if (!live()) return; // (review r5 fix-1) another session now: no e-mail sent from it
        sendEmailNotif("trade_submitted", { from_name: fromName, to_name: toName, shift: shiftLabel, week: tradeWeek, detail: proposeMsg }, [tradeFrom, tradeTo], ep);
      }
    } catch(e) { console.error("Submit trade error:", e); if (live()) showToast("Couldn't submit the trade — check your connection and try again.", "error"); }
    finally { tradeSubmitBusyRef.current = false; }
  }, [tradeFrom, tradeTo, tradeWeek, tradeShift, tradeReturnWeek, tradeReturnShift, surgeons, addNotification, sendEmailNotif, isScheduler, schedule, silvisActive, silvisBlock, silvisRefuse]);

  // ─── Shift Trade: Cascade Detection ───
  // When a DC or Weekend swap happens, detect downstream conflicts and propose fixes
  const detectCascadeChanges = useCallback((sched, req) => {
    const changes = []; // { week, shiftKey, from, to, reason }
    const ids = surgeons.map(s => s.id);
    const nameOf = (id) => surgeons.find(s => s.id === id)?.name || id;
    const nightKeys = ["mon","tue","wed","thu"];

    const applySwap = (s, r) => {
      const n = JSON.parse(JSON.stringify(s));
      const wk1 = n[r.week_monday];
      if (!wk1) return n;
      if (r.shift_key === "dayCall") wk1.dayCall = r.to_surgeon_id;
      else if (r.shift_key === "wknd") wk1.nights = { ...wk1.nights, wknd: r.to_surgeon_id };
      else wk1.nights = { ...wk1.nights, [r.shift_key]: r.to_surgeon_id };
      if (r.return_week && r.return_shift) {
        const wk2 = n[r.return_week];
        if (wk2) {
          if (r.return_shift === "dayCall") wk2.dayCall = r.from_surgeon_id;
          else if (r.return_shift === "wknd") wk2.nights = { ...wk2.nights, wknd: r.from_surgeon_id };
          else wk2.nights = { ...wk2.nights, [r.return_shift]: r.from_surgeon_id };
        }
      }
      return n;
    };

    const afterSwap = applySwap(sched, req);

    // Check both weeks involved
    const weeksToCheck = [req.week_monday];
    if (req.return_week && req.return_week !== req.week_monday) weeksToCheck.push(req.return_week);

    for (const mStr of weeksToCheck) {
      const wk = afterSwap[mStr];
      if (!wk) continue;
      const dc = wk.dayCall;
      const nights = wk.nights || {};

      // RULE 1: DC surgeon cannot have a night in the same week
      if (dc) {
        for (const nk of nightKeys) {
          if (nights[nk] === dc) {
            // DC has a night conflict — try to give it to the OTHER surgeon in the trade
            const otherSurgeon = (dc === req.to_surgeon_id) ? req.from_surgeon_id : req.to_surgeon_id;
            // Check the other surgeon isn't already DC or has that night
            const otherHasConflict = otherSurgeon === wk.dayCall || nightKeys.some(k => k !== nk && nights[k] === otherSurgeon);
            // Also check consecutive night rule
            const nkIdx = nightKeys.indexOf(nk);
            const prevNight = nkIdx > 0 ? nights[nightKeys[nkIdx-1]] : null;
            const nextNight = nkIdx < 3 ? nights[nightKeys[nkIdx+1]] : null;
            const wouldBeConsecutive = prevNight === otherSurgeon || nextNight === otherSurgeon;

            if (!otherHasConflict && !wouldBeConsecutive) {
              changes.push({
                week: mStr, shiftKey: nk, from: dc, to: otherSurgeon,
                reason: `${nameOf(dc)} is now Service Week — ${SHIFT_LABELS[nk]} moves to ${nameOf(otherSurgeon)}`
              });
            } else {
              // Try the off surgeon
              const assigned = new Set([dc, ...Object.values(nights)].filter(Boolean));
              const offSurgeon = ids.find(id => !assigned.has(id));
              if (offSurgeon) {
                changes.push({
                  week: mStr, shiftKey: nk, from: dc, to: offSurgeon,
                  reason: `${nameOf(dc)} is now Service Week — ${SHIFT_LABELS[nk]} moves to ${nameOf(offSurgeon)} (off surgeon)`,
                  requiresApproval: true, approverId: offSurgeon
                });
              }
            }
          }
        }
        // DC surgeon cannot have weekend
        if (nights.wknd === dc) {
          const otherSurgeon = (dc === req.to_surgeon_id) ? req.from_surgeon_id : req.to_surgeon_id;
          const otherIsDC = otherSurgeon === wk.dayCall;
          if (!otherIsDC) {
            changes.push({
              week: mStr, shiftKey: "wknd", from: dc, to: otherSurgeon,
              reason: `${nameOf(dc)} is now Service Week — Weekend moves to ${nameOf(otherSurgeon)}`
            });
          } else {
            const assigned = new Set([dc, ...Object.values(nights)].filter(Boolean));
            const offSurgeon = ids.find(id => !assigned.has(id));
            if (offSurgeon) {
              changes.push({
                week: mStr, shiftKey: "wknd", from: dc, to: offSurgeon,
                reason: `${nameOf(dc)} is now Service Week — Weekend moves to ${nameOf(offSurgeon)} (off surgeon)`,
                requiresApproval: true, approverId: offSurgeon
              });
            }
          }
        }
      }
    }

    // RULE 2: Weekend swap → check Monday night of NEXT week
    const checkWeekendMonday = (weekMon, newWkndSurgeon) => {
      const mondayStrs = Object.keys(afterSwap).sort();
      const idx = mondayStrs.indexOf(weekMon);
      if (idx < 0 || idx >= mondayStrs.length - 1) return;
      const nextMon = mondayStrs[idx + 1];
      const nextWk = afterSwap[nextMon];
      if (!nextWk?.nights?.mon) return;
      if (nextWk.nights.mon === newWkndSurgeon) {
        // Weekend surgeon has Monday night next week — conflict
        const otherSurgeon = (newWkndSurgeon === req.to_surgeon_id) ? req.from_surgeon_id : req.to_surgeon_id;
        // Check other surgeon isn't DC next week
        const otherIsDC = otherSurgeon === nextWk.dayCall;
        // Check consecutive night
        const tueNight = nextWk.nights?.tue;
        const wouldBeConsecutive = tueNight === otherSurgeon;
        if (!otherIsDC && !wouldBeConsecutive) {
          changes.push({
            week: nextMon, shiftKey: "mon", from: newWkndSurgeon, to: otherSurgeon,
            reason: `${nameOf(newWkndSurgeon)} now has Weekend — Mon Night (next week) moves to ${nameOf(otherSurgeon)}`
          });
        } else {
          const assigned = new Set([nextWk.dayCall, ...Object.values(nextWk.nights)].filter(Boolean));
          const offSurgeon = ids.find(id => !assigned.has(id));
          if (offSurgeon) {
            changes.push({
              week: nextMon, shiftKey: "mon", from: newWkndSurgeon, to: offSurgeon,
              reason: `${nameOf(newWkndSurgeon)} now has Weekend — Mon Night (next week) moves to ${nameOf(offSurgeon)} (off surgeon)`,
              requiresApproval: true, approverId: offSurgeon
            });
          }
        }
      }
    };

    // Check weekend cascades
    if (req.shift_key === "wknd") checkWeekendMonday(req.week_monday, req.to_surgeon_id);
    if (req.return_shift === "wknd") checkWeekendMonday(req.return_week, req.from_surgeon_id);
    // Also check if a DC swap moved someone to weekend indirectly (from cascade)
    for (const ch of [...changes]) {
      if (ch.shiftKey === "wknd") checkWeekendMonday(ch.week, ch.to);
    }

    return changes;
  }, [surgeons]);

  // ─── Shift Trade Request: Accept (with cascade) ───
  const acceptTradeRequest = useCallback(async (req) => {
    // This session, at the tap (review r4 branch-2), and its headers: after
    // EVERY await below, a session change meanwhile — a sign-out, or "Sign in
    // again" landing on another account — stops the accept there, silently:
    // no schedule write, no Undo step, no notice or e-mail, nothing said on
    // the next session's screen. A trade this tap already marked accepted is
    // set back to pending WITH THE TAP'S HEADERS (this account's token), so
    // it is never left accepted with no swap; if that fails, it is logged
    // (the console and an audit line, written as this account) for a manual
    // fix — never toasted on the next screen.
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    // Composed ONCE here and reused by every audit line, the notification and
    // the email below, matching the propose/decline siblings.
    const acceptMsg = tradeAcceptMsg(req);
    const abandon = async (rows) => {
      if (!Array.isArray(rows) || rows.length === 0) return; // this tap accepted nothing: nothing to set back
      let why = "";
      try {
        const b = await fetch(`${SUPABASE_URL}/rest/v1/shift_trade_requests?id=eq.${req.id}&status=eq.accepted`, {
          method: "PATCH",
          headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
          body: JSON.stringify({ status: "pending", reviewed_at: null }),
        });
        const back = b.ok ? await b.json().catch(() => null) : null;
        if (Array.isArray(back) && back.length === 1) return;
        why = b.ok ? `${Array.isArray(back) ? back.length : "no"} row(s) came back` : `HTTP ${b.status} ${await b.text().catch(() => "")}`;
      } catch (e) { why = String(e && e.message || e); }
      console.error("Trade accept abandoned (the session changed while it was being accepted), and the request could NOT be set back to pending:", req.id, why);
      logAudit("trade.accept_unapplied", `${acceptMsg} — NOT applied: the session changed (a sign-out, or another account) while it was being accepted; still marked accepted (setting it back failed) — needs a manual fix`, { request_id: req.id, reverted: false }, tapH);
    };
    try {
      // TIME-MOVED RE-VALIDATION (owner ruling 2026-09-06, item 4): a trade
      // can be accepted days after it was proposed — the pickers filter at
      // PROPOSE time (#49), this is the same rule at ACCEPT time, checked
      // before any write. Either leg elapsed (shiftStartDate < today; for
      // dayCall that is the week's Monday) refuses loudly with zero writes.
      const accToday = fmt(new Date());
      if (shiftStartDate(req.week_monday, req.shift_key) < accToday
        || (req.return_week && req.return_shift && shiftStartDate(req.return_week, req.return_shift) < accToday)) {
        showToast("This trade's shift has already passed — propose a new one.", "error");
        return;
      }
      if (!schedEditable()) return;
      // The trade must still describe the schedule (sync v2, stale intents,
      // A13): the proposer still holds the shift, the other side the return
      // shift, and each cascade's `from` the slot it moves — as it stands once
      // the two legs land, since a cascade can move a slot a leg just filled.
      // Someone else may have changed the week since it was proposed — and
      // v2's pull shows that change here, so a blind accept would now
      // overwrite it. Everything is read from the mirror (scheduleRef), never
      // the render's `schedule` (it stays in the deps only to keep this
      // closure's logAudit current), so the cascades the confirm below lists
      // are the schedule's own. Checked before the status PATCH (a refused
      // trade stays pending) and again at commit, after its await.
      const hasReturn = !!(req.return_week && req.return_shift);
      const holderIn = (cur, w, k) => (k === "dayCall" ? cur[w]?.dayCall : cur[w]?.nights?.[k]) || "";
      const holderAfterLegs = (cur, w, k) => (w === req.week_monday && k === req.shift_key) ? (req.to_surgeon_id || "")
        : (hasReturn && w === req.return_week && k === req.return_shift) ? (req.from_surgeon_id || "") : holderIn(cur, w, k);
      const tradeHolds = (cur, cs) => holderIn(cur, req.week_monday, req.shift_key) === (req.from_surgeon_id || "")
        && (!hasReturn || holderIn(cur, req.return_week, req.return_shift) === (req.to_surgeon_id || ""))
        && cs.every(ch => holderAfterLegs(cur, ch.week, ch.shiftKey) === (ch.from || ""));
      // What the confirm asks about: each cascade's slot, both people, and
      // whether it needs the off surgeon (its reason text derives from these).
      const cascadeSig = (cs) => JSON.stringify(cs.map(c => [c.week, c.shiftKey, c.from, c.to, !!c.requiresApproval]));
      const cur = scheduleRef.current;
      const cascades = detectCascadeChanges(cur, req);
      if (!tradeHolds(cur, cascades)) {
        showToast("This trade is out of date — the schedule for those shifts changed since it was proposed. Nothing was changed; propose it again if it's still wanted.", "error");
        return;
      }
      const nameOf = (id) => surgeons.find(s => s.id === id)?.name || id;
      // silvisBusy: neither leg — nor any cascade reassignment — may land FAK
      // on a Silvis primary day. Checked HERE, before the status PATCH: a
      // refused trade must stay 'pending', never 'accepted' with no swap
      // applied. Member → refused outright; scheduler/admin → confirm override.
      if (silvisActive) {
        const hits = [];
        const r1 = silvisBlock(req.to_surgeon_id, req.week_monday, req.shift_key, cur[req.week_monday]); if (r1) hits.push(r1);
        if (hasReturn) { const r2 = silvisBlock(req.from_surgeon_id, req.return_week, req.return_shift, cur[req.return_week]); if (r2) hits.push(r2); }
        for (const ch of cascades) { const rc = silvisBlock(ch.to, ch.week, ch.shiftKey, cur[ch.week]); if (rc) hits.push("cascade: " + rc); }
        if (silvisRefuse(hits)) return;
      }

      // If cascades exist, show confirmation with details
      if (cascades.length > 0) {
        const cascadeDesc = cascades.map(c => `  • ${c.reason}`).join("\n");
        const needsApproval = cascades.filter(c => c.requiresApproval);
        let msg = `Accepting this trade will also change:\n\n${cascadeDesc}`;
        if (needsApproval.length > 0) {
          msg += `\n\n⚠️ ${needsApproval.map(c => nameOf(c.approverId)).join(", ")} will be notified and must be available for the new assignment.`;
        }
        msg += "\n\nProceed with all changes?";
        if (!confirm(msg)) return;
      }

      // Fail-closed status write with a status precondition. The old
      // db.update call returned {error} on HTTP failure without throwing and
      // was never checked — so a 401/5xx/RLS failure applied the swap while
      // the row stayed "pending" (re-actionable ≤60s later; a later decline
      // would leave the swap live with no record of it). The ?status=eq.pending
      // filter + rows-affected check also no-op the two-device race (both
      // parties accepting the same trade) and accept-after-withdraw, which
      // return 200 with zero rows matched.
      const acceptRes = await fetch(`${SUPABASE_URL}/rest/v1/shift_trade_requests?id=eq.${req.id}&status=eq.pending`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify({ status: "accepted", reviewed_at: new Date().toISOString() }),
      });
      if (!acceptRes.ok) {
        console.error("Trade accept status write failed:", acceptRes.status, await acceptRes.text().catch(() => ""));
        if (live()) showToast("Couldn't accept the trade — nothing was changed. Check your connection and try again.", "error");
        return; // fail closed: no swap, no cascades, no undo, no notifications
      }
      const acceptRows = await acceptRes.json().catch(() => []);
      // (review r4 branch-2) another session now — signed out, or "Sign in
      // again" landed on another account, while the status PATCH was out:
      // nothing of this trade is applied, sent or said in it (set back, above).
      if (!live()) return abandon(acceptRows);
      if (!Array.isArray(acceptRows) || acceptRows.length === 0) {
        showToast("This trade was already handled or withdrawn — nothing was changed.", "error");
        return; // realtime/60s poll will refresh the visible status
      }
      // (acceptMsg: composed once, at the tap — above.)
      // RE-CHECKED AT COMMIT (A13). The status PATCH was awaited, and a pull
      // can adopt someone else's change to these weeks meanwhile. Nothing
      // awaits from here to updateSchedule, so what is checked is what is
      // written: both legs and every confirmed cascade's `from` against the
      // latest mirror, and the cascades re-computed from it must be exactly
      // the set the user confirmed. Otherwise nothing is applied (no undo
      // step, no schedule write, no notifications) and the request goes back
      // to pending — only from the 'accepted' this click wrote
      // (status=eq.accepted), and believed only when that one row comes back.
      const curNow = scheduleRef.current;
      const cascadesNow = detectCascadeChanges(curNow, req);
      if (!tradeHolds(curNow, cascades) || cascadeSig(cascadesNow) !== cascadeSig(cascades)) {
        let back = null, why = "";
        try {
          const backRes = await fetch(`${SUPABASE_URL}/rest/v1/shift_trade_requests?id=eq.${req.id}&status=eq.accepted`, {
            method: "PATCH",
            headers: { ...dbAuthHeaders(), "Content-Type": "application/json", Prefer: "return=representation" },
            body: JSON.stringify({ status: "pending", reviewed_at: null }),
          });
          if (backRes.ok) back = await backRes.json().catch(() => null);
          else why = `HTTP ${backRes.status} ${await backRes.text().catch(() => "")}`;
        } catch (e) { why = String(e && e.message || e); }
        const reverted = Array.isArray(back) && back.length === 1;
        const here = live(); // (review r4 branch-2) still this session after the set-back's awaits?
        if (reverted && here) setTradeRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: "pending" } : r));
        else if (!reverted) console.error("Trade accept not applied (the schedule changed), and the request could NOT be set back to pending:", req.id, why || `${Array.isArray(back) ? back.length : "no"} row(s) came back`);
        logAudit("trade.accept_unapplied", `${acceptMsg} — NOT applied: the schedule for those shifts changed while it was being accepted; ${reverted ? "set back to pending" : "still marked accepted (setting it back failed) — needs a manual fix"}`, { request_id: req.id, reverted }, here ? undefined : tapH);
        if (!here) return; // another session now: nothing said on its screen
        showToast(reverted
          ? "This trade was not applied — the schedule for those shifts changed while it was being accepted. Nothing was changed, and the trade is pending again: look it over and accept it again if it still fits."
          : "This trade was not applied — the schedule for those shifts changed while it was being accepted. The schedule was not changed, but the request is still marked accepted and needs a manual fix (it couldn't be set back to pending).", "error");
        return; // no undo, no schedule write, no notifications
      }
      setTradeRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: "accepted" } : r));
      logAudit("trade.accept", `${acceptMsg}${cascadesNow.length ? ` (+${cascadesNow.length} cascade change${cascadesNow.length === 1 ? "" : "s"})` : ""}`, { request_id: req.id, cascades: cascadesNow.length });
      pushUndo();
      updateSchedule(p => {
        const n = { ...p };

        // Apply the primary swap
        const wk1 = { ...n[req.week_monday] };
        if (req.shift_key === "dayCall") wk1.dayCall = req.to_surgeon_id;
        else wk1.nights = { ...wk1.nights, [req.shift_key]: req.to_surgeon_id };
        n[req.week_monday] = wk1;

        // Apply the return swap
        if (req.return_week && req.return_shift) {
          const wk2 = { ...n[req.return_week] };
          if (req.return_shift === "dayCall") wk2.dayCall = req.from_surgeon_id;
          else wk2.nights = { ...wk2.nights, [req.return_shift]: req.from_surgeon_id };
          n[req.return_week] = wk2;
        }

        // Apply all cascade changes (the set re-computed at commit)
        for (const ch of cascadesNow) {
          const wkC = { ...n[ch.week] };
          wkC.nights = { ...wkC.nights, [ch.shiftKey]: ch.to };
          // Recalculate off surgeon
          const assigned = new Set([wkC.dayCall, ...Object.values(wkC.nights)].filter(Boolean));
          wkC.off = surgeons.map(s => s.id).find(id => !assigned.has(id)) || null;
          n[ch.week] = wkC;
        }

        // Recalculate off for primary swap weeks
        [req.week_monday, req.return_week].filter(Boolean).forEach(mStr => {
          const wk = { ...n[mStr] };
          const assigned = new Set([wk.dayCall, ...Object.values(wk.nights)].filter(Boolean));
          wk.off = surgeons.map(s => s.id).find(id => !assigned.has(id)) || null;
          n[mStr] = wk;
        });

        return n;
      });

      // Notify about the primary trade (the tap's session passed in: each
      // notice stops at a session change — review r4 branch-2 / fixes-3)
      await addNotification("trade_accepted", "Shift Trade Accepted",
        acceptMsg,
        { from_surgeon_id: req.from_surgeon_id, to_surgeon_id: req.to_surgeon_id },
        [req.from_surgeon_id, req.to_surgeon_id], ep);
      if (!live()) return; // another session now: no more notices or e-mails from it
      sendEmailNotif("trade_accepted", { from_name: req.from_surgeon_name, to_name: req.to_surgeon_name, shift: req.shift_label, week: req.week_monday, detail: acceptMsg }, [req.from_surgeon_id, req.to_surgeon_id], ep);

      // Notify about each cascade change — affected surgeons + scheduler/admin
      for (const ch of cascadesNow) {
        const fromName = nameOf(ch.from);
        const toName = nameOf(ch.to);
        const cascadeTargets = [...new Set([ch.from, ch.to, ...schedulerAdminIds].filter(Boolean))];
        // Composed once, used for in-app + push + the email ADDED here: the
        // cascade victim was not party to the trade and previously got the
        // weakest notice of anyone involved (no email counterpart existed).
        const cascadeDetail = cascadeMsg({ week: ch.week, shiftKey: ch.shiftKey, fromName, toName });
        await addNotification("schedule_changed", "Shift Reassigned",
          cascadeDetail,
          { from_surgeon_id: ch.from, to_surgeon_id: ch.to, surgeon_id: ch.to, week: ch.week },
          cascadeTargets, ep);
        if (!live()) return; // another session now
        sendEmailNotif("schedule_changed", { shift: SHIFT_LABELS[ch.shiftKey] || ch.shiftKey, week: ch.week, old_surgeon: fromName, new_surgeon: toName, detail: cascadeDetail }, cascadeTargets, ep);
      }
    } catch(e) { console.error("Accept trade error:", e); if (live()) showToast("Couldn't accept the trade — check your connection and try again.", "error"); }
  }, [schedule, surgeons, pushUndo, addNotification, sendEmailNotif, detectCascadeChanges, schedulerAdminIds, silvisActive, silvisBlock, silvisRefuse]);

  // ─── Shift Trade Request: Decline ───
  const declineTradeRequest = useCallback(async (req) => {

  // ─── Edit Vacation Request ───
  const [editingVacReq, setEditingVacReq] = useState(null); // { id, start_date, end_date, reason }

  const saveVacRequestEdit = useCallback(async () => {
    if (!editingVacReq) return;
    // MEMBER PATH GATE (owner ruling 2026-09-06, item 3): the same two-layer
    // rule as submitVacRequest — the pending-list editor's inputs carry
    // min={today} for members, and this is the real gate behind it (min is
    // UI-only; a typed date bypasses it). The reviewed-list editor is
    // scheduler-only and schedulers are exempt here, so their record
    // corrections stay unrestricted.
    if (!isScheduler) {
      const editTodayStr = fmt(new Date());
      if (editingVacReq.start_date < editTodayStr || editingVacReq.end_date < editTodayStr) {
        showToast(`Requests are for upcoming time off — ${editingVacReq.start_date < editTodayStr ? "the start date" : "the end date"} is in the past. If a past record needs correcting, ask the scheduler to enter it directly in Setup.`, "error");
        return;
      }
    }
    // This session, at the tap (review r5 fix-1 — as the approval): after
    // the edit's PATCH, a session change meanwhile stops it there, silently —
    // the approved vacation's time_off row is not moved (as the next account,
    // or refused as anon: the request's dates and the time off then disagree),
    // nothing said; the request's edit is set back to its old dates and reason
    // with the tap's headers — only from the dates this tap wrote.
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    // The request as it was (its old dates — what a set-back restores, and
    // what an approved one's time off is moved from).
    const req = vacRequests.find(r => r.id === editingVacReq.id);
    try {
      const updates = { start_date: editingVacReq.start_date, end_date: editingVacReq.end_date, reason: editingVacReq.reason };
      // Fail-closed row update. Id-only precondition — edits are valid on both
      // pending and approved rows, so no status filter; the rows-affected check
      // still catches a request withdrawn/deleted meanwhile (and RLS zero-row
      // no-ops). Abort BEFORE touching the time_off bucket, else the bucket
      // carries new dates while the request records the old ones.
      const editRes = await fetch(`${SUPABASE_URL}/rest/v1/vacation_requests?id=eq.${editingVacReq.id}`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(updates),
      });
      if (!editRes.ok) {
        console.error("Vacation edit write failed:", editRes.status, await editRes.text().catch(() => ""));
        if (live()) showToast("Couldn't save the changes — nothing was changed. Check your connection and try again.", "error");
        return;
      }
      const editRows = await editRes.json().catch(() => []);
      if (!live()) { // (review r5 fix-1) another session now
        const summary = `Edit of ${req ? req.surgeon_name + "'s request" : "request " + editingVacReq.id} to ${updates.start_date} → ${updates.end_date}`;
        if (Array.isArray(editRows) && editRows.length) {
          if (req) await setBackRequest(editingVacReq.id, `start_date=eq.${updates.start_date}&end_date=eq.${updates.end_date}`, { start_date: req.start_date, end_date: req.end_date, reason: req.reason ?? null }, tapH, "Vacation request edit", { action: "request.edit_unapplied", summary });
          else { console.error("Vacation request edit abandoned (the session changed while it was being saved); its old dates are unknown here, so it could NOT be set back:", editingVacReq.id); logAudit("request.edit_unapplied", `${summary} — NOT applied: the session changed while it was being saved; it could not be set back — needs a manual fix`, { request_id: editingVacReq.id, reverted: false }, tapH); }
        }
        return;
      }
      if (!Array.isArray(editRows) || editRows.length === 0) {
        showToast("This request no longer exists — nothing was changed.", "error");
        return;
      }
      setVacRequests(prev => prev.map(r => r.id === editingVacReq.id ? { ...r, ...updates } : r));
      // If approved, also update the bucket it landed in (vacations or no-call)
      if (req?.status === "approved") {
        toEdit(req.surgeon_id, req.request_type === "nocall" ? "nocall" : "vacation",
          req.start_date, req.end_date, editingVacReq.start_date, editingVacReq.end_date);
      }
      setEditingVacReq(null);
    } catch(e) { console.error("Edit vacation error:", e); if (live()) showToast("Couldn't save the changes — check your connection and try again.", "error"); }
  }, [editingVacReq, vacRequests, isScheduler]);

  // ─── Revoke Approved Vacation (scheduler only) ───
  const revokeApprovedVac = useCallback(async (req) => {
    const isNoCall = req.request_type === "nocall";
    const kindLabel = isNoCall ? "no-call days" : "vacation";
    if (!confirm(`Revoke ${req.surgeon_name}'s approved ${kindLabel} ${req.start_date} → ${req.end_date}? This will remove it from the schedule.`)) return;
    // This session, at the tap (review r5 fix-1 — as the approval): after the
    // revoke's status PATCH, a session change meanwhile stops it there,
    // silently — the time_off row is not deleted (as the next account; or
    // refused as anon, leaving a revoked request whose vacation still blocks
    // the surgeon), no notice, nothing said; this tap's revoke is set back to
    // approved with the tap's headers (only from the 'revoked' it wrote).
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    try {
      // Fail-closed status write with an APPROVED precondition. The most
      // consequential of the four: unchecked, a failed status write here still
      // DELETED the time_off entry while the row kept saying "approved" — the
      // record shows an approved vacation that no longer exists, and the
      // generator (which reads time_off) will schedule that surgeon during a
      // vacation they believe is approved. The N10 failure mode by another
      // road — and it lands on a person, not just a table.
      const revokeRes = await fetch(`${SUPABASE_URL}/rest/v1/vacation_requests?id=eq.${req.id}&status=eq.approved`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify({ status: "revoked", reviewed_at: new Date().toISOString() }),
      });
      if (!revokeRes.ok) {
        console.error("Vacation revoke status write failed:", revokeRes.status, await revokeRes.text().catch(() => ""));
        if (live()) showToast("Couldn't revoke the vacation — nothing was changed. Check your connection and try again.", "error");
        return; // fail closed: the time_off entry stays; record and reality agree
      }
      const revokeRows = await revokeRes.json().catch(() => []);
      if (!live()) { // (review r5 fix-1) another session now: set back to approved (the time off still holds it)
        if (Array.isArray(revokeRows) && revokeRows.length) await setBackRequest(req.id, "status=eq.revoked", { status: "approved", reviewed_at: req.reviewed_at ?? null }, tapH, "Vacation revoke",
          { action: "request.revoke_unapplied", summary: `Revoke of ${req.surgeon_name}'s approved ${isNoCall ? "no-call" : "vacation"} ${req.start_date} → ${req.end_date}` });
        return;
      }
      if (!Array.isArray(revokeRows) || revokeRows.length === 0) {
        showToast("This vacation is no longer approved (already revoked or changed) — nothing was changed.", "error");
        return;
      }
      setVacRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: "revoked" } : r));
      // Remove from the bucket it landed in

      const revokeTargets = [...new Set([req.surgeon_id, ...schedulerAdminIds].filter(Boolean))];
      await addNotification("vacation_revoked", isNoCall ? "No-Call Revoked" : "Vacation Revoked",
        `${req.surgeon_name}'s ${kindLabel} ${req.start_date} → ${req.end_date} was revoked`,
        {}, revokeTargets, ep);
    } catch(e) { console.error("Revoke error:", e); if (live()) showToast("Couldn't revoke the vacation — check your connection and try again.", "error"); }
  }, [addNotification, schedulerAdminIds]);

  // ─── OneSignal Push Notifications ───
  const [oneSignalReady, setOneSignalReady] = useState(false);
  const [oneSignalSubscribed, setOneSignalSubscribed] = useState(false);
  const [pushDiag, setPushDiag] = useState({ msg: "", loading: false });
  const [pushSubscriptionId, setPushSubscriptionId] = useState(null);
  const [pushExternalId, setPushExternalId] = useState(null);
  const [oneSignalInitError, setOneSignalInitError] = useState(null);

  // Initialize OneSignal on mount.
  //
  // IMPORTANT — service worker path: the OneSignal dashboard's Site URL for
  // this app is set to https://fkhan628.github.io/ (origin root), and the
  // OneSignalSDKWorker.js file is served from a separate user-site repo at
  // https://fkhan628.github.io/OneSignalSDKWorker.js. This matches OneSignal's
  // defaults exactly, so we do NOT pass serviceWorkerPath/serviceWorkerParam
  // here — passing them would force the SDK to register the worker at
  // /Call-Schedule-App/ (project scope) instead, which conflicts with the
  // dashboard config and breaks subscriptions.
  useEffect(() => {
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "9ca5c08f-6fb3-4ee5-b564-09aafc1c1901",
          });
          setOneSignalReady(true);
          setOneSignalInitError(null);
          // Check current permission
          const perm = OneSignal.Notifications.permission;
          setOneSignalSubscribed(perm);
          setPushPermission(perm ? "granted" : "default");
          // Listen for subscription changes
          OneSignal.Notifications.addEventListener("permissionChange", (granted) => {
            setOneSignalSubscribed(granted);
            setPushPermission(granted ? "granted" : "denied");
          });
          // Listen for subscription-id changes so the panel updates when the
          // SW finishes registering and the push endpoint becomes available.
          try {
            OneSignal.User.PushSubscription.addEventListener("change", (ev) => {
              const id = ev?.current?.id || OneSignal?.User?.PushSubscription?.id || null;
              setPushSubscriptionId(id);
            });
          } catch(evErr) { console.warn("Subscription change listener:", evErr); }
        } catch(e) {
          console.error("OneSignal init error:", e);
          setOneSignalInitError(e?.message || String(e));
        }
      });
    } catch(e) { console.error("OneSignal setup error:", e); setOneSignalInitError(e?.message || String(e)); }
  }, []);

  // Associate the OneSignal subscription with this user's person_id so that
  // push notifications can be targeted to specific people via external_id.
  // This runs whenever the user signs in or the person_id changes.
  // Existing subscribed users will get tagged next time they open the app
  // after this deploy — no re-subscription required.
  useEffect(() => {
    if (!oneSignalReady || !mySurgeon || mySurgeon === "admin") return;
    try {
      if (window.OneSignal?.login) {
        window.OneSignal.login(mySurgeon).catch(e => console.error("OneSignal.login error:", e));
      }
    } catch(e) { console.error("OneSignal external id set error:", e); }
  }, [oneSignalReady, mySurgeon]);

  // Request push permission via OneSignal.
  // Robust version: detects common failure modes (iOS non-PWA, SDK not loaded,
  // user gesture lost, subscription didn't register) and surfaces them to the
  // user instead of silently doing nothing.
  const requestPushPermission = useCallback(async () => {
    // The session at the tap (review r5 fix-1): after a session change while
    // the prompt (or OneSignal's login) is out — a sign-out, or "Sign in
    // again" on another account — this device's push subscription is never
    // associated with the previous account (OneSignal.login with its
    // person_id) in the next session, and nothing of it is said there.
    const ep = sessionEpochRef.current;
    setPushDiag({ msg: "Requesting permission…", loading: true });
    try {
      // iOS Safari requires the app to be installed as a PWA (home screen) for
      // web push to work. Detect that up front so users aren't left wondering.
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isStandalone = window.navigator.standalone === true ||
        window.matchMedia?.("(display-mode: standalone)").matches;
      if (isIOS && !isStandalone) {
        setPushDiag({ msg: "On iPhone/iPad, push notifications only work after adding this app to your home screen (Share → Add to Home Screen), then opening it from the home-screen icon.", loading: false });
        setPushPermission("unsupported");
        return;
      }

      // If OneSignal isn't loaded yet, tell the user to wait instead of falling
      // through to the native API (which wouldn't register with OneSignal and
      // silently leaves them unable to receive pushes).
      if (!window.OneSignal?.Notifications) {
        setPushDiag({ msg: "Notification service still loading. Wait a few seconds and tap Enable again.", loading: false });
        return;
      }

      // (review r5 fix-1) The permission prompt can stay up for minutes: a
      // session change meanwhile stops it here (ep, at the tap — above).
      await window.OneSignal.Notifications.requestPermission();
      if (sessionEpochRef.current !== ep) return;
      const perm = window.OneSignal.Notifications.permission;
      setOneSignalSubscribed(perm);
      setPushPermission(perm ? "granted" : "denied");

      if (!perm) {
        setPushDiag({ msg: "Permission was not granted. If you didn't see a prompt, notifications may be blocked at the browser or OS level — check your device notification settings for this site.", loading: false });
        return;
      }

      // Associate this subscription with the logged-in person_id so targeted
      // pushes (manual edits, vacation updates, etc.) can reach this device.
      // Without this, only broadcast pushes arrive.
      if (mySurgeon && mySurgeon !== "admin" && window.OneSignal?.login) {
        try { await window.OneSignal.login(mySurgeon); } catch(e) { console.error("OneSignal login after permission:", e); }

          }
        } catch(e) { console.error("Push diag readback:", e); }
      }, 1500);
    } catch(e) {
      console.error("Push permission error:", e);
      if (sessionEpochRef.current !== ep) return; // (review r5 fix-1) another session now: nothing said on its screen

        `Permission: ${window.OneSignal?.Notifications?.permission ? "granted" : "not granted"}`,
        `Opted in: ${optedIn === true ? "yes" : optedIn === false ? "no" : "unknown"}`,
        `Subscription ID: ${subId || "none"}`,
        `External ID: ${extId || "none"}`,
        `Logged in as: ${mySurgeon || "nobody"}`,
      ];

  // Rescue tool for users stuck in "opted in but no subscription ID" state.
  // Clears the OneSignal service worker AND IndexedDB (stale state from prior
  // OneSignal config changes is a common root cause), logs out, forces a
  // fresh subscribe, then re-logs-in with the current person_id.
  const resetPushSubscription = useCallback(async () => {
    setPushDiag({ msg: "Resetting push subscription…", loading: true });
    try {
      // Unregister OneSignal's service worker to force a clean re-registration
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(r => /OneSignalSDK/i.test(r.active?.scriptURL || "")).map(r => r.unregister()));
      }
      // Clear OneSignal's IndexedDB — stale data here is the most common
      // cause of "opted in but no subscription ID" state.
      try {
        if (window.indexedDB?.deleteDatabase) {
          await new Promise((resolve) => {
            const req = indexedDB.deleteDatabase("ONE_SIGNAL_SDK_DB");
            req.onsuccess = req.onerror = req.onblocked = () => resolve();
            setTimeout(resolve, 2000); // safety timeout
          });
        }
      } catch(e) { console.warn("IndexedDB clear:", e); }
      // Log out (clears external_id association)
      try { if (window.OneSignal?.logout) await window.OneSignal.logout(); } catch(e) { console.warn("logout:", e); }
      // Tell the user to reload — we can't re-init OneSignal cleanly on the same page
      setPushDiag({ msg: "✓ Reset complete. Now tap 'Refresh Now' in Settings below (or close and reopen the app), then return here and tap 'Enable Push Notifications'.", loading: false });

      setPushDiag({ msg: `Reset error: ${e.message || e}`, loading: false });

  // ─── Deep-link handler for push notification clicks ───
  // OneSignal push clicks land on the app with ?tab=X or ?tab=X&week=YYYY-MM-DD
  // query params. We parse them on mount (and whenever `loaded` flips to true
  // so week-focus can resolve against the schedule data), navigate to the tab,
  // jump the calendar to the week if specified, and clean up the URL so a
  // refresh doesn't re-trigger old deep-links.
  useEffect(() => {
    if (!loaded) return;
    try {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get("tab");
      const week = params.get("week"); // YYYY-MM-DD (a Monday)
      const validTabs = ["calendar", "mine", "requests", "stats", "settings", "setup", "totals"];
      if (tab && validTabs.includes(tab)) {
        setView(tab);
      }
      if (week && /^\d{4}-\d{2}-\d{2}$/.test(week)) {
        const [y, m] = week.split("-").map(Number);
        setCalMonth(m - 1);
        setCalYear(y);
      }
      // Clean up the URL so a reload doesn't re-apply this deep-link. Keeps
      // any other query params (e.g. _v version-check) intact.
      if (tab || week) {
        params.delete("tab");
        params.delete("week");
        const newSearch = params.toString();
        const newUrl = window.location.pathname + (newSearch ? "?" + newSearch : "") + window.location.hash;
        window.history.replaceState(null, "", newUrl);
      }
    } catch(e) { console.error("Deep-link handler error:", e); }
  }, [loaded]);

  // ─── Save Notification Preference for a surgeon ───
  // PER-ID timer map, not one shared timer: a single timer meant that editing
  // surgeon A's email then surgeon B's within 500ms cancelled A's pending
  // write entirely — A's change lived only in local state (the optimistic
  // merge hides the loss until reload). Reachable from the scheduler's
  // per-person email inputs; one mechanism behind the N8 cross-user quirk.
  const notifSaveTimerRef = useRef({});
  // `source` labels the writer for the audit trail: "settings" (default — the
  // Settings-tab editors) or "signup" (the auto-populate on account creation).
  // Contact data is user-visible state with two writers; before 2026-08-08
  // nothing recorded who changed it beyond a bare updated_at.
  const saveNotifPref = useCallback(async (surgeonId, updates, source) => {
    // Update local state + ref immediately
    setNotifPrefs(prev => {
      const cur = prev[surgeonId] || {
        surgeon_id: surgeonId, email: "",
        // Legacy flags (kept for backward compat)
        browser_push: true, email_notifs: false, schedule_changes: true, vacation_updates: true, shift_reminders: true,
        // Per-channel flags (default ON)
        schedule_changes_email: true, schedule_changes_push: true,
        vacation_updates_email: true, vacation_updates_push: true,
        shift_reminders_email: true, shift_reminders_push: true,
        // Per-user reminder hours (Central time)
        daily_reminder_hour: 8, vac_deadline_hour: 8,
      };
      const merged = { ...cur, ...updates };
      notifPrefsRef.current = { ...prev, [surgeonId]: merged };
      return { ...prev, [surgeonId]: merged };
    });
    // Debounce the DB save (500ms) — per surgeonId, so concurrent edits to
    // different people's rows can't cancel each other's pending writes.
    // The session at the change (review r5 fix-1): a save whose debounce ends
    // after a session change is never written as the next account (nor
    // refused as anon, and said on the sign-in screen) — the next account's
    // own prefs are read by its load; one that crosses it while its write is
    // out: its audit line as this account (its headers), nothing said.
    const ep = sessionEpochRef.current;
    if (notifSaveTimerRef.current[surgeonId]) clearTimeout(notifSaveTimerRef.current[surgeonId]);
    notifSaveTimerRef.current[surgeonId] = setTimeout(async () => {
      if (sessionEpochRef.current !== ep) return;
      const tapH = dbAuthHeaders();
      setNotifPrefsSaving(true);
      try {
        const cur = notifPrefsRef.current[surgeonId] || {};
        const row = {
          surgeon_id: surgeonId,
          email: cur.email || "",
          // Legacy
          browser_push: cur.browser_push !== false,
          email_notifs: cur.email_notifs || false,
          schedule_changes: cur.schedule_changes !== false,
          vacation_updates: cur.vacation_updates !== false,
          shift_reminders: cur.shift_reminders !== false,
          // Per-channel (default ON for new accounts)
          schedule_changes_email: cur.schedule_changes_email !== false,
          schedule_changes_push: cur.schedule_changes_push !== false,
          vacation_updates_email: cur.vacation_updates_email !== false,
          vacation_updates_push: cur.vacation_updates_push !== false,
          shift_reminders_email: cur.shift_reminders_email !== false,
          shift_reminders_push: cur.shift_reminders_push !== false,
          // Hour preferences (default 8 AM Central)
          daily_reminder_hour: typeof cur.daily_reminder_hour === "number" ? cur.daily_reminder_hour : 8,
          vac_deadline_hour: typeof cur.vac_deadline_hour === "number" ? cur.vac_deadline_hour : 8,
          updated_at: new Date().toISOString(),
        };
        // db.upsert returns {error} on HTTP failure WITHOUT throwing — the
        // catch below only saw network rejections, so a 401 (stale token) or
        // RLS-denied write vanished: the optimistic merge above kept the
        // toggle/email showing the new value while the DB never got it.
        const { error: prefErr } = await db.upsert("notification_preferences", row);
        if (prefErr) throw new Error(`notif pref save failed: ${String(prefErr).slice(0, 200)}`);
        // Audit AFTER the write is known-good (a failed save must not log a
        // phantom change). Via the latest-closure bridge — this callback's []
        // deps would otherwise attribute every entry to the first render's
        // null userProfile ("Unknown").
        // The email is deliberately MASKED: notification_preferences reads are
        // owner-or-scheduler scoped (RLS), but audit_log's SELECT policy is
        // USING(true) for ALL authenticated users (verified live 2026-08-08) —
        // logging the plaintext would copy owner-scoped contact data into a
        // broader table. Person + timestamp + source answer the audit
        // question; the mask keeps the shape without the value.
        const src = source || "settings";
        const em = row.email || "";
        const at = em.indexOf("@");
        const emailMasked = !em ? "(empty)" : (at > 0 ? `${em[0]}***@${em[at + 1] || ""}***` : "***");
        auditRef.current.logAudit(
          src === "signup" ? "prefs.signup_populate" : "prefs.save",
          `${src === "signup" ? "Signup filled" : "Saved"} notification prefs for ${auditRef.current.nameOf(surgeonId)} — email: ${emailMasked}`,
          { surgeon_id: surgeonId, email_masked: emailMasked, source: src }, sessionEpochRef.current === ep ? undefined : tapH);
      } catch(e) { console.error("Save notif pref error:", e); if (sessionEpochRef.current === ep) showToast("Couldn't save notification settings — check your connection and try again.", "error"); }
      setNotifPrefsSaving(false);
    }, 500);
  }, []);

  // ─── Fire browser notifications when polling detects new in-app notifications ───
  useEffect(() => {
    // Don't fire until initial data is loaded — prevents all existing notifications
    // from triggering browser push on every app open
    if (!loaded) return;
    if (lastNotifCountRef.current === null) {
      // First run after load: snapshot the current count so only truly new ones fire
      lastNotifCountRef.current = notifications.length;
      return;

    if (notifications.length > lastNotifCountRef.current) {
      // New notifications arrived — fire browser push for each new one

  }, [loaded, notifications, sendBrowserNotif, mySurgeon, notifPrefs]);

  // ─── Test Notification ───
  const sendTestNotification = useCallback(async () => {

  // ─── Publish Schedule (with notification) ───
  const doGenerateAndNotify = async () => {
    // This session, at the tap (review r3 regress-3): the notice and the
    // e-mail go out only from it — never from the next one, after a sign-out
    // or a switch to another account meanwhile.
    const ep = sessionEpochRef.current;
    // Notify only when something was actually published — not when the Silvis
    // confirm was cancelled, and not when the result went to the preview for
    // "Needs your OK" review (2026-10-11).
    if ((await doGenerate(false)) !== "published") return;
    if (sessionEpochRef.current !== ep) return;
    // (The counts roll forward inside doGenerate's publish, at commit — net
    // of any weeks it replaced.) The tap's session is passed in (review r4
    // fixes-3): the notice's device push, sent after its insert's await, and
    // its failure toasts are fenced inside addNotification too.
    await addNotification("schedule_published", "Schedule Published",
      "A new call schedule has been generated. Check the Schedule or Calendar tab.", {}, null, ep);
    if (sessionEpochRef.current !== ep) return;
    sendEmailNotif("schedule_published", { period: `${MO[startMonth]} – ${MO[endMoIdx]} ${startYear}` }, null, ep);
  };

  // ─── Build Individual ICS for a surgeon (their shifts + vacations only) ───
  const downloadMyCal = (surgeonId) => {
    const s = surgeons.find(x => x.id === surgeonId);
    if (!s) return;
    const events = buildICSEvents(schedule, s.id, s.name, { nameOf });
    // Vacations as all-day events; the end date is exclusive, so the day after the last vacation day
    const vacRanges = vacations[s.id] || [];
    vacRanges.forEach(([vs, ve]) => {
      events.push({
        allDay: true, start: icsDay(parse(vs)), end: icsDay(addD(parse(ve), 1)),

  // Download CSV template pre-filled with surgeon names
  const downloadTemplate = useCallback(() => {
    const header = "Surgeon,Service Weeks,Night Shifts,Weekend Shifts,Backup Service Week,Backup Nights,Backup Weekends";
    const rows = surgeons.map(s => {
      const p = priorCounts[s.id] || {};
      return `${s.name},${p.dc||0},${p.nights||0},${p.wknd||0},${p.dcB||0},${p.nightsB||0},${p.wkndB||0}`;

  // Upload filled template (CSV or Excel)
  const handleTemplateUpload = useCallback(async (file) => {
    if (!file) return;
    // The session at the pick (review r5 fix-1): the file's read (and the
    // spreadsheet library's import) is awaited — after a session change
    // meanwhile its counts are never merged into the next account's setup
    // (which its autosave would then write as that account), nothing said.
    const ep = sessionEpochRef.current;
    setScanning(true);
    setScanMsg("Reading file…");

    try {
      const ext = file.name.split(".").pop().toLowerCase();
      let rows = [];

      if (["xlsx","xls"].includes(ext)) {
        // Excel: parse with SheetJS
        const XLSX = await import("https://cdn.sheetjs.com/xlsx-0.20.0/package/xlsx.mjs");
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:"array"});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {defval:0});
      } else {
        // CSV: parse manually
        const text = await file.text();
        const lines = text.trim().split("\n").map(l => l.split(",").map(c => c.trim()));
        if (lines.length > 1) {
          const headers = lines[0];
          for (let i = 1; i < lines.length; i++) {
            const row = {};
            headers.forEach((h, j) => row[h] = lines[i]?.[j] || "0");
            rows.push(row);
          }
        }
      }

      // Map rows to surgeon IDs
      const nameToId = {};
      surgeons.forEach(s => {
        nameToId[s.name.toUpperCase()] = s.id;
        nameToId[s.name] = s.id;
      });

      // Find the right columns (flexible header matching)
      const findCol = (row, patterns) => {
        for (const key of Object.keys(row)) {
          const k = key.toLowerCase().replace(/[^a-z]/g,"");
          for (const p of patterns) {
            if (k.includes(p)) return parseInt(row[key]) || 0;
          }
        }
        return 0;
      };

      const newCounts = {};
      let matched = 0;
      rows.forEach(row => {
        // Find surgeon name in first column or "Surgeon" column
        const nameVal = row["Surgeon"] || row["surgeon"] || row["Name"] || row["name"] || Object.values(row)[0] || "";
        const nameStr = String(nameVal).trim();
        const id = nameToId[nameStr] || nameToId[nameStr.toUpperCase()];
        if (!id) return;

        newCounts[id] = {
          dc: findCol(row, ["daycall","dayweek","dcweek","dc"]) || parseInt(Object.values(row)[1]) || 0,
          nights: findCol(row, ["night","ngt"]) || parseInt(Object.values(row)[2]) || 0,
          wknd: findCol(row, ["weekend","wknd","wkend"]) || parseInt(Object.values(row)[3]) || 0,
          dcB: findCol(row, ["backupday","bkpday","backupdaycall"]) || parseInt(Object.values(row)[4]) || 0,
          nightsB: findCol(row, ["backupnight","bkpnight"]) || parseInt(Object.values(row)[5]) || 0,
          wkndB: findCol(row, ["backupweekend","bkpwknd","backupwkend"]) || parseInt(Object.values(row)[6]) || 0,
        };
        matched++;
      });

      if (sessionEpochRef.current !== ep) return; // another session now (review r5 fix-1)
      setPriorCounts(prev => ({ ...prev, ...newCounts }));
      setScanMsg(matched > 0
        ? `Imported counts for ${matched} surgeon${matched>1?"s":""}. Review and adjust if needed.`
        : "Could not match surgeon names. Make sure the first column has initials matching: " + surgeons.map(s=>s.name).join(", "));
    } catch (err) {
      console.error("Upload error:", err);
      if (sessionEpochRef.current === ep) setScanMsg("Could not parse the file. Use the CSV template or an Excel file with matching columns.");
    } finally {
      setScanning(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }, [surgeons]);

  const sMap = useMemo(() => { const m={}; surgeons.forEach((s,i)=>m[s.id]={...s,idx:i}); return m; }, [surgeons]);
  const aMap = useMemo(() => { const m={}; apps.forEach((a,i)=>m[a.id]={...a,idx:i}); return m; }, [apps]);

  // Map a holiday coverage label (e.g. "July 4th 24h", "Memorial Day Night Before",
  // "New Year's Day 24h") to its specific emoji. Falls back to 📅 if unmatched.
  const holidayEmoji = (label) => {
    if (!label) return "📅";
    const s = label.toLowerCase();
    if (s.includes("christmas")) return "🎄";
    if (s.includes("thanksgiving")) return "🦃";
    if (s.includes("new year")) return "🎆";
    if (s.includes("july 4") || s.includes("independence")) return "🎆";
    if (s.includes("memorial")) return "🇺🇸";
    if (s.includes("labor")) return "🇺🇸";
    return "📅";
  };
  const mondays = useMemo(() => {
    if (startMondayOverride) {
      // Explicit start Monday — generate numWeeks consecutive Mondays from it
      const ms = []; let d = parse(startMondayOverride);
      // Safety: snap to the Monday of that week if not already
      if (d.getDay() !== 1) d = monOf(d);
      for (let i = 0; i < numWeeks; i++) { ms.push(new Date(d)); d = addD(d, 7); }
      return ms;
    }
    return getMondays(startYear, startMonth, numWeeks);
  }, [startYear, startMonth, numWeeks, startMondayOverride]);
  const endDate = mondays.length > 0 ? addD(mondays[mondays.length-1], 6) : null;
  const endMoIdx = endDate ? endDate.getMonth() : (startMonth+2)%12;
  const endYr = endDate ? endDate.getFullYear() : startYear;

  const rename = (id,name) => setSurgeons(p=>p.map(s=>s.id===id?{...s,name}:s));
  const renameApp = (id,name) => setApps(p=>p.map(a=>a.id===id?{...a,name}:a));

  const addSurgeon = () => {
    const id = "s" + Date.now();
    setSurgeons(p => [...p, { id, name: "NEW" }]);
    logAudit("roster.surgeon.add", "Added a new surgeon slot");
  };
  const removeSurgeon = (id) => {
    const s = surgeons.find(x => x.id === id);
    if (!s) return;
    if (!confirm(`Remove surgeon ${s.name}? This will not remove their past data from totals.`)) return;
    setSurgeons(p => p.filter(x => x.id !== id));
    logAudit("roster.surgeon.remove", `Removed surgeon ${s.name}`, { id, name: s.name });
  };
  const addApp = () => {
    const id = "a" + Date.now();
    setApps(p => [...p, { id, name: "NEW" }]);
    logAudit("roster.app.add", "Added a new APP slot");

  // id strings (v1) or {id, note} objects (planned v2) interchangeably.
  const dayOffId = (x) => typeof x === "string" ? x : ((x && x.id) || "");
  // Saves are SERIALIZED on a promise chain (two upserts can never be in
  // flight, so commits can't reorder) and each save sends the map as it is at
  // execution time — one debounced enqueue per tap burst carries everything.
  // (review r5 fix-1) The taps' session (dayOffEpochRef, set at each tap):
  // a save — the debounced one, a retry, the unload flush — that runs after a
  // session change (a sign-out, or "Sign in again" on another account) never
  // writes those taps as the next account, nor retries them as anon on the
  // sign-in screen (a toast every 5 s); they are dropped, so the next
  // account's own day-offs are adopted (dirty blocks adoption). A save that
  // crosses one while its write is out: its audit lines as the account that
  // tapped (its headers), nothing said on the next screen.
  const enqueueDayOffSave = () => {
    dayOffSaveChainRef.current = dayOffSaveChainRef.current.then(async () => {
      if (!dayOffDirtyRef.current) return; // an earlier chained save already confirmed everything

      const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
      const carried = dayOffPendingAuditRef.current, auditCount = carried.length; // (the array of this save's taps — kept if a session boundary forgets them meanwhile: review r6 fix-3)
      const ts = new Date().toISOString();
      try {
        const { error } = await supabase.from("app_shifts_data")
          .upsert({ id: "dayoff", data: appDayOffRef.current, updated_at: ts });
        if (error) throw new Error(String(error).slice(0, 200));
        const here = sessionEpochRef.current === ep;
        if (here) dayOffLastWriteTsRef.current = ts; // (another session now: its read adopts this row — the watermark was forgotten at the boundary, review r6 fix-3)
        // Audit only what this save actually CARRIED and COMMITTED; entries
        // queued by taps landing mid-save wait for the next confirmed save.
        carried.splice(0, auditCount).forEach(a =>
          logAudit(a.was ? "app_dayoff.remove" : "app_dayoff.add",
            `${a.was ? "Removed" : "Marked"} APP ${a.name} day off ${a.ds}`, { date: a.ds, app_id: a.aid }, here ? undefined : tapH));
        if (dayOffPendingAuditRef.current.length === 0) {
          dayOffDirtyRef.current = false; // fully confirmed — server adoption may resume
        } else {
          scheduleDayOffRetry(600); // mid-save taps still need a confirming save
        }

        setSaveError(false);
        setSaveStatus("APP day-offs saved");
        setTimeout(() => setSaveStatus(""), 1500);

        // dirty blocks any refresh from reverting it). Loud + AUTO-retried —
        // recovery must not depend on the user tapping again.
        console.error("APP day-off save failed (auto-retry in 5s):", e);
        scheduleDayOffRetry(5000); // (after a session change: the retry drops them, above)
        if (sessionEpochRef.current !== ep) return; // another session now: nothing said on its screen
        setSaveError(true);
        setSaveStatus("⚠ APP day-off save failed — retrying…");

      }

  const scheduleDayOffRetry = (ms) => {
    if (dayOffRetryTimerRef.current) clearTimeout(dayOffRetryTimerRef.current);

  // stored row was this device's own last write (ts <= the watermark), so
  // adoptDayOffRow skipped it — and the next account's first chip tap saved
  // the previous account's taps as its own (within the retry's window, their
  // audit lines too). So: the unsaved taps and their audit lines dropped, the
  // debounce and the retry cancelled, the map and the watermark forgotten —
  // and the chips refused until the next account's own read (adoptDayOffRow
  // arms them, and with no watermark it adopts the stored row in full).
  const forgetDayOffs = () => {

  const buildGenAvailability = () => {

    const availability = {};

    // through onVac. Since 2026-10-11 the generator never places anyone below

  // (generator.js scheduleRules). ONE builder, like buildGenAvailability.

  // generator's own pins answer — holidayDesign with christmasSlotOk on
  // today's time off and Silvis days — for a holiday card's weekend eve
  // (generator.js holidayEveHolder): the card, Warnings and the planner.
  const takesChristWknd = (mon) => {
    const fid = (surgeons.find(s => (s.name || "").toUpperCase() === "FAK") || {}).id || null;
    if (!fid || typeof holidayDesign !== "function") return false;
    const p = holidayDesign(holidayAssignments, [mon], fid, christmasSlotOk(buildGenAvailability(), vacations, buildSilvisPrimary())).pins[mon];
    return !!p && p.wknd === fid;

  // Seed the generator with the week immediately preceding the new start so
  // rotation continuity carries across the period boundary — without this,
  // generating the next period can repeat the prior schedule's last
  // service-week surgeon (no predecessor is visible to week 0). Uses fmt/addD
  // (the same helpers that key the schedule) so lookups match exactly. ONE
  // builder (2026-10-12) for doGenerate, "Search more" and the preview's
  // Needs your OK — which used to get only {dayCall, wknd} and so missed
  // spacing across the seam — now with that week's weeknights too (rule 2 and
  // every-other-night strain across the seam). first: the period's first
  // Monday (a Date; default the Generate settings').
  const buildPrevWeekSeed = (first) => {
    const f = first || mondays[0];
    if (!f) return null;
    const prevWk = schedule[fmt(addD(f, -7))]; // contiguous prior week, if any
