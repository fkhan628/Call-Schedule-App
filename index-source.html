              <button aria-label="Next month" onClick={()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);}} style={css.btn(false)}>▶</button>
              {/* Back to today (owner 2026-10-14): today's month, then today's cell scrolled into view (a long grid on a phone).
                  Blue while another month is showing. */}
              {(() => { const now = new Date(), away = calMonth !== now.getMonth() || calYear !== now.getFullYear();
                return <button aria-label="Go to today" title="Back to today" onClick={()=>{
                  const n = new Date(); setCalMonth(n.getMonth()); setCalYear(n.getFullYear());
                  setTimeout(() => { const el = document.querySelector("[data-cal-today=\"1\"]"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 60);
                }} style={{...css.btn(away),padding:"7px 10px"}}>Today</button>; })()}
            </div>
            <div style={{display:"flex",gap:5}}>
              {isScheduler && <>
                <button onClick={()=>setView("setup")} style={css.btn(false)}>← Setup</button>
                <button onClick={()=>doGenerate(false)} disabled={!!searching} style={{...css.btn(true),opacity:searching?0.55:1}}>{searching === "publish" ? "🔍 Searching…" : "↻ Regenerate"}</button>
                <button onClick={clearSchedule} style={{...css.btn(false),color:"#c04040",borderColor:"#e0a0a0"}}>✕ Clear</button>
              </>}
            </div>
          </div>

          {searching && searching !== "more" && view === "calendar" && <SearchProgress searchRef={searchRef} dk={dk} />}
          {/* Calendar Filters */}
          <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:10,padding:"8px 12px",background:dk?"#16213e":"#fff",border:`1px solid ${dkCardBorder}`,borderRadius:8}}>
            <span style={{fontSize:11,fontWeight:600,color:dkSubtext,marginRight:4}}>Show:</span>
            {[
              {key:"svc",label:"Service Wk",color:"#3080a8",icon:"S"},
              {key:"night",label:"Nights",color:"#6850a0",icon:"N"},
              {key:"wknd",label:"Weekends",color:"#908050",icon:"W"},
              {key:"app",label:"APPs",color:"#985020",icon:"A"},
              {key:"fierce",label:"Fierce",color:"#8a6a10",icon:"⚡"},
              {key:"vac",label:"Vacations",color:"#5a6a78",icon:"🏖"},
              // FAK's Silvis (trauma) days — ON DEMAND, in every view including
              // ?public=1 and the OR board (owner decision 2026-09-24: viewers
              // see Silvis only when THEY turn it on; ?silvis=1 = the office link).
              {key:"silvis",label:"Silvis",color:"#1a4a9a",icon:"🚑"},
              // APP day-offs are INTERNAL-ONLY — the toggle (like the data's
              // render below) never exists in the ?public=1 view. This is a
              // deliberate NEW gate: vacations are public by design, day-offs
              // are not.
              ...(appOffVisible ? [{key:"appOff",label:"APP Off",color:"#7a8a98",icon:"☕"}] : []),
            ].map(f=>(
              <button key={f.key} onClick={()=>toggleFilter(f.key)}
                style={{background:calFilters[f.key]?f.color+"18":"transparent",border:`1px solid ${calFilters[f.key]?f.color:dk?"#3a4a6e":"#d0d8e0"}`,color:calFilters[f.key]?f.color:dkSubtext,borderRadius:5,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font,opacity:calFilters[f.key]?1:0.5}}>
                {f.icon} {f.label}
              </button>
            ))}
            <span style={{margin:"0 4px",color:dkSubtext}}>|</span>
            <select value={calSurgeonFilter} onChange={e=>{setCalSurgeonFilter(e.target.value);if(e.target.value)setCalDeptFilter("");}}
              style={{...css.inp,padding:"3px 6px",fontSize:10,width:100,...dkInp}}>
              <option value="">All Surgeons</option>
              {surgeons
                .filter(s => !calDeptFilter || (SURGEON_DEPTS[s.name]||[]).includes(calDeptFilter))
                .map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <select value={calAppFilter} onChange={e=>setCalAppFilter(e.target.value)}
              style={{...css.inp,padding:"3px 6px",fontSize:10,width:90,...dkInp}}>
              <option value="all">All APPs</option>
              <option value="none">No APPs</option>
              {apps.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
            <select value={calDeptFilter} onChange={e=>{setCalDeptFilter(e.target.value);if(e.target.value)setCalSurgeonFilter("");}}
              style={{...css.inp,padding:"3px 6px",fontSize:10,width:100,...dkInp}}>
              <option value="">All Depts</option>
              {Object.entries(DEPT_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
            {(calFiltersDiffer || calSurgeonFilter || calAppFilter!=="all" || calDeptFilter) && (
              <button onClick={()=>{setCalFilters({ ...CAL_FILTER_DEFAULTS });rememberSilvisToggle(null);setCalSurgeonFilter("");setCalAppFilter("all");setCalDeptFilter("");}}
                style={{background:"none",border:"1px solid #d0d8e0",color:"#8a94a0",borderRadius:5,padding:"3px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>
                Reset
              </button>
            )}
          </div>

          {/* Silvis switch ON but the data can't be trusted → say so; a failed
              feed must never look like "no Silvis days". */}
          {calFilters.silvis && (() => {
            const note = !silvisFakId
              ? { kind: "noroster", text: `Silvis days unavailable — "${silvisRule.code}" is not on the roster.` }
              : sfNotice(silvisRows.length, silvisLoadError, silvisDays.fetchedAt);
            return note ? <div role="status" style={{marginTop:-4,marginBottom:10,padding:"5px 12px",fontSize:11,fontWeight:600,color:note.kind==="stale"?"#a06020":"#c04040",background:dk?"#2a1a1a":"#fdf3ec",border:"1px solid #e8c8b0",borderRadius:6}}>🚑 {note.text}</div> : null;
          })()}

          {/* Schedule Warnings — INTERNAL ONLY (owner decision 2026-09-24: outsiders on
              ?public=1 / the OR board can't act on warnings). Everything here reads
              the DISMISSAL-FILTERED lists (warnShown) — header count and "+ more"
              included. Scheduler/admin: a dismiss control per line (confirm quoting
              the line, audited) and "N dismissed · show" to review and Restore. */}
          {!isPublicMode && (()=>{
            const shownTotal = warnShown.silvis.length + warnShown.conflicts.length + warnShown.vac.length;
            const dismissBtn = (x) => (canWriteBlob && x.key && x.dismissable !== false) ? (
              <button onClick={()=>dismissWarning(x)} title="Dismiss for everyone" aria-label="Dismiss this warning for everyone"
                style={{marginLeft:"auto",minWidth:36,minHeight:36,padding:"4px 10px",border:"1px solid #e0c0a8",borderRadius:6,background:"transparent",color:"#a06020",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:font,flexShrink:0}}>✕</button>
            ) : null;
            const dismissedBar = (canWriteBlob && warnShown.hidden.length > 0) ? (
              <div style={{fontSize:11,color:"#8a94a0",marginTop:shownTotal ? 6 : 0}}>
                {warnShown.hidden.length} dismissed · <button onClick={()=>setShowDismissedWarnings(v=>!v)}
                  style={{border:"none",background:"none",color:"#1a6fa8",textDecoration:"underline",cursor:"pointer",fontSize:11,padding:"8px 4px",fontFamily:font}}>{showDismissedWarnings ? "hide" : "show"}</button>
                {showDismissedWarnings && warnShown.hidden.map(d => (
                  <div key={d.key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",marginTop:3,fontSize:12,color:"#7a8a98",background:dk?"#1e2430":"#f4f6fa",borderRadius:6,border:"1px solid #d8dee6"}}>
                    <span style={{textDecoration:"line-through"}}>{d.text}</span>
                    <span style={{fontSize:10,whiteSpace:"nowrap"}}>— {d.by}{d.at ? ", " + new Date(d.at).toLocaleDateString() : ""}</span>
                    <button onClick={()=>restoreWarning(d)}
                      style={{marginLeft:"auto",minHeight:36,padding:"4px 12px",border:"1px solid #c8d0dc",borderRadius:6,background:"transparent",color:"#1a6fa8",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:font,flexShrink:0}}>Restore</button>
                  </div>
                ))}
              </div>
            ) : null;
            if (shownTotal === 0) return dismissedBar ? <div style={{marginBottom:10}}>{dismissedBar}</div> : null;
            return (
            <div style={{...css.card,marginBottom:14,background:dk?"#2a1a1a":"#fef8f0",border:"1px solid #e8c0a0"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700,color:"#c06020"}}>⚠️ Schedule Warnings — {shownTotal}</div>
              </div>
              {/* silvisBusy — feed health + hard overlaps (🔴) */}
              {warnShown.silvis.slice(0,10).map((c,i) => (
                <div key={c.key || `s${i}`} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",marginBottom:3,fontSize:12,color:c.severity==="error"?"#c04040":"#5a6a78",background:c.severity==="error"?(dk?"#2a0a0a":"#fce8e8"):dk?"#1a1a2a":"#f0f8ff",borderRadius:4,border:`1px solid ${c.severity==="error"?"#e0b0b0":"#c0d8f0"}`}}>
                  <span style={{fontWeight:700}}>{c.severity==="error"?"🔴":"🔵"}</span>
                  <span style={{fontFamily:mono,fontSize:11,color:dkSubtext}}>{c.week}</span>
                  <span>{c.message}</span>
                  {dismissBtn(c)}
                </div>
              ))}
              {warnShown.conflicts.slice(0,10).map((c,i) => (
                <div key={c.key || `c${i}`} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",marginBottom:3,fontSize:12,color:c.severity==="error"?"#c04040":c.severity==="warning"?"#a06020":"#5a6a78",background:c.severity==="error"?(dk?"#2a0a0a":"#fce8e8"):dk?"#2a1a0a":"#fef8e8",borderRadius:4,border:`1px solid ${c.severity==="error"?"#e0b0b0":"#e8d0b0"}`}}>
                  <span style={{fontWeight:700}}>{c.severity==="error"?"🔴":c.severity==="warning"?"🟡":"🔵"}</span>
                  <span style={{fontFamily:mono,fontSize:11,color:dkSubtext}}>{c.week}</span>
                  <span>{c.message}</span>
                  {dismissBtn(c)}
                </div>
              ))}
              {warnShown.vac.slice(0,10).map((w,i) => (
                <div key={w.key || `v${i}`} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",marginBottom:3,fontSize:12,color:w.severity==="error"?"#c04040":"#5a6a78",background:w.severity==="error"?(dk?"#2a0a0a":"#fce8e8"):dk?"#1a1a2a":"#f0f8ff",borderRadius:4,border:`1px solid ${w.severity==="error"?"#e0b0b0":"#c0d8f0"}`}}>
                  <span style={{fontWeight:700}}>{w.severity==="error"?"🔴":"🔵"}</span>
                  <span>{w.message}</span>
                  {dismissBtn(w)}
                </div>
              ))}
              {warnShown.silvis.length > 10 && <p style={{fontSize:11,color:"#8a94a0",marginTop:4}}>+ {warnShown.silvis.length - 10} more Silvis line{warnShown.silvis.length - 10 === 1 ? "" : "s"}…</p>}
              {warnShown.conflicts.length > 10 && <p style={{fontSize:11,color:"#8a94a0",marginTop:4}}>+ {warnShown.conflicts.length - 10} more schedule line{warnShown.conflicts.length - 10 === 1 ? "" : "s"}…</p>}
              {warnShown.vac.length > 10 && <p style={{fontSize:11,color:"#8a94a0",marginTop:4}}>+ {warnShown.vac.length - 10} more vacation-overlap line{warnShown.vac.length - 10 === 1 ? "" : "s"}…</p>}
              {dismissedBar}
            </div>
            );
          })()}

          <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1,marginBottom:1}}>
            {DAY_HDR.map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#8a94a0",padding:"5px 0",letterSpacing:1}}>{d}</div>)}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1}}>
            {(()=>{
              const now = new Date();
              const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

              // Helper: for a given date, find the Monday that starts its week.
              // Weeks run Monday-Sunday here (calendar grid is Sun-Sat but Fierce
              // weeks are keyed by their Monday, matching how the schedule works).
              const getWeekMonday = (d) => {
                const day = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
                const diff = day === 0 ? -6 : 1 - day; // shift back to Monday
                const m = new Date(d);
                m.setDate(d.getDate() + diff);
                return fmt(m);
              };

              // Helper: is a given surgeon on vacation on a given date?
              const isSurgeonOnVacDate = (sid, ds) => onVac(sid, ds, vacations);

              // For a given date and surgeon, determine if today is the first
              // and/or last day of their vacation range (considering that a
              // range the user entered could span multiple days, but we want
              // bars to continue across week boundaries too visually).
              // Simpler: is yesterday NOT vacation for them? Is tomorrow NOT
              // vacation for them? That determines corner rounding.
              const getVacBounds = (sid, ds) => {
                const d = parse(ds);
                const prev = fmt(addD(d, -1));
                const next = fmt(addD(d, 1));
                const isFirst = !isSurgeonOnVacDate(sid, prev);
                const isLast = !isSurgeonOnVacDate(sid, next);
                return { isFirst, isLast };
              };

              return calGrid.map((day,i)=>{
              if(!day) return <div key={`e${i}`} style={{background:"#f8f9fb",minHeight:82}}/>;
              const ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
              const isToday = ds === todayStr;
              const entries=calData[ds]||[];
              const dObj = new Date(calYear,calMonth,day);
              const isWknd=[0,6].includes(dObj.getDay());
              const hasFierce = entries.some(e=>e.type==="Fierce");
              const hasFierceBkp = entries.some(e=>e.type==="FierceBkp");
              const sf = calSurgeonFilter;  // shorthand used throughout the cell render

              // Determine if THIS DAY's WEEK (Mon-Sun) is a Fierce primary or
              // Fierce backup week. Used to apply bolder/lighter shading to
              // ALL 7 days of the week, not just the Fierce day itself.
              const weekMonday = getWeekMonday(dObj);
              const isFiercePrimaryWeek = backupMondaySet.has(weekMonday);
              const isFierceBackupWeek = fierceBackupSet.has(weekMonday);

              // Gather surgeons on vacation today, respecting filters
              const onVacToday = [...surgeons, ...apps].filter(s=>{
                if (!isSurgeonOnVacDate(s.id, ds)) return false;
                if (sf && s.id !== sf) return false;
                const isApp = s.id.startsWith("a");
                if (isApp) return (calAppFilter === "all" || calAppFilter === s.id);
                if (calDeptFilter) return (SURGEON_DEPTS[s.name]||[]).includes(calDeptFilter);
                return true;
              });

              // Background tint — Fierce primary is bolder, Fierce backup lighter,
              // regular weekdays/weekends keep their existing soft tints.
              let cellBg;
              let cellBorder;
              if (isFiercePrimaryWeek && calFilters.fierce) {
                cellBg = "#fef3d0";      // warm gold — bolder, primary
                cellBorder = "1px solid #e0c870";
              } else if (isFierceBackupWeek && calFilters.fierce) {
                cellBg = "#e8f0fc";      // soft blue — lighter, backup
                cellBorder = "1px solid #c8d8ec";
              } else if (isWknd) {
                cellBg = "#edf0f4";
                cellBorder = "1px solid #e8ecf0";
              } else {
                cellBg = "#f8f9fb";
                cellBorder = "1px solid #e8ecf0";
              }

              return (
                <div key={ds} data-cal-today={isToday ? "1" : undefined} style={{
                  background: cellBg,
                  border: cellBorder,
                  minHeight:82, padding:"3px 4px", borderRadius:2,
                  display:"flex", flexDirection:"column", minWidth:0,
                }}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                    {isToday ? (
                      <span style={{fontSize:11,fontWeight:700,color:"#ffffff",fontFamily:mono,background:"#1a6fa8",borderRadius:"50%",width:20,height:20,display:"inline-flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{day}</span>
                    ) : (
                      <span style={{fontSize:11,fontWeight:600,color:isWknd?"#5a7090":"#4a5868",fontFamily:mono}}>{day}</span>
                    )}
                    {calFilters.fierce && hasFierce && <span style={{fontSize:8,fontWeight:700,color:"#8a6a10",background:"#fef8e8",borderRadius:3,padding:"0 4px",letterSpacing:0.5}}>BKP</span>}
                    {calFilters.fierce && hasFierceBkp && !hasFierce && <span style={{fontSize:8,fontWeight:700,color:"#1a6fa8",background:"#e8f0fc",borderRadius:3,padding:"0 4px",letterSpacing:0.5}}>F·BKP</span>}
                  </div>

                  {/* DENY-LIST: any calData type not excluded here renders as a chip,
                      and anything that is not Svc/Wknd renders as a NIGHT ("N").
                      So only Davenport call types may ever be pushed into calData
                      (see the calData memo) — a foreign type here is a phantom
                      shift. The "Silvis" term is belt-and-braces from #56; since
                      Silvis left calData (2026-09-24) it never matches. */}
                  {entries.filter(e=>{
                    if(e.type==="Fierce"||e.type==="FierceBkp"||e.type==="APP"||e.type==="Holiday"||e.type==="Silvis") return false;
                    const isD = e.type.includes("Svc");
                    const isW = e.type.includes("Wknd");
                    if(isD && !calFilters.svc) return false;
                    if(isW && !calFilters.wknd) return false;
                    if(!isD && !isW && !calFilters.night) return false;
                    if(sf && e.surgeon !== sf) return false;
                    if(calDeptFilter && !(SURGEON_DEPTS[sMap[e.surgeon]?.name]||[]).includes(calDeptFilter)) return false;
                    return true;
                  }).map((e,j)=>{
                    const isB = e.cls==="backup";
                    const isD = e.type.includes("Svc");
                    const isW = e.type.includes("Wknd");
                    const label = isD?"S":isW?"W":"N";
                    const color = isD?"#3080a8":isW?"#908050":"#6850a0";
                    const highlighted = sf && e.surgeon === sf;
                    return (
                      <div key={j} style={{marginBottom:1,padding:"1px 3px",borderRadius:3,fontSize:10,
                        background:highlighted?"#e0f0ff":isB?"#fef8e8":isD?"#f8f9fb":isW?"#faf8f0":"#f4f0f8",
                        border:`1px solid ${highlighted?"#80b8e0":isB?"#d8c880":isD?"#d0dce8":isW?"#faf0d8":"#141028"}`,
                        opacity:isB?0.85:1,
                      }}>
                        {isB&&<span style={{color:"#8a6a10",fontWeight:700,fontSize:8,marginRight:2}}>B</span>}
                        <span style={{color,fontWeight:700}}>{label}</span>
                        {" "}
                        <span style={{color:surgeonColors(sMap[e.surgeon]?.name, sMap[e.surgeon]?.idx).tx||"#4a5868",fontWeight:highlighted?700:400}}>{sMap[e.surgeon]?.name||"?"}</span>
                      </div>
                    );
                  })}

                  {/* Holiday coverage entries */}
                  {entries.filter(e=>e.type==="Holiday").filter(e=>!sf||e.surgeon===sf).filter(e=>!calDeptFilter||(SURGEON_DEPTS[sMap[e.surgeon]?.name]||[]).includes(calDeptFilter)).map((e,j)=>(
                    <div key={"hol"+j} style={{marginBottom:1,padding:"1px 3px",borderRadius:3,fontSize:10,
                      background:"#fef0e8",border:"1px solid #e0a868",fontWeight:600}}>
                      <span style={{color:"#c06020",fontWeight:700}} title={e.holName||""}>{holidayEmoji(e.holName)}</span>
                      {" "}
                      <span style={{color:surgeonColors(sMap[e.surgeon]?.name, sMap[e.surgeon]?.idx).tx||"#4a5868"}}>{sMap[e.surgeon]?.name||"?"}</span>
                      <span style={{color:"#a07030",fontSize:8,marginLeft:2}}>{e.hours}</span>
                    </div>
                  ))}

                  {/* Silvis (trauma) day — ON DEMAND (🚑 switch). Reads silvisDays
                      DIRECTLY via sfCellChip — never a calData row (a non-Davenport
                      row there renders as a phantom "N" night: #57). FAK only. */}
                  {(() => {
                    const chip = sfCellChip(silvisDays, ds, silvisFakId, {
                      on: calFilters.silvis, sf, fakName: sMap[silvisFakId]?.name, ruleOn: silvisActive,
                      deptOk: !calDeptFilter || (SURGEON_DEPTS[sMap[silvisFakId]?.name]||[]).includes(calDeptFilter),
                    });
                    if (!chip) return null;
                    const P = chip.role === "P";
                    return (
                      <div key="silvis" title={chip.title}
                        style={{marginBottom:1,padding:"1px 3px",borderRadius:3,fontSize:10,fontWeight:600,
                          background:P?(dk?"#1a2a4a":"#e8f0fc"):(dk?"#1e2430":"#f4f6fa"),border:`1px solid ${P?"#7a9ad0":"#c8d0dc"}`,opacity:P?1:0.85}}>
                        <span style={{color:P?"#1a4a9a":"#7a8a98",fontWeight:700}}>{chip.label}</span>
                      </div>
                    );
                  })()}

                  {/* APP entries — hidden when filtering to a specific surgeon */}
                  {calFilters.app && !sf && calAppFilter!=="none" && !calDeptFilter && entries.filter(e=>e.type==="APP").filter(e=>calAppFilter==="all"||e.appId===calAppFilter).map((e,j)=>(
                    <div key={"app"+j} style={{marginBottom:1,padding:"1px 3px",borderRadius:3,fontSize:10,
                      background:"#fcf4f0",border:"1px solid #281818"}}>
                      <span style={{color:"#c08050",fontWeight:700}}>A</span>
                      {" "}
                      <span style={{color:APP_PAL[aMap[e.appId]?.idx%APP_PAL.length]?.tx||"#5a6878"}}>{aMap[e.appId]?.name||"?"}</span>
                    </div>
                  ))}

                  {/* APP day-offs — display-only. NOT rendered in plain
                      ?public=1 (a deliberate gate: vacations are public by
                      design, day-offs are not) but DO render on the OR board
                      ?public=1&view=or, which the charge nurses use to
                      coordinate. ONE quiet muted line per
                      day, all off-APPs comma-joined — the 🏖 vacation-row
                      pattern, with ☕ matching the filter toggle so the icon
                      is self-teaching. Deliberately the least-loud element in
                      the cell (it's the least important); an APP off during
                      the day can still take call that night — both render.
                      Entries tolerate the planned v2 {id, note} shape. */}
                  {appOffVisible && calFilters.appOff && !sf && calAppFilter!=="none" && !calDeptFilter && (() => {
                    const offNames = (appDayOff[ds]||[]).map(dayOffId)
                      .filter(aid => aid && (calAppFilter==="all"||aid===calAppFilter))
                      .map(aid => aMap[aid]?.name||aid);
                    return offNames.length ? (
                      <div style={{marginTop:1,fontSize:8.5,color:"#8a94a0",whiteSpace:"nowrap"}}>
                        ☕ {offNames.join(", ")}
                      </div>
                    ) : null;
                  })()}

                  {calFilters.fierce && hasFierce && <div style={{fontSize:8,color:"#8a6a10",marginTop:1,fontWeight:600}}>⚡ Fierce Primary</div>}
                  {calFilters.fierce && hasFierceBkp && !hasFierce && <div style={{fontSize:8,color:"#1a6fa8",marginTop:1,fontWeight:600}}>🛡 Fierce Backup</div>}

                  {/* Holiday name label — shows on calendar even when no coverage
                      has been assigned yet. Hidden if a coverage entry already
                      exists for this day (it already shows the name). Also
                      hidden if a surgeon filter is active and no coverage entry
                      links this holiday to that surgeon — avoids showing the
                      holiday label in the filtered view for non-relevant surgeons. */}
                  {calHolidayLabels[ds] && !entries.some(e => e.type === "Holiday") && !sf && !calDeptFilter && (
                    <div style={{fontSize:8,color:"#c06020",marginTop:1,fontStyle:"italic",fontWeight:600}} title={calHolidayLabels[ds].name}>
                      {calHolidayLabels[ds].emoji} {calHolidayLabels[ds].name}
                    </div>
                  )}

                  {/* Vacation bar — renders as a continuous bar across consecutive
                      vacation days. Corners round based on whether today is the
                      start/end of ANY vacation span in the group. Multiple
                      surgeons on vacation today share the bar, names joined. */}
                  {calFilters.vac && onVacToday.length > 0 && (() => {
                    // Determine corner rounding based on the GROUP of vacationers:
                    // Round the left corner only if NONE of today's vacationers
                    // were also on vacation yesterday (i.e., at least one span
                    // starts today). Round right corner if none continue tomorrow.
                    // This matches the "visual continuity when same group continues"
                    // and "split when group changes" behavior the user requested.
                    const prevDs = fmt(addD(dObj, -1));
                    const nextDs = fmt(addD(dObj, 1));
                    // Set of surgeon ids on vacation on each adjacent day
                    const yesterdaySet = new Set(onVacToday.filter(s => isSurgeonOnVacDate(s.id, prevDs)).map(s => s.id));
                    const tomorrowSet = new Set(onVacToday.filter(s => isSurgeonOnVacDate(s.id, nextDs)).map(s => s.id));
                    // If yesterday's vacationer set is IDENTICAL to today's, no
                    // left round (bar continues). Otherwise round left.
                    const todaySet = new Set(onVacToday.map(s => s.id));
                    const setsEqual = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
                    const roundLeft = !setsEqual(yesterdaySet, todaySet);
                    const roundRight = !setsEqual(tomorrowSet, todaySet);

                    // Names inside the bar — initials, comma-separated. Always
                    // show ALL vacationers (no truncation). On narrow screens
                    // the bar will wrap onto multiple lines naturally, and
                    // the day cell grows to accommodate. Keeping names visible
                    // is more useful than keeping the bar to a single line.
                    const displayNames = onVacToday.map(s => s.name).join(", ");

                    return (
                      <div style={{
                        marginTop: "auto",  // push to bottom of cell
                        marginLeft: roundLeft ? 0 : -4,
                        marginRight: roundRight ? 0 : -4,
                        marginBottom: -3,
                        padding: "2px 4px",
                        fontSize: 9,
                        fontWeight: 600,
                        background: "#e4e7ec",
                        color: "#5a6a78",
                        borderTopLeftRadius: roundLeft ? 6 : 0,
                        borderBottomLeftRadius: roundLeft ? 6 : 0,
                        borderTopRightRadius: roundRight ? 6 : 0,
                        borderBottomRightRadius: roundRight ? 6 : 0,
                        whiteSpace: "normal",       // allow wrapping
                        overflowWrap: "break-word", // break at comma boundaries
                        wordBreak: "break-word",
                        lineHeight: 1.25,
                        letterSpacing: 0.2,
                      }} title={onVacToday.map(s => s.name).join(", ") + " on vacation"}>
                        🏖 {displayNames}
                      </div>
                    );
                  })()}
                </div>
              );
            });
            })()}
          </div>

          <div style={{marginTop:10,display:"flex",gap:12,fontSize:10,color:"#8a94a0",flexWrap:"wrap"}}>
            <span><span style={{color:"#3080a8",fontWeight:700}}>S</span> Service Wk</span>
            <span><span style={{color:"#6030a0",fontWeight:700}}>N</span> Night</span>
            <span><span style={{color:"#908050",fontWeight:700}}>W</span> Weekend</span>
            <span><span style={{color:"#c08050",fontWeight:700}}>A</span> APP</span>
            <span><span style={{color:"#8a6a10",fontWeight:700}}>B</span> Backup</span>
            <span><span style={{color:"#8a6a10"}}>⚡</span> Fierce Primary</span>
            <span><span style={{color:"#1a6fa8"}}>🛡</span> Fierce Backup</span>
            <span>🏖 Vacation</span>
            <span><span style={{color:"#c06020"}}>📅</span> Holiday Coverage</span>
          </div>

          {/* Calendar tools — collapsed by default so the calendar itself stays front and center */}
          <Collapsible css={css} ck="cal_tools" defaultOpen={false} title="🔧 Schedule Tools & Export" style={{background:"transparent",border:"none",boxShadow:"none",padding:"4px 2px",marginTop:8}}>
          {/* ─── Silvis (trauma) feed — read-only mirror; rule silvisBusy (internal views only) ─── */}
          {!isPublicMode && (()=>{
            const st = sfStatus(silvisDays.fetchedAt);
            return (
              <div style={{...css.card,marginTop:14,background:dk?"#16223a":"linear-gradient(135deg,#eef3fc,#e8eefa)",border:"1px solid #b8c8e8"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                  <div style={css.cardT}>🚑 Silvis feed <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— read-only mirror of FAK's Silvis trauma call</span></div>
                  {authUser
                    ? <button onClick={()=>refreshSilvisFeed(false)} disabled={silvisRefreshing}
                        style={{...css.btn(false),padding:"6px 14px",fontSize:12,opacity:silvisRefreshing?0.6:1}}>{silvisRefreshing ? "Refreshing…" : "↻ Refresh from Silvis"}</button>
                    : <span style={{fontSize:11,color:"#8a94a0"}}>sign in to refresh</span>}
                </div>
                <div style={{fontSize:12,color:"#5a6a78",marginTop:6,lineHeight:1.6}}>
                  {silvisRows.length === 0
                    ? <span style={{color:"#c04040",fontWeight:600}}>No cached Silvis days{silvisLoadError ? " — last read: " + silvisLoadError : ""}. Rule silvisBusy is BLIND until {authUser ? "a refresh succeeds (↻ above)" : "a signed-in user refreshes"}.</span>
                    : <>
                        <b>{silvisRuleRows.length}</b> days cached · FAK Silvis <b>primary</b> on <b>{silvisDays.primary.size}</b>, backup on {silvisDays.backup.size}
                        {" · "}fetched {st.ageHours === null ? "?" : st.ageHours + "h ago"}{st.stale && <span style={{color:"#c06020",fontWeight:700}}> · STALE</span>}
                        {silvisLoadError && <span style={{color:"#c04040"}}> · last load failed ({silvisLoadError}) — showing the previous cache</span>}
                        {silvisDays.from && silvisDays.to && <span> · covers {silvisDays.from} → {silvisDays.to}</span>}
                        {!silvisActive && <span style={{color:"#a06020",fontWeight:700}}> · {!sfRuleActive(silvisRule) ? "rule silvisBusy is OFF (silvisRule.enabled = false in the config blob)" : `code "${silvisRule.code}" is not on the roster — rule silvisBusy is inactive`}</span>}
                        {silvisSoftNotes.length > 0 && <div style={{marginTop:3,color:"#7a8a98"}}>Backup touches (standby — no action needed): {silvisSoftNotes.map(n => n.short).join(" · ")}</div>}
                      </>}
                </div>
                <div style={{fontSize:11,color:"#8a94a0",marginTop:4}}>Rule silvisBusy: on a Silvis PRIMARY day (07:00 → 07:00 next day) FAK cannot hold any overlapping Davenport call — the generator never assigns it; a manual edit or trade acceptance is refused (scheduler override with the reason shown). Backup days are standby and never block. Whichever app generates a period first wins those days; the other respects the feed.</div>
              </div>
            );
          })()}

          {/* ─── Manual Adjustments (scheduler/admin only) ─── */}
          {(isScheduler || userProfile?.role === "admin") && (
            <div style={{...css.card,marginTop:14,background:"linear-gradient(135deg,#fff8e8,#fcf4e0)",border:"1px solid #e0c890"}}>
              <div style={css.cardT}>✏️ Manual Adjustments</div>
              <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
                Edit an existing week or create a new week's schedule on the fly. Weeks shown match the month displayed in the calendar above. Affected surgeons/APPs will be notified via push and email.
              </p>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <select value={editWeekPick} onChange={e=>setEditWeekPick(e.target.value)} style={{...css.inp,flex:1,minWidth:180}}>
                  <option value="">Select a week in {MO[calMonth]} {calYear}…</option>
                  {(()=>{
                    // Find all Mondays whose week STARTS in the viewed calendar month.
                    // Week is "in" a month if its Monday falls in that month.
                    const first = new Date(calYear, calMonth, 1);
                    // Find the first Monday on or after the 1st of the month
                    let mon = new Date(first);
                    if (mon.getDay() !== 1) {
                      // day=0 (Sun) → +1; day=2 (Tue) → +6; day=3 (Wed) → +5; etc.
                      const dow = mon.getDay();
                      const offset = (dow === 0) ? 1 : (8 - dow);
                      mon = addD(mon, offset);
                    }
                    const results = [];
                    while (mon.getMonth() === calMonth && mon.getFullYear() === calYear) {
                      results.push(fmt(mon));
                      mon = addD(mon, 7);
                    }
                    return results;
                  })().map(m => {
                    const mon = parse(m);
                    const sun = addD(mon, 6);
                    const exists = !!schedule[m];
                    const suffix = exists
                      ? (schedule[m].isBackup ? " (Backup)" : "")
                      : " (new)";
                    const label = `Wk of ${MO[mon.getMonth()].slice(0,3)} ${mon.getDate()} – ${MO[sun.getMonth()].slice(0,3)} ${sun.getDate()}${suffix}`;
                    return <option key={m} value={m}>{label}</option>;
                  })}
                </select>
                <button onClick={()=>{ if(editWeekPick) openWeekEditor(editWeekPick); }}
                  disabled={!editWeekPick}
                  style={{...css.btn(true),padding:"8px 14px",opacity:editWeekPick?1:0.5,cursor:editWeekPick?"pointer":"not-allowed"}}>
                  Open Week Editor
                </button>
              </div>
            </div>
          )}

          {/* ─── Shift Swap Tool ─── */}
          {!isPublicMode && Object.keys(schedule).length > 0 && (
            <div style={{...css.card,marginTop:14,background:"linear-gradient(135deg,#f8f0ff,#f4f0f8)",border:"1px solid #d0c0e4"}}>
              <div style={css.cardT}>🔄 Shift Swap Tool</div>
              <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
                Need to change a shift? All swaps must be <strong>two-way</strong> — the other surgeon takes your shift and you take one of theirs.
                One-way swaps are only permitted for emergencies (illness, family emergency) and require scheduler approval.
              </p>
              <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:10}}>
                {isScheduler ? <>
                  <div>
                    <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Week</label>
                    <select value={swapTarget?.mondayStr||""} onChange={e=>{setSwapTarget(prev=>({...(prev||{}),mondayStr:e.target.value}));setSwapSuggestions(null);}} style={{...css.inp,width:160}}>
                      <option value="">Select week…</option>
                      {/* Swaps act on upcoming shifts — fully past weeks are dead
                          entries here (record corrections go through Manual
                          Adjustments, not swaps). Current week stays listed: a
                          Thursday night is swappable on Tuesday. */}
                      {Object.keys(schedule).sort().filter(m => fmt(addD(parse(m), 6)) >= todayStr).map(m=><option key={m} value={m}>Wk of {m}{m <= todayStr ? " (this week)" : ""}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Shift</label>
                    <select value={swapTarget?.shift||""} onChange={e=>{setSwapTarget(prev=>({...(prev||{}),shift:e.target.value}));setSwapSuggestions(null);}} style={{...css.inp,width:140}}>
                      <option value="">Select shift…</option>
                      {ALL_SHIFT_KEYS.map(sk=><option key={sk} value={sk}>{swapTarget?.mondayStr ? slotLabel(swapTarget.mondayStr, sk) : SHIFT_LABELS[sk]}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Current Surgeon</label>
                    {(()=>{
                      const m = swapTarget?.mondayStr;
                      const sh = swapTarget?.shift;
                      const wk = m ? schedule[m] : null;
                      let currentId = null;
                      if (wk && sh) {
                        currentId = sh === "dayCall" ? wk.dayCall : wk.nights?.[sh];
                      }
                      return currentId ? (
                        <div style={{padding:"6px 10px"}}><Badge id={currentId}/></div>
                      ) : (
                        <div style={{padding:"6px 10px",fontSize:12,color:"#8a94a0"}}>—</div>
                      );
                    })()}
                  </div>
                </> : (
                  <div>
                    <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Your shift to swap</label>
                    {(()=>{
                      const opts = [];
                      Object.keys(schedule).sort().forEach(m => {
                        const wk = schedule[m];
                        if (!wk) return;
                        ALL_SHIFT_KEYS.forEach(sk => {
                          const holder = sk === "dayCall" ? wk.dayCall : wk.nights?.[sk];
                          if (holder === mySurgeon) {
                            // Upcoming shifts only; start-date rule per kind:
                            // a night = its own date, weekend = its Friday,
                            // service week = its Monday. A partially-elapsed
                            // service week is EXCLUDED on purpose: the swap and
                            // trade-accept paths reassign the whole week's
                            // dayCall (no dayCallOverrides), which would rewrite
                            // the already-worked days — mid-week splits are the
                            // scheduler's week editor's job.
                            // Filter AND label both go through the helpers (one owner for the date):
                            if (shiftStartDate(m, sk) < todayStr) return;
                            const label = `${slotLabel(m, sk)}${wk.isBackup ? " (Backup)" : ""}${m <= todayStr ? " (this week)" : ""}`;
                            opts.push({ value: `${m}|${sk}`, label });
                          }
                        });
                      });
                      const curVal = swapTarget?.mondayStr && swapTarget?.shift ? `${swapTarget.mondayStr}|${swapTarget.shift}` : "";
                      const placeholder = !mySurgeon ? "Select your name in Mine tab first"
                        : (opts.length === 0 ? "You have no upcoming shifts" : "Select your shift…");
                      return (
                        <select value={curVal} onChange={e=>{
                          const v = e.target.value;
                          setSwapSuggestions(null);
                          if (!v) { setSwapTarget(null); }
                          else { const [w, s] = v.split("|"); setSwapTarget({ mondayStr: w, shift: s }); }
                        }} style={{...css.inp,minWidth:260}} disabled={!mySurgeon || opts.length === 0}>
                          <option value="">{placeholder}</option>
                          {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                      );
                    })()}
                  </div>
                )}
                <button onClick={()=>{
                  const m = swapTarget?.mondayStr;
                  const sh = swapTarget?.shift;
                  const wk = m ? schedule[m] : null;
                  if (!wk || !sh) return;
                  const currentId = sh === "dayCall" ? wk.dayCall : wk.nights?.[sh];
                  if (!currentId) return;
                  findSwapSuggestions(m, sh, currentId);
                }} disabled={!swapTarget?.mondayStr || !swapTarget?.shift}
                  style={{...css.btn(true),padding:"7px 16px",opacity:(!swapTarget?.mondayStr || !swapTarget?.shift)?0.5:1,background:"linear-gradient(135deg,#6030a0,#8050c0)",borderColor:"#6030a0"}}>
                  Find Swap Options
                </button>
              </div>

              {/* Swap Suggestions */}
              {swapSuggestions && (
                <div style={{marginTop:12}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#6030a0",marginBottom:8}}>
                    Swap options for <Badge id={swapTarget.surgeonId}/> — {slotLabel(swapTarget.mondayStr, swapTarget.shift)}
                  </div>
                  {swapSuggestions.length === 0 ? (
                    <p style={{color:"#8a94a0",fontSize:13,padding:10}}>No eligible swap candidates found. All surgeons are either on vacation or have conflicts.</p>
                  ) : swapSuggestions.map((s,i) => (
                    <div key={s.candidateId} style={{background:i===0?"#f0f8f0":"#f8f9fb",border:`1px solid ${i===0?"#b0d8b0":"#e0e4ea"}`,borderRadius:8,padding:"10px 14px",marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:4}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          {i===0 && <span style={{fontSize:10,fontWeight:700,color:"#1a8040",background:"#e0f8e0",padding:"1px 6px",borderRadius:4}}>BEST</span>}
                          <Badge id={s.candidateId}/>
                          <span style={{fontSize:12,color:s.countDiff>0?"#1a8040":s.countDiff===0?"#5a6a78":"#c09030",fontWeight:600}}>
                            {s.countDiff>0?"▲ Fewer shifts":s.countDiff===0?"= Equal":"▼ More shifts"}
                          </span>
                        </div>
                      </div>
                      <div style={{fontSize:11,color:"#5a6a78",lineHeight:1.6,marginBottom:4}}>
                        {s.reasons.map((r,j)=><div key={j}>• {r}</div>)}
                      </div>
                      {s.returnSwaps.length > 0 ? (
                        <div style={{marginTop:6,paddingTop:6,borderTop:"1px solid #e8ecf0"}}>
                          <div style={{fontSize:10,fontWeight:700,color:"#6030a0",marginBottom:4}}>↔ Two-way swap — {s.candidateName} takes this shift, {swapTarget.surgeonName} takes one of theirs:</div>
                          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {s.returnSwaps.slice(0,8).map((rs,k) => (
                              <button key={k} onClick={()=>executeTwoWaySwap(swapTarget.mondayStr, swapTarget.shift, swapTarget.surgeonId, s.candidateId, rs.mondayStr, rs.shift)}
                                style={{background:"#f0e8fc",border:"1px solid #c8b0e0",color:"#6030a0",borderRadius:5,padding:"4px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>
                                ↔ {rs.label}
                              </button>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div style={{fontSize:11,color:"#a08040",background:"#fef8e8",border:"1px solid #e8d8a0",borderRadius:5,padding:"6px 10px",marginTop:4}}>
                          No return swap available — {s.candidateName} doesn't have a matching shift {swapTarget.surgeonName} could take back.
                        </div>
                      )}
                      {/* Emergency one-way swap — scheduler only */}
                      {isScheduler && (
                        <div style={{marginTop:6,paddingTop:6,borderTop:"1px dashed #e0d0c0"}}>
                          <button onClick={()=>{
                            // Guarded at the CALL SITE, not inside swapShift —
                            // swapShift also serves record corrections, which
                            // must keep full past access (the Bucket-B caveat).
                            if (shiftStartDate(swapTarget.mondayStr, swapTarget.shift) < fmt(new Date())) { showToast("This trade's shift has already passed — propose a new one.", "error"); return; }
                            if (!confirm(`⚠️ Emergency one-way swap\n\nThis will reassign ${slotLabel(swapTarget.mondayStr, swapTarget.shift)} to ${s.candidateName} WITHOUT a return swap.\n\nOne-way swaps should only be used for illness, family emergency, or other acute circumstances.\n\nProceed?`)) return;
                            swapShift(swapTarget.mondayStr, swapTarget.shift, s.candidateId, swapTarget.surgeonId);
                          }}
                            style={{background:"none",border:"1px solid #e0c0a0",color:"#a08040",borderRadius:5,padding:"3px 10px",fontSize:10,cursor:"pointer",fontFamily:font}}>
                            ⚠ Emergency one-way (scheduler only)
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                  <button onClick={()=>{setSwapSuggestions(null);setSwapTarget(null);}} style={{...css.btn(false),padding:"5px 12px",fontSize:11,marginTop:6}}>Close</button>
                </div>
              )}
            </div>
          )}

          {/* Calendar App Integration — ICS export */}
          {!isPublicMode && Object.keys(schedule).length > 0 && (
            <div style={{...css.card,marginTop:14,background:"linear-gradient(135deg,#f8f9fb,#f0f2f5)",border:"1px solid #d0d8e4"}}>
              <div style={css.cardT}>📅 Calendar App Integration</div>
              <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
                Download .ics files to import your call shifts into Apple Calendar, Google Calendar, or Outlook. Choose your own name for a personal calendar, or the full schedule for everyone.
              </p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {surgeons.map(s => (
                  <button key={s.id} onClick={() => {
                    const events = buildICSEvents(schedule, s.id, s.name, { nameOf });
                    const ics = generateICS(events, `Call Schedule — ${s.name}`);
                    downloadICS(ics, `call-schedule-${s.name.toLowerCase()}.ics`);
                  }} style={{...css.badge(sMap[s.id]?.idx||0, sMap[s.id]?.name),cursor:"pointer",padding:"5px 12px",fontSize:12}}>
                    ⬇ {s.name}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                <button onClick={() => {
                  const allEvents = [];
                  surgeons.forEach(s => { allEvents.push(...buildICSEvents(schedule, s.id, s.name, { withCode: true, nameOf })); });
                  allEvents.push(...buildAppICSEvents(appShifts, aMap));
                  const ics = generateICS(allEvents, "Full Call Schedule");
                  downloadICS(ics, "call-schedule-full.ics");
                }} style={{...css.btn(true),padding:"6px 16px"}}>
                  ⬇ Full Schedule (All Surgeons + APPs)
                </button>
              </div>
            </div>
          )}

                      <select value={draft.dayCall} onChange={e=>updateDraft(d=>({...d,dayCall:e.target.value}))} style={{...css.inp,padding:"6px 8px"}}>{surgeonOpts}</select>
                      {["mon","tue","wed","thu"].map(nk => (

                      <label style={{fontSize:12,color:dk?"#b0b8c0":"#4a5868"}}>{slotLabel(mondayStr, "wknd")}</label>
                      <select value={draft.nights.wknd||""} onChange={e=>updateDraft(d=>({...d,nights:{...d.nights,wknd:e.target.value}}))} style={{...css.inp,padding:"6px 8px"}}>{surgeonOpts}</select>

                  {/* Single-day service coverage */}
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,fontWeight:700,color:dk?"#b0b8c0":"#5a6a78",marginBottom:2,textTransform:"uppercase",letterSpacing:0.5}}>Service Day Coverage</div>
                    <div style={{fontSize:11,color:"#8a94a0",marginBottom:6,lineHeight:1.4}}>Optional — if someone covered a single service day, set it here. Leave each day as the service surgeon otherwise. Adjusts shift counts &amp; billing for that day only.</div>
                    <div style={{display:"grid",gridTemplateColumns:"150px 1fr",gap:6,alignItems:"center"}}>
                      {["Mon","Tue","Wed","Thu","Fri","Sat"].map((dn,i)=>{
                        const ds = fmt(addD(parse(mondayStr), i));
                        const mdp = ds.split("-");
                        const lbl = `${dn} ${parseInt(mdp[1])}/${parseInt(mdp[2])}`;
                        const isOv = draft.dayCallOverrides && draft.dayCallOverrides[ds] && draft.dayCallOverrides[ds] !== draft.dayCall;
                        const val = (draft.dayCallOverrides && draft.dayCallOverrides[ds]) || draft.dayCall || "";
                        return (
                          <React.Fragment key={ds}>
                            <label style={{fontSize:12,color:dk?"#b0b8c0":"#4a5868"}}>{lbl}{isOv && <span style={{color:"#c08030",marginLeft:4}}>●</span>}</label>

        {/* ════════════════ STATS ════════════════ */}
        {view==="stats" && !isPublicMode && <>
          {/* Segmented switcher — show one table at a time instead of stacking all */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            {[["counts","Counts"],["fairness","Fairness"],["monthly","Monthly"],["billing","Billing"],["app","APP"]].map(([k,lbl])=>(
              <button key={k} onClick={()=>setStatsTab(k)} style={{background: statsTab===k ? "linear-gradient(135deg,#1a6fa8,#2488c8)" : (dk?"#1e2a36":"#f4f6f8"), color: statsTab===k ? "#fff" : "#5a6a78", border: `1px solid ${statsTab===k ? "#1a6fa8" : (dk?"#2a3a48":"#d0d8e0")}`, borderRadius: 7, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: font}}>{lbl}</button>
            ))}
          </div>
          {statsTab==="counts" && (<>
          {/* Export — scheduler only */}
          {isScheduler && (
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>

                ⬇ Export Yearly Summary (CSV)
              </button>
            </div>
          )}
          {/* Scope (This Period / Year to Date) + backup toggles */}
          <div style={{display:"flex",justifyContent:"flex-end",gap:6,marginBottom:8,flexWrap:"wrap"}}>
            <button onClick={()=>setStatsScope("period")}
              style={{background:statsScope==="period"?"#eaf4fb":"#f4f6f8",border:`1px solid ${statsScope==="period"?"#a8cce8":"#d0d8e0"}`,color:statsScope==="period"?"#1a6fa8":"#5a6a78",borderRadius:6,padding:"4px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>
              This Period
            </button>
            <button onClick={()=>setStatsScope("ytd")}
              style={{background:statsScope==="ytd"?"#eaf4fb":"#f4f6f8",border:`1px solid ${statsScope==="ytd"?"#a8cce8":"#d0d8e0"}`,color:statsScope==="ytd"?"#1a6fa8":"#5a6a78",borderRadius:6,padding:"4px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>
              Year to Date
            </button>
            <button onClick={()=>setShowBackupStats(p=>!p)}
              style={{background:showBackupStats?"#fef8e8":"#f4f6f8",border:`1px solid ${showBackupStats?"#d8c880":"#d0d8e0"}`,color:showBackupStats?"#8a6a10":"#5a6a78",borderRadius:6,padding:"4px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>
              {showBackupStats ? "Hide 2nd Call" : "Show 2nd Call"}
            </button>
          </div>
          {/* Surgeon stats — This Period or Year to Date (statsScope) */}
          <div style={css.card}>
            <div style={css.cardT}>{statsScope==="ytd" ? <>Current Period — {ytdRange.start} → {ytdRange.end}</> : <>This Period — {MO[startMonth]} to {MO[endMoIdx]} {startYear}</>}</div>
            {!Object.values(statsScope==="ytd"?statsYTD:stats).some(s=>s.dc>0||s.nights>0) ? (
              <p style={{color:"#7a8a98",fontSize:13}}>Generate a schedule first.</p>
            ) : (
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead>
                    <tr style={{borderBottom:"2px solid #d0d8e0"}}>
                      <th style={thS}>Surgeon</th>
                      <th style={thS}><span style={{color:"#1a8040"}}>Total</span></th>
                      <th style={thS} colSpan={4}><span style={{color:"#1a6fa8"}}>{showBackupStats ? "1st Call" : "Regular"}</span></th>
                      {showBackupStats && <th style={{...thS,borderLeft:"2px solid #d8c880"}} colSpan={4}><span style={{color:"#8a6a10"}}>2nd Call</span></th>}
                    </tr>
                    <tr style={{borderBottom:"1px solid #e0e4ea"}}>
                      <th style={thS2}></th>
                      <th style={thS2}><span style={{color:"#1a8040"}}>Shifts</span></th>
                      <th style={thS2}>Svc Wk</th><th style={thS2}>Nights</th><th style={thS2}>Wknds</th><th style={thS2}>Off</th>
                      {showBackupStats && <><th style={{...thS2,borderLeft:"2px solid #d8c880"}}>Svc Wk</th><th style={thS2}>Nights</th><th style={thS2}>Wknds</th><th style={thS2}>Off</th></>}
                    </tr>
                  </thead>
                  <tbody>
                    {surgeons.filter(s => isScheduler || !mySurgeon || mySurgeon === "admin" || s.id === mySurgeon).map(s=>{
                      const st=(statsScope==="ytd"?statsYTD:stats)[s.id]||{};
                      const total = calcRawCount(st);
                      return (
                        <tr key={s.id} style={{borderBottom:"1px solid #e8ecf0"}}>
                          <td style={{padding:"7px 8px"}}><Badge id={s.id}/></td>
                          <td style={{...tdS,color:"#1a8040",fontWeight:700,fontSize:15}}>{total}</td>
                          {[st.dc,st.nights,st.wknd,st.off].map((v,i)=>
                            <td key={i} style={tdS}>{v||0}</td>
                          )}
                          {showBackupStats && [st.dcB,st.nightsB,st.wkndB,st.offB].map((v,i)=>
                            <td key={"b"+i} style={{...tdS,...(i===0?{borderLeft:"2px solid #d8c880"}:{})}}>{v||0}</td>
                          )}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div style={{marginTop:8,fontSize:11,color:"#7a8a98",lineHeight:1.5}}>
                  <strong style={{color:"#2c5a80"}}>Total</strong> = every assignment counts once — service weeks + week nights + weekends, 1st + 2nd call. The REGULAR columns show 1st call only.
                </div>
              </div>
            )}
          </div>
          </>)}

          {/* Monthly Call Summary */}
          {statsTab==="monthly" && Object.keys(schedule).length > 0 && (()=>{
            // Compute monthly breakdown
            // Formula: Service Week = 6, Week Night = 1, Weekend = 2
            // Whole-shift shifts (Svc Wk, Weekend) are attributed to the month the shift STARTS in
            const monthlyData = {};
            const allMonths = new Set();
            Object.entries(schedule).forEach(([mStr, wk]) => {
              const mon = parse(mStr);
              // Register every month touched by this week so all surgeons show columns
              for (let i = 0; i < 7; i++) {
                const d = addD(mon, i);
                const moKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                allMonths.add(moKey);
                if (!monthlyData[moKey]) monthlyData[moKey] = {};
                surgeons.forEach(s => { if (!monthlyData[moKey][s.id]) monthlyData[moKey][s.id] = { total1st: 0, total2nd: 0 }; });
              }
              const isB = wk.isBackup;
              const countKey = isB ? "total2nd" : "total1st";

              // Service Week = 6 points, attributed to the month containing Monday
              if (wk.dayCall) {
                const monMoKey = `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,"0")}`;
                if (monthlyData[monMoKey]?.[wk.dayCall]) monthlyData[monMoKey][wk.dayCall][countKey] += 6;
              }

              // Week Nights (Mon-Thu) = 1 point each, attributed to the night's own month
              NIGHT_KEYS.forEach((sk, i) => {
                const sid = wk.nights?.[sk];
                if (!sid) return;
                const d = addD(mon, i);
                const moKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                if (monthlyData[moKey]?.[sid]) monthlyData[moKey][sid][countKey] += 1;
              });

              // Weekend (Fri night + Sun 24h) = 2 points, attributed to the month containing Friday
              const wkndSid = wk.nights?.wknd;
              if (wkndSid) {
                const fri = addD(mon, 4);
                const friMo = `${fri.getFullYear()}-${String(fri.getMonth()+1).padStart(2,"0")}`;
                if (monthlyData[friMo]?.[wkndSid]) monthlyData[friMo][wkndSid][countKey] += 2;
              }
            });

            const sortedMonths = [...allMonths].sort();
            const moLabels = sortedMonths.map(m => { const [y,mo] = m.split("-"); return MO[parseInt(mo)-1].slice(0,3) + " " + y.slice(2); });

            return (
              <div style={css.card}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div style={css.cardT}>📊 Monthly Call Summary</div>
                  <button onClick={()=>{

                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead>
                      <tr style={{borderBottom:"2px solid #d8c880"}}>
                        <th style={{...thS2,position:"sticky",left:0,background:dk?"#16213e":"#fff",zIndex:1}}>Surgeon</th>
                        {moLabels.map(m=><th key={m} style={{...thS2,textAlign:"center",minWidth:40}}>{m}</th>)}
                        <th style={{...thS2,textAlign:"center",fontWeight:700,color:"#8a6a10"}}>Total</th>
                      </tr>

                        const total = vals.reduce((a,b)=>a+b,0);

                            {vals.map((v,i)=><td key={i} style={{...tdS,textAlign:"center",fontSize:12,padding:"4px 3px",color:v===0?"#c0c8d0":undefined}}>{v||"–"}</td>)}
                            <td style={{...tdS,textAlign:"center",fontSize:13,fontWeight:700,color:"#8a6a10"}}>{total}</td>

          {/* Billing Summary — month-by-month. Scheduler/admin see all surgeons;
              each surgeon sees only their own row (tied to authenticated identity). */}
          {statsTab==="billing" && Object.keys(schedule).length > 0 && (()=>{
            const canSeeAllBilling = isScheduler || userProfile?.role === "admin";
            const ownBillId = userProfile?.person_id;
            // Non-privileged users are restricted to their own row by authenticated
            // identity (NOT the Mine selector, which is mutable and could leak).
            const billVisible = canSeeAllBilling ? surgeons : surgeons.filter(s => s.id === ownBillId);
            // Compute monthly billing breakdown. 1st-call only (backup weeks excluded).
            // Attribution (the credits come from weekBillingCredits in helpers.js):
            //   Service Week (dayCall) → each of the 7 days (M-Sun) attributed to its own month
            //   Week Nights (Mon-Thu)  → each night's own month
            //   Weekend (Fri+Sat+Sun)  → each of the 3 days attributed to its own month
            //   Holiday 24h            → 2 days to the covering surgeon on the holiday's date;
            //                            that date's regular credits drop
            // Every counter is in BILLING DAYS, so the total is dc + nights + wknd + hol.
            const monthly = {}; // { "2026-05": { s1: { dc: n, nights: n, wknd: n, hol: n }, ... } }
            const allMonths = new Set();
            Object.entries(schedule).forEach(([mStr, wk]) => {
              const mon = parse(mStr);
              for (let i = 0; i < 7; i++) {
                const d = addD(mon, i);
                const moKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                allMonths.add(moKey);
                if (!monthly[moKey]) monthly[moKey] = {};
                surgeons.forEach(s => { if (!monthly[moKey][s.id]) monthly[moKey][s.id] = { dc:0, nights:0, wknd:0, hol:0 }; });
              }
              // Backup weeks are 2nd-call and not billed: the helper returns no credits for them.
              // Each credit lands in its own date's calendar month.
              weekBillingCredits(mStr, wk).forEach(c => {
                const d = parse(c.ds);
                const moKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                if (monthly[moKey]?.[c.sid]) monthly[moKey][c.sid][c.kind] += c.n;
              });
            });
            const sortedMonths = [...allMonths].sort();
            const moLabel = (mk) => { const [y,mo] = mk.split("-"); return `${MO[parseInt(mo)-1]} ${y}`; };
            const billingDays = (r) => (r.dc||0) + (r.nights||0) + (r.wknd||0) + (r.hol||0);
            return (
            <div style={css.card}>
              <div style={css.cardT}>💰 Billing Summary <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— Monthly, 1st Call Only</span></div>
              <p style={{fontSize:11,color:"#7a8a98",margin:"0 0 14px",lineHeight:1.5}}>
                Breakdown by calendar month. Backup weeks are excluded — only 1st-call shifts count toward billing. Each call day is counted in the month it actually falls in (a service week or weekend spanning a month boundary is split across both months). A covered holiday bills 2 days (the day and the night) to the surgeon who covers it, and that date's regular credits don't count.
              </p>
              {sortedMonths.map(mk => {
                const monthData = monthly[mk] || {};
                const hasAny = billVisible.some(s => {
                  return billingDays(monthData[s.id] || {}) > 0;

                if (!hasAny) return null;
                return (
                  <div key={mk} style={{marginBottom:16}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#1a6fa8",marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>{moLabel(mk)}</div>
                    <div style={{overflowX:"auto"}}>

                            <th style={{...thS2,color:"#1a8040"}}>Total Days</th>
                            <th style={thS2}>Svc Days</th>
                            <th style={thS2}>Nights</th>
                            <th style={thS2}>Wknd Days</th>
                            <th style={thS2}>Holiday</th>

                        </thead>
                        <tbody>
                          {billVisible.map(s => {
                            const r = monthData[s.id] || {dc:0,nights:0,wknd:0,hol:0};

                            return (
                              <tr key={s.id} style={{borderBottom:"1px solid #e8ecf0",opacity:empty?0.45:1}}>
                                <td style={{padding:"5px 6px"}}><Badge id={s.id} small/></td>
                                <td style={{...tdS,color:empty?"#a0a8b0":"#1a8040",fontWeight:700,fontSize:14}}>{days||"–"}</td>
                                <td style={tdS}>{r.dc||"–"}</td>
                                <td style={tdS}>{r.nights||"–"}</td>
                                <td style={tdS}>{r.wknd||"–"}</td>
                                <td style={tdS}>{r.hol||"–"}</td>
                              </tr>
                            );

                      </table>
                    </div>

              <div style={{fontSize:11,color:"#7a8a98",lineHeight:1.5,marginTop:6}}>
                <strong style={{color:"#2c5a80"}}>Formula:</strong> Svc Days + Nights + Wknd Days + Holiday Days = Total Call Days. Each day counted in the month it falls in. Billed monthly.
              </div>

          {/* APP stats */}
          {statsTab==="app" && (
          <div style={css.card}>

                  <tbody>

                        <td style={{padding:"7px 8px"}}><AppBadge id={a.id}/></td>
                        <td style={tdS}>{appStats[a.id]||0}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          )}

          {statsTab==="fairness" && (<>
          {/* Vacation Days — scoped to the current 14-week schedule period */}
          <div style={css.card}>
            <div style={css.cardT}>
              Vacation Days Used
              {statsScope==="ytd" ? (
                <span style={{fontWeight:400,fontSize:11,color:"#7a8a98",textTransform:"none",letterSpacing:0}}>
                  {" — Current Period ("}{vacDaysYTD.start} → {vacDaysYTD.end}{") · days actually taken off — worked-vacation days excluded"}
                </span>
              ) : vacDaysPeriod.hasPeriod && (
                <span style={{fontWeight:400,fontSize:11,color:"#7a8a98",textTransform:"none",letterSpacing:0}}>

                </span>
              )}
              <span style={{marginLeft:8,display:"inline-flex",gap:5,verticalAlign:"middle"}}>
                <button onClick={()=>setStatsScope("period")} style={{background:statsScope==="period"?"#eaf4fb":"#f4f6f8",border:`1px solid ${statsScope==="period"?"#a8cce8":"#d0d8e0"}`,color:statsScope==="period"?"#1a6fa8":"#5a6a78",borderRadius:5,padding:"1px 8px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font,textTransform:"none",letterSpacing:0}}>Period</button>
                <button onClick={()=>setStatsScope("ytd")} style={{background:statsScope==="ytd"?"#eaf4fb":"#f4f6f8",border:`1px solid ${statsScope==="ytd"?"#a8cce8":"#d0d8e0"}`,color:statsScope==="ytd"?"#1a6fa8":"#5a6a78",borderRadius:5,padding:"1px 8px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font,textTransform:"none",letterSpacing:0}}>YTD</button>
              </span>
            </div>
            {!Object.values((statsScope==="ytd"?vacDaysYTD:vacDaysPeriod).out).some(v=>v.days>0) ? (
              <p style={{color:"#7a8a98",fontSize:13}}>{statsScope==="ytd" ? "No vacation days in this year's scheduled span." : "No vacation days fall within this schedule period."}</p>
            ) : (
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead>

                  <tbody>
                    {surgeons.filter(s => isScheduler || !mySurgeon || mySurgeon === "admin" || s.id === mySurgeon).map(s=>{
                      const vSrc = (statsScope==="ytd"?vacDaysYTD:vacDaysPeriod).out;
                      const days = vSrc[s.id]?.days || 0;
                      const ranges = vSrc[s.id]?.ranges || [];
                      const workedD = vSrc[s.id]?.worked || 0;
                      return (
                        <tr key={s.id} style={{borderBottom:"1px solid #e8ecf0"}}>
                          <td style={{padding:"7px 8px"}}><Badge id={s.id}/></td>
                          <td style={{...tdS,fontWeight:700,color:days>0?"#60c0a0":"#3e4e5e",fontSize:15}}>{days}</td>
                          <td style={{padding:"7px 8px",fontSize:11,color:"#5a6a78",fontFamily:mono}}>
                            {ranges.map(([vs,ve],i)=>(
                              <span key={i}>{i>0?" · ":""}{vs} → {ve}</span>

                            {ranges.length===0 && <span style={{color:"#8a94a0"}}>—</span>}
                            {workedD>0 && <span style={{color:"#8a94a0"}}>{" · "}{workedD}d worked (excluded)</span>}

                      );
                    })}
                    {(isScheduler || mySurgeon === "admin" || apps.some(a => a.id === mySurgeon)) && apps.filter(a => isScheduler || mySurgeon === "admin" || a.id === mySurgeon).map(a=>{
                      const vSrcA = (statsScope==="ytd"?vacDaysYTD:vacDaysPeriod).out;
                      const days = vSrcA[a.id]?.days || 0;
                      const ranges = vSrcA[a.id]?.ranges || [];
                      const workedDA = vSrcA[a.id]?.worked || 0;
                      if (!days && !ranges.length) return null;
                      return (
                        <tr key={a.id} style={{borderBottom:"1px solid #e8ecf0"}}>
                          <td style={{padding:"7px 8px"}}><AppBadge id={a.id}/></td>
                          <td style={{...tdS,fontWeight:700,color:days>0?"#60c0a0":"#3e4e5e",fontSize:15}}>{days}</td>
                          <td style={{padding:"7px 8px",fontSize:11,color:"#5a6a78",fontFamily:mono}}>
                            {ranges.map(([vs,ve],i)=>(
                              <span key={i}>{i>0?" · ":""}{vs} → {ve}</span>

                            {workedDA>0 && <span style={{color:"#8a94a0"}}>{" · "}{workedDA}d worked (excluded)</span>}

                </table>
              </div>

          </div>

          {/* Fairness — based on 1-YEAR totals (scheduler/admin only) */}
          {(isScheduler || mySurgeon === "admin") && Object.values(stats).some(s=>s.dc>0) && (
            <div style={css.card}>

              {(()=>{

                const totalArr = surgeons.map(s=>calcShifts(cum1yr[s.id]||{}));
                const tSp = sp(totalArr);
                const tOk = tSp <= 7;
                return <>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"8px 12px",background:tOk?"#e8f8e8":"#fef8e8",border:`1px solid ${tOk?"#b0d8b0":"#302810"}`,borderRadius:7}}>
                    <span style={{fontSize:16}}>{tOk?"✅":"⚠️"}</span>
                    <span style={{fontSize:13,fontWeight:700,color:tOk?"#60e0a0":"#e0a060"}}>
                      Total Call Days (1yr): spread {tSp} (min {Math.min(...totalArr)}, max {Math.max(...totalArr)}) — {tOk?"Fair":"Review recommended"}
                    </span>
                  </div>
                  {[
                    ["Service Wk (reg)", v(s=>s.dc||0)],
                    ["Nights (reg)", v(s=>s.nights||0)],
                    ["Weekends (reg)", v(s=>s.wknd||0)],
                    ["Service Wk (backup)", v(s=>s.dcB||0)],

                          {label}: spread {s} (min {Math.min(...arr)}, max {Math.max(...arr)}) — {ok?"Fair":"Review"}
                        </span>
                      </div>
                    );
                  })}
                </>;
              })()}
            </div>
          )}

          {/* Running Totals — 1yr, 2yr, multi-year */}
          {Object.values(stats).some(s=>s.dc>0) && (
            <div style={css.card}>
              <div style={css.cardT}>Running Totals <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— Prior + This Period</span></div>

              {[
                {label:"1-Year", color:"#1a6fa8", data:cum1yr},
                {label:"Multi-Year", color:"#7030a8", data:cumStats},
              ].map(tier=>(
                <div key={tier.label} style={{marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:700,color:tier.color,marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>{tier.label}</div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead>
                        <tr style={{borderBottom:"1px solid #d0d8e0"}}>
                          <th style={thS2}>Surgeon</th>
                          <th style={{...thS2,color:tier.color}}>Total</th>
                          <th style={thS2}>Svc Wk</th><th style={thS2}>Nights</th><th style={thS2}>Wknds</th><th style={thS2}>Off</th>
                          {showBackupStats && <><th style={{...thS2,borderLeft:"1px solid #d8c880"}}>B-SW</th><th style={thS2}>B-Ngt</th><th style={thS2}>B-Wknd</th><th style={thS2}>B-Off</th></>}
                        </tr>
                      </thead>
                      <tbody>
                        {surgeons.filter(s => isScheduler || !mySurgeon || mySurgeon === "admin" || s.id === mySurgeon).map(s=>{
                          const c=tier.data[s.id]||{};
                          const total = calcTotal(c);
                          return (
                            <tr key={s.id} style={{borderBottom:"1px solid #e8ecf0"}}>
                              <td style={{padding:"5px 6px"}}><Badge id={s.id} small/></td>
                              <td style={{...tdS,color:tier.color,fontWeight:700,fontSize:14}}>{total}</td>
                              {[c.dc,c.nights,c.wknd,c.off].map((v,i)=>
                                <td key={i} style={{...tdS,fontWeight:600}}>{v||0}</td>
                              )}
                              {showBackupStats && [c.dcB,c.nightsB,c.wkndB,c.offB].map((v,i)=>
                                <td key={"b"+i} style={{...tdS,fontWeight:600,...(i===0?{borderLeft:"1px solid #d8c880"}:{})}}>{v||0}</td>
                              )}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              ))}

              <div style={{fontSize:11,color:"#7a8a98",lineHeight:1.5}}>
                <strong style={{color:"#2c5a80"}}>Total</strong> = 1st Call + 2nd Call. Service Week = 6, Week Night = 1, Weekend = 2.
              </div>
            </div>
          )}
          </>)}
        </>}

        {/* ════════════════ MY SCHEDULE ════════════════ */}
        {view==="myschedule" && !isPublicMode && <>
          <div style={css.card}>
            <div style={css.cardT}>My Call Schedule</div>
            <p style={{fontSize:13,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
              {userProfile ? `Showing schedule for ${userProfile.display_name}.` : "Select your name to see only your shifts and vacations."}
              {isScheduler && " As scheduler, you can view any surgeon's schedule."}
            </p>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:16}}>
              <select value={mySurgeon} onChange={e=>setMySurgeon(e.target.value)} style={{...css.inp,width:180,fontSize:14}}>
                <option value="">Select your name…</option>
                {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              {mySurgeon && (
                <button onClick={()=>downloadMyCal(mySurgeon)} style={{...css.btn(true),padding:"8px 18px"}}>
                  📅 Download My Calendar (.ics)
                </button>
              )}
            </div>
          </div>

          {mySurgeon && Object.keys(schedule).length > 0 && (() => {
            const myId = mySurgeon;
            const myName = sMap[myId]?.name || "?";
            const myVacs = vacations[myId] || [];
            const myNoCall = noCallDays[myId] || [];
            // Mine view hides completed vacations (end before today) and shows the
            // rest in chronological order. Each row keeps its ORIGINAL array index
            // so Edit/Remove still target the right entry after sort/filter.
            const myToday = fmt(new Date());
            const myVacsView = myVacs
              .map((r, origIdx) => ({ vs: r[0], ve: r[1], origIdx }))
              .filter(x => x.ve >= myToday)
              .sort((a, b) => a.vs < b.vs ? -1 : a.vs > b.vs ? 1 : 0);
            // No-call days get the same treatment (read-only, so no index needed).
            const myNoCallView = myNoCall
              .map(r => ({ ns: r[0], ne: r[1] }))
              .filter(x => x.ne >= myToday)
              .sort((a, b) => a.ns < b.ns ? -1 : a.ns > b.ns ? 1 : 0);
            // Only the owner (or a scheduler) may adjust this person's time off.
            const canEditTimeOff = (userProfile && myId === userProfile.person_id) || isScheduler;
            const saveMyVacEdit = () => {
              if (!myVacEdit) return;
              const { idx, start, end } = myVacEdit;
              if (!start || !end || start > end) { alert("Please enter a valid date range (start on or before end)."); return; }
              const old = myVacs[idx];
