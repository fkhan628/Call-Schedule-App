              // BOUNDED SELF-SERVE (owner ruling 2026-09-06): members may edit
              // their own entry only while it is ongoing or upcoming (original
              // end >= today) — trimming an ONGOING vacation, even to an end
              // date in the past ("came home early"), stays allowed because
              // the gate is on the ORIGINAL entry, not the new values. A fully
              // elapsed entry is history, and the #49 request gate just told
              // members past corrections go through the scheduler — this path
              // saying otherwise would contradict that in the same release.
              // Schedulers keep full past access. The Mine list already hides
              // elapsed rows, so this is the belt to that suspender.
              if (old && old[1] < fmt(new Date()) && !isScheduler) {
                showToast("This vacation has already ended — past records are corrected by the scheduler in Setup.", "error");
                setMyVacEdit(null);
                return;
              }
              if (old) toEdit(myId, "vacation", old[0], old[1], start, end);
              setMyVacEdit(null);
              try { addNotification("vacation_revoked", "Vacation Adjusted", `${myName} adjusted a vacation to ${start} → ${end}.`, { surgeon_id: myId }, [...schedulerAdminIds]); } catch(e) { console.error("Vacation-adjust notification failed:", e); }
            };
            const removeMyVac = (idx) => {
              const r = myVacs[idx];
              // Same bound as saveMyVacEdit: deleting an elapsed entry erases
              // history — member removals only while end >= today.
              if (r && r[1] < fmt(new Date()) && !isScheduler) {
                showToast("This vacation has already ended — past records are corrected by the scheduler in Setup.", "error");
                return;
              }
              if (!confirm(`Remove your vacation ${r[0]} → ${r[1]}? This gives those days back.`)) return;
              toRemove(myId, "vacation", r[0], r[1]);
              if (myVacEdit && myVacEdit.idx === idx) setMyVacEdit(null);
              try { addNotification("vacation_revoked", "Vacation Removed", `${myName} removed their vacation ${r[0]} → ${r[1]} (gave days back).`, { surgeon_id: myId }, [...schedulerAdminIds]); } catch(e) { console.error("Vacation-removal notification failed:", e); }
            };

            // Build my shifts. Who holds each date comes from weekHolders (helpers.js), the
            // calendar's rule: a covered holiday or a single-day override takes that date from
            // its regular holder. A service week or weekend that lost a day keeps its role with
            // a note; a night on a covered date is not listed; the surgeon covering a holiday or
            // a single service day gets a role with a date (it ends that day, no swap).
            const myShifts = [];
            Object.entries(schedule).forEach(([mStr, wk]) => {
              const mon = parse(mStr);
              const endStr = fmt(addD(mon, 6));
              const hw = weekHolders(mStr, wk);
              const svcOf = (d) => (d.i <= 4 ? d.svc : d.sat);
              const svcDays = hw.days.slice(0, 6);
              const roles = [];
              if (wk.dayCall === myId) {
                // A day this surgeon still holds as its holiday coverer was not given away: no note
                const notes = svcDays.filter(d => svcOf(d) !== myId && !(d.cover && d.cover.sid === myId)).map(d => coverNote(d, d.cover ? d.cover.sid : svcOf(d), nameOf));
                roles.push({type: "Service Week (incl. Sat)", icon: "🏥", detail: ["M–F 7a–5p + Sat 7a–Sun 7a", ...notes].join(" · "), color: "#1a6fa8", shiftKey: "dayCall",
                  held: svcDays.filter(d => svcOf(d) === myId).map(d => d.ds)});
              }
              NIGHT_KEYS.forEach((sk, i) => {
                if (hw.days[i].night === myId) roles.push({type: SHIFT_LABELS[sk], icon: "🌙", detail: SHIFT_TIMES[sk], color: "#6030a0", shiftKey: sk});
              });
              if (wk.nights?.wknd === myId) {
                const legs = [hw.days[4], hw.days[6]];
                const mine = (d) => (d.i === 4 ? d.wkndFri : d.wkndSun) === myId;
                const notes = legs.filter(d => !mine(d) && !(d.cover && d.cover.sid === myId)).map(d => coverNote(d, d.cover ? d.cover.sid : null, nameOf));
                roles.push({type: "Weekend", icon: "🌗", detail: [SHIFT_TIMES.wknd, ...notes].join(" · "), color: "#7a6030", shiftKey: "wknd",
                  held: legs.filter(mine).map(d => d.ds)});
              }
              svcDays.forEach(d => {
                if (wk.dayCall === myId || svcOf(d) !== myId) return;
                roles.push({type: "Service Day", icon: "🏥", detail: `${dayMonthLabel(d.ds)} · ${d.i === 5 ? "7a–7a" : "7a–5p"}`, color: "#1a6fa8", shiftKey: null, date: d.ds});
              });
              hw.covers.forEach(c => {
                if (c.sid !== myId) return;
                roles.push({type: `${c.type === "swap" ? (c.label || "Coverage") : holidayTitleName(c)} 24h`, icon: holidayEmoji(c.holiday || c.label), detail: `${dayMonthLabel(c.ds)} · 7a–7a`, color: "#c06020", shiftKey: null, date: c.ds});
              });
              // "No call this week" would contradict a holiday 24h or a service day this surgeon holds
              if (wk.off === myId && !roles.some(r => r.date)) roles.push({type: "OFF", icon: "✅", detail: "No call this week", color: "#2a7a40", shiftKey: null});
              if (roles.length > 0) {
                myShifts.push({ mStr, endStr, roles, isBackup: wk.isBackup, isFierceBackup: wk.isFierceBackup });
              }
            });
            // The My Shifts list shows only shifts not yet done, and offers Find Swap only before a
            // shift starts (the helper owns both rules). The full list stays for the Next call card.
            const myShiftsView = mineUpcoming(myShifts, myToday);

            // ─── Next call at-a-glance ───
            // Flatten each upcoming role to a concrete start date (a night lands on
            // its weekday; service week + weekend run Mon→Sun, starting on the first
            // day the surgeon actually holds; a dated role is that one day), drop
            // anything fully past, sort soonest-first. OFF weeks aren't call, so
            // they're excluded.
            const _today0 = new Date(); _today0.setHours(0, 0, 0, 0);
            const _DAY = 86400000;
            const _startOff = { dayCall: 0, mon: 0, tue: 1, wed: 2, thu: 3, wknd: 4 };
            const _nice = (d) => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
            const _whenTxt = (d) => d > 1 ? `in ${d} days` : d === 1 ? "tomorrow" : d === 0 ? "today" : "in progress";
            const _whenTone = (d) => d <= 0 ? "#1a8040" : d <= 2 ? "#c0392b" : d <= 7 ? "#b9770e" : "#5a6a78";
            const _nextUp = [];
            myShifts.forEach(s => {
              const mon = parse(s.mStr);
              s.roles.forEach(r => {
                if (!r.shiftKey && !r.date) return; // OFF isn't a call shift
                if (r.date) {
                  const day = parse(r.date);
                  if (day < _today0) return;
                  _nextUp.push({ ...r, start: day, end: day, days: Math.round((day - _today0) / _DAY), span: false, isBackup: s.isBackup, isFierceBackup: s.isFierceBackup });
                  return;
                }
                const span = (r.shiftKey === "dayCall" || r.shiftKey === "wknd");
                const start = r.held && r.held.length ? parse(r.held[0]) : addD(mon, _startOff[r.shiftKey] ?? 0);
                const end = span ? addD(mon, 6) : start;
                if (end < _today0) return; // fully in the past
                const days = Math.round((start - _today0) / _DAY);
                _nextUp.push({ ...r, start, end, days, span, isBackup: s.isBackup, isFierceBackup: s.isFierceBackup });
              });
            });
            _nextUp.sort((a, b) => a.start - b.start);
            const _upNext = _nextUp.slice(0, 3);

            return (
              <>
                <div style={{fontSize:15,fontWeight:700,color:"#1a2a3a",marginBottom:12}}>
                  <Badge id={myId}/> <span style={{marginLeft:8}}>{MO[startMonth]} – {MO[endMoIdx]} {startYear}</span>
                </div>

                {/* Next call at-a-glance — pinned summary of upcoming assignments */}
                <div style={{...css.card, padding:0, overflow:"hidden", marginBottom:16, border:"1px solid "+(dk?"#2a3a48":"#dfe6ec")}}>
                  <div style={{background:dk?"linear-gradient(135deg,#16202c,#1b2735)":"linear-gradient(135deg,#f3f7fb,#e9f1f8)", padding:"9px 14px", borderBottom:"1px solid "+(dk?"#243240":"#e4ebf1"), fontSize:11, fontWeight:800, letterSpacing:0.6, color:dk?"#9fb4c8":"#3a5a78", textTransform:"uppercase"}}>
                    🗓 Next Call
                  </div>
                  {_upNext.length === 0 ? (
                    <div style={{padding:"16px 14px", fontSize:13, color:"#8a94a0"}}>No upcoming call shifts in the current schedule.</div>
                  ) : (
                    <div style={{padding:"13px 14px"}}>
                      {(() => {
                        const e = _upNext[0];
                        return (
                          <div style={{display:"flex", alignItems:"center", gap:12}}>
                            <div style={{fontSize:30, lineHeight:1}}>{e.icon}</div>
                            <div style={{flex:1, minWidth:0}}>
                              <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                                <span style={{fontSize:16, fontWeight:800, color:dk?"#dde6ef":"#1a2a3a"}}>{e.type}</span>
                                {e.isBackup && <span style={{fontSize:9, fontWeight:800, letterSpacing:0.5, padding:"2px 6px", borderRadius:4, background:"#efe3c8", color:"#8a6a10"}}>BACKUP</span>}
                                <span style={{fontSize:12, fontWeight:800, padding:"2px 9px", borderRadius:20, background:_whenTone(e.days)+"1f", color:_whenTone(e.days)}}>{_whenTxt(e.days)}</span>
                              </div>
                              <div style={{fontSize:13, color:dk?"#9aa8b6":"#4a5a68", marginTop:3}}>{e.span ? `${_nice(e.start)} – ${_nice(e.end)}` : _nice(e.start)}</div>
                              <div style={{fontSize:11, color:"#9aa4ae", marginTop:1}}>{e.detail}</div>
                            </div>
                          </div>
                        );
                      })()}
                      {_upNext.length > 1 && (
                        <div style={{marginTop:12, paddingTop:10, borderTop:"1px dashed "+(dk?"#2a3a48":"#e4ebf1"), display:"flex", flexDirection:"column", gap:9}}>
                          {_upNext.slice(1).map((e, i) => (
                            <div key={i} style={{display:"flex", alignItems:"center", gap:10}}>
                              <span style={{fontSize:16}}>{e.icon}</span>
                              <span style={{flex:1, minWidth:0, fontSize:13, fontWeight:600, color:dk?"#c8d2dc":"#3a4a58", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{e.type}{e.isBackup && <span style={{fontSize:9, fontWeight:700, color:"#8a6a10", marginLeft:6}}>· backup</span>}</span>
                              <span style={{fontSize:12, color:dk?"#9aa8b6":"#5a6a78", whiteSpace:"nowrap"}}>{e.span ? `${_nice(e.start)} – ${_nice(e.end)}` : _nice(e.start)}</span>
                              <span style={{fontSize:11, fontWeight:700, color:_whenTone(e.days), minWidth:60, textAlign:"right"}}>{_whenTxt(e.days)}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* 🚑 Silvis — FAK only: his upcoming Silvis days, soonest first */}
                {myId && silvisFakId && myId === silvisFakId && (() => {
                  const up = sfUpcoming(silvisDays, fmt(new Date()));
                  const note = sfNotice(silvisRows.length, silvisLoadError, silvisDays.fetchedAt);
                  const LIMIT = 5;
                  const shownS = showAllMySilvis ? up : up.slice(0, LIMIT);
                  return (
                  <div style={{...css.card,background:dk?"#16223a":"#f3f6fd",border:"1px solid "+(dk?"#2a3a58":"#c8d4ec")}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#1a4a9a",marginBottom:6}}>🚑 Silvis <span style={{fontWeight:400,color:"#7a8aa8"}}>({up.length} upcoming)</span></div>
                    {silvisRows.length === 0 ? (
                      <div style={{fontSize:12,color:"#c04040"}}>{note ? note.text : "No Silvis days cached."} Check Calendar → 🔧 Schedule Tools & Export.</div>
                    ) : (<>
                      {note && <div style={{fontSize:11,color:note.kind==="stale"?"#a06020":"#c04040",marginBottom:4}}>{note.text}</div>}
                      {up.length === 0 && <div style={{fontSize:12,color:"#8a94a0"}}>No upcoming Silvis days.</div>}
                      {shownS.map(it => (
                        <div key={it.day} style={{fontSize:12,padding:"3px 0",color:it.role==="P"?(dk?"#c8d8f0":"#1a2a4a"):"#7a8a98",fontWeight:it.role==="P"?600:400}}>{sfRowLabel(it)}</div>
                      ))}
                      {up.length > LIMIT && (
                        <button onClick={()=>setShowAllMySilvis(v=>!v)} style={{marginTop:4,background:"none",border:"none",color:"#1a6fa8",fontSize:11,cursor:"pointer",padding:"6px 0",fontFamily:font}}>
                          {showAllMySilvis ? "Show fewer" : `Show all ${up.length}`}
                        </button>
                      )}
                    </>)}
                  </div>
                  );
                })()}

                {/* 📊 My call totals — DSG + Silvis (2026-10-11). ONLY the signed-in account whose
                    roster code is silvisRule.code, on its own Mine page — never the Mine selector
                    alone (any viewer can pick a name there; Billing's rule). Published weeks only
                    (schedule, never the generator preview); the full Silvis cache, not the rule's window. */}
                {!isPublicMode && !!userProfile?.person_id && !!silvisFakId && userProfile.person_id === silvisFakId && myId === silvisFakId && (
                  <CallTotalsCard
                    totals={typeof callTotalsFor === "function" ? callTotalsFor({ weeks: schedule, roster: surgeons, silvisRows, code: silvisRule.code, today: fmt(new Date()) }) : null}
                    silvisNote={sfNotice(silvisRows.length, silvisLoadError, silvisDays.fetchedAt)}
                    css={css} dk={dk} />
                )}

                {/* My Vacations — completed (past) ones hidden; shown in date order */}
                {myVacsView.length > 0 && (() => {
                  const VAC_LIMIT = 5;
                  const shown = showAllMyVacs ? myVacsView : myVacsView.slice(0, VAC_LIMIT);
                  return (
                  <div style={{...css.card,background:"#fef8f0",border:"1px solid #e8d8c0"}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#8a6a10",marginBottom:6}}>🏖 My Vacations <span style={{fontWeight:400,color:"#b09860"}}>({myVacsView.length})</span></div>
                    {shown.map(({vs,ve,origIdx},i) => {
                      const editing = myVacEdit && myVacEdit.idx === origIdx;
                      return (
                        <div key={origIdx} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",padding:"4px 0",borderBottom:i<shown.length-1?"1px solid #f0e4d0":"none"}}>
                          {editing ? (
                            <>
                              <input type="date" value={myVacEdit.start} max={myVacEdit.end} onChange={e=>setMyVacEdit(p=>({...p,start:e.target.value}))} style={{...css.inp,padding:"3px 6px",fontSize:12,width:148}}/>
                              <span style={{color:"#8a94a0"}}>→</span>
                              <input type="date" value={myVacEdit.end} min={myVacEdit.start} onChange={e=>setMyVacEdit(p=>({...p,end:e.target.value}))} style={{...css.inp,padding:"3px 6px",fontSize:12,width:148}}/>
                              <button onClick={saveMyVacEdit} style={{background:"#2a7a40",color:"#fff",border:"none",borderRadius:5,padding:"3px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>Save</button>
                              <button onClick={()=>setMyVacEdit(null)} style={{background:"#f0f0f0",color:"#5a6a78",border:"1px solid #d0d8e0",borderRadius:5,padding:"3px 10px",fontSize:11,cursor:"pointer",fontFamily:font}}>Cancel</button>
                            </>
                          ) : (
                            <>
                              <span style={{fontSize:13,color:"#5a5030",fontFamily:mono,flex:1,minWidth:140}}>{vs} → {ve}</span>
                              {canEditTimeOff && <>
                                <button onClick={()=>setMyVacEdit({idx:origIdx,start:vs,end:ve})} style={{background:"#e8f0fc",border:"1px solid #a8c8e0",color:"#1a6fa8",borderRadius:5,padding:"2px 10px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font}}>✏️ Edit</button>
                                <button onClick={()=>removeMyVac(origIdx)} style={{background:"#fdecec",border:"1px solid #e8a0a0",color:"#a82828",borderRadius:5,padding:"2px 10px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font}}>Remove</button>
                              </>}
                            </>
                          )}
                        </div>
                      );
                    })}
                    {myVacsView.length > VAC_LIMIT && (
                      <button onClick={()=>setShowAllMyVacs(v=>!v)} style={{background:"none",border:"none",color:"#1a6fa8",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font,padding:"6px 0 0",textDecoration:"underline"}}>
                        {showAllMyVacs ? "Show less" : `Show all ${myVacsView.length} →`}
                      </button>
                    )}
                    {canEditTimeOff && <div style={{fontSize:10,color:"#a8946a",marginTop:8,lineHeight:1.4}}>Shorten or remove a vacation to give days back. The scheduler is notified; already-generated weeks aren't reassigned automatically. Past records are corrected by the scheduler in Setup.</div>}
                  </div>
                  );
                })()}

                {/* My No-Call Days — completed ones hidden; shown in date order */}
                {myNoCallView.length > 0 && (() => {
                  const NC_LIMIT = 5;
                  const shown = showAllMyNoCall ? myNoCallView : myNoCallView.slice(0, NC_LIMIT);
                  return (
                  <div style={{...css.card,background:"#f4f0fb",border:"1px solid #d8cdec"}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#5a3a90",marginBottom:6}}>🚫 My No-Call Days <span style={{fontWeight:400,color:"#9a82c0"}}>({myNoCallView.length})</span></div>
                    {shown.map(({ns,ne},i) => (
                      <div key={i} style={{fontSize:13,color:"#4a3a60",fontFamily:mono,marginBottom:3}}>{ns}{ns!==ne ? ` → ${ne}` : ""}</div>
                    ))}
                    {myNoCallView.length > NC_LIMIT && (
                      <button onClick={()=>setShowAllMyNoCall(v=>!v)} style={{background:"none",border:"none",color:"#6a4aa0",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font,padding:"4px 0 0",textDecoration:"underline"}}>
                        {showAllMyNoCall ? "Show less" : `Show all ${myNoCallView.length} →`}
                      </button>
                    )}
                    <div style={{fontSize:10,color:"#8a7aa8",marginTop:6,lineHeight:1.4}}>Days you're working but won't be assigned call.</div>
                  </div>
                  );
                })()}

                {/* My Shifts */}
                {myShiftsView.map(wk => (
                  <div key={wk.mStr} style={{...css.card,padding:12,marginBottom:8,border:wk.isBackup?"1px solid #e8d090":"1px solid #e0e4ea"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:4}}>
                      <span style={{fontFamily:mono,fontSize:13,color:wk.isBackup?"#8a6a10":"#1a6fa8",fontWeight:600}}>{wk.mStr} → {wk.endStr}</span>
                      {wk.isBackup && <span style={css.backupBanner}>⚡ BACKUP</span>}
                      {wk.isFierceBackup && <span style={{fontSize:11,color:"#1a6fa8",background:"#e8f0fc",border:"1px solid #a8c8e0",borderRadius:6,padding:"2px 8px",fontWeight:600}}>🛡 Fierce Backup</span>}
                    </div>
                    {wk.roles.map((r,i) => (
                      <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 10px",background:"#f8f9fb",borderRadius:5,border:"1px solid #e8ecf0",marginBottom:3}}>
                        <span style={{fontSize:14}}>{r.icon}</span>
                        <span style={{fontSize:13,fontWeight:600,color:r.color}}>{r.type}</span>
                        <span style={{fontSize:11,color:"#8a94a0",fontFamily:mono}}>{r.detail}</span>
                        {r.canSwap ? (
                          <button onClick={()=>{findSwapSuggestions(wk.mStr, r.shiftKey, myId); setView("calendar");}}
                            style={{marginLeft:"auto",background:"#f0e8fc",border:"1px solid #c8b0e0",color:"#6030a0",borderRadius:5,padding:"2px 10px",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:font}}>
                            🔄 Find Swap
                          </button>
                        ) : r.shiftKey ? (
                          <span style={{marginLeft:"auto",background:"#e8f5ec",border:"1px solid #b0d8bc",color:"#1a8040",borderRadius:5,padding:"2px 8px",fontSize:10,fontWeight:600,fontFamily:font}}>in progress</span>
                        ) : null}
                      </div>
                    ))}
                  </div>
                ))}

                {myShifts.length === 0 && (
                  <div style={{...css.card,textAlign:"center",color:"#8a94a0",padding:30}}>No shifts assigned yet. Generate a schedule first.</div>
                )}
                {myShifts.length > 0 && myShiftsView.length === 0 && (
                  <div style={{...css.card,textAlign:"center",color:"#8a94a0",padding:30}}>No upcoming shifts in the current schedule.</div>
                )}
              </>
            );
          })()}

          {!mySurgeon && (
            <div style={{...css.card,textAlign:"center",color:"#8a94a0",padding:30}}>Select your name above to view your schedule.</div>
          )}
        </>}

        {/* ════════════════ REQUESTS ════════════════ */}
        {view==="requests" && !isPublicMode && <>
          {/* Vacation Request Deadline — auto-detected from latest schedule period */}
          {vacationDeadline && (() => {
            const { nextPeriodStart, nextPeriodEnd, periodWeeks, deadline, daysRemaining, isPast } = vacationDeadline;
            const deadlineDate = parse(deadline);
            const periodDate = parse(nextPeriodStart);
            const periodEndDate = nextPeriodEnd ? parse(nextPeriodEnd) : null;
            const fmtPretty = d => {
              const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
              return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
            };
            // Color/tone scaling based on urgency
            let bg, border, accent, label, icon;
            if (isPast) {
              bg = "linear-gradient(135deg,#f5f5f5,#eaeaea)";
              border = "#c0c0c0";
              accent = "#7a7a7a";
              label = `Deadline passed (${Math.abs(daysRemaining)} day${Math.abs(daysRemaining)===1?"":"s"} ago)`;
              icon = "📅";
            } else if (daysRemaining <= 7) {
              bg = "linear-gradient(135deg,#fef0f0,#fde0e0)";
              border = "#e8a0a0";
              accent = "#a82828";
              label = daysRemaining === 0
                ? "DEADLINE TODAY"
                : `${daysRemaining} day${daysRemaining===1?"":"s"} remaining`;
              icon = "⚠️";
            } else if (daysRemaining <= 21) {
              bg = "linear-gradient(135deg,#fff8e8,#fdf0d0)";
              border = "#e8c890";
              accent = "#a8702a";
              label = `${daysRemaining} days remaining`;
              icon = "⏰";
            } else {
              bg = "linear-gradient(135deg,#f0f8fd,#e0f0fa)";
              border = "#a8c8e0";
              accent = "#1a6fa8";
              label = `${daysRemaining} days remaining`;
              icon = "🗓";
            }
            return (
              <div style={{...css.card,background:bg,border:`1px solid ${border}`,marginBottom:14}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
                  <div style={{fontSize:32,lineHeight:1}}>{icon}</div>
                  <div style={{flex:1,minWidth:240}}>
                    <div style={{fontSize:11,fontWeight:700,color:accent,textTransform:"uppercase",letterSpacing:1.2,marginBottom:4}}>
                      Vacation Request Deadline
                    </div>
                    <div style={{fontSize:18,fontWeight:700,color:"#2c3e50",marginBottom:6}}>
                      {label}
                    </div>
                    <div style={{fontSize:13,color:"#5a6a78",lineHeight:1.5}}>
                      Submit requests by <strong style={{color:accent}}>{fmtPretty(deadlineDate)}</strong> for the next schedule period{periodEndDate ? <> — <strong>{fmtPretty(periodDate)}</strong> through <strong>{fmtPretty(periodEndDate)}</strong> ({periodWeeks} weeks)</> : <> beginning <strong>{fmtPretty(periodDate)}</strong></>}.
                    </div>
                    {!isPast && daysRemaining > 7 && (
                      <div style={{fontSize:11,color:"#7a8a98",marginTop:6,fontStyle:"italic"}}>
                        Requests are typically due 6 weeks before each new schedule period.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Submit Vacation Request */}
          <div style={css.card}>
            <div style={css.cardT}>🏖 Request Time Off</div>
            <p style={{fontSize:13,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
              Submit a vacation or no-call-day request. It will be reviewed at the regular Friday meeting.
            </p>
            <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:8}}>
              <div>
                <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>Type</label>
                <select value={vacReqType} onChange={e=>setVacReqType(e.target.value)} style={{...css.inp,width:135}}>
                  <option value="vacation">🏖 Vacation</option>
                  <option value="nocall">🚫 No-Call Day</option>
                </select>
              </div>
              {isScheduler ? (
                <div>
                  <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>Person</label>
                  <select value={vacReqSurgeon} onChange={e=>setVacReqSurgeon(e.target.value)} style={{...css.inp,width:140}}>
                    <option value="">Select…</option>
                    <optgroup label="Surgeons">
                      {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                    </optgroup>
                    <optgroup label="APPs">
                      {apps.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                    </optgroup>
                  </select>
                </div>
              ) : (
                <div>
                  <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>Requesting for</label>
                  <div style={{fontSize:13,fontWeight:600,color:"#1a6fa8",padding:"6px 0"}}>{[...surgeons,...apps].find(p=>p.id===mySurgeon)?.name || "—"}</div>
                </div>
              )}
              <div>
                <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>Start Date</label>
                {/* min is UI-only (a typed date bypasses it) — submitVacRequest
                    carries the real gate and its rejection message. */}
                <input type="date" min={todayStr} value={vacReqStart} onChange={e=>setVacReqStart(e.target.value)} style={{...css.inp,width:150}}/>
              </div>
              <div>
                <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>End Date</label>
                <input type="date" min={todayStr} value={vacReqEnd} onChange={e=>setVacReqEnd(e.target.value)} style={{...css.inp,width:150}}/>
              </div>
              <button onClick={submitVacRequest} style={{...css.btn(true),padding:"7px 18px"}}>Submit Request</button>
            </div>
            <div>
              <label style={{fontSize:11,color:"#7a8a98",display:"block",marginBottom:2}}>Reason (optional)</label>
              <input value={vacReqReason} onChange={e=>setVacReqReason(e.target.value)} placeholder="Conference, personal, etc."
                style={{...css.inp,width:"100%",maxWidth:400}}/>
            </div>
          </div>

          {/* Pending Requests — Grouped by Person */}
          {(()=>{
            const pending = myVacRequests.filter(r => r.status === "pending");
            const reviewed = myVacRequests.filter(r => r.status !== "pending");

            // Group pending by surgeon_id
            const pendingGroups = {};
            pending.forEach(r => {
              if (!pendingGroups[r.surgeon_id]) pendingGroups[r.surgeon_id] = [];
              pendingGroups[r.surgeon_id].push(r);
            });
            // Sort groups: surgeons first (by order), then APPs
            const allPeople = [...surgeons, ...apps];
            const groupOrder = allPeople.map(p => p.id).filter(id => pendingGroups[id]);

            // Helper to format date range compactly
            const shortRange = (s, e) => {
              const sp = s.split("-"), ep = e.split("-");
              const sm = MO[parseInt(sp[1])-1]?.slice(0,3), sd = parseInt(sp[2]);
              const em = MO[parseInt(ep[1])-1]?.slice(0,3), ed = parseInt(ep[2]);
              if (s === e) return `${sm} ${sd}`;
              if (sp[1] === ep[1]) return `${sm} ${sd}–${ed}`;
              return `${sm} ${sd} – ${em} ${ed}`;
            };

            // Group reviewed by surgeon_id
            const reviewedGroups = {};
            reviewed.forEach(r => {
              if (!reviewedGroups[r.surgeon_id]) reviewedGroups[r.surgeon_id] = [];
              reviewedGroups[r.surgeon_id].push(r);
            });
            const reviewedGroupOrder = allPeople.map(p => p.id).filter(id => reviewedGroups[id]);

            return <>
              <div style={css.card}>
                <div style={css.cardT}>⏳ Pending Requests <span style={{fontWeight:400,fontSize:12,color:"#8a94a0"}}>— {pending.length}</span></div>
                {pending.length === 0 ? (
                  <p style={{color:"#8a94a0",fontSize:13}}>No pending requests.</p>
                ) : groupOrder.map(pid => {
                  const reqs = pendingGroups[pid];
                  const expanded = expandedVacGroups["p_"+pid];
                  return <div key={pid} style={{marginBottom:6,border:"1px solid #e8d8c0",borderRadius:8,overflow:"hidden",background:"#fef8f0"}}>
                    {/* Collapsed header row */}
                    <div onClick={()=>toggleVacGroup("p_"+pid)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",cursor:"pointer",flexWrap:"wrap"}}>
                      <span style={{fontSize:10,color:"#b0a080",transition:"transform 0.15s",transform:expanded?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                      {sMap[pid] ? <Badge id={pid}/> : <AppBadge id={pid}/>}
                      <span style={{fontSize:11,color:"#c09030",fontWeight:600,background:"#fef3e0",padding:"1px 8px",borderRadius:10,border:"1px solid #e8d090"}}>{reqs.length} pending</span>
                      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginLeft:"auto"}}>
                        {reqs.map(r => <span key={r.id} style={{fontFamily:mono,fontSize:11,color:"#8a7a60",background:"#f8f0e0",padding:"1px 7px",borderRadius:4,border:"1px solid #e8dcc0"}}>{shortRange(r.start_date,r.end_date)}</span>)}
                      </div>
                    </div>
                    {/* Expanded detail rows */}
                    {expanded && <div style={{borderTop:"1px solid #e8d8c0",padding:"4px 12px 8px"}}>
                      {reqs.map(r => <div key={r.id} style={{padding:"8px 0",borderBottom:"1px solid #f0e8d8"}}>
                        {editingVacReq?.id === r.id ? (
                          <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap"}}>
                            <div>
                              <label style={{fontSize:10,color:"#7a8a98",display:"block"}}>Start</label>
                              <input type="date" min={isScheduler ? undefined : fmt(new Date())} value={editingVacReq.start_date} onChange={e=>setEditingVacReq(p=>({...p,start_date:e.target.value}))} style={{...css.inp,width:140,fontSize:12}}/>
                            </div>
                            <div>
                              <label style={{fontSize:10,color:"#7a8a98",display:"block"}}>End</label>
                              <input type="date" min={isScheduler ? undefined : fmt(new Date())} value={editingVacReq.end_date} onChange={e=>setEditingVacReq(p=>({...p,end_date:e.target.value}))} style={{...css.inp,width:140,fontSize:12}}/>
                            </div>
                            <div>
                              <label style={{fontSize:10,color:"#7a8a98",display:"block"}}>Reason</label>
                              <input value={editingVacReq.reason||""} onChange={e=>setEditingVacReq(p=>({...p,reason:e.target.value}))} style={{...css.inp,width:140,fontSize:12}}/>
                            </div>
                            <button onClick={saveVacRequestEdit} style={{...css.btn(true),padding:"5px 12px",fontSize:11}}>Save</button>
                            <button onClick={()=>setEditingVacReq(null)} style={{...css.btn(false),padding:"5px 12px",fontSize:11}}>Cancel</button>
                          </div>
                        ) : (
                          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                            <span style={{fontFamily:mono,fontSize:13,color:"#2c3e50",minWidth:130}}>{r.start_date} → {r.end_date}</span>
                            {r.request_type === "nocall"
                              ? <span style={{fontSize:10,fontWeight:700,color:"#8a6a10",background:"#fcf6e8",padding:"1px 7px",borderRadius:10,border:"1px solid #e8dcae",whiteSpace:"nowrap"}}>🚫 No-Call</span>
                              : <span style={{fontSize:10,fontWeight:700,color:"#5a8aa8",background:"#eef6fb",padding:"1px 7px",borderRadius:10,border:"1px solid #cfe2ee",whiteSpace:"nowrap"}}>🏖 Vacation</span>}
                            {r.reason && <span style={{fontSize:12,color:"#7a8a98",fontStyle:"italic"}}>"{r.reason}"</span>}
                            <span style={{fontSize:11,color:"#a0a8b0"}}>Submitted {new Date(r.submitted_at).toLocaleDateString()}</span>
                            {(r.surgeon_id !== mySurgeon || isScheduler) && (
                              <div style={{marginLeft:"auto",display:"flex",gap:6}}>
                                <button onClick={()=>approveVacRequest(r)} style={{background:"#e8f8e8",border:"1px solid #a0d8a0",color:"#1a8040",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:font}}>✓ Approve</button>
                                <button onClick={()=>{const note=prompt("Reason for denial (optional):"); if(note!==null) denyVacRequest(r,note);}} style={{background:"#fce8e8",border:"1px solid #e0b0b0",color:"#c04040",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:font}}>✕ Deny</button>
                              </div>
                            )}
                            {r.surgeon_id === mySurgeon && !isScheduler && <span style={{marginLeft:"auto",fontSize:11,color:"#c09030",fontWeight:600,background:"#fef8e8",padding:"2px 8px",borderRadius:4,border:"1px solid #e8d090"}}>Pending review</span>}
                            <button onClick={()=>setEditingVacReq({id:r.id,start_date:r.start_date,end_date:r.end_date,reason:r.reason||""})} style={{background:"none",border:"1px solid #d0d8e0",color:"#5a6a78",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>✎ Edit</button>
                            <button onClick={()=>deleteVacRequest(r.id)} style={{background:"none",border:"1px solid #e0c0c0",color:"#904040",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>Withdraw</button>
                          </div>
                        )}
                        {/* Coverage-floor check + vacation-overlap context (per-day) */}
                        {(() => {
                          const cov = vacRequestCoverage(r);
                          if (!cov || (!cov.breach && cov.conflicts.length === 0 && cov.pendingOverlaps.length === 0)) return null;
                          return <div style={{marginTop:6}}>
                            {cov.breach && (
                              <div style={{fontSize:11,fontWeight:700,color:"#a02020",background:"#fce8e8",border:"1px solid #e0a8a8",borderRadius:6,padding:"4px 9px",marginBottom:4}}>
                                ⚠ Coverage below minimum — only {cov.worst.available} of {surgeons.length} surgeons available on {cov.worst.date} if approved (floor: {MIN_AVAILABLE_SURGEONS})
                              </div>
                            )}
                            {cov.conflicts.length > 0 && (
                              <div style={{fontSize:11,color:"#8a6a10",marginBottom:2}}>
                                🏖 Also on vacation in this window:{" "}
                                {cov.conflicts.map((c,i)=>(
                                  <span key={c.id}>{i>0?" · ":""}<strong>{sMap[c.id]?.name || c.id}</strong>{" ("}{c.ranges.map(([cs,ce])=>cs===ce?cs:`${cs}→${ce}`).join(", ")}{")"}</span>
                                ))}
                              </div>
                            )}
                            {cov.pendingOverlaps.length > 0 && (
                              <div style={{fontSize:11,color:"#7a6a98"}}>
                                ⏳ Overlapping pending requests:{" "}
                                {cov.pendingOverlaps.map((o,i)=>(
                                  <span key={o.id}>{i>0?" · ":""}<strong>{sMap[o.surgeon_id]?.name || o.surgeon_id}</strong>{" ("}{o.start_date}→{o.end_date}{")"}</span>
                                ))}
                              </div>
                            )}
                          </div>;
                        })()}
                      </div>)}
                    </div>}
                  </div>;
                })}
                {pending.length > 0 && !isScheduler && (
                  <p style={{fontSize:12,color:"#8a94a0",margin:"10px 0 0",lineHeight:1.5}}>
                    Only the scheduler can approve or deny requests. Enter the scheduler PIN in ⚙️ Settings to unlock.
                  </p>
                )}
              </div>

              {reviewed.length > 0 && (
                <div style={css.card}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <div style={css.cardT}>📋 Reviewed <span style={{fontWeight:400,fontSize:12,color:"#8a94a0"}}>— {reviewed.length}</span></div>
                    {isScheduler && reviewed.length > 0 && (
                      <button onClick={clearReviewedRequests} style={{background:"none",border:"1px solid #e8c0c0",color:"#904040",borderRadius:5,padding:"3px 10px",fontSize:10,cursor:"pointer",fontFamily:font}}>Clear All Reviewed</button>
                    )}
                  </div>
                  {reviewedGroupOrder.map(pid => {
                    const reqs = reviewedGroups[pid];
                    const expanded = expandedVacGroups["r_"+pid];
                    const approvedCt = reqs.filter(r=>r.status==="approved").length;
                    const deniedCt = reqs.filter(r=>r.status==="denied").length;
                    const revokedCt = reqs.filter(r=>r.status==="revoked").length;
                    return <div key={pid} style={{marginBottom:5,border:"1px solid #d8e0d8",borderRadius:7,overflow:"hidden",background:"#f8faf8"}}>
                      <div onClick={()=>toggleVacGroup("r_"+pid)} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 12px",cursor:"pointer",flexWrap:"wrap"}}>
                        <span style={{fontSize:10,color:"#a0b0a0",transition:"transform 0.15s",transform:expanded?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                        {sMap[pid] ? <Badge id={pid}/> : <AppBadge id={pid}/>}
                        {approvedCt > 0 && <span style={{fontSize:10,fontWeight:600,color:"#1a8040"}}>✓ {approvedCt}</span>}
                        {deniedCt > 0 && <span style={{fontSize:10,fontWeight:600,color:"#c04040"}}>✕ {deniedCt}</span>}
                        {revokedCt > 0 && <span style={{fontSize:10,fontWeight:600,color:"#8a8a40"}}>↩ {revokedCt}</span>}
                        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginLeft:"auto"}}>
                          {reqs.slice(0,6).map(r => <span key={r.id} style={{fontFamily:mono,fontSize:10,color:r.status==="approved"?"#4a8a4a":r.status==="revoked"?"#8a8a40":"#a06060",background:r.status==="approved"?"#e8f4e8":r.status==="revoked"?"#f4f4e8":"#f8e8e8",padding:"1px 6px",borderRadius:4,border:`1px solid ${r.status==="approved"?"#c0e0c0":r.status==="revoked"?"#d8d8c0":"#e0c0c0"}`}}>{shortRange(r.start_date,r.end_date)}</span>)}
                          {reqs.length > 6 && <span style={{fontSize:10,color:"#a0a8b0"}}>+{reqs.length-6}</span>}
                        </div>
                      </div>
                      {expanded && <div style={{borderTop:"1px solid #d8e0d8",padding:"4px 12px 6px"}}>
                        {reqs.map(r => <div key={r.id} style={{padding:"6px 0",borderBottom:"1px solid #e8f0e8"}}>
                          {editingVacReq?.id === r.id ? (
                            <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap"}}>
                              <div>
                                <label style={{fontSize:10,color:"#7a8a98",display:"block"}}>Start</label>
                                <input type="date" value={editingVacReq.start_date} onChange={e=>setEditingVacReq(p=>({...p,start_date:e.target.value}))} style={{...css.inp,width:140,fontSize:12}}/>
                              </div>
                              <div>
                                <label style={{fontSize:10,color:"#7a8a98",display:"block"}}>End</label>
                                <input type="date" value={editingVacReq.end_date} onChange={e=>setEditingVacReq(p=>({...p,end_date:e.target.value}))} style={{...css.inp,width:140,fontSize:12}}/>
                              </div>
                              <button onClick={saveVacRequestEdit} style={{...css.btn(true),padding:"4px 10px",fontSize:11}}>Save</button>
                              <button onClick={()=>setEditingVacReq(null)} style={{...css.btn(false),padding:"4px 10px",fontSize:11}}>Cancel</button>
                            </div>
                          ) : (
                            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                              <span style={{fontSize:13,fontWeight:700,color:r.status==="approved"?"#1a8040":r.status==="revoked"?"#8a8a40":"#c04040"}}>{r.status==="approved"?"✓":r.status==="revoked"?"↩":"✕"}</span>
                              <span style={{fontFamily:mono,fontSize:12,color:"#2c3e50"}}>{r.start_date} → {r.end_date}</span>
                              {r.request_type === "nocall"
                                ? <span style={{fontSize:9,fontWeight:700,color:"#8a6a10",background:"#fcf6e8",padding:"1px 6px",borderRadius:10,border:"1px solid #e8dcae",whiteSpace:"nowrap"}}>🚫 No-Call</span>
                                : <span style={{fontSize:9,fontWeight:700,color:"#5a8aa8",background:"#eef6fb",padding:"1px 6px",borderRadius:10,border:"1px solid #cfe2ee",whiteSpace:"nowrap"}}>🏖 Vacation</span>}
                              {r.reason && <span style={{fontSize:11,color:"#8a94a0"}}>"{r.reason}"</span>}
                              {r.review_note && <span style={{fontSize:11,color:"#c04040"}}>Note: {r.review_note}</span>}
                              {r.status==="revoked" && <span style={{fontSize:10,color:"#8a8a40",fontWeight:600}}>Revoked</span>}
                              <span style={{fontSize:11,color:"#a0a8b0",marginLeft:"auto"}}>{r.reviewed_at ? new Date(r.reviewed_at).toLocaleDateString() : ""}</span>
                              {isScheduler && r.status==="approved" && (
                                <>
                                  <button onClick={()=>setEditingVacReq({id:r.id,start_date:r.start_date,end_date:r.end_date,reason:r.reason||""})} style={{background:"none",border:"1px solid #d0d8e0",color:"#5a6a78",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>✎ Edit</button>
                                  <button onClick={()=>revokeApprovedVac(r)} style={{background:"none",border:"1px solid #e0c0c0",color:"#904040",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>↩ Revoke</button>
                                </>
                              )}
                              {isScheduler && (
                                <button onClick={()=>deleteVacRequest(r.id)} style={{background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:12,padding:"0 4px"}}>✕</button>
                              )}
                            </div>
                          )}
                        </div>)}
                      </div>}
                    </div>;
                  })}
                </div>
              )}
            </>;
          })()}

          {/* ─── Shift Trade Requests ─── */}
          <div style={css.card}>
            <div style={css.cardT}>🔄 Propose a Shift Trade</div>
            <p style={{fontSize:13,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>
              Propose a two-way trade with another surgeon — you take one of their shifts in return. They'll be notified and can accept or decline.
            </p>
            <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:8}}>
              {isScheduler ? (
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>From</label>
                  <select value={tradeFrom} onChange={e=>setTradeFrom(e.target.value)} style={{...css.inp,width:100}}>
                    <option value="">Who…</option>
                    {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
              ) : (
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>From</label>
                  <div style={{fontSize:13,fontWeight:600,color:"#6030a0",padding:"6px 0"}}>{surgeons.find(s=>s.id===mySurgeon)?.name || "—"}</div>
                </div>
              )}
              <div>
                <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Trade with</label>
                <select value={tradeTo} onChange={e=>setTradeTo(e.target.value)} style={{...css.inp,width:100}}>
                  <option value="">Who…</option>
                  {surgeons.filter(s=>s.id!==tradeFrom).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              {isScheduler ? <>
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Week</label>
                  <select value={tradeWeek} onChange={e=>setTradeWeek(e.target.value)} style={{...css.inp,width:140}}>
                    <option value="">Select…</option>
                    {Object.keys(schedule).sort().filter(m => fmt(addD(parse(m), 6)) >= todayStr).map(m=><option key={m} value={m}>{m}{m <= todayStr ? " (this week)" : ""}</option>)}
                  </select>
                </div>
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Shift to give</label>
                  <select value={tradeShift} onChange={e=>setTradeShift(e.target.value)} style={{...css.inp,width:130}}>
                    <option value="">Select…</option>
                    {ALL_SHIFT_KEYS.map(sk=><option key={sk} value={sk}>{tradeWeek ? slotLabel(tradeWeek, sk) : SHIFT_LABELS[sk]}</option>)}
                  </select>
                </div>
              </> : (
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Shift to give</label>
                  {(()=>{
                    const opts = [];
                    Object.keys(schedule).sort().forEach(m => {
                      const wk = schedule[m];
                      if (!wk) return;
                      ALL_SHIFT_KEYS.forEach(sk => {
                        const holder = sk === "dayCall" ? wk.dayCall : wk.nights?.[sk];
                        if (holder === tradeFrom) {
                          // Upcoming only — same start-date rule and same
                          // partially-elapsed-service-week exclusion as the
                          // swap tool (see its comment; acceptTradeRequest
                          // also reassigns the WHOLE week's dayCall).
                          // Filter AND label both go through the helpers (one owner for the date):
                          if (shiftStartDate(m, sk) < todayStr) return;
                          const label = `${slotLabel(m, sk)}${wk.isBackup ? " (Backup)" : ""}${m <= todayStr ? " (this week)" : ""}`;
                          opts.push({ value: `${m}|${sk}`, label });
                        }
                      });
                    });
                    const curVal = tradeWeek && tradeShift ? `${tradeWeek}|${tradeShift}` : "";
                    return (
                      <select value={curVal} onChange={e=>{
                        const v = e.target.value;
                        if (!v) { setTradeWeek(""); setTradeShift(""); }
                        else { const [w, s] = v.split("|"); setTradeWeek(w); setTradeShift(s); }
                      }} style={{...css.inp,minWidth:240}}>
                        <option value="">{opts.length === 0 ? "No upcoming shifts" : "Select your shift…"}</option>
                        {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                      </select>
                    );
                  })()}
                </div>
              )}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:10}}>
              {isScheduler ? <>
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Return week</label>
                  <select value={tradeReturnWeek} onChange={e=>setTradeReturnWeek(e.target.value)} style={{...css.inp,width:140}}>
                    <option value="">Select…</option>
                    {Object.keys(schedule).sort().filter(m => fmt(addD(parse(m), 6)) >= todayStr).map(m=><option key={m} value={m}>{m}{m <= todayStr ? " (this week)" : ""}</option>)}
                  </select>
                </div>
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Return shift</label>
                  <select value={tradeReturnShift} onChange={e=>setTradeReturnShift(e.target.value)} style={{...css.inp,width:130}}>
                    <option value="">Select…</option>
                    {ALL_SHIFT_KEYS.map(sk=><option key={sk} value={sk}>{tradeReturnWeek ? slotLabel(tradeReturnWeek, sk) : SHIFT_LABELS[sk]}</option>)}
                  </select>
                </div>
              </> : (
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Return shift</label>
                  {(()=>{
                    const opts = [];
                    if (tradeTo) {
                      Object.keys(schedule).sort().forEach(m => {
                        const wk = schedule[m];
                        if (!wk) return;
                        ALL_SHIFT_KEYS.forEach(sk => {
                          const holder = sk === "dayCall" ? wk.dayCall : wk.nights?.[sk];
                          if (holder === tradeTo) {
                            // Upcoming only — same rules as "Shift to give".
                            // Filter AND label both go through the helpers (one owner for the date):
                            if (shiftStartDate(m, sk) < todayStr) return;
                            const label = `${slotLabel(m, sk)}${wk.isBackup ? " (Backup)" : ""}${m <= todayStr ? " (this week)" : ""}`;
                            opts.push({ value: `${m}|${sk}`, label });
                          }
                        });
                      });
                    }
                    const curVal = tradeReturnWeek && tradeReturnShift ? `${tradeReturnWeek}|${tradeReturnShift}` : "";
                    const placeholder = !tradeTo ? "Pick trade partner first" : (opts.length === 0 ? "They have no upcoming shifts" : "Select their shift…");
                    return (
                      <select value={curVal} onChange={e=>{
                        const v = e.target.value;
                        if (!v) { setTradeReturnWeek(""); setTradeReturnShift(""); }
                        else { const [w, s] = v.split("|"); setTradeReturnWeek(w); setTradeReturnShift(s); }
                      }} style={{...css.inp,minWidth:240}} disabled={!tradeTo}>
                        <option value="">{placeholder}</option>
                        {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                      </select>
                    );
                  })()}
                </div>
              )}
              <button onClick={submitTradeRequest} style={{...css.btn(true),padding:"7px 18px",background:"linear-gradient(135deg,#6030a0,#8050c0)",borderColor:"#6030a0"}}>Propose Trade</button>
            </div>
            {/* silvisBusy: a proposal that could never be accepted is flagged here, before it is sent */}
            {silvisActive && tradeFrom && tradeTo && tradeWeek && tradeShift && (()=>{
              const previewReq = { from_surgeon_id: tradeFrom, to_surgeon_id: tradeTo, week_monday: tradeWeek, shift_key: tradeShift, return_week: tradeReturnWeek || null, return_shift: tradeReturnShift || null };
              const hits = [];
              const r1 = silvisBlock(tradeTo, tradeWeek, tradeShift, schedule[tradeWeek]); if (r1) hits.push(r1);
              if (tradeReturnWeek && tradeReturnShift) { const r2 = silvisBlock(tradeFrom, tradeReturnWeek, tradeReturnShift, schedule[tradeReturnWeek]); if (r2) hits.push(r2); }
              if (tradeShift === "dayCall" || tradeShift === "wknd") for (const ch of detectCascadeChanges(schedule, previewReq)) { const rc = silvisBlock(ch.to, ch.week, ch.shiftKey, schedule[ch.week]); if (rc) hits.push("cascade: " + rc); }
              if (!hits.length) return null;
              return (
                <div style={{marginTop:10,padding:"10px 14px",background:"#fce8e8",border:"1px solid #e0b0b0",borderRadius:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#c04040",marginBottom:6}}>🔴 Silvis conflict — this trade {(isScheduler || userProfile?.role === "admin") ? "needs a scheduler override to be accepted" : "cannot be accepted"}:</div>
                  {hits.map((h,i) => <div key={i} style={{fontSize:11,color:"#803030",marginBottom:3,paddingLeft:8}}>• {h}</div>)}
                </div>
              );
            })()}
            {/* Cascade Preview — show downstream effects of DC/Weekend swaps */}
            {tradeFrom && tradeTo && tradeWeek && tradeShift && (tradeShift === "dayCall" || tradeShift === "wknd") && (()=>{
              const previewReq = {
                from_surgeon_id: tradeFrom, to_surgeon_id: tradeTo,
                week_monday: tradeWeek, shift_key: tradeShift,
                return_week: tradeReturnWeek || null, return_shift: tradeReturnShift || null
              };
              const cascades = detectCascadeChanges(schedule, previewReq);
              if (cascades.length === 0) return null;
              return (
                <div style={{marginTop:10,padding:"10px 14px",background:"#fef8e8",border:"1px solid #e8d090",borderRadius:8}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#8a6a10",marginBottom:6}}>⚠️ This swap will also change:</div>
                  {cascades.map((c,i) => (
                    <div key={i} style={{fontSize:11,color:"#5a4a10",marginBottom:3,paddingLeft:8}}>
                      • {c.reason}{c.requiresApproval ? " ⚠️ requires approval" : ""}
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>

          {/* Pending Trades */}
          {(()=>{
            const pendingTrades = myTradeRequests.filter(r => r.status === "pending");
            const reviewedTrades = myTradeRequests.filter(r => r.status !== "pending");
            return <>
              {pendingTrades.length > 0 && (
                <div style={css.card}>
                  <div style={css.cardT}>⏳ Pending Trades <span style={{fontWeight:400,fontSize:12,color:"#8a94a0"}}>— {pendingTrades.length}</span></div>
                  {pendingTrades.map(r => (
                    <div key={r.id} style={{padding:"10px 12px",marginBottom:6,background:"#f8f0ff",border:"1px solid #d0c0e8",borderRadius:8,flexWrap:"wrap"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                        <Badge id={r.from_surgeon_id}/>
                        <span style={{fontSize:12,color:"#6030a0",fontWeight:600}}>→</span>
                        <Badge id={r.to_surgeon_id}/>
                        <span style={{fontFamily:mono,fontSize:12,color:"#2c3e50"}}>{slotLabel(r.week_monday, r.shift_key)}</span>
                        {r.return_shift && r.return_week
                          ? <span style={{fontSize:11,color:"#8a94a0"}}>↔ {slotLabel(r.return_week, r.return_shift)}</span>
                          : <span style={{fontSize:11,color:"#a08040"}}>(one-way — no return shift)</span>}
                      </div>
                      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontSize:10,color:"#a0a8b0"}}>Proposed {new Date(r.submitted_at).toLocaleDateString()}</span>
                        {silvisActive && (()=>{
                          // silvisBusy: a pending trade that cannot be accepted says so on the row, not only after the click
                          const hits = [];
                          const h1 = silvisBlock(r.to_surgeon_id, r.week_monday, r.shift_key, schedule[r.week_monday]); if (h1) hits.push(h1);
                          if (r.return_week && r.return_shift) { const h2 = silvisBlock(r.from_surgeon_id, r.return_week, r.return_shift, schedule[r.return_week]); if (h2) hits.push(h2); }
                          for (const ch of detectCascadeChanges(schedule, r)) { const hc = silvisBlock(ch.to, ch.week, ch.shiftKey, schedule[ch.week]); if (hc) hits.push("cascade: " + hc); }
                          if (!hits.length) return null;
                          return <span title={hits.join("\n")} style={{fontSize:10,fontWeight:700,color:"#c04040",background:"#fce8e8",border:"1px solid #e0b0b0",borderRadius:5,padding:"1px 6px"}}>🔴 Silvis conflict — {(isScheduler || userProfile?.role === "admin") ? "scheduler override only" : "cannot be accepted"}</span>;
                        })()}
                        {(mySurgeon === r.to_surgeon_id || isScheduler) && (
                          <>
                            <button onClick={()=>acceptTradeRequest(r)} style={{background:"#e8f8e8",border:"1px solid #a0d8a0",color:"#1a8040",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>✓ Accept</button>
                            <button onClick={()=>declineTradeRequest(r)} style={{background:"#fce8e8",border:"1px solid #e0b0b0",color:"#c04040",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>✕ Decline</button>
                          </>
                        )}
                        {mySurgeon === r.from_surgeon_id && <button onClick={()=>deleteTradeRequest(r.id)} style={{background:"none",border:"1px solid #d0d8e0",color:"#8a94a0",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>Withdraw</button>}
                        {mySurgeon !== r.to_surgeon_id && mySurgeon !== r.from_surgeon_id && !isScheduler && (
                          <span style={{fontSize:10,color:"#8a6a10",fontWeight:600}}>Awaiting {r.to_surgeon_name}'s response</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {reviewedTrades.length > 0 && (
                <div style={css.card}>
                  <div style={css.cardT}>📋 Completed Trades <span style={{fontWeight:400,fontSize:12,color:"#8a94a0"}}>— {reviewedTrades.length}</span></div>
                  {reviewedTrades.slice(0,15).map(r => (
                    <div key={r.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",marginBottom:3,background:r.status==="accepted"?"#f0faf0":"#faf0f0",border:`1px solid ${r.status==="accepted"?"#c0e0c0":"#e0c0c0"}`,borderRadius:5,flexWrap:"wrap"}}>
                      <span style={{fontSize:12,fontWeight:700,color:r.status==="accepted"?"#1a8040":"#c04040"}}>{r.status==="accepted"?"✓":"✕"}</span>
                      <Badge id={r.from_surgeon_id} small/><span style={{fontSize:10,color:"#6030a0"}}>↔</span><Badge id={r.to_surgeon_id} small/>
                      <span style={{fontFamily:mono,fontSize:11,color:"#5a6a78"}}>{slotLabel(r.week_monday, r.shift_key)}</span>
                      {r.return_shift && r.return_week
                        ? <span style={{fontSize:10,color:"#8a94a0"}}>↔ {slotLabel(r.return_week, r.return_shift)}</span>
                        : <span style={{fontSize:10,color:"#a08040"}}>(one-way)</span>}
                      {isScheduler && <button onClick={()=>deleteTradeRequest(r.id)} style={{background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:11,marginLeft:"auto"}}>✕</button>}
                    </div>
                  ))}
                </div>
              )}
            </>;
          })()}
        </>}

        {/* ════════════════ SETTINGS ════════════════ */}
        {view==="settings" && !isPublicMode && <>
          {/* Dark / Light Mode */}
          <div style={css.card}>
            <div style={css.cardT}>🎨 Appearance</div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:13,color:"#5a6a78"}}>Theme</span>
              <button onClick={()=>setDarkMode(d=>!d)} style={{...css.btn(!darkMode),padding:"6px 16px",fontSize:12}}>
                ☀️ Light
              </button>
              <button onClick={()=>setDarkMode(d=>!d)} style={{...css.btn(darkMode),padding:"6px 16px",fontSize:12}}>
                🌙 Dark
              </button>
            </div>
          </div>

          {(isScheduler || userProfile?.role === "admin") && (
            <Collapsible css={css} ck="settings_audit" defaultOpen={false}
              title={<>📋 Activity Log <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— who changed what</span></>}
              right={<button onClick={(e)=>{e.stopPropagation(); loadAudit();}} title="Refresh" style={{background:"none",border:"1px solid #d0d8e0",borderRadius:6,color:"#5a6a78",cursor:"pointer",fontSize:13,padding:"2px 8px",fontFamily:font}}>↻</button>}>
              {auditLoading ? (
                <div style={{fontSize:12,color:"#8a94a0",padding:"6px 0"}}>Loading…</div>
              ) : auditEntries.length === 0 ? (
                <div style={{fontSize:12,color:"#8a94a0",padding:"6px 0"}}>No activity recorded yet. Changes from here on will appear here.</div>
              ) : (
                <div style={{maxHeight:420,overflowY:"auto",margin:"-2px -2px 0"}}>
                  {auditEntries.map(en => {
                    const si = surgeons.findIndex(s => s.id === en.actor_id);
                    const c = si >= 0 ? surgeonColors(surgeons[si].name, si) : null;
                    return (
                      <div key={en.id} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"7px 2px",borderBottom:"1px solid "+(dk?"#243240":"#eef1f4")}}>
                        <span style={{flexShrink:0,fontSize:10,fontWeight:700,letterSpacing:0.4,padding:"2px 7px",borderRadius:5,background:c?c.tg:(dk?"#243240":"#eef1f4"),color:c?c.tx:"#5a6a78",border:`1px solid ${c?c.bd:(dk?"#2a3a48":"#e0e4ea")}`,minWidth:38,textAlign:"center"}}>{en.actor_name}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12.5,color:dk?"#c8d2dc":"#3a4a58",lineHeight:1.35}}>{en.summary}</div>
                          <div style={{fontSize:10,color:"#9aa4ae",marginTop:1,fontFamily:mono}}>{fmtAuditTime(en.created_at)} · {en.action}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </Collapsible>
          )}

          {/* Client versions — scheduler/admin, read-only */}
          {(isScheduler || userProfile?.role === "admin") && (
            <Collapsible css={css} ck="settings_client_versions" defaultOpen={false}
              title={<>📱 Client Versions <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— who's on which build</span></>}
              right={<button onClick={(e)=>{e.stopPropagation(); loadClientVersions();}} title="Refresh" style={{background:"none",border:"1px solid #d0d8e0",borderRadius:6,color:"#5a6a78",cursor:"pointer",fontSize:13,padding:"2px 8px",fontFamily:font}}>↻</button>}>
              <p style={{fontSize:11.5,color:"#7a8a98",margin:"0 0 8px",lineHeight:1.5}}>
                Updated each time a signed-in user opens the app. "Current"/"Behind" compare against THIS device's build ({APP_VERSION}) — reload your own app before trusting the comparison.
              </p>
              {clientVersionsErr && (
                <div style={{fontSize:12,color:"#c04040",padding:"6px 0",fontWeight:600}}>⚠ {clientVersionsErr}</div>
              )}
              {clientVersions !== null && cvProfiles === null && !clientVersionsErr && (
                <div style={{fontSize:11,color:"#c09030",padding:"0 0 6px",fontWeight:600}}>⚠ Couldn't check who has an account — "Never signed up" labels are unavailable this load (versions below are still correct).</div>
              )}
              {clientVersions === null && !clientVersionsErr ? (
                <div style={{fontSize:12,color:"#8a94a0",padding:"6px 0"}}>Loading…</div>
              ) : clientVersions !== null && (
                <div style={{display:"flex",flexDirection:"column"}}>
                  {(() => {
                    const roster = [...surgeons, ...apps];
                    // Labels come ONLY from this load's own profiles fetch —
                    // null means "couldn't check"; never guess from a cache.
                    const profilesKnown = cvProfiles !== null;
                    // Roster people first, then any heartbeat rows from ids
                    // outside the roster (e.g. an admin account).
                    const extras = clientVersions.filter(r => !roster.some(p => p.id === r.person_id));
                    const line = (key, name, id, row, hasProfile) => {
                      let status;
                      if (row) {
                        const vc = versionCmp(row.app_version, APP_VERSION);
                        const cmp = vc === 0 ? "current" : (vc < 0 ? "behind" : "newer");
                        const bs = cmp === "current" ? {background:"#e8f6ec",color:"#1a8040",border:"1px solid #b8e0c4"}
                                 : cmp === "behind"  ? {background:"#fef8e8",color:"#c09030",border:"1px solid #e8d090"}
                                                     : {background:"#e8f0fa",color:"#1a6fa8",border:"1px solid #b8d4ec"};
                        status = <>
                          <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:5,...bs}}>{cmp === "current" ? "Current" : cmp === "behind" ? "Behind" : "Newer than you"}</span>
                          <span style={{fontSize:11,fontFamily:mono,color:dk?"#c8d2dc":"#3a4a58"}}>{row.app_version}</span>
                          <span style={{fontSize:11,color:"#8a94a0"}}>{fmtAuditTime(row.last_seen)}{uaLabel(row.user_agent) ? ` · ${uaLabel(row.user_agent)}` : ""}</span>
                        </>;
                      } else if (profilesKnown && !hasProfile) {
                        status = <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:5,background:"#faeaea",color:"#c04040",border:"1px solid #eabcbc"}}>Never signed up</span>;
                      } else if (profilesKnown) {
                        status = <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:5,background:dk?"#243240":"#eef1f4",color:"#7a8a98",border:"1px solid "+(dk?"#2a3a48":"#e0e4ea")}}>Signed up · no heartbeat yet</span>;
                      } else {
                        status = <span style={{fontSize:11,color:"#8a94a0"}}>no heartbeat recorded</span>;
                      }
                      return (
                        <div key={key} style={{display:"flex",gap:8,alignItems:"center",padding:"7px 2px",borderBottom:"1px solid "+(dk?"#243240":"#eef1f4")}}>
                          <span style={{flexShrink:0,fontSize:12,fontWeight:600,color:dk?"#c8d2dc":"#2c3e50",minWidth:52}}>{name}</span>
                          <span style={{flexShrink:0,fontSize:10,color:"#9aa4ae",fontFamily:mono,minWidth:22}}>{id}</span>
                          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>{status}</div>
                        </div>
                      );
                    };
                    return <>
                      {roster.map(p => line(p.id, p.name, p.id, clientVersions.find(r => r.person_id === p.id), (cvProfiles || []).some(pr => pr.person_id === p.id)))}
                      {extras.map(r => line(r.person_id, r.person_id, "", r, true))}
                    </>;
                  })()}
                </div>
              )}
            </Collapsible>
          )}

          {/* APP Shift Managers — scheduler/admin only. Collapsible (like
              Activity Log / Client Versions above); the collapsed summary
              keeps the panel's core value — who can assign — visible at a
              glance. Everything inside is unchanged. */}
          {(isScheduler || userProfile?.role === "admin") && (
            <Collapsible css={css} ck="settings_app_managers" defaultOpen={false}
              title={<>👩‍⚕️ APP Shift Managers <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— who can assign APP shifts</span></>}
              summary={(() => {
                // allProfiles === [] means NOT LOADED (a loaded list always
                // contains at least the viewing scheduler), never "nobody" —
                // don't render a confident empty claim from an unloaded list.
                if (allProfiles.length === 0) return <div style={{fontSize:12,color:"#8a94a0"}}>Expand to load users and see who has access.</div>;
                const grantees = allProfiles.filter(p => p.can_assign_apps);
                if (grantees.length === 0) return <div style={{fontSize:12,color:"#8a94a0"}}>No one has APP-assign access.</div>;
                return (
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#7a8a98"}}>Can assign APPs:</span>
                    {grantees.map(p => (
                      <span key={p.id} style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:5,background:"#e8f6ec",color:"#1a8040",border:"1px solid #b8e0c4"}}>
                        {[...surgeons, ...apps].find(x => x.id === p.person_id)?.name || p.display_name || p.person_id}
                      </span>
                    ))}
                  </div>
                );
              })()}>
              <p style={{fontSize:12,color:"#7a8a98",margin:"0 0 10px",lineHeight:1.5}}>
                Users listed here can assign APP shifts on the Setup tab (but have no other scheduler access). Toggle the switch to grant or revoke permission.
              </p>
              <button onClick={async ()=>{
                const profiles = await dbAuth.getAllProfiles();
                setAllProfiles(profiles || []);
              }} style={{...css.btn(false),padding:"5px 12px",fontSize:11,marginBottom:10}}>
                🔄 Load Users
              </button>
              {allProfiles.length === 0 ? (
                <p style={{fontSize:12,color:"#a0a8b0",fontStyle:"italic"}}>Click "Load Users" to see all signed-up users.</p>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {allProfiles.sort((a,b)=>(a.display_name||"").localeCompare(b.display_name||"")).map(p => (
                    <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",background:"#f8f9fb",borderRadius:6,border:"1px solid #e0e4ea"}}>
                      <div>
                        <span style={{fontSize:13,fontWeight:600,color:"#2c3e50"}}>{p.display_name}</span>
                        <span style={{fontSize:11,color:"#8a94a0",marginLeft:8}}>{p.person_id}</span>
                        {p.role === "admin" && <span style={{fontSize:10,color:"#6030a0",marginLeft:6,fontWeight:600}}>(admin)</span>}
                        {p.role === "scheduler" && <span style={{fontSize:10,color:"#1a6fa8",marginLeft:6,fontWeight:600}}>(scheduler)</span>}
                      </div>
                      <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                        <span style={{fontSize:11,color:p.can_assign_apps?"#1a8040":"#a0a8b0",fontWeight:600}}>
                          {p.can_assign_apps ? "Can assign APPs" : "No APP access"}
                        </span>
                        <input type="checkbox" checked={!!p.can_assign_apps} onChange={async (e)=>{
                          const newVal = e.target.checked;
                          const updated = { ...p, can_assign_apps: newVal };
                          const ep = sessionEpochRef.current; // (review r5 fix-1) after a session change during the write: this account's own profile never set as the next session's, nothing said
                          const { error } = await dbAuth.upsertProfile(updated);
                          if (sessionEpochRef.current !== ep) { if (error) console.error("APP-access update failed:", error); return; }
                          if (error) { alert("Failed to update: " + error); return; }
                          setAllProfiles(prev => prev.map(x => x.id === p.id ? updated : x));

            {mySurgeon && mySurgeon !== "admin" && (() => {
              const myName = [...surgeons, ...apps].find(p => p.id === mySurgeon)?.name;

                <div style={{marginBottom:10}}>

                <div style={{display:"flex",gap:6,alignItems:"center"}}>
