  //    would do (keep their change, or refuse when it hit a slot edited
  //    there — mergeEditorEdits), instead of only when Save is tapped.
  //  - Swap OPTIONS made earlier that involve one of them — the target's week
  //    or a return swap's — describe a schedule that's gone: they're closed,
  //    as an out-of-date swap tap closes them. A week merely picked in the
  //    swap tool, with no options found yet, stays picked.
  // (The setters are stable; swapTarget / swapSuggestions are this render's —
  // the bridge is re-made every render.)
  schedSyncBridgeRef.current = { canWrite: !isPublicMode, userId: userProfile?.person_id || null, showToast,
    onAdopted: (weeks) => {
      setEditWeekModal(m => (m && !m.adoptedAway && weeks.includes(m.mondayStr)) ? { ...m, adoptedAway: true } : m);
      if (swapSuggestions && swapTarget && (weeks.includes(swapTarget.mondayStr) || swapSuggestions.some(c => (c.returnSwaps || []).some(r => weeks.includes(r.mondayStr))))) {
        setSwapSuggestions(null); setSwapTarget(null);
        showToast("Someone else just changed a week these swap options were for — they were closed. Find swaps again.", "info");
      }
    } };
  const schedSyncRef = useRef(null);
  if (!schedSyncRef.current) schedSyncRef.current = createSchedSync({
    getState: () => scheduleRef.current,
    commit: (next) => commitSchedule(next),
    fetch: (u, i) => fetch(u, i),
    url: SUPABASE_URL,
    writeHeaders: () => dbAuthHeaders(),   // writes send the stored token as-is (an expired one 401s — never anon)
    readHeaders: () => dbReadHeaders(),    // reads fall back to anon when the token is stale (the table is anon-readable)
    anonHeaders: () => dbHeaders,          // …and once the SERVER has refused the token (a clock that calls it fresh can't tell)
    canWrite: () => schedSyncBridgeRef.current.canWrite,
    // The stored token. "Expired" is what the SERVER says (a 401 for this
    // token), never the device clock — a skewed clock must not stop saves (A7).
    token: () => auth.getSession()?.access_token || null,
    userId: () => schedSyncBridgeRef.current.userId,
    now: () => new Date().toISOString(),
    nowMs: () => Date.now(),
    onStatus: (st) => setSchedSync(prev => JSON.stringify(prev) === JSON.stringify(st) ? prev : st),
    onToast: (m, tone) => schedSyncBridgeRef.current.showToast(m, tone),
    onWipeBlocked: ({ curCount, baseCount, deletes }) => {
      console.warn(`schedule_weeks wipe BLOCKED: in-memory ${curCount} wk vs table ${baseCount} wk would delete ${deletes}. Refusing — not an intentional clear.`);
      schedSyncBridgeRef.current.showToast("Blocked an unexpected schedule wipe — your saved schedule is safe. Reload to resync.", "error");
    },
    onInternalError: (e) => console.error("schedule sync: internal error (a bug, not the network):", e),
    onAdopted: (weeks) => schedSyncBridgeRef.current.onAdopted(weeks),
    log: (...a) => console.warn(...a),
  });

  // The edit gates, checked at the START of every user-initiated schedule
  // action, before any side effect (a trade's status PATCH, a notification):
  //  - the LOAD gate: until the schedule has been read from the table this
  //    session, an edit would be made against a blank or partial schedule;
  //  - the SIGN-IN gate: with an expired token the edit could only be held in
  //    memory until a reload drops it. Refuse it up front instead, with the
  //    way out ("Sign in again" at the top) — nothing becomes pending.
  //  - the JOB gate (schedEditable("job"), review r2 regress-1): ONE clear /
  //    reset / restore / publish at a time from the UI. Those callers ask it
  //    at the tap and again after each await, right before they commit their
  //    target; it refuses while another such job is queued or running (the
  //    engine's jobPending()), naming it. A second one stacked behind the
  //    first took its `before` from a screen showing the first's target, not
  //    yet applied — when both then wrote nothing, putting that back sent the
  //    first's target as an ordinary save (a saved week deleted, a refused
  //    restore's copy written).
  const [reauthNeeded, setReauthNeeded] = useState(false);
  const [reauthBusy, setReauthBusy] = useState(false);
  // The SOFT stale-sign-in warning (A7(3)): set on resume when the stored
  // token is past its expiry by the DEVICE clock. Only a warning — the same
  // "Sign in again", in amber — never an edit gate: a skewed clock must not
  // stop edits (the gate below closes on the server's 401).
  const [staleTokenWarn, setStaleTokenWarn] = useState(false);
  // The password sheet (A7(2)): opens when "Sign in again" can't renew the
  // session in place. Its email is the signed-in account's, fixed.
  const [reauthSheet, setReauthSheet] = useState(false);
  const [reauthPassword, setReauthPassword] = useState("");
  const [reauthError, setReauthError] = useState("");
  const schedEditable = (job) => {
    if (!schedSyncRef.current.isSeeded()) {
      showToast("The schedule hasn't loaded yet — nothing was changed. It retries every minute; try again shortly.", "error");
      return false;
    }
    if (schedSyncRef.current.authBlocked()) {
      setReauthNeeded(true);
      showToast("Your sign-in has expired — nothing was changed. Tap \"Sign in again\" at the top, then redo this.", "error");
      return false;
    }
    if (job) {
      const busy = schedSyncRef.current.jobPending();
      if (busy) { showToast(`${schedSyncRef.current.jobLabel(busy)} is still running — wait for it to finish, then try again.`, "error"); return false; }
    }
    return true;
  };
  // A re-auth landed: the session was renewed in place, or the password sheet
  // signed in (A7(2)). WHICH account it is decides what happens — by the auth
  // id (authUser.id), not person_id (what the engine's userId() carries):
  //  - the SAME account: keep everything — the mirror, what the engine knows,
  //    undo, an open editor. The new token un-blocks writes (the dead token
  //    was the old one), so clear both banners, then pull, which sends what's
  //    pending after it.
  //  - a DIFFERENT account: nothing of this session may be sent as it. Cross
  //    the sign-out boundary WITHOUT signing out (that would end the session
  //    just made), then take the new account in as a password sign-in does.
  // It never calls handleSignOut, never nulls authUser, and bumps
  // reloadTrigger only for a different account.
  const reauthLanded = async (user) => {
    const eng = schedSyncRef.current;
    if (!user || (authUser && user.id === authUser.id)) {
      setReauthNeeded(false); setStaleTokenWarn(false);
      eng.report(); // the banners follow the new token now, not at the next job's report
      if (pendingSaveRef.current) setSetupSaveNudge(n => n + 1); // a setup change kept while signed out (review r2 regress-2) goes out now, under the renewed session
      showToast(eng.pending().length ? "Signed in again — sending what wasn't saved." : "Signed in again.", "info");
      schedSyncRef.current.pull();
      return "same";
    }
    const lost = eng.pending().length;
    sessionBoundary();
    auth.bindUser(user.id); // this tab is the new account's now (review r4 branch-4) — e.g. another tab's sign-in, renewed here
    biometric.unenroll(); setBiometricEnrolled(false); setBiometricPending(false); // the previous account's enrolment (sign-out drops it too)
    setAuthUser(user);
    let profile = null;
    try { profile = await dbAuth.getProfile(user.id); } catch (e) { profile = null; }
    if (profile) {
      setUserProfile(profile); setMySurgeon(profile.person_id); setNeedsProfile(false);
      setIsScheduler(profile.role === "scheduler" || profile.role === "admin"); // never left on from the previous account
      setReloadTrigger(t => t + 1);
    } else {
      setUserProfile(null); setMySurgeon(""); setIsScheduler(false); setNeedsProfile(true);
    }
    showToast(lost
      ? `Signed in as a different account than before — the ${lost} week${lost === 1 ? "" : "s"} not saved ${lost === 1 ? "was" : "were"} discarded.`
      : "Signed in as a different account than before — the schedule is reloading.", lost ? "error" : "info");
    return "switched";
  };
  // "Sign in again": first renew the session IN PLACE with the stored refresh
  // token (auth.refreshKeep: the refresh every app open does, except that a
  // failure never clears the stored session), so nothing in memory is lost (a
  // reload or a sign-out would drop unsaved weeks). When it can't be renewed,
  // the password sheet opens — still in place. Biometric isn't offered: it
  // would only unlock the same stored session.
  const reauthForSync = async () => {
    if (reauthBusy) return;
    setReauthBusy(true);
    try {
      const r = await auth.refreshKeep();
      if (r.ok) { await reauthLanded(r.user && r.user.id ? r.user : authUser); return; } // a refresh token renews the session it was issued for
      setReauthPassword("");
      setReauthError(r.error === "network" ? "Couldn't reach the server to renew your sign-in — check the connection, then sign in here." : "");
      setReauthSheet(true);
    } finally { setReauthBusy(false); }
  };
  // The sheet's submit: a password sign-in as the signed-in account (its
  // email, fixed). A failure — a wrong password, offline, a server error — is
  // shown in the sheet and clears NOTHING (signIn leaves the stored session
  // alone when refused, and throws when offline — caught here).
  const submitReauth = async () => {
    if (reauthBusy) return;
    const email = authUser && authUser.email;
    if (!email) { setReauthError("This account has no email to sign in with here — reload the app and sign in."); return; }
    if (!reauthPassword) { setReauthError("Enter your password."); return; }
    setReauthBusy(true); setReauthError("");
    try {
      let res;
      try { res = await auth.signIn(email, reauthPassword); }
      catch (e) { res = { user: null, error: "Couldn't reach the server — check the connection and try again." }; }
      if (!res || res.error || !res.user || !res.user.id) { setReauthError((res && res.error) || "Sign in failed — try again."); return; }
      setReauthSheet(false); setReauthPassword(""); setReauthError("");
      await reauthLanded(res.user);
    } finally { setReauthBusy(false); }
  };
  // ─── This tab's session, changed by another tab ───
  // (review r4 branch-4) Tabs share the stored session. When another tab
  // changes it — signs out, signs in as another account, or renews it — this
  // tab looks at once, not at its next pull: the engine reports again (its
  // token() reads the stored session as THIS tab may use it — none while
  // another account's is stored: config.js bindUser), so anything pending
  // says "Sign in again" now; and when this tab's own session is gone, or is
  // now another account's, the "Sign in again" banner shows even with nothing
  // pending. (A renewal of this account's own session changes nothing.)
  // The banner follows the session both ways (review r5 regress-2): when
  // this tab's own account is back — another tab signed in again as it — it
  // is lowered (it only ever rose here: a tab signed in and saving still said
  // its sign-in had expired). A token the server refused stays said by the
  // engine's own authNeeded (the banner shows on either); a new token is a
  // new one to try. And a setup change held while signed out goes out now,
  // under that session — as reauthLanded's same-account branch does.
  useEffect(() => {
    if (!authUser) return;
    const onStorage = (e) => {
      if (e && e.key !== null && e.key !== "dsg-auth-token") return; // (key null: the whole storage cleared)
      schedSyncRef.current.report();
      const back = !!auth.getSession(); // (this tab's account's — another account's stored session is none here: config.js bindUser)
      setReauthNeeded(!back);
      if (back && pendingSaveRef.current) setSetupSaveNudge(n => n + 1);
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [authUser]);

  // The reload guard: any path that reloads the page while weeks aren't
  // saved asks first ("No data is lost" is only true when nothing is pending).
  const confirmReloadWithPending = (base) => {
    const n = schedSyncRef.current.pending().length;
    if (!n) return base ? confirm(base) : true;
    return confirm(`${n} week${n === 1 ? "" : "s"} of the schedule ${n === 1 ? "isn't" : "aren't"} saved yet — reloading now loses ${n === 1 ? "it" : "them"}.\n\nReload anyway?`);
  };
  // The header's schedule sync line. A14: a pull found the server with fewer
  // weeks than this screen and didn't adopt that (a full clear elsewhere, or
  // the RLS/anon empty shape — never adopted on one read). The header says so
  // persistently, in the scheduler AND the public / OR-board headers, until a
  // later pull or a reload settles it, and "☁ Synced" never shows beside it.
  // Its Reload goes through the reload guard (asks while weeks are unsaved).
  // A5(g): the engine reports a job that has made no progress for its stall
  // bound (45 s — every request is answered or aborted within 15 s): the
  // header says "Sync stalled — reload to resync", with the same guarded
  // Reload, until progress clears it.
  // A16: each header shows ONE of these lines at a time — schedSyncLine
  // (module scope, by its precedence) picks which; every line below renders
  // only for its own kind.
  const reloadToResync = () => { if (confirmReloadWithPending()) window.location.reload(); };
  const schedLine = schedSyncLine(schedSync, { loaded, readOnly: isPublicMode, blobStatus: !!saveStatus });
  const schedLineKind = schedLine ? schedLine.kind : null;
  const schedStaleShown = schedLineKind === "stale";
  const schedStalledShown = schedLineKind === "stalled";
  const schedSyncedShown = schedLineKind === "synced";
  // The amber "Sign in again" (A7(3)) — never beside the red one.
  const staleTokenShown = !isPublicMode && !!authUser && staleTokenWarn && !(schedSync.authNeeded || reauthNeeded);
  // The setup autosave's own "☁ Saved" never renders beside a RED schedule
  // line (A16: one story — beside "⚠ 1 week not saved" it would read as if
  // everything were saved), nor beside the busy line of a clear / reset /
  // restore / publish job (review r2 fixes-2: "☁ Saved  Clearing… keep the
  // app open" read as if the clear were saved while it still runs — the
  // job's own commit re-runs the autosave); the autosave's errors still do,
  // and so does every other status (a job's own outcome says what landed).
  const SCHED_LINE_RED = ["auth", "loadFailed", "notSaved", "rejected", "blocked", "stalled"];
  const saveStatusShown = !!saveStatus && !(saveStatus === "Saved" && !saveError && (SCHED_LINE_RED.includes(schedLineKind) || schedLineKind === "busy"));
  // Clear / factory reset / restore: an authoritative engine job — its own
  // grant, a fresh whole-table read first, fail closed. When it was refused
  // and wrote nothing (the read failed, signed out, cancelled at its
  // deadline…), the ENGINE puts the screen back as it was BEFORE the caller
  // committed the target — `before`, the mirror the caller captures just
  // ahead of that commit (E4, review r1 app-1): edits pending from before the
  // tap and new local weeks stay pending, and the job's follow-up push sends
  // them — in the job, before that push could send the refused target; every
  // week edited since the tap stays — so it never shows a clear that didn't
  // happen. The caller's Undo step for it (undoStep, from pushUndo — taken of
  // that same mirror) is taken back then: the screen is back where the step
  // would take it, so there is nothing to undo. By identity — a step pushed
  // meanwhile stays. (A job still running past its deadline, A5(f), or one
  // whose writes merely failed and are retried, R7, keeps its step.) The job
  // tells its own detail as r.notice, not in a toast: the caller's one
  // message about the outcome carries it. `late(r)` (E8, review r2 fixes-1):
  // the caller's words for that outcome when the job ends after its deadline
  // — a factory reset or a restore knows what it did before the weeks job.
  const runAuthoritativeSchedule = async (target, what, undoStep, before, late) => {
    const r = await schedSyncRef.current.authoritative(target, true, what, null, { before, late });
    if (undoStep && !r.ok && !r.wrote && !r.running && (r.error || r.internal)) setScheduleHistory(h => h.filter(s => s !== undoStep));
    return r;
  };
  // Generate & Publish / Accept & Publish (A14): the engine's PUBLISH job —
  // authoritative over the period's weeks only (re-read just those, write
  // them, a week deleted elsewhere is re-inserted, never a delete). Call it
  // right after publishWeeks commits, before any await, so the debounced
  // weeks push defers to it. Resolves ok only when EVERY period week landed;
  // a week that didn't stays on screen and pending, and the follow-up push
  // keeps retrying it.
  const runPublish = (weeks) => schedSyncRef.current.authoritative(weeks, false, "publish", Object.keys(weeks));
  // What a publish that didn't fully land tells the scheduler (nobody is
  // notified) — ONE message, with the engine's own detail (pr.notice: which
  // weeks, and why) in it; the engine doesn't toast it beside this.
  const publishNotLanded = (pr, what) => {
    if (pr && (pr.skipped === "reset" || pr.skipped === "cancelled")) return; // fenced by a sign-out (another session now): nothing is said on its screen
    const n = ((pr && pr.results) || []).filter(x => x.outcome !== "saved").length;
    showToast(pr && pr.error ? `${what}: ${pr.error}${pr.running ? " Nobody was notified." : ""}`
      : pr && pr.notice ? `${what}: ${pr.notice} Nobody was notified.`
      : `${what} — ${n ? n + " week" + (n === 1 ? " isn't" : "s aren't") : "the new weeks aren't"} saved yet; retrying automatically. Nobody was notified.`, pr && pr.running ? "info" : "error");
  };

  // ─── Current-state bundle (NOT "the thing we persist") ───
  // A snapshot of live component state in one object. Every save path builds
  // from this so the shape can't drift (a prior bug dropped
  // startMondayOverride/pendingLocks from the regenerate & clear saves, which
  // hand-rolled their own objects). Excludes appShifts (own table).
  //
  // schedule / vacations / noCallDays are IN the bundle but NOT in the blob —
  // every blob write strips them before the upsert. They are ARGUMENTS to
  // these consumers, not a persistence duplication:
  //   1. payloadLooksWiped — the empty-save guard reads bundle.schedule /
  //      .vacations to tell a wipe from a legitimate save (the autosave and
  //      the blob keepalive both run it on the pending bundle).
  //   2. The JSON export — the spread of this bundle is what puts the
  //      schedule and time off into the user's backup file.
  // (Until sync v2 the schedule_weeks writes also read bundle.schedule; the
  // sync engine now reads the schedule mirror itself.)
  // Removing them was evaluated and CANCELLED 2026-08-08 (buys zero blob
  // bytes — already stripped — and each consumer fails SILENTLY without its
  // argument). See REMAINING-WORK for the full record.
  const buildStateBundle = (overrides = {}) => ({
    surgeons, apps, vacations, noCallDays,
    backupMondays: [...backupMondaySet],
    fierceBackup: [...fierceBackupSet],
    schedule, priorCounts, year1Counts,
    startMonth, startYear, numWeeks, holidayAssignments, startMondayOverride,
    pendingLocks,
    silvisRule,
    dismissedWarnings,
    ...overrides,
  });
  // The LATEST render's buildStateBundle (as genCommitRef is for Generate &
  // Publish): a write made after an await — the clear's blob save, after its
  // whole job — builds from the state as it is THEN, never the tap's render
  // (a setting changed, or another scheduler's setup adopted, during the job
  // would be reverted — review r1 regress).
  const stateBundleRef = useRef(null);
  stateBundleRef.current = buildStateBundle;
  // The setup part of a bundle (what the blob holds), as one canonical string
  // (keys sorted at every level): the setup autosave compares it with the one
  // last written or read (setupBaseRef — review r3, 19/n open item 2).
  const setupSig = (p) => { const b = Object.assign({}, p); ["schedule", "vacations", "noCallDays", "_intentionalClear"].forEach(k => { delete b[k]; }); return JSON.stringify(b, (k, v) => (v && typeof v === "object" && !Array.isArray(v)) ? Object.keys(v).sort().reduce((o, kk) => (o[kk] = v[kk], o), {}) : v); };

  // Mirrors the DB predicate these shared-config tables actually enforce:
  // is_scheduler_or_admin() = role IN ('scheduler','admin'). `isScheduler` is
  // set from exactly that (role === "scheduler" || role === "admin"), so it is
  // the honest client-side twin. NOTE this is NOT the user_profiles predicate
  // (role='scheduler' OR person_id='admin') — different tables, different
  // rule; verified against pg_proc 2026-08-17.
  const canWriteBlob = isScheduler;

  // ─── Supabase: Auto-save on changes ───
  useEffect(() => {
    // The setup as last written or read (setupBaseRef — review r3, 19/n open
    // item 2): the write sets it (below); a READ moves lastSyncRef, and this
    // render — the one it lands in — holds what was read: that's the baseline
    // now. (Before the gates: the load's read lands while still loading.)
    const payload = buildStateBundle(), payloadSig = setupSig(payload);
    if (!setupBaseRef.current || setupBaseRef.current.at !== lastSyncRef.current) setupBaseRef.current = { at: lastSyncRef.current, sig: payloadSig };
    if (!loaded) return;
    if (isPublicMode) return;  // Public viewers never write to the DB
    // Skip auto-save for 3s after initial load — prevents re-saving unchanged data
    // when initial state hydration triggers this effect
    if (loadedAtRef.current && Date.now() - loadedAtRef.current < 3000) return;
    // If the initial read threw, this session can't trust its own state — don't
    // let it overwrite the DB (residual blind-write protection).
    if (loadFailedRef.current) {
      setSaveError(true);
      setSaveStatus("⚠ Not saving — schedule failed to load");
      return;
    }
    // The session boundary (review r1 regress) — see the write below. Here:
    // a render from before this account's setup was read schedules nothing,
    // so its payload (the previous session's) can't be written by a timer
    // that fires after the read but before the render that adopts it.
    if (!setupReadRef.current) return;
    // Capture the payload so the visibility/unload handlers can flush it
    // immediately without waiting for the debounce — with no session, only a
    // setup that differs from the one last written or read (review r3, 19/n
    // open item 2: a peer's week adopted, or time off reloaded, re-runs this
    // effect with the setup as it was — nothing to save, nothing to say).
    const setupChanged = payloadSig !== setupBaseRef.current.sig;
    if (setupChanged || auth.getSession()) pendingSaveRef.current = payload;
    // No stored session while this account's setup IS read (review r2
    // regress-2: another tab signed out, or its refresh failed — no boundary
    // crossed here): nothing is written, never as anon — but never silently.
    // A scheduler's change stays pending (pendingSaveRef) and is said: "⚠ Not
    // saved — you're signed out", with the red "Sign in again" banner; when
    // the same account signs in again, reauthLanded nudges this effect
    // (setupSaveNudge) and the change goes out under the renewed session.
    // (A member never writes the setup: nothing to say.)
    const signedOut = () => { if (canWriteBlob) { setSaveError(true); setSaveStatus("⚠ Not saved — you're signed out. Sign in again"); setReauthNeeded(true); } };
    if (!auth.getSession()) { if (setupChanged) signedOut(); return; }
    // Arm the guard as soon as we hold real data locally, so a later
    // transient-empty render can't slip an empty blob through before the
    // guard is otherwise set.
    if (!payloadLooksWiped(payload)) everHadRealDataRef.current = true;
    const timer = setTimeout(async () => {
      // Never while a factory reset is under way (review r6 broke-1): a
      // render in its gaps — the 60-s poll's time off, a pulled week, a
      // realtime event — still shows the OLD setup, and the server's is
      // (being) cleared: its timer would write the old setup back over the
      // cleared blob and use up the reset's one-shot bypass. The reset's own
      // final run renders the reset setup, and that render's timer writes it.
      if (resetBusyRef.current) return;
      // Never across the session boundary (review r1 regress), checked when
      // it would write: this account's setup not read yet since the boundary
      // (setupReadRef) — what this page holds in memory is the previous
      // session's, not this account's to write …
      if (!setupReadRef.current) return;
      // …and never without a session (signed out during the debounce — in
      // another tab, perhaps): said, and kept pending, as above — a changed
      // setup; an unchanged one has nothing to keep (review r3).
      if (!auth.getSession()) { if (setupChanged) signedOut(); else pendingSaveRef.current = null; return; }
      // ── Empty-save guard ──
      // Structural fix for the load(permissive)/save(unconditional) asymmetry:
      // refuse to overwrite known-good data with a wiped payload. Leave
      // pendingSaveRef intact so a real edit still saves normally afterward.
      if (payloadLooksWiped(payload) && everHadRealDataRef.current && !allowWipeSaveRef.current) {
        console.warn("Autosave blocked: refusing to write empty payload over real data.");
        setSaveError(true);
        setSaveStatus("⚠ Save blocked — empty data not written");
        return;
      }
      allowWipeSaveRef.current = false; // consume one-shot bypass
      // ── The schedule is NOT saved here (2026-08-17, then sync v2) ──
      // The weeks used to be leg 1 of this timer, and before 2026-08-17 they
      // sat behind the blob upsert, which threw — silently DISCARDING a
      // member's swap or trade (RLS denies members the blob). Since sync v2
      // the weeks have their OWN effect (below), for every non-public session
      // and every role, with none of this effect's gates in its way.

      // The config blob. RLS restricts call_schedule_data writes to
      // scheduler/admin (is_scheduler_or_admin() = role IN ('scheduler',
      // 'admin')); `isScheduler` mirrors that exactly. A member has nothing
      // to write here — every member-owned fact lives in its own table
      // (time_off, notification_preferences, client_versions, …), and the
      // dep array only goes dirty for them via ADOPTION of other people's
      // changes. So they must not attempt it: attempting produced a 403 on a
      // 60s cadence and a permanent red "Save failed" header.
      if (!canWriteBlob) return;
      try {
        const ts = new Date().toISOString();
        // Stage 6: the schedule lives in schedule_weeks now. Write everything
        // else to the blob, but omit the schedule (leg 1 above persists it to
        // the table with CAS). `payload` itself keeps the schedule so the
        // empty-save guard above still sees real data and leg 1 works.
        const blobData = { ...payload }; delete blobData.schedule;
        // Vacations/no-call live in time_off (single source since the
        // migration); the blob copy was a dead mirror with no data readers —
        // and the poisonable structure behind the 2026-07-18 digest incident —
        // so it is no longer written. (payload keeps them for the empty-save
        // guard and the JSON export; guard ARMING now comes from the real
        // sources — the sync engine's schedule load and loadTimeOff.)
        delete blobData.vacations; delete blobData.noCallDays;
        const { error: saveErr } = await supabase
          .from("call_schedule_data")
          .upsert({ id: "main", data: blobData, updated_at: ts });
        // HTTP failures return {error} WITHOUT throwing — the catch below only
        // sees network rejections. Unchecked, this showed a false "Saved" and
        // cleared pendingSaveRef (disarming the unload-flush retry). It matters
        // most for the stale-token 401 that the PR#16 header split makes writes
        // produce BY DESIGN — that failure must surface, not be lied about.
        if (saveErr) throw new Error(`blob save failed: ${String(saveErr).slice(0, 200)}`);
        lastSyncRef.current = ts;
        pendingSaveRef.current = null; // Save committed — clear pending
        setupBaseRef.current = { at: ts, sig: payloadSig }; // …and it is the setup as last written (review r3)
        setSaveError(false);
        setSaveStatus("Saved");
        setTimeout(() => setSaveStatus(""), 2000);
      } catch (e) {
        console.error("Save failed:", e);
        setSaveError(true);
        const failMsg = String(e?.message || e);
        // Classify on the RESPONSE BODY, not the status code: PostgREST
        // answers 401 for an anonymous RLS denial and 403 for an
        // authenticated one, so the status alone is unreliable — but the body
        // always carries code 42501 / "row-level security". A permissions
        // failure is NOT retrying into success, so it must not claim to be.
        const denied = /42501|row-level security|\b403\b/i.test(failMsg);
        setSaveStatus(denied ? "⚠ Not saved — no permission" : "Save failed — retrying…");
        showToast(denied
          ? "Couldn't save the shared setup — your account doesn't have permission. Ask the scheduler."
          : /401|JWT|expired/i.test(failMsg)
            ? "Changes aren't saving — your session expired. Reload or sign in again."
            : "Changes aren't saving — check your connection.", "error");
      }
    }, 800);
    return () => clearTimeout(timer);
  }, [loaded, surgeons, apps, vacations, noCallDays, backupMondaySet, fierceBackupSet, schedule, setupSaveNudge, priorCounts, year1Counts, startMonth, startYear, numWeeks, holidayAssignments, startMondayOverride, pendingLocks, dismissedWarnings]);

  // ─── schedule_weeks: push every schedule change (sync engine v2) ───
  // Its own effect, for every non-public session and every role — members
  // are intended writers (swaps, trades) — and independent of the blob leg
  // above and of its guards (the engine has its own load gate, wipe guard and
  // sign-in handling). 800 ms debounce, like the blob; pushes coalesce.
  // commitSchedule never pushes by itself: this effect is the one trigger
  // for edits (the pull and the authoritative jobs request their own).
  useEffect(() => {
    if (!loaded || isPublicMode) return;
    const t = setTimeout(() => { schedSyncRef.current.push(); }, 800);
    return () => clearTimeout(t);
  }, [loaded, schedule]);

  // Pull on resume and on reconnect (I5): a phone that slept for an hour
  // shows other people's changes the moment it's opened, not a minute later,
  // and anything pending is retried as soon as the network is back. Public
  // and OR-board sessions pull too (the engine never writes from them).
  // On resume, first (A5(b)): timers froze while the page was suspended, so
  // a request sent before can't have timed out — the engine aborts any older
  // than its timeout, so the pull isn't queued behind it. Then (A7(3)): a
  // stored sign-in past its expiry by the device clock, in a view that
  // writes, shows the amber "Sign in again" (a warning, never a gate).
  useEffect(() => {
    if (!loaded) return;
    const onVisible = () => {
      if (document.hidden) return;
      schedSyncRef.current.onResume();
      const t = auth.getSession()?.access_token || null;
      setStaleTokenWarn(!!t && schedSyncBridgeRef.current.canWrite && !jwtIsFresh(t));
      schedSyncRef.current.pull();
    };
    const onOnline = () => schedSyncRef.current.pull();
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("online", onOnline);
    return () => { document.removeEventListener("visibilitychange", onVisible); window.removeEventListener("online", onOnline); };
  }, [loaded]);

  // ─── Flush pending save when app is backgrounded or closing ───
  //
  // The auto-save above has an 800ms debounce. If the user closes the app,
  // locks the phone, or switches apps within that window, the save is
  // cancelled and their edit is lost.
  //
  // This effect listens for three events that signal "user is leaving" and
  // fires any pending save immediately, bypassing the debounce.
  //
  //   visibilitychange (hidden) — mobile: user switched apps or locked phone
  //   pagehide                  — page is being unloaded (tab close, navigate)
  //   beforeunload              — desktop backup for pagehide
  //
  // Uses fetch keepalive:true so the request completes even during unload.
  // Supabase JS's upsert doesn't support keepalive, so we construct the fetch
  // directly using the stored session token.
  useEffect(() => {
    // (The blob keepalive is gone — A10: its canWriteBlob gate sat in this
    // []-closure, frozen at the first render's false, so it never fired; a
    // live one would be a blind, un-chained blob write. A blob edit made in
    // the last 800 ms before the app closes is lost — the same trade-off the
    // day-off flush below documents.)

    // Day-off flush: anything UNCONFIRMED (pending burst OR failed save
    // awaiting retry — the dirty flag covers both) is pushed through the
    // NORMAL serialized save chain immediately, via the latest-closure
    // bridge (correct audit attribution). Deliberately NOT a keepalive
    // side-write: review round 3 showed an un-chained keepalive can stall
    // in the radio, land AFTER a later confirmed save, and silently regress
    // the server to an older map that the staleness check then makes
    // undetectable. A chained save can't reorder. The cost: on true page
    // DEATH (tab close) the in-flight fetch may die and lose whatever is
    // UNCONFIRMED — normally the last ≤600ms of taps, but after a failed
    // save awaiting its 5s retry, everything since the last confirmed save.
    // Either way it's visible next session (chips absent, dirty state dies
    // with the page, DB stays consistent) and re-enterable. On mere
    // backgrounding (visibilitychange — the common mobile case) the page
    // survives and the chain confirms normally.
    const flushDayOff = (source) => {
      if (isPublicMode) return;
      if (!dayOffDirtyRef.current) return; // nothing unconfirmed
      if (dayOffSaveTimerRef.current) { clearTimeout(dayOffSaveTimerRef.current); dayOffSaveTimerRef.current = null; }
      try { dayOffEnqueueRef.current(); }
      catch (e) { console.warn(`Day-off flush (${source}) error:`, e); }
    };

    // schedule_weeks (sync engine v2). On HIDE (the common mobile case, the
    // page survives) the weeks go through the engine's normal chain — never a
    // side-write that could stall and land after a later save (the day-off
    // lesson, review round 3). On real UNLOAD (pagehide / beforeunload) the
    // chain can't finish, so the engine builds CAS keepalive PATCHes for the
    // unsaved weeks the table already has, from the LATEST mirror and its
    // known (version, updated_at) — through refs, so this []-closure is never
    // stale (R6). A week someone else changed matches 0 rows and changes
    // nothing; no INSERT and no delete is ever sent this way (R1, R2, R4).
    // Each one's done() is called when its request settles (review r5
    // matrix-3): until then the engine counts its body as possibly landing —
    // the page may survive the unload (a cancelled "Leave site?", the
    // back-forward cache) with it still held in the radio.
    const flushSchedWeeks = (source) => {
      if (isPublicMode) return;
      try {
        if (source === "visibilitychange") { schedSyncRef.current.push(); return; }
        schedSyncRef.current.keepaliveRequests().forEach(x => { fetch(x.url, x.init).catch(() => {}).then(() => { if (x.done) x.done(); }); });
      } catch (e) { console.warn(`schedule_weeks flush (${source}) failed:`, e); }
    };

    const onVisibilityChange = () => {
      if (document.hidden) { flushDayOff("visibilitychange"); flushSchedWeeks("visibilitychange"); }
    };
    const onPageHide = () => { flushDayOff("pagehide"); flushSchedWeeks("pagehide"); };
    // beforeunload also asks the browser to confirm leaving while weeks are
    // unsaved (desktop shows its own "Leave site?" prompt; ignored on mobile).
    const onBeforeUnload = (ev) => {
      flushDayOff("beforeunload"); flushSchedWeeks("beforeunload");
      try { if (!isPublicMode && schedSyncRef.current.pending().length) { ev.preventDefault(); ev.returnValue = ""; } } catch (e) { /* never block unload on an error */ }
    };

    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("pagehide", onPageHide);
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => {
      document.removeEventListener("visibilitychange", onVisibilityChange);
      window.removeEventListener("pagehide", onPageHide);
      window.removeEventListener("beforeunload", onBeforeUnload);
    };
  }, []);

  // ─── Supabase: Save edge function URL ───
  useEffect(() => {
    if (!loaded) return;
    if (isPublicMode) return;  // Public viewers never write config
    // Never persist an empty URL. A failed load leaves the in-memory value ""
    // (the loader's config read shares one try/catch with all the other load
    // reads, and setLoaded(true) runs even after a caught failure) — this
    // effect then wrote "" over the stored URL 500ms later, which is how
    // client email + push dispatch silently died (2026-07-02). The blob
    // autosave already checks loadFailedRef for exactly this reason; config
    // now gets the same check plus a hard non-empty requirement (clearing the
    // URL is not a supported app action — do it in SQL if ever needed).
    if (loadFailedRef.current) return;
    if (!edgeFunctionUrl || !edgeFunctionUrl.trim()) return;
    // call_schedule_config writes are scheduler/admin per RLS, and the value
    // being written here is one the session just LOADED — so for a member
    // this effect could only ever echo a value back and be denied. It fired
    // on every load in every signed-in session since 2026-05-15, silently
    // until the 2026-07-02 toast made it a red "check your connection" on a
    // member's screen. Only a session that can actually write it may try.
    // (The Settings field that legitimately EDITS this is already
    // scheduler/admin-gated; this effect is just its persist-back.)
    if (!canWriteBlob) return;
    // …and not across the session boundary: another account's role arriving
    // (canWriteBlob false → true) would echo this page's value as that account
    // before its own setup has been read (setupReadRef, as the autosave).
    if (!setupReadRef.current) return;
    const timer = setTimeout(async () => {
      try {
        const { error: cfgErr } = await supabase
          .from("call_schedule_config")
          .upsert({ id: "config", edge_function_url: edgeFunctionUrl.trim(), updated_at: new Date().toISOString() });
        // {error} was discarded — an HTTP-failed save of a REAL URL was
        // invisible (the catch only sees network throws): the field showed
        // the typed URL, nothing persisted, dispatch kept using the old one.
        if (cfgErr) throw new Error(`edge fn url save failed: ${String(cfgErr).slice(0, 200)}`);
      } catch(e) {
        console.error("Edge Function URL save failed:", e);
        // Same body-based classification as the autosave — a permissions
        // denial is not a connectivity problem.
        const m = String(e?.message || e);
        showToast(/42501|row-level security|\b403\b/i.test(m)
          ? "Couldn't save the Edge Function URL — your account doesn't have permission."
          : "Couldn't save the Edge Function URL — check your connection.", "error");
      }
    }, 500);
    return () => clearTimeout(timer);
  }, [loaded, edgeFunctionUrl, canWriteBlob]);

  // ─── Periodic snapshot safety net ───
  // The destructive buttons snapshot on their own, but corruption can also
  // arrive through ordinary saves. Once per session (and at most once every
  // 6h across sessions), capture a snapshot after load so there is always a
  // recent restore point. Scheduler/admin only — the same people whose
  // destructive actions already write snapshots. Best-effort: a failure here
  // must never block the app. A15: it passes minWeeks as the destructive
  // captures do, so a schedule read that comes back EMPTY while weeks are
  // known (the anon/RLS shape) fails the capture instead of saving a snapshot
  // whose schedule is {} (restoring that deletes every week) — and so it
  // waits for the engine's first read, before which no weeks are known.
  const sessionSnapRef = useRef(false);
  useEffect(() => {
    if (!loaded || sessionSnapRef.current || !schedSync.seeded) return;
    if (!(isScheduler || userProfile?.role === "admin")) return;
    sessionSnapRef.current = true;
    snapshots.captureIfStale("periodic_session", 6, { minWeeks: Object.keys(schedSyncRef.current.knownSchedule()).length ? 1 : 0 });
  }, [loaded, isScheduler, userProfile, schedSync.seeded]);

  // ─── Reset all data ───
  const resetAllData = async () => {
    // This session, at the tap (review r3 regress-3): after each await below,
    // a sign-out / another account meanwhile (the epoch moved) ends the reset
    // there, silently — nothing more of it is sent as the next account, and
    // nothing of it is said on the next session's screen.
    const ep = sessionEpochRef.current;
    // Gate: scheduler or the admin account only.
    if (!isScheduler && userProfile?.role !== "admin") {
      alert("Only a scheduler or the admin account can reset all data.");
      return;
    }
    // …and the edit gate (the schedule loaded, the sign-in live, no other
    // clear / reset / restore / publish queued or running), before anything
    // is asked or written: the reset deletes every week.
    if (!schedEditable("job")) return;
    // Typed confirmation — a single mis-tap can no longer wipe the schedule.
    const typed = prompt(
      "⚠ This permanently clears the ENTIRE saved schedule for everyone " +
      "(schedule, vacations, APP shifts, counts).\n\n" +
      "APP day-off entries are KEPT (by design — transcribed reference data " +
      "a schedule reset shouldn't eat); clear them chip-by-chip if needed.\n\n" +
      "A snapshot is saved first so it can be restored, but you should also " +
      "Export a JSON backup before doing this.\n\n" +
      'Type  RESET  (all caps) to confirm:'
    );
    if (typed !== "RESET") {
      setSaveStatus("Reset cancelled");
      setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    // Snapshot the current persisted row before wiping it. If the snapshot
    // can't be written there is no way back, so the reset is refused.
    const resetSnap = await snapshots.capture("reset_all_data", { minWeeks: Object.keys(schedSyncRef.current.knownSchedule()).length ? 1 : 0 });
    if (sessionEpochRef.current !== ep) return;
    if (!resetSnap.ok) {
      showToast("Couldn't save a backup snapshot — reset cancelled. Nothing was deleted.", "error");
      setSaveStatus("Reset cancelled");
      setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    // The edit gate again, after the snapshot's await — before the first write.
    if (!schedEditable("job")) {
      setSaveStatus("Reset cancelled");
      setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    logAudit("system.factory_reset", "⚠ FACTORY RESET — wiped all schedule data back to defaults");
    allowWipeSaveRef.current = true;   // authorize the intended empty write
    everHadRealDataRef.current = false; // wipe is intentional; re-arm only when real data returns
    // ABORTING the reset (a clear failed, or the session changed): restore the
    // two guard refs armed above. CRITICAL — leaving allowWipeSaveRef=true would
    // hand the next autosave a live one-shot empty-write authorization, and
    // everHadRealDataRef=false would disarm the empty-save guard — exactly the
    // transient-empty race the guard exists to close.
    // (It also ends the reset's hold on the setup autosave — resetBusyRef,
    // review r6 broke-1: the screen and the server agree again by then.)
    const unarm = () => { resetBusyRef.current = false; allowWipeSaveRef.current = false; everHadRealDataRef.current = true; };
    // The reset's own setup, on this screen — what the stored setup is cleared
    // to (the full reset below; and a half-landed one, so the screen matches
    // the server and no later autosave quietly writes the old setup back).
    const resetSetupHere = () => { setSurgeons(INIT_SURGEONS); setApps(INIT_APPS); setBackupMondaySet(new Set()); setFierceBackupSet(new Set()); setPriorCounts({}); setYear1Counts({}); setStartMonth(4); setStartYear(2026); };
    // The stored-data clears, ONE AT A TIME (review r3 fixes-2; the time off,
    // third, review r4 fixes-2 — below): the APP
    // shifts only once the setup is cleared — sent together, either could land
    // while the other failed, and the reset still said "Nothing was changed".
    // Both fail closed. upsert returns {error} on HTTP failure WITHOUT
    // throwing (and throws when the network fails: no answer, so the outcome
    // is unknown), so each is checked. The app_shifts_data clear is the
    // critical one: NOTHING retries it (the autosave never writes that
    // table), so a silent failure meant old APP shifts resurrected after a
    // "successful" reset.
    const clearRow = async (table, data) => {
      try { const { error } = await supabase.from(table).upsert({ id: "main", data, updated_at: new Date().toISOString() }); return error ? { ok: false, error } : { ok: true }; }
      catch (e) { return { ok: false, error: e, unanswered: true }; }
    };
    // From the setup clear to the final run the setup autosave writes nothing
    // (review r6 broke-1): a render in any of the three clears' gaps — a
    // pulled week, the 60-s poll's time off, a realtime event — shows the OLD
    // setup while the server's is cleared; its debounce, firing before the
    // reset ends, wrote that old setup back over the cleared blob (and used
    // up the one-shot bypass, so the reset's own write was then blocked).
    resetBusyRef.current = true;
    const blobClear = await clearRow("call_schedule_data", { _intentionalClear: true });
    if (sessionEpochRef.current !== ep) { unarm(); return; } // another session now: the APP shifts are not cleared as the next account
    const appClear = blobClear.ok ? await clearRow("app_shifts_data", {}) : null;
    if (sessionEpochRef.current !== ep) { unarm(); return; } // …nor anything after it: no weeks job as the next account, no message
    if (!blobClear.ok || !appClear.ok) {
      console.error("Factory reset: clearing stored data failed:", (blobClear.ok ? appClear : blobClear).error);
      unarm();
      if (blobClear.ok) {
        // The setup WAS cleared on the server — the APP shifts not: the reset
        // stops there. The screen takes the reset's setup too (it matches the
        // server); the APP shifts, time off and weeks stay as they are. Said
        // exactly so — never "Nothing was changed".
        resetSetupHere();
        showToast("Factory reset: the setup was reset, but clearing the APP shifts failed — so the time off and the schedule weeks were left as they are. Run the reset again, or restore the \"Before factory reset\" snapshot.", "error");
        return;
      }
      // The setup clear failed — so nothing else was sent. Refused (an HTTP
      // failure): nothing was changed. No answer (the network): it may have
      // landed — said so, and how to finish or undo it.
      showToast(blobClear.unanswered
        ? "Couldn't clear the stored data — reset cancelled. The server didn't answer, so the setup may have been reset; nothing else was. Run the reset again, or restore the \"Before factory reset\" snapshot."
        : "Couldn't clear the stored data — reset cancelled. Nothing was changed.", "error");
      setSaveStatus("Reset cancelled");
      setTimeout(() => setSaveStatus(""), 2000);
      return;
    }
    // Both landed. The third clear, the time off (review r4 fixes-2: it used
    // to be sent un-awaited and unchecked, and "Reset complete" followed
    // whatever it did): awaited and checked, in the same chain — sent only
    // once the setup and the APP shifts are cleared, and the weeks job only
    // once it has landed. Failed, the reset stops there and says exactly what
    // was reset — the setup and the APP shifts — and what wasn't: the time off
    // (still shown, as the server still holds it) and the weeks. No answer:
    // it may have landed — said so. Its own generic toast is this message
    // instead (quiet); and nothing at all after a session change.
    const toClear = await toClearAll(undefined, { quiet: true });
    // The reset's setup and APP shifts go on this screen only AFTER that
    // await (review r5 regress-1). Put there before it (21/n), a render in the
    // gap — the reset's setup beside the OLD weeks and time off, not a wiped
    // payload — re-armed the empty-save guard (everHadRealDataRef, disarmed
    // above on purpose): every setup change after the reset was then blocked
    // ("⚠ Save blocked — empty data not written"), and with a DELETE slower
    // than the autosave's debounce the gap's write used up the one-shot
    // bypass, so the reset's own final write was blocked too. Stopped here —
    // the session changed, or the time-off clear failed — they go on screen
    // now, before unarm() and the message (the server holds them); landed,
    // below, in the same synchronous run as the empty schedule: ONE render,
    // with the weeks and the time off already empty (as before 21/n).
    if (sessionEpochRef.current !== ep || !toClear || !toClear.ok) { resetSetupHere(); setAppShifts({}); }
    if (sessionEpochRef.current !== ep) { unarm(); return; } // another session now: no weeks job as the next account, nothing said
    if (!toClear || !toClear.ok) {
      console.error("Factory reset: clearing the time off failed", toClear && toClear.unanswered ? "(no answer)" : "");
      unarm();
      showToast(toClear && toClear.unanswered
        ? "Factory reset: the setup and the APP shifts were reset, but the time-off clear got no answer — so the time off may have been cleared, and the schedule weeks were left as they are. Run the reset again, or restore the \"Before factory reset\" snapshot."
        : "Factory reset: the setup and the APP shifts were reset, but clearing the time off failed — so the time off and the schedule weeks were left as they are. Run the reset again, or restore the \"Before factory reset\" snapshot.", "error");
      return;
    }
    // All three landed: this screen takes the reset's setup and APP shifts
    // now, with the empty schedule below (no await between: one render).
    // The reset's hold on the setup autosave ends here, and the empty-save
    // guard is disarmed again (review r6 broke-1): a time-off read answering
    // in the gaps (the 60-s poll's loadTimeOff, with rows read before the
    // DELETE committed) arms it directly — left armed, every setup change
    // after the reset was "⚠ Save blocked".
    resetBusyRef.current = false;
    everHadRealDataRef.current = false;
    resetSetupHere(); setAppShifts({});
    // Every week deleted: an authoritative engine job with its own grant. If
    // it can't write (table unreadable, signed out, cancelled at its deadline)
    // the weeks on screen go back as they were (`before`) — and ONE message
    // says what DID happen (review r1 app-4): the setup, APP shifts and time
    // off were reset above, before this job; only the weeks were not cleared.
    // The engine's reason says "nothing was changed" — of the weeks — so that
    // clause is dropped here. A partly failed one carries the engine's detail
    // (r.notice). The same message when the job ends after its deadline
    // (`late`, E8 — review r2 fixes-1: the engine's own text said "nothing was
    // changed" after the setup had been reset). "Reset complete" only once
    // every week is cleared too (while it runs, the header says "Clearing…").
    const weeksNotCleared = (r) => {
      if (!r || r.ok) return null;
      const why = r.error && String(r.error).replace(/ — nothing was changed\./, ".").replace(/ Nothing was changed\./, "");
      return why ? `Factory reset: the setup, APP shifts and time off were reset, but the schedule weeks were NOT cleared: ${why} Run the reset again, or restore the "Before factory reset" snapshot.`
        : "Factory reset: the schedule wasn't fully cleared. " + (r.notice || `${schedSyncRef.current.pending().length} week(s) not deleted yet — retrying automatically.`);
    };
    const tellWeeks = (r) => {
      if (sessionEpochRef.current !== ep) return; // another session now (review r3 regress-3): nothing is said on its screen
      if (r.skipped === "reset" || r.skipped === "cancelled") return; // fenced by a sign-out: another session now — nothing is said on its screen
      if (r.running) { showToast(r.error, "info"); return; }
      if (r.ok) { setSaveStatus("Reset complete"); setTimeout(() => setSaveStatus(""), 2000); return; }
      showToast(weeksNotCleared(r), "error");
    };
    // …and never while another clear / reset / restore / publish is queued or
    // running by now — one requested during the stored-data clears above
    // (review r2 regress-1): the weeks are left as they are, said as above.
    const busyJob = schedSyncRef.current.jobPending();
    if (busyJob) tellWeeks({ ok: false, wrote: false, error: `${schedSyncRef.current.jobLabel(busyJob)} is still running — wait for it to finish.` });
    else {
      const before = scheduleRef.current; // the weeks as shown — what a refused job puts back (E4)
      commitSchedule({});
      runAuthoritativeSchedule({}, "reset", null, before, weeksNotCleared).then(tellWeeks);
    }
  };

  // ─── Push Notifications — sent via send-push Edge Function ───
  // The OneSignal REST API key lives server-side in Supabase secrets.
  // Client only sends { title, message, targetIds? } to the Edge Function,
  // which proxies to OneSignal. If targetIds is a non-empty array, only those
  // person_ids (mapped via OneSignal external_id aliases) receive the push.
  // Otherwise it broadcasts to all subscribed users.
  //
  // deepLinkUrl: if provided, Edge Function forwards to OneSignal as the
  // click-action URL so tapping the push opens the app at the relevant tab/week.
  // ep (review r4 fixes-3): the session it is sent for (sessionEpochRef, at
  // the call by default) — its failure is never told on the next session's
  // screen (signed out, or another account, while it was out). The same for
  // addNotification and sendEmailNotif below: every notice path (a publish's,
  // a trade's, a swap's) is fenced inside them, after each of their awaits.
  const sendPushNotif = useCallback(async (title, message, targetIds = null, deepLinkUrl = null, ep = sessionEpochRef.current) => {
    if (!edgeFunctionUrl) return;
    // Derive send-push URL from the configured send-notification URL
    // (they share the /functions/v1/ base path).
    const pushUrl = edgeFunctionUrl.replace(/\/[^/]+$/, "/send-push");
    try {
      const body = { title, message };
      if (Array.isArray(targetIds) && targetIds.length > 0) {
        body.targetIds = targetIds;
      }
      if (deepLinkUrl) body.url = deepLinkUrl;
      await fetch(pushUrl, {
        method: "POST",
        headers: dbAuthHeaders(), // send the user's JWT (or anon fallback) — send-push gateway is verify_jwt=true and rejects no-auth
        body: JSON.stringify(body),
      });
    } catch(e) { console.error("Push notification error:", e); if (sessionEpochRef.current === ep) showToast("Couldn't send the push notification — check your connection.", "error"); }
  }, [edgeFunctionUrl]);

  // Build a deep-link URL for a notification. Routes users to the relevant
  // tab (and calendar week if applicable) when they tap the push.
  // Returns an absolute URL based on the current origin + pathname so it
  // works regardless of which host serves the PWA.
  const buildDeepLink = useCallback((type, data) => {
    try {
      const base = window.location.origin + window.location.pathname;
      let tab = null;
      let week = null;
      switch (type) {
        case "schedule_changed":
        case "schedule_published":
        case "shift_reminder":
          tab = "calendar";
          if (data?.week && /^\d{4}-\d{2}-\d{2}$/.test(data.week)) week = data.week;
          break;
        case "vacation_submitted":
        case "vacation_approved":
        case "vacation_denied":
        case "vacation_revoked":
        case "trade_submitted":
        case "trade_accepted":
        case "trade_declined":
          tab = "requests";
          break;
        default:
          return null;
      }
      const params = new URLSearchParams();
      if (tab) params.set("tab", tab);
      if (week) params.set("week", week);
      const q = params.toString();
      return q ? `${base}?${q}` : base;
    } catch(e) { return null; }
  }, []);

  // ─── Push Notification Filter ───
  // Filters a list of targetIds down to those whose per-channel push flag is
  // not disabled for this notification type. Must be declared BEFORE
  // addNotification (which references it in its deps).
  const filterPushTargetsByType = useCallback((type, targetIds) => {
    if (!Array.isArray(targetIds) || targetIds.length === 0) return targetIds;
    const currentPrefs = notifPrefsRef.current || {};
    return targetIds.filter(sid => {
      const prefs = currentPrefs[sid];
      if (!prefs) return true; // no row = default on
      if (type === "test") return true;
      if ((type === "schedule_published" || type === "schedule_changed" || type === "trade_submitted" || type === "trade_accepted" || type === "trade_declined") && prefs.schedule_changes_push === false) return false;
      if ((type === "vacation_approved" || type === "vacation_denied" || type === "vacation_submitted" || type === "vacation_revoked" || type === "vacation_deadline_reminder") && prefs.vacation_updates_push === false) return false;
      if (type === "shift_reminder" && prefs.shift_reminders_push === false) return false;
      return true;
    });
  }, []);

  // ─── Add Notification ───
  // pushTargetIds: optional array of person_ids to scope the push notification to.
  // If omitted, the push is a broadcast (useful for group-wide events like
  // "Schedule Published"). Targeted push is used for manual edits, trades, etc.
  // Per-channel push gating: if pushTargetIds is provided, it's filtered by
  // each user's per-category push flag before send.
  // ep (review r4 fixes-3): the session it is for — sessionEpochRef at the
  // call unless the caller passes the one it took at its tap. The push goes
  // out AFTER the notice's insert is awaited: a session change meanwhile (a
  // sign-out, "Sign in again" on another account) stops it there — no push,
  // nothing put in the next session's list, nothing said on its screen.
  const addNotification = useCallback(async (type, title, message, data = {}, pushTargetIds = null, ep = sessionEpochRef.current) => {
    try {
      const notif = { type, title, message, data, created_at: new Date().toISOString() };
      const { data: inserted, error: insertErr } = await db.insert("notifications", notif);
      if (sessionEpochRef.current !== ep) { if (insertErr) console.error("Notification insert failed:", insertErr); return; } // another session now
      if (insertErr) { console.error("Notification insert failed:", insertErr); showToast("Couldn't save that notification.", "error"); }
      if (inserted) setNotifications(prev => [inserted, ...prev].slice(0, 50));
      // Also send as device push via OneSignal, with a deep-link URL so tap
      // navigates to the relevant tab/week.
      const deepLinkUrl = buildDeepLink(type, data);
      // Filter push targets by per-channel preferences
      const filteredTargets = pushTargetIds ? filterPushTargetsByType(type, pushTargetIds) : null;
      // If we filtered and the result is empty, skip push entirely (don't broadcast).
      if (pushTargetIds && (!filteredTargets || filteredTargets.length === 0)) {
        console.log(`[push-skip] all ${pushTargetIds.length} target(s) opted out for type=${type}`);
      } else {
        sendPushNotif(title, message, filteredTargets, deepLinkUrl, ep);
      }
    } catch(e) { console.error("Notification error:", e); if (sessionEpochRef.current === ep) showToast("Couldn't send the notification — check your connection.", "error"); }
  }, [sendPushNotif, buildDeepLink, filterPushTargetsByType]);

  // ─── Email Notifications via Supabase Edge Function ───
  // Recipient resolution + per-category email gating happen SERVER-SIDE in the
  // send-notification function (service-role, sees every prefs row). The client
  // sends only the notification type, template data, and optional targetIds.
  // This is what makes cross-user emails work from non-scheduler devices, whose
  // JWT can only read their own notification_preferences row.
  const sendEmailNotif = useCallback(async (type, data, targetIds = null, ep = sessionEpochRef.current) => { // (ep: as addNotification's — review r4 fixes-3)
    if (!edgeFunctionUrl) return;
    if (sessionEpochRef.current !== ep) return; // (a caller's tap from another session: nothing sent from this one)
    // A targeted send with an EMPTY target list means "no recipients", not
    // broadcast — e.g. schedulerAdminIds is [] until profiles load. Omitting
    // targetIds is what requests a broadcast, so never send an empty list's
    // request at all (matches the pre-server-side behavior: nothing sent).
    if (Array.isArray(targetIds) && targetIds.length === 0) return;
    try {
      const body = { type, data };
      if (Array.isArray(targetIds)) body.targetIds = targetIds;
      const res = await fetch(edgeFunctionUrl, {
        method: "POST",
        // dbAuthHeaders, not the bare anon key: send-notification is moving to
        // require a verified user JWT (it emails through our Resend account on
        // request). Same broadening PR #10 did for send-push. Deliberately NOT
        // the expiry-aware read headers — a send with a dead token must 401
        // into the failure toast below, never silently degrade to anon.
        headers: dbAuthHeaders(),
        body: JSON.stringify(body),
      });
      const result = await res.json().catch(() => null);
      if (!res.ok || (result && result.failed > 0)) {
        console.warn("Email notification issue:", type, res.status, JSON.stringify(result));
        if (sessionEpochRef.current === ep) showToast("Some notification emails didn't send.", "error");
      }
    } catch(e) { console.error("Email notification error:", e); if (sessionEpochRef.current === ep) showToast("Couldn't send email notifications — check your connection.", "error"); }
  }, [edgeFunctionUrl]);

  // ─── Vacation Request: Submit ───
  // In-flight guards for the two request submits (a double tap files once).
  const vacSubmitBusyRef = useRef(false);
  const tradeSubmitBusyRef = useRef(false);
  const submitVacRequest = useCallback(async () => {
    // A double tap must not file the request twice (2026-10-11) — checked
    // first, so a tap during the insert runs no validation; it says it is
    // still sending (the button has no busy state, and on bad wifi a silent
    // no-op looks like a dead button).
    if (vacSubmitBusyRef.current) { showToast("Still sending your last request — one moment.", "info"); return; }
    if (!vacReqSurgeon || !vacReqStart || !vacReqEnd) { showToast("Pick who it's for and both dates first.", "error"); return; }
    const surgeonName = surgeons.find(s => s.id === vacReqSurgeon)?.name || apps.find(a => a.id === vacReqSurgeon)?.name || vacReqSurgeon;
    const isNoCall = vacReqType === "nocall";
    const kindLabel = isNoCall ? "no-call days" : "vacation";
    // The date inputs carry min={today}, but min is UI-only — a typed date
    // sails past it. This is the real gate, and it says WHY (fail-loud
    // contract): requests are forward-looking; past records are scheduler
    // record-keeping in Setup, where back-dating stays allowed on purpose.
    const reqTodayStr = fmt(new Date());
    if (vacReqStart < reqTodayStr || vacReqEnd < reqTodayStr) {
      showToast(`Requests are for upcoming time off — ${vacReqStart < reqTodayStr ? "the start date" : "the end date"} is in the past. If a past ${kindLabel} record needs correcting, ask the scheduler to enter it directly in Setup.`, "error");
      return;
    }
    if (vacReqEnd < vacReqStart) { showToast("The end date is before the start date.", "error"); return; }
    vacSubmitBusyRef.current = true;
    // This session, at the tap (review r5 fix-1): the request is sent with
    // this account's headers (db.insert's, at the call); after a session
    // change during it, nothing more of it is done, sent or said in the next
    // session — no list update, no form cleared, no toast, no notice or e-mail.
    const ep = sessionEpochRef.current;
    const live = () => sessionEpochRef.current === ep;
    try {
      const req = {
        surgeon_id: vacReqSurgeon, surgeon_name: surgeonName,
        start_date: vacReqStart, end_date: vacReqEnd,
        reason: vacReqReason, status: "pending",
        request_type: vacReqType,
        submitted_at: new Date().toISOString(),
      };
      // db.insert returns { data:null, error } on an HTTP failure (it does not
      // throw): a 401 / 403 / RLS refusal used to clear the form and say
      // nothing (fail-loud contract, 2026-10-11). Now it says why and keeps it.
      const { data: inserted, error: insertErr } = await db.insert("vacation_requests", req);
      if (!live()) { if (!inserted) console.error("vacation request insert failed:", insertErr); return; } // (review r5 fix-1) another session now
      if (!inserted) {
        console.error("vacation request insert failed:", insertErr);
        showToast(`Couldn't send your ${kindLabel} request — ${writeFailReason(insertErr)}. Nothing was sent; your entries are still here.`, "error");
        return;
      }
      setVacRequests(prev => [inserted, ...prev]);
      // Filed: clear the form and say so BEFORE notifying — a notification
      // failure toasts after this, so it is the message left on screen.
      setVacReqStart(""); setVacReqEnd(""); setVacReqReason(""); setVacReqType("vacation");
      showToast(`${isNoCall ? "No-call" : "Vacation"} request sent.`, "success");
      await addNotification("vacation_submitted", isNoCall ? "No-Call Request" : "Vacation Request",
        `${surgeonName} requested ${kindLabel} ${vacReqStart} to ${vacReqEnd}`, { surgeon_id: vacReqSurgeon }, schedulerAdminIds, ep);
      if (!live()) return; // (review r5 fix-1) another session now: no e-mail sent from it
      sendEmailNotif("vacation_submitted", { surgeon_name: surgeonName, surgeon_id: vacReqSurgeon, start_date: vacReqStart, end_date: vacReqEnd, reason: vacReqReason, request_type: vacReqType }, schedulerAdminIds, ep);
    } catch(e) { console.error("Submit request error:", e); if (live()) showToast("Couldn't submit your request — check your connection and try again.", "error"); }
    finally { vacSubmitBusyRef.current = false; }
  }, [vacReqSurgeon, vacReqStart, vacReqEnd, vacReqReason, vacReqType, surgeons, apps, addNotification, sendEmailNotif, schedulerAdminIds]);

  // ─── A request's status, set back after a session change (review r5 fix-1) ───
  // A vacation request's approve / revoke / edit whose status write landed
  // while the session ended (a sign-out, or "Sign in again" landing on another
  // account — the tap's sessionEpochRef moved) is not carried on in the next
  // session: its write is set back here WITH THE TAP'S HEADERS (tapH — the
  // account that tapped, never the next one's token), only from the value
  // this tap wrote (`filter`), and believed only when exactly that one row
  // comes back (a 200 with no row is RLS refusing it, or the row changed
  // meanwhile). If it can't be, it is logged — the console, and an audit line
  // written as the account that tapped — for a manual fix. Nothing is said:
  // the screen is the next session's. As acceptTradeRequest's abandon (H2).
  const setBackRequest = async (id, filter, body, tapH, what, audit) => {
    let why = "";
    try {
      const b = await fetch(`${SUPABASE_URL}/rest/v1/vacation_requests?id=eq.${id}&${filter}`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(body),
      });
      const back = b.ok ? await b.json().catch(() => null) : null;
      if (Array.isArray(back) && back.length === 1) return true;
      why = b.ok ? `${Array.isArray(back) ? back.length : "no"} row(s) came back` : `HTTP ${b.status} ${await b.text().catch(() => "")}`;
    } catch (e) { why = String(e && e.message || e); }
    console.error(`${what} abandoned (the session changed while it was being saved), and the request could NOT be set back:`, id, why);
    logAudit(audit.action, `${audit.summary} — NOT applied: the session changed (a sign-out, or another account) while it was being saved; setting the request back failed — needs a manual fix`, { request_id: id, reverted: false }, tapH);
    return false;
  };

  // ─── Vacation Request: Approve ───
  const approveVacRequest = useCallback(async (req) => {
    // This session, at the tap (review r5 fix-1 — H2's pattern, as the
    // trade's accept), and its headers: after EVERY await below, a session
    // change meanwhile stops the approval there, silently — no time_off row
    // written (as the next account; or refused as anon, leaving an approved
    // request with no time off, which the generator schedules over), no
    // notice or e-mail, nothing said on the next session's screen. A request
    // this tap already marked approved is set back to pending with the tap's
    // headers (setBackRequest: logged and audited as this account if it can't be).
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    const isNoCall = req.request_type === "nocall";
    // Check if approving would exceed 4 surgeons off/unavailable
    const reqStart = parse(req.start_date);
    const reqEnd = parse(req.end_date);
    let d = new Date(reqStart);
    let maxOff = 0;
    while (d <= reqEnd) {
      const ds = fmt(d);
      const alreadyOff = surgeons.filter(s => s.id !== req.surgeon_id && (onVac(s.id, ds, vacations) || onVac(s.id, ds, noCallDays))).length + 1; // +1 for this request
      if (alreadyOff > maxOff) maxOff = alreadyOff;
      d = addD(d, 1);
    }
    if (maxOff > 4) {
      if (!confirm(`Warning: Approving this would put ${maxOff} surgeons off/unavailable at the same time (max 4). Approve anyway?`)) return;
    }
    try {
      const reviewerName = userProfile?.display_name || surgeons.find(s => s.id === mySurgeon)?.name || "A colleague";
      // Fail-closed status write with a pending precondition — same pattern
      // (and same reasons) as acceptTradeRequest: the old unchecked db.update
      // let a 401/5xx/RLS failure write the vacation into time_off while the
      // row stayed "pending" (re-approvable ≤60s later — and toAdd is a plain
      // INSERT, so a re-approve created DUPLICATE time_off rows). Zero rows
      // matched = already handled elsewhere (two-device race / withdrawn).
      const approveRes = await fetch(`${SUPABASE_URL}/rest/v1/vacation_requests?id=eq.${req.id}&status=eq.pending`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify({ status: "approved", reviewed_at: new Date().toISOString(), reviewed_by: reviewerName }),
      });
      if (!approveRes.ok) {
        console.error("Vacation approve status write failed:", approveRes.status, await approveRes.text().catch(() => ""));
        if (live()) showToast("Couldn't approve the request — nothing was changed. Check your connection and try again.", "error");
        return; // fail closed: no time_off write, no audit, no notifications
      }
      const approveRows = await approveRes.json().catch(() => []);
      // (review r5 fix-1) another session now — while the status PATCH was
      // out: no time_off row, no notice, nothing said in it; this tap's
      // approval set back to pending (with the tap's headers).
      if (!live()) {
        if (Array.isArray(approveRows) && approveRows.length) await setBackRequest(req.id, "status=eq.approved", { status: "pending", reviewed_at: null, reviewed_by: null }, tapH, "Vacation approval",
          { action: "request.approve_unapplied", summary: `Approval of ${req.surgeon_name}'s ${isNoCall ? "no-call" : "vacation"} request ${req.start_date} → ${req.end_date}` });
        return;
      }
      if (!Array.isArray(approveRows) || approveRows.length === 0) {
        showToast("This request was already handled or withdrawn — nothing was changed.", "error");
        return; // realtime/60s poll will refresh the visible status
      }
      setVacRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: "approved" } : r));
      // Auto-add to the right bucket: no-call requests go to noCallDays, vacations to vacations
      toAdd(req.surgeon_id, isNoCall ? "nocall" : "vacation", req.start_date, req.end_date);
      logAudit("request.approve", `Approved ${req.surgeon_name}'s ${isNoCall ? "no-call" : "vacation"} request: ${req.start_date} → ${req.end_date}`, { request_id: req.id, surgeon_id: req.surgeon_id });
      const kindLabel = isNoCall ? "no-call days" : "vacation";
      const approveTargets = [...new Set([req.surgeon_id, ...schedulerAdminIds].filter(Boolean))];
      await addNotification("vacation_approved", isNoCall ? "No-Call Approved" : "Vacation Approved",
        `${req.surgeon_name}'s ${kindLabel} ${req.start_date} to ${req.end_date} was approved`,
        { surgeon_id: req.surgeon_id }, approveTargets, ep);
      if (!live()) return; // (review r5 fix-1) another session now: no e-mail sent from it
      sendEmailNotif("vacation_approved", { surgeon_name: req.surgeon_name, surgeon_id: req.surgeon_id, start_date: req.start_date, end_date: req.end_date, request_type: req.request_type }, approveTargets, ep);
    } catch(e) { console.error("Approve error:", e); if (live()) showToast("Couldn't approve the request — check your connection and try again.", "error"); }
  }, [addNotification, sendEmailNotif, schedulerAdminIds, userProfile, surgeons, mySurgeon, vacations, noCallDays]);

  // ─── Vacation Request: Deny ───
  const denyVacRequest = useCallback(async (req, note = "") => {
    // This session, at the tap (review r5 fix-1 — as the trade's decline):
    // the denial (its status write) is this account's, done — but after a
    // session change meanwhile nothing more of it is done, sent or said in
    // the next session: no list update, no notice, no e-mail, no toast. Its
    // audit line is still written — as this account (the tap's headers).
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const live = () => sessionEpochRef.current === ep;
    const isNoCall = req.request_type === "nocall";
    const kindLabel = isNoCall ? "no-call days" : "vacation";
    const denyAudit = (hdrs) => logAudit("request.deny", `Denied ${req.surgeon_name}'s ${isNoCall ? "no-call" : "vacation"} request: ${req.start_date} → ${req.end_date}${note ? " (" + note + ")" : ""}`, { request_id: req.id, surgeon_id: req.surgeon_id }, hdrs);
    try {
      const reviewerName = userProfile?.display_name || surgeons.find(s => s.id === mySurgeon)?.name || "A colleague";
      // Fail-closed status write — same pattern as approve above (no bucket
      // write on this path, but an unchecked failure still left the row
      // pending: re-actionable, duplicate notifications/emails on re-deny).
      const denyRes = await fetch(`${SUPABASE_URL}/rest/v1/vacation_requests?id=eq.${req.id}&status=eq.pending`, {
        method: "PATCH",
        headers: { ...tapH, "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify({ status: "denied", reviewed_at: new Date().toISOString(), reviewed_by: reviewerName, review_note: note }),
      });
      if (!denyRes.ok) {
        console.error("Vacation deny status write failed:", denyRes.status, await denyRes.text().catch(() => ""));
        if (live()) showToast("Couldn't deny the request — nothing was changed. Check your connection and try again.", "error");
        return;
      }
      const denyRows = await denyRes.json().catch(() => []);
      if (!live()) { if (Array.isArray(denyRows) && denyRows.length) denyAudit(tapH); return; } // (review r5 fix-1) another session now: recorded as this account, nothing more
      if (!Array.isArray(denyRows) || denyRows.length === 0) {
        showToast("This request was already handled or withdrawn — nothing was changed.", "error");
        return;
      }
      setVacRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: "denied", review_note: note } : r));
      denyAudit();
      const denyTargets = [...new Set([req.surgeon_id, ...schedulerAdminIds].filter(Boolean))];
      await addNotification("vacation_denied", isNoCall ? "No-Call Denied" : "Vacation Denied",
        `${req.surgeon_name}'s ${kindLabel} ${req.start_date} to ${req.end_date} was denied${note ? ": " + note : ""}`,
        { surgeon_id: req.surgeon_id }, denyTargets, ep);
      if (!live()) return; // (review r5 fix-1) another session now: no e-mail sent from it
      sendEmailNotif("vacation_denied", { surgeon_name: req.surgeon_name, surgeon_id: req.surgeon_id, start_date: req.start_date, end_date: req.end_date, note, request_type: req.request_type }, denyTargets, ep);
    } catch(e) { console.error("Deny error:", e); if (live()) showToast("Couldn't deny the request — check your connection and try again.", "error"); }
  }, [addNotification, sendEmailNotif, schedulerAdminIds, userProfile, surgeons, mySurgeon]);

  // ─── Shift Trade Request: Submit ───
  const submitTradeRequest = useCallback(async () => {
    // A double tap must not propose the trade twice (2026-10-11) — checked
    // first, so a tap during the insert never re-runs the one-way / Silvis
    // prompts; it says it is still sending (same reason as the vacation submit).
    if (tradeSubmitBusyRef.current) { showToast("Still sending your last trade proposal — one moment.", "info"); return; }
    if (!tradeFrom || !tradeTo || !tradeWeek || !tradeShift) { showToast("Pick both people, the week and the shift first.", "error"); return; }
    // Two-way swap required unless scheduler emergency override
    if (!tradeReturnWeek || !tradeReturnShift) {
