  const calcTotal = (s) => calcShifts(s) + calcShiftsB(s);
  // Raw shift HEADCOUNT — every shift counts once, no weighting, 1st + 2nd call
  // combined. This is what surgeons actually tally when they eyeball the calendar
  // ("I'm on 12, he's on 14"), so it drives the Fairness Summary and the stats
  // Total column. (calcTotal above stays weighted for billing/RVU/cumulative
  // views, where service-week heaviness genuinely matters.)
  const calcRawCount = (s) => (s.dc||0) + (s.nights||0) + (s.wknd||0) + (s.dcB||0) + (s.nightsB||0) + (s.wkndB||0);


  // ─── Conflict Detection ───
  // silvisBusy overlaps in the PUBLISHED schedule — every (week, slot) FAK
  // holds whose window touches a Silvis PRIMARY day (hard, 🔴), plus Silvis
  // BACKUP touches as a soft note (🔵, never a block). Same future-week scope
  // as `conflicts` below. Honors dayCallOverrides and holiday precedence
  // exactly as the Silvis side's deriveKhanBusyDays does (sfOverlaps).
  const silvisConflicts = useMemo(() => {
    if (!silvisActive || isPublicMode) return [];
    const todayStr = fmt(new Date());
    const inScope = (o) => fmt(addD(parse(o.mondayStr), 6)) >= todayStr;
    const md = (ds) => { const d = parse(ds); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const who = nameOf(silvisFakId);
    // FEED HEALTH first — the always-visible net for "the rule is blind":
    // an empty cache, a failed last read, a stale cache, or published weeks
    // beyond the feed's horizon (Silvis publishes rolling 3-month periods;
    // the function caches [today-7, today+120]).
    // The three DATA-SOURCE lines (empty / failed / stale) are NOT dismissable
    // (owner decision 2026-09-24): they clear themselves once the feed is
    // healthy, and hiding one lets trades and edits go through against
    // missing or old Silvis days unnoticed (an empty feed blocks nothing).
    // "silvis-feed|empty" is a STATIC key — one dismissal would hide every
    // future outage. The horizon note stays dismissable (its key moves).
    const health = [];
    if (silvisRows.length === 0) health.push({ key: "silvis-feed|empty", dismissable: false, severity: "error", week: "feed", message: `Silvis feed is EMPTY${silvisLoadError ? " — " + silvisLoadError : ""} — rule silvisBusy cannot see ${who}'s Silvis call (sign in and refresh from Settings)` });
    else if (silvisLoadError) health.push({ key: `silvis-feed|failed|${silvisDays.fetchedAt || "none"}`, dismissable: false, severity: "error", week: "feed", message: `Silvis feed: last read FAILED (${silvisLoadError}) — using the previous cache` });
    else { const st = sfStatus(silvisDays.fetchedAt); if (st.stale) health.push({ key: `silvis-feed|stale|${silvisDays.fetchedAt || "none"}`, dismissable: false, severity: "warning", week: "feed", message: `Silvis feed is STALE (fetched ${st.ageHours === null ? "?" : st.ageHours + "h"} ago) — refresh from Settings` }); }
    if (silvisRows.length > 0 && silvisDays.to) {
      const beyond = Object.keys(schedule).filter(m => /^\d{4}-\d{2}-\d{2}$/.test(m) && m > silvisDays.to && inScope({ mondayStr: m })).sort();
      if (beyond.length) health.push({ key: `silvis-horizon|${silvisDays.to}|${beyond[0]}|${beyond.length}`, severity: "info", week: beyond[0], message: `${beyond.length} published week${beyond.length === 1 ? "" : "s"} from ${beyond[0]} lie beyond the Silvis feed horizon (${silvisDays.to}) — no Silvis data there yet; re-check after Silvis publishes` });
    }
    const hard = sfOverlaps(schedule, silvisDays.primary, silvisFakId).filter(inScope)
      .map(o => ({ key: `silvis|${silvisFakId}|${o.mondayStr}|${o.slot}|${o.day}`, severity: "error", week: o.mondayStr, message: `${who}: Silvis primary + Davenport ${o.label}, ${md(o.day)}` }));
    // RULE 1 (owner 2026-10-12): a Silvis primary on the SUNDAY after his
    // Davenport service week (the service-week surgeon must be free that Sunday).
    const sunday = Object.keys(schedule).filter(m => /^\d{4}-\d{2}-\d{2}$/.test(m) && schedule[m] && schedule[m].dayCall === silvisFakId && inScope({ mondayStr: m }))
      .filter(m => silvisDays.primary && silvisDays.primary.has(fmt(addD(parse(m), 6))))
      .map(m => { const sun = fmt(addD(parse(m), 6)); return { key: `silvis-sun|${silvisFakId}|${m}|${sun}`, severity: "error", week: m, message: `${who}: Silvis primary Sun ${md(sun)} — the Sunday of the Davenport service week of ${md(m)}` }; });
    // RULE 2 across the two jobs (owner 2026-10-13): a Davenport overnight of
    // his on the date right before or after a Silvis primary 24h is two
    // overnights in a row (the generator allows it only as his last resort).
    const adj = [];
    [...(silvisDays.primary || [])].sort().forEach(D => [-1, 1].forEach(o => {
      const N = fmt(addD(parse(D), o));
      if (overnightHolderOn(schedule, N) !== silvisFakId) return;
      const nd = parse(N), mN = fmt(addD(nd, nd.getDay() === 0 ? -6 : 1 - nd.getDay()));
      if (!inScope({ mondayStr: mN })) return;
      adj.push({ key: `silvis-adj|${silvisFakId}|${D}|${N}`, severity: "warning", week: mN,
        message: o < 0 ? `${who}: Davenport overnight ${dayMonthLabel(N)} → Silvis primary ${dayMonthLabel(D)} — two overnights in a row across the two jobs`
                       : `${who}: Silvis primary ${dayMonthLabel(D)} → Davenport overnight ${dayMonthLabel(N)} — two overnights in a row across the two jobs` });
    }));
    return health.concat(hard, sunday, adj);
  }, [schedule, silvisActive, silvisDays, silvisFakId, surgeons, isPublicMode, silvisRows, silvisLoadError]);
  // Silvis BACKUP touches — standby, never a block, never a warning: shown
  // on the Silvis feed card only (they used to summon the warning panel).
  const silvisSoftNotes = useMemo(() => {
    if (!silvisActive || isPublicMode) return [];
    const todayStr = fmt(new Date());
    const md = (ds) => { const d = parse(ds); return `${d.getMonth() + 1}/${d.getDate()}`; };
    return sfOverlaps(schedule, silvisDays.backup, silvisFakId).filter(o => fmt(addD(parse(o.mondayStr), 6)) >= todayStr)
      .map(o => ({ week: o.mondayStr, short: `Davenport ${o.label} ${md(o.day)}` }));
  }, [schedule, silvisActive, silvisDays, silvisFakId, isPublicMode]);

  const conflicts = useMemo(() => {
    const issues = [];
    // PAST-WEEK EXEMPTION (pre-import blocker 3): warnings exist to prompt
    // fixes, and the past is unactionable — hand-lived history (trades,
    // holiday coverage, real-life swaps) legitimately violates generator
    // hard rules and must not light up warning cards. (Until 2026-09-24 the
    // cards rendered for EVERY viewer including ?public=1; the panel is now
    // internal-only — owner decision — and lines can be dismissed for
    // everyone by a scheduler, see dismissedWarnings.) Scan only weeks still in progress
    // or ahead (the week's Sunday is today or later). Dropping past weeks
    // also drops the past→current boundary check, whose Monday night is
    // already tonight-or-gone by then — equally unactionable. today is
    // computed when the memo re-runs (any schedule change); a session left
    // open across midnight re-floors on its next recompute, which is fine
    // for a warnings display.
    const todayStr = fmt(new Date());
    const mondayStrs = Object.keys(schedule).sort().filter(mStr => fmt(addD(parse(mStr), 6)) >= todayStr);
    const ids = surgeons.map(s => s.id);
    // DESIGNED holiday patterns (2026-10-11): exactly the pairs generator.js
    // holidayDesign pins to ONE surgeon — e.g. Christmas week (FAK's service
    // week + the Eve night + the weekend), a holiday's surgeon A on the
    // service week + the holiday 24h night. They are never conflicts, the same
    // rule listScheduleBends uses. (A card eve held by a surgeon who is NOT the
    // card's service-week holder is a real conflict and is still shown.) If
    // generator.js isn't loaded, nothing is waived — more lines, never fewer.
    const fakW = (surgeons.find(s => (s.name || "").toUpperCase() === "FAK") || {}).id || null;
    const design = typeof holidayDesign === "function" ? holidayDesign(holidayAssignments, mondayStrs, fakW, christmasSlotOk(buildGenAvailability(), vacations, buildSilvisPrimary())) : { pins: {}, eves: {} }; // the generator's own slot test (decision 3 where FAK can work it)
    const designed = (m1, s1, m2, s2, id) => !!(id && design.pins[m1] && design.pins[m1][s1] === id && design.pins[m2] && design.pins[m2][s2] === id);
    // Card coverage rows (date|surgeon, eve or not): a VACATION on one of these is
    // already the vacOverlapWarnings "holiday-vac" line — one fact, one line.
    const cardRows = new Set();
    Object.values(holidayAssignments || {}).forEach(arr => (Array.isArray(arr) ? arr : []).forEach(h => {
      (effectiveHolidayCoverage(h) || []).forEach(c => { if (c && c.date && c.surgeon) cardRows.add(c.date + "|" + c.surgeon); });
    }));
    const md = (ds) => { const d = parse(ds); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const codeOf = (id) => sMap[id]?.name || id;

    mondayStrs.forEach((mStr, wkIdx) => {
      const wk = schedule[mStr];
      const mon = parse(mStr);

      // Check back-to-back nights within the week
      const nightOrder = ["mon","tue","wed","thu"];
      for (let i = 0; i < nightOrder.length - 1; i++) {
        const a = wk.nights?.[nightOrder[i]];
        const b = wk.nights?.[nightOrder[i+1]];
        if (a && a === b && !designed(mStr, nightOrder[i], mStr, nightOrder[i+1], a)) {
          issues.push({ key: `consecutive|${mStr}|${a}|${nightOrder[i]}+${nightOrder[i+1]}`, type: "consecutive", severity: "error", week: mStr, message: `${sMap[a]?.name} has consecutive nights (${SHIFT_LABELS[nightOrder[i]]} + ${SHIFT_LABELS[nightOrder[i+1]]})` });
        }
      }

      // Check weekend → Mon night same person (hard rule violation)
      const wkndSurgeon = wk.nights?.wknd;
      if (wkIdx < mondayStrs.length - 1) {
        const nextWk = schedule[mondayStrs[wkIdx + 1]];
        if (wkndSurgeon && nextWk?.nights?.mon === wkndSurgeon && !designed(mStr, "wknd", mondayStrs[wkIdx + 1], "mon", wkndSurgeon)) {
          issues.push({ key: `wknd-mon|${mStr}|${mondayStrs[wkIdx + 1]}|${wkndSurgeon}`, type: "consecutive", severity: "error", week: mStr, message: `${sMap[wkndSurgeon]?.name} has Weekend then Mon night the next week` });
        }
        // Check service week surgeon → Mon night next week (hard rule).
        // Exempt the Monday-holiday convention: Surgeon A legitimately holds
        // the service week the week BEFORE a Monday holiday AND covers that
        // holiday's 24h shift (with a full Sunday of rest in between). When
        // next week's Monday is holiday-24h-covered, nextWk.nights.mon is the
        // holiday surgeon — not a real Monday-night assignment — so this isn't
        // a service-week→Mon-night violation. (e.g. RPC before Labor Day.)
        if (wk.dayCall && nextWk?.nights?.mon === wk.dayCall) {
          const nextMonStr = mondayStrs[wkIdx + 1];
          const nextHolCov = nextWk.holidayCoverage || {};
          if (!nextHolCov[nextMonStr] && !designed(mStr, "dayCall", nextMonStr, "mon", wk.dayCall)) {
            issues.push({ key: `svc-mon|${mStr}|${nextMonStr}|${wk.dayCall}`, type: "consecutive", severity: "error", week: mStr, message: `${sMap[wk.dayCall]?.name} has Service Week then Mon night the next week` });
          }
        }
      }

      // Check DC surgeon also on night same week (should not happen, unless holiday 24h covers that day)
      if (wk.dayCall) {
        const holCov = wk.holidayCoverage || {};
        nightOrder.forEach(sk => {
          if (wk.nights?.[sk] === wk.dayCall) {
            const nightDate = fmt(addD(mon, {mon:0,tue:1,wed:2,thu:3}[sk]));
            // Skip if this day is covered by holiday 24h (the same surgeon covering both is intentional)
            if (holCov[nightDate]) return;
            // …or if the cards DESIGN this pair (e.g. Christmas: FAK's service week + the Eve night)
            if (designed(mStr, "dayCall", mStr, sk, wk.dayCall)) return;
            issues.push({ key: `svc-night|${mStr}|${wk.dayCall}|${sk}`, type: "double", severity: "error", week: mStr, message: `${sMap[wk.dayCall]?.name} is on Service Week AND ${SHIFT_LABELS[sk]} (same week)` });
          }
        });
        if (wk.nights?.wknd === wk.dayCall) {
          const friD = fmt(addD(mon, 4));
          const sunD = fmt(addD(mon, 6));
          if (!holCov[friD] && !holCov[sunD] && !designed(mStr, "dayCall", mStr, "wknd", wk.dayCall)) {
            issues.push({ key: `svc-wknd|${mStr}|${wk.dayCall}`, type: "double", severity: "error", week: mStr, message: `${sMap[wk.dayCall]?.name} is on Service Week AND Weekend (same week)` });
          }
        }
        // RULE 1 (owner 2026-10-12): the service-week surgeon must be free that
        // SUNDAY too — no vacation or no-call (Silvis primary: its own line in
        // silvisConflicts). Time off entered after publishing lands here.
        const sunS = fmt(addD(mon, 6));
        const sunKind = sunS >= todayStr ? (onVac(wk.dayCall, sunS, vacations || {}) ? "vacation" : onVac(wk.dayCall, sunS, noCallDays || {}) ? "no-call" : null) : null;
        if (sunKind) issues.push({ key: `svc-sun|${mStr}|${wk.dayCall}|${sunS}|${sunKind}`, type: "timeoff", severity: "error", week: mStr, message: `${codeOf(wk.dayCall)} is on Service Week ${md(mStr)} but is off Sun ${md(sunS)} (${sunKind}) — the service-week surgeon must be free that Sunday` });
      }
      // RULE 2 (owner 2026-10-12): Thu night + that weekend is two nights in a
      // row (Thu → Fri night) — unless the cards design it or a holiday 24h
      // holds that Friday.
      if (wk.nights?.thu && wk.nights.thu === wk.nights?.wknd) {
        const friT = fmt(addD(mon, 4));
        if (!(wk.holidayCoverage || {})[friT] && !designed(mStr, "thu", mStr, "wknd", wk.nights.thu)) {
          issues.push({ key: `thu-wknd|${mStr}|${wk.nights.thu}`, type: "consecutive", severity: "error", week: mStr, message: `${codeOf(wk.nights.thu)} has Thu night then the Weekend (Fri night) — two nights in a row` });
        }
      }

      // ON CALL WHILE OFF (owner decision 2026-10-11: vacation is a hard stop).
      // Time off entered AFTER publishing lands under existing shifts — the
      // generator can't see those. Per DATE, by weekHolders (helpers.js — the
      // calendar's own rule: a holiday-covered date credits its coverer, a
      // single-day override its override surgeon). Two kinds of line:
      //   - "<CODE> is on call <shift> <date> but is off (vacation | no-call)"
      //     — a shift whose own date is vacation or no-call;
      //   - "<CODE>'s <shift> <date> runs into their vacation starting <date>"
      //     — an overnight ending on a VACATION morning: a weeknight before a
      //     vacation day, the weekend before a vacation Monday, a holiday 24h
      //     before a vacation day. (A no-call next day is fine; the service
      //     week's Saturday is not checked against a Sunday start — the
      //     generator floor's rule.) Silvis primary days keep their own lines.
      // A run is dropped only once it is wholly past (a run in progress keeps its
      // full range, so its key — and any dismissal — stays the same); the
      // overnight "runs into" lines skip past dates. Dismissable like the rest.
      const hw = weekHolders(mStr, wk);
      const offKind = (id, ds) => onVac(id, ds, vacations || {}) ? "vacation" : onVac(id, ds, noCallDays || {}) ? "no-call" : null;
      const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const dayLbl = (ds) => `${DOW[parse(ds).getDay()]} ${md(ds)}`;
      // One leg = one (surgeon, shift FAMILY) on one date. Families: the
      // service week (Mon–Sat, incl. the Sat 24h) — "service day" when a
      // single-day override holder, not the week's service doctor; one weeknight;
      // the weekend (Fri night + Sun); one holiday 24h.
      const legs = [];
      hw.days.forEach(day => {
        if (day.cover && day.cover.sid) legs.push({ sid: day.cover.sid, fam: "cover|" + day.ds, label: `${holidayTitleName(day.cover)} 24h`, ds: day.ds, overnight: true });
        const svcId = day.svc || day.sat;
        if (svcId) legs.push({ sid: svcId, fam: svcId === wk.dayCall ? "svc" : "svcday", label: svcId === wk.dayCall ? "service week" : "service day", ds: day.ds, overnight: false });
        if (day.night) legs.push({ sid: day.night, fam: day.nightKey, label: `${DOW[parse(day.ds).getDay()]} night`, ds: day.ds, overnight: true });
        if (day.wkndFri) legs.push({ sid: day.wkndFri, fam: "wknd", label: "weekend", ds: day.ds, overnight: false });
        if (day.wkndSun) legs.push({ sid: day.wkndSun, fam: "wknd", label: "weekend", ds: day.ds, overnight: true });
      });
      // (a) ON its own off day — consecutive dates of one (surgeon, family, kind)
      // collapse into ONE line ("DJA is on call service week Mon 10/26–Sat 10/31
      // but is off (vacation)"); the key holds the facts, so a longer or shorter
      // run comes back as a new line. A vacation on a holiday card's own row is
      // the vacOverlapWarnings "holiday-vac" line already — not repeated here.
      const runs = [];
      legs.forEach(l => {
        const kind = offKind(l.sid, l.ds);
        if (!kind) return;
        if (kind === "vacation" && cardRows.has(l.ds + "|" + l.sid)) return;
        const last = runs[runs.length - 1];
        const next = (r) => fmt(addD(parse(r.to), r.fam === "wknd" && parse(r.to).getDay() === 5 ? 2 : 1)); // a weekend's Fri → Sun is one run
        if (last && last.sid === l.sid && last.fam === l.fam && last.kind === kind && next(last) >= l.ds && last.to <= l.ds) { last.to = l.ds; return; }
        const same = runs.find(r => r.sid === l.sid && r.fam === l.fam && r.kind === kind && next(r) === l.ds);
        if (same) { same.to = l.ds; return; }
        runs.push({ sid: l.sid, fam: l.fam, label: l.label, kind, from: l.ds, to: l.ds });
      });
      // A run is built from the WHOLE week, so its key (first..last day) stays the
      // same while it is in progress — a dismissal holds; only a run wholly in
      // the past is dropped (unactionable).
      runs.filter(r => r.to >= todayStr).forEach(r => {
        issues.push({ key: `on-off|${mStr}|${r.sid}|${r.fam}|${r.from}|${r.to}|${r.kind}`, type: "timeoff", severity: "error", week: mStr, message: `${codeOf(r.sid)} is on call ${r.fam === "svcday" && r.from !== r.to ? "service days" : r.label} ${NIGHT_KEYS.includes(r.fam) ? md(r.from) : r.from === r.to ? dayLbl(r.from) : dayLbl(r.from) + "–" + dayLbl(r.to)} but is off (${r.kind})` });
      });
      // (b) an overnight ending on a VACATION morning (not an off day itself):
      // a weeknight before a vacation day, the weekend's Sunday before a
      // vacation Monday (named by the weekend days that surgeon holds), a
      // holiday 24h before a vacation day. A no-call next day is fine.
      legs.forEach(l => {
        if (l.ds < todayStr || !l.overnight || offKind(l.sid, l.ds)) return;
        const next = fmt(addD(parse(l.ds), 1));
        if (!onVac(l.sid, next, vacations || {})) return;
        const fri = fmt(addD(parse(l.ds), -2));
        const shown = l.fam === "wknd" ? (legs.some(x => x.fam === "wknd" && x.sid === l.sid && x.ds === fri) ? `weekend ${md(fri)}–${md(l.ds)}` : `weekend (Sun ${md(l.ds)})`) : `${l.label} ${md(l.ds)}`;
        issues.push({ key: `into-vac|${mStr}|${l.sid}|${l.fam}|${l.ds}`, type: "timeoff", severity: "error", week: mStr, message: `${codeOf(l.sid)}'s ${shown} runs into their vacation starting ${dayLbl(next)}` });
      });
    });

    return issues;
  }, [schedule, surgeons, sMap, vacations, noCallDays, holidayAssignments, silvisActive, silvisFakId, silvisDays]);

  // ─── Vacation Overlap Warnings ───
  const vacOverlapWarnings = useMemo(() => {
    const warnings = [];
    if (!mondays.length) return warnings;
    const startDate = mondays[0];
    const endDate = addD(mondays[mondays.length - 1], 6);

    // Check each day in the schedule period
    let d = new Date(startDate);
    while (d <= endDate) {
      const ds = fmt(d);
      const surgeonsOff = surgeons.filter(s => onVac(s.id, ds, vacations));
      const appsOff = apps.filter(a => onVac(a.id, ds, vacations));

      if (surgeonsOff.length > 4) {
        warnings.push({ key: `surgeons-off|${ds}|${surgeonsOff.map(s => s.id).sort().join("+")}`, date: ds, severity: "error", message: `${surgeonsOff.length} surgeons off on ${ds} (max 4): ${surgeonsOff.map(s=>s.name).join(", ")}` });
      }
      if (appsOff.length > 2) {
        warnings.push({ key: `apps-off|${ds}|${appsOff.map(a => a.id).sort().join("+")}`, date: ds, severity: "info", message: `${appsOff.length} APPs off on ${ds} (prefer ≤2): ${appsOff.map(a=>a.name).join(", ")}` });
      }
      d = addD(d, 1);
    }

    // Holiday-coverage vs vacation conflict (group rule: a holiday's assigned
    // Surgeon A/B should not be on vacation during the holiday they cover).
    // Each coverage entry names the surgeon responsible for that date; if that
    // surgeon has vacation then, flag it at setup time.
    Object.values(holidayAssignments || {}).forEach(arr => {
      if (!Array.isArray(arr)) return;
      const fakV = (surgeons.find(s => (s.name || "").toUpperCase() === "FAK") || {}).id || null;
      arr.forEach(h => {
        effectiveHolidayCoverage(h).forEach(c => {
          if (!c.surgeon || !c.date) return;
          // a weekend eve inside FAK's Christmas design week is his when the cards give him that weekend (decision 3)
          const sid = c.isEve ? (holidayEveHolder(h, c.date, holidayAssignments, fakV, takesChristWknd) || c.surgeon) : c.surgeon;
          if (onVac(sid, c.date, vacations)) {
            warnings.push({ key: `holiday-vac|${h.date || ""}|${c.date}|${sid}`, date: c.date, severity: "error", message: `${sMap[sid]?.name || sid} is assigned ${h.name} coverage (${c.date}) but has vacation then — holiday surgeons can't be on vacation during their holiday` });
          }
        });
      });
    });

    return warnings;
  }, [mondays, surgeons, apps, vacations, noCallDays, holidayAssignments, sMap, silvisActive, silvisFakId, silvisDays]);

  // ─── Schedule Warnings: dismissals applied ───
  // Every viewer's panel reads THESE lists (header count and "+ more" too);
  // `hidden` = dismissed entries whose warning is still being produced — the
  // scheduler's "N dismissed · show" review list.
  const warnShown = useMemo(() => {
    const hid = new Set((dismissedWarnings || []).map(d => d && d.key).filter(Boolean));
    // dismissable:false lines are ALWAYS shown — a dismissal already stored
    // in the blob for one of their keys is inert — and never listed as hidden.
    const keep = (arr) => arr.filter(x => x.dismissable === false || !(x.key && hid.has(x.key)));
    const live = new Set([...silvisConflicts, ...conflicts, ...vacOverlapWarnings].filter(x => x.dismissable !== false).map(x => x.key).filter(Boolean));
    return {
      silvis: keep(silvisConflicts), conflicts: keep(conflicts), vac: keep(vacOverlapWarnings),
      hidden: (dismissedWarnings || []).filter(d => d && d.key && live.has(d.key)),
    };
  }, [silvisConflicts, conflicts, vacOverlapWarnings, dismissedWarnings]);
  // The line as the panel shows it (week prefix where the line carries one).
  const warnLineText = (x) => (x.week && x.week !== "feed" ? x.week + " · " : "") + x.message;
  const warnActor = () => userProfile?.display_name || surgeons.find(s => s.id === userProfile?.person_id)?.name || "a scheduler";
  // Dismiss for EVERYONE — schedulers/admins only (canWriteBlob: the blob is
  // where the dismissal lives). confirm() quoting the line comes BEFORE the
  // write; the audit row is the group's record of what was hidden and by whom.
  const dismissWarning = (x) => {
    if (!canWriteBlob || !x || !x.key || x.dismissable === false) return;
    const text = warnLineText(x);
    if (!confirm(`Dismiss this warning for EVERYONE?\n\n"${text}"\n\nIt stays hidden on every device until a scheduler restores it. If the underlying facts change, it comes back as a new warning.`)) return;
    const by = warnActor();
    setDismissedWarnings(prev => [...(prev || []).filter(d => d && d.key !== x.key), { key: x.key, text, by, at: new Date().toISOString() }]);
    logAudit("warning_dismissed", `${by} dismissed: ${text}`, { key: x.key });
  };
  const restoreWarning = (d) => {
    if (!canWriteBlob || !d || !d.key) return;
    const by = warnActor();
    setDismissedWarnings(prev => (prev || []).filter(e => e && e.key !== d.key));
    logAudit("warning_restored", `${by} restored: ${d.text || d.key}`, { key: d.key });
  };

  // ─── Yearly Summary Export ───
  const exportYearlySummary = useCallback(() => {
    const header = ["Surgeon","Svc Wk","Nights","Wknds","B-SW","B-Nights","B-Wknds","Total"];
    const rows = surgeons.map(s => {
      const cur = stats[s.id] || {};
      const pri = priorCounts[s.id] || {};
      const cumDc = (pri.dc||0) + (cur.dc||0);
      const cumN = (pri.nights||0) + (cur.nights||0);
      const cumW = (pri.wknd||0) + (cur.wknd||0);
      const cumDcB = (pri.dcB||0) + (cur.dcB||0);
      const cumNB = (pri.nightsB||0) + (cur.nightsB||0);
      const cumWB = (pri.wkndB||0) + (cur.wkndB||0);
      const total1 = calcShifts({dc:cumDc,nights:cumN,wknd:cumW,totalDays:(pri.totalDays||0)+(cur.totalDays||0)});
      const total2 = (pri.totalDaysB||0) + (cur.totalDaysB||0);
      return [s.name, cumDc, cumN, cumW, cumDcB, cumNB, cumWB, total1+total2].join(",");
    });
    const csv = [header.join(","), ...rows].join("\n");
    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `call-schedule-summary-${startYear}.csv`; a.click();
    URL.revokeObjectURL(url);
  }, [surgeons, stats, priorCounts, startYear, calcShifts]);

  // ─── Dark Mode Styles ───
  const dk = darkMode;
  const dkBg = dk ? "#1a1a2e" : "#f0f2f5";
  const dkCardBorder = dk ? "#2a3a5e" : "#e0e4ea";
  const dkText = dk ? "#e0e0f0" : "#2c3e50";
  const dkSubtext = dk ? "#8a8aaa" : "#7a8a98";
  const dkHdr = dk ? "linear-gradient(180deg,#16213e,#1a1a2e)" : "linear-gradient(180deg,#ffffff,#f8f9fb)";
  const dkInp = dk ? {background:"#0f3460",border:"1px solid #2a3a5e",color:"#e0e0f0"} : {};

  // Calendar data
  const calData = useMemo(() => {
    const d={};
    Object.entries(schedule).forEach(([mStr,wk])=>{
      const mon=parse(mStr);
      const pfx = wk.isBackup ? "B-" : "";
      const cls = wk.isBackup ? "backup" : "primary";
      const holCov = wk.holidayCoverage || {};
      if(wk.dayCall){
        for(let i=0;i<5;i++){
          const ds=fmt(addD(mon,i));
          // Skip Svc entry on days covered by a holiday 24h surgeon
          if(holCov[ds]) continue;
          d[ds]=[...(d[ds]||[]),{type:pfx+"Svc",surgeon:(wk.dayCallOverrides&&wk.dayCallOverrides[ds])||wk.dayCall,cls}];
        }
        const sat=fmt(addD(mon,5));
        if(!holCov[sat]) d[sat]=[...(d[sat]||[]),{type:pfx+"Wknd",surgeon:(wk.dayCallOverrides&&wk.dayCallOverrides[sat])||wk.dayCall,cls,note:"Sat 7a–7a"}];
      }
      NIGHT_KEYS.forEach((sk,i)=>{
        const sid=wk.nights?.[sk]; if(!sid) return;
        const ds=fmt(addD(mon,i));
        if(holCov[ds]) return; // Holiday 24h covers this night
        d[ds]=[...(d[ds]||[]),{type:pfx+"Ngt",surgeon:sid,cls}];
      });
      const wkndS = wk.nights?.wknd;
      if(wkndS){
        const fri=fmt(addD(mon,4));
        if(!holCov[fri]) d[fri]=[...(d[fri]||[]),{type:pfx+"Wknd",surgeon:wkndS,cls,note:"5p–7a"}];
        const sun=fmt(addD(mon,6));
        if(!holCov[sun]) d[sun]=[...(d[sun]||[]),{type:pfx+"Wknd",surgeon:wkndS,cls,note:"7a–7a"}];
      }
      if(wk.isBackup){
        for(let i=0;i<7;i++){
          const ds=fmt(addD(mon,i));
          d[ds]=[...(d[ds]||[]),{type:"Fierce",surgeon:null,cls:"fierce"}];
        }
      }
      if(wk.isFierceBackup){
        for(let i=0;i<7;i++){
          const ds=fmt(addD(mon,i));
          d[ds]=[...(d[ds]||[]),{type:"FierceBkp",surgeon:null,cls:"fiercebkp"}];
        }
      }
      // Holiday coverage
      if (wk.holidayCoverage) {
        Object.entries(wk.holidayCoverage).forEach(([ds, cov]) => {
          d[ds]=[...(d[ds]||[]),{type:"Holiday",surgeon:cov.surgeonId,cls:"holiday",role:cov.role,hours:cov.hours,holName:cov.name,holType:cov.type}];
        });
      }
    });
    // APP shifts
    Object.entries(appShifts).forEach(([ds,aid])=>{
      d[ds]=[...(d[ds]||[]),{type:"APP",appId:aid,cls:"app"}];
    });
    // DAVENPORT CALL TYPES ONLY. Owner decision 2026-09-24: FAK's Silvis days
    // come OFF the calendar (a Show-bar toggle + his Mine section follow — and
    // they will read silvisDays directly, never through calData). #55 pushed
    // {type:"Silvis"} rows here, and the cell's generic S/N/W predicate — a
    // deny-list that renders anything not Svc/Wknd as a NIGHT — drew every one
    // as a phantom "N FAK" chip, on the public link and the OR board too (live
    // 2026.09.24a → 24d). Pinned behaviorally in test/sync-guards.js §O4: the
    // memo runs on a fixture and must emit no foreign type.
    return d;
  }, [schedule, appShifts]);

  // Holiday name labels for the calendar (pure informational labels, independent
  // of holiday coverage assignments). Uses getHolidays() — only covers the 6
  // holidays used for call coverage (Memorial Day, July 4th, Labor Day,
  // Thanksgiving, Christmas, New Year's).
  const calHolidayLabels = useMemo(() => {
    const labels = {};
    // Include current year + previous year (so New Year's Day — Jan 1 —
    // shows up when viewing January, since it's defined as part of the
    // PRIOR year's "New Year's" holiday entry ending Jan 1).
    [calYear - 1, calYear].forEach(y => {
      try {
        const h = getHolidays(y);
        [...h.major, ...h.minor].forEach(hol => {
          labels[hol.date] = { name: hol.name, emoji: hol.emoji };
          // New Year's entry has startDate (Dec 31) and endDate (Jan 1).
          // Label both days.
          if (hol.endDate && hol.endDate !== hol.date) {
            labels[hol.endDate] = { name: "New Year's Day", emoji: hol.emoji };
          }
        });
      } catch (e) { /* getHolidays unavailable */ }
    });
    return labels;
  }, [calYear]);

  // Calendar grid
  const calGrid = useMemo(() => {
    const days=new Date(calYear,calMonth+1,0).getDate();
    const first=new Date(calYear,calMonth,1).getDay();
    const c=[]; for(let i=0;i<first;i++) c.push(null);
    for(let d=1;d<=days;d++) c.push(d);
    while(c.length%7) c.push(null);
    return c;
  }, [calYear,calMonth]);

  // ─── On Call Today ───
  const todayStr = fmt(new Date());
  const todayDow = new Date().getDay(); // 0=Sun
  const todayEntries = calData[todayStr] || [];
  const todayCall = useMemo(() => {
    const info = { dayCall: null, night: null, weekend: null, app: null, fierce: false, fierceBkp: false };
    todayEntries.forEach(e => {
      if (e.type === "Svc" || e.type === "B-Svc") info.dayCall = sMap[e.surgeon]?.name || null;
      if (e.type === "Ngt" || e.type === "B-Ngt") info.night = sMap[e.surgeon]?.name || null;
      if (e.type === "Wknd" || e.type === "B-Wknd") info.weekend = sMap[e.surgeon]?.name || null;
      if (e.type === "APP") info.app = aMap[e.appId]?.name || null;
      if (e.type === "Fierce") info.fierce = true;
      if (e.type === "FierceBkp") info.fierceBkp = true;
    });
    return info;
  }, [todayEntries, sMap, aMap]);

  const hasCallToday = todayCall.dayCall || todayCall.night || todayCall.weekend;

  // Build notification message for tonight
  const buildTonightMsg = () => {
    const today = new Date();
    const dayName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
    const mo = today.getMonth()+1;
    const dy = today.getDate();
    const dow = today.getDay();
    const appTimeLabel = (dow === 0 || dow === 6) ? "7a–7a" : "5p–7a";
    let msg = `🏥 DSG Call — ${dayName} ${mo}/${dy}\n\n`;
    if (todayCall.dayCall) msg += `🏥 Service Week: ${todayCall.dayCall}\n`;
    if (todayCall.night) msg += `🌙 Night (5p–7a): ${todayCall.night}\n`;
    if (todayCall.weekend) msg += `🌗 Weekend: ${todayCall.weekend}\n`;
    if (todayCall.app) msg += `👩‍⚕️ APP (${appTimeLabel}): ${todayCall.app}\n`;
    if (todayCall.fierce) msg += `⚡ Fierce Primary Week\n`;
    if (todayCall.fierceBkp) msg += `🛡 Fierce Backup Week\n`;
    if (!hasCallToday) msg += `No call assignments found for today.\n`;
    msg += `\n📋 Full schedule: https://fkhan628.github.io/Call-Schedule-App/`;
    return msg;
  };

  const [copied, setCopied] = useState(false);
  const [copiedUrl, setCopiedUrl] = useState(""); // tracks which calendar URL was just copied

  // Robust copy that works across mobile browsers; falls back to prompt() if clipboard API fails
  const copyText = async (text, label) => {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        // Fallback for iOS Safari, older browsers
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
      }
      setCopiedUrl(label);
      setTimeout(() => setCopiedUrl(""), 2500);
    } catch(e) {
      // Last resort: show the URL in a prompt so the user can copy manually
      prompt("Copy this URL:", text);
    }
  };
  const shareTonightMsg = async () => {
    const msg = buildTonightMsg();
    if (navigator.share) {
      try { await navigator.share({ text: msg }); return; } catch(e) { console.debug("Share dismissed or unavailable (falling back to copy):", e); }
    }
    try { await navigator.clipboard.writeText(msg); setCopied(true); setTimeout(()=>setCopied(false), 2000); } catch(e) {
      console.error("Copy to clipboard failed:", e);
      showToast("Couldn't copy — long-press the message to copy it manually.", "error");
    }
  };

  const Badge = ({id,small}) => {
    const s=sMap[id]; if(!s) return <span style={{color:"#a0a8b0",fontSize:10}}>—</span>;
    return <span style={{...css.badge(s.idx, s.name),fontSize:small?10:11,padding:small?"1px 6px":"2px 9px"}}>{s.name}</span>;
  };

  const AppBadge = ({id,small}) => {
    const a=aMap[id]; if(!a) return <span style={{color:"#a0a8b0",fontSize:10}}>—</span>;
    return <span style={{...css.appBadge(a.idx),fontSize:small?10:11,padding:small?"1px 6px":"2px 9px"}}>{a.name}</span>;
  };

  return (
    <div style={{...css.root,background:dkBg,color:dkText}}>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
      {/* Month painter — full-screen bulk-entry sheet (two mounts: APP call
          shifts from the APP card, time off from the Vacations card).
          Rendered OUTSIDE the view conditionals so a background state change
          can never unmount it mid-draft. */}
      {paintSheet && (
        <MonthPainterSheet
          key={paintSheet}
          mode={paintSheet}
          css={css} dk={dk}
          surgeons={surgeons} apps={apps}
          appShifts={appShifts} vacations={vacations} noCallDays={noCallDays}
          appDayOff={appDayOff} dayOffId={dayOffId}
          onCommit={paintSheet === "app" ? commitAppPaint : commitTimeOffPaint}
          onClose={() => setPaintSheet(null)}
        />
      )}
      {/* Non-blocking toast */}
      {toast && (
        <div role="status" aria-live="polite" onClick={()=>setToast(null)} style={{position:"fixed",left:"50%",bottom:24,transform:"translateX(-50%)",zIndex:9999,maxWidth:"90vw",background:toast.tone==="success"?"#1a7a4a":toast.tone==="error"?"#a83232":"#1a2a3a",color:"#fff",borderRadius:9,padding:"10px 18px",fontSize:13,fontWeight:600,fontFamily:font,boxShadow:"0 4px 16px rgba(0,0,0,0.25)",cursor:"pointer",letterSpacing:0.2}}>
          {toast.tone==="success"?"✓ ":toast.tone==="error"?"⚠ ":""}{toast.msg}
        </div>
      )}
      {/* "Sign in again" (sync v2): its own banner ABOVE every sheet and modal
          (z 10000). A button in the header would be covered while e.g. the
          week editor is open — and tapping there closes the editor and drops
          its draft (found in the two-user smoke, 2026-10-12). */}
      {!isPublicMode && authUser && (schedSync.authNeeded || reauthNeeded) && (
        <div role="alert" style={{position:"fixed",left:0,right:0,top:0,zIndex:10000,background:"#a83232",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexWrap:"wrap",gap:10,padding:"8px 14px",fontSize:12.5,fontWeight:600,fontFamily:font,boxShadow:"0 2px 12px rgba(0,0,0,0.25)"}}>
          <span>⚠ Your sign-in has expired{schedSync.pending ? ` — ${schedSync.pending} week${schedSync.pending === 1 ? "" : "s"} of the schedule not saved yet` : ""}.</span>
          <button onClick={reauthForSync} disabled={reauthBusy} style={{background:"#fff",border:"none",color:"#a83232",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:font}}>{reauthBusy ? "Signing in…" : "Sign in again"}</button>
        </div>
      )}
      {/* …and its SOFT version (A7(3)): on resume the sign-in looked expired by
          this device's clock. Amber and a warning only — edits still work (a
          skewed clock must not stop them); the red banner takes over once the
          server actually refuses the token. */}
      {staleTokenShown && (
        <div role="status" aria-live="polite" style={{position:"fixed",left:0,right:0,top:0,zIndex:10000,background:"#fdf0e0",color:"#7a4a00",borderBottom:"1px solid #e0b070",display:"flex",alignItems:"center",justifyContent:"center",flexWrap:"wrap",gap:10,padding:"8px 14px",fontSize:12.5,fontWeight:600,fontFamily:font,boxShadow:"0 2px 12px rgba(0,0,0,0.15)"}}>
          <span>⚠ Your sign-in may have expired — sign in again so your changes keep saving.</span>
          <button onClick={reauthForSync} disabled={reauthBusy} style={{background:"#8a5a10",border:"none",color:"#fff",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:font}}>{reauthBusy ? "Signing in…" : "Sign in again"}</button>
          <button aria-label="Dismiss" onClick={()=>setStaleTokenWarn(false)} style={{background:"none",border:"none",color:"#8a5a10",cursor:"pointer",fontSize:14,padding:"2px 6px"}}>✕</button>
        </div>
      )}
      {/* The password sheet (A7(2)), ABOVE both banners (z 10001): "Sign in
          again" opens it when the session can't be renewed in place. The
          email is the signed-in account's, fixed. A failure shows here and
          clears nothing; Cancel only closes it (the banner stays). It never
          signs out. Rendered outside the view conditionals, like the banners. */}
      {!isPublicMode && authUser && reauthSheet && (
        <div role="dialog" aria-modal="true" aria-label="Sign in again" style={{position:"fixed",inset:0,zIndex:10001,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"48px 16px 16px",overflowY:"auto",fontFamily:font}}>
          <form onSubmit={e=>{ e.preventDefault(); submitReauth(); }} style={{background:"#fff",borderRadius:12,padding:20,maxWidth:380,width:"100%",boxSizing:"border-box",boxShadow:"0 8px 32px rgba(0,0,0,0.25)"}}>
            <h3 style={{margin:"0 0 6px",fontSize:16,color:"#1a2a3a"}}>Sign in again</h3>
            <p style={{fontSize:12.5,color:"#5a6a78",margin:"0 0 12px",lineHeight:1.5}}>Your sign-in couldn't be renewed. Enter your password to keep going — {schedSync.pending ? `the ${schedSync.pending} week${schedSync.pending === 1 ? "" : "s"} not saved yet stay${schedSync.pending === 1 ? "s" : ""} on this screen and ${schedSync.pending === 1 ? "is" : "are"} sent once you're in.` : "nothing on this screen is lost."}</p>
            <input type="email" value={authUser.email || ""} readOnly aria-label="Email" autoComplete="username" style={{...css.inp,width:"100%",boxSizing:"border-box",padding:"10px 12px",fontSize:16,marginBottom:8,opacity:0.75}}/>
            <input type="password" value={reauthPassword} onChange={e=>setReauthPassword(e.target.value)} placeholder="Password" aria-label="Password" autoComplete="current-password" autoFocus style={{...css.inp,width:"100%",boxSizing:"border-box",padding:"10px 12px",fontSize:16,marginBottom:8}}/>
            {reauthError && <div role="alert" style={{fontSize:12,color:"#c04040",padding:"6px 10px",background:"#fce8e8",borderRadius:6,border:"1px solid #e8c0c0",marginBottom:8}}>{reauthError}</div>}
            <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
              <button type="button" onClick={()=>{ setReauthSheet(false); setReauthPassword(""); setReauthError(""); }} disabled={reauthBusy} style={{...css.btn(false),padding:"9px 14px",fontSize:13}}>Cancel</button>
              <button type="submit" disabled={reauthBusy} style={{...css.btn(true),padding:"9px 18px",fontSize:13,fontWeight:700,opacity:reauthBusy?0.6:1}}>{reauthBusy ? "Signing in…" : "Sign in"}</button>
            </div>
          </form>
        </div>
      )}
      {/* Update-available banner — persistent until acted on; reload is USER-initiated
          (never forced — a mid-action reload is jarring and kills adoption). */}
      {/* Hidden while the paint sheet is open: the banner sits at z 9998
          (over the sheet footer) and its reload button hard-resets — one
          mis-tap would destroy an unsaved draft. It reappears on close. */}
      {updateAvailable && !paintSheet && (
        <div role="status" aria-live="polite" style={{position:"fixed",left:0,right:0,bottom:0,zIndex:9998,background:"#1a2a3a",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexWrap:"wrap",gap:10,padding:"9px 14px",fontSize:12.5,fontWeight:600,fontFamily:font,boxShadow:"0 -2px 12px rgba(0,0,0,0.25)"}}>
          <span>⬆ New version available ({updateAvailable})</span>
          <button onClick={()=>{ if (!confirmReloadWithPending()) return; if (window.__dsgHardReset) window.__dsgHardReset(); else window.location.reload(); }} style={{background:"#2a8a5a",border:"none",color:"#fff",borderRadius:6,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:font}}>Tap to reload</button>
          <button aria-label="Dismiss" onClick={()=>{ updateDismissedRef.current = updateAvailable; setUpdateAvailable(null); }} style={{background:"none",border:"none",color:"#8a9aa8",cursor:"pointer",fontSize:14,padding:"2px 6px"}}>✕</button>
        </div>
      )}
      {darkMode && <style>{`
        body { background: #1a1a2e !important; color: #e0e0f0 !important; }
        /* Cards and containers */
        div[style*="background: rgb(255, 255, 255)"], div[style*="background:#ffffff"], div[style*="background: #fff"] { background: #16213e !important; border-color: #2a3a5e !important; }
        div[style*="background: linear-gradient"] { border-color: #2a3a5e !important; }
        /* Form elements */
        select, input[type="date"], input[type="number"], input[type="text"], input[type="password"], input[type="email"] { background: #0f3460 !important; border-color: #2a3a5e !important; color: #e0e0f0 !important; }
        button { color: #c0c8d8 !important; }
        button[style*="background: linear-gradient"] { color: #fff !important; }
        /* Tables */
        table { color: #c0c0d0 !important; }
        th { color: #8a8aaa !important; }
        td { color: #c0c0d0 !important; }
        /* Text overrides for common inline colors */
        div[style*="color: rgb(42, 62, 80)"], div[style*="color:#2c3e50"], span[style*="color:#2c3e50"], p[style*="color:#2c3e50"] { color: #e0e0f0 !important; }
        div[style*="color:#5a6a78"], span[style*="color:#5a6a78"], p[style*="color:#5a6a78"] { color: #9aa0b8 !important; }
        div[style*="color:#7a8a98"], span[style*="color:#7a8a98"], p[style*="color:#7a8a98"], label[style*="color:#7a8a98"] { color: #7a80a0 !important; }
        div[style*="color:#1a6fa8"], span[style*="color:#1a6fa8"] { color: #5aafe8 !important; }
        div[style*="color:#6a7a88"], span[style*="color:#6a7a88"] { color: #8a90a8 !important; }
        div[style*="color:#4a5a68"], span[style*="color:#4a5a68"] { color: #b0b8c8 !important; }
        div[style*="color:#8a94a0"], span[style*="color:#8a94a0"] { color: #7080a0 !important; }
        /* Info/warning/success boxes */
        div[style*="background:#fef8f0"], div[style*="background:#fef0e0"], div[style*="background: rgb(254, 248, 240)"] { background: #2a2820 !important; border-color: #4a4030 !important; color: #d0c090 !important; }
        div[style*="background:#e8f8e8"], div[style*="background:#f0faf0"] { background: #1a2a1a !important; border-color: #2a4a2a !important; color: #90d090 !important; }
        div[style*="background:#fce8e8"], div[style*="background:#faf0f0"] { background: #2a1a1a !important; border-color: #4a2a2a !important; color: #d09090 !important; }
        div[style*="background:#f8f0ff"], div[style*="background:#f0e8fc"], div[style*="background:#f0e8f8"] { background: #1a1a2e !important; border-color: #3a2a5e !important; color: #b090d0 !important; }
        div[style*="background:#e0f0ff"], div[style*="background:#e8f0fc"], div[style*="background:#e8f4fc"] { background: #1a2030 !important; border-color: #2a3a5e !important; color: #90b0d0 !important; }
        div[style*="background:#f8f9fb"], div[style*="background:#f0f2f5"], div[style*="background:#f4f6f8"] { background: #16213e !important; border-color: #2a3a5e !important; }
        div[style*="background: linear-gradient(135deg,#f8f9fb"], div[style*="background: linear-gradient(135deg,#f4f6f8"] { background: #16213e !important; }
        div[style*="background: linear-gradient(135deg,#f8f0ff"], div[style*="background: linear-gradient(135deg,#f4f0f8"] { background: #1a1a30 !important; }
        /* Dashed borders */

            <button onClick={()=>{setBiometricPending(false);setAuthError("");}}
              style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline"}}>
              Use email & password instead
            </button>
          </div>

      ) : !authUser && !isPublicMode ? (
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",minHeight:"80vh",padding:20}}>
          <div style={{...css.card,maxWidth:380,width:"100%",padding:28}}>

              <div style={{width:48,height:48,borderRadius:10,background:"linear-gradient(135deg,#1a6fa8,#2488c8)",display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:10}}>
                <span style={{color:"#fff",fontSize:18,fontWeight:800,fontFamily:font}}>DSG</span>
              </div>
              <h2 style={{fontSize:18,fontWeight:700,color:dkText,margin:"0 0 4px"}}>DSG Call Schedule</h2>
              <p style={{fontSize:12,color:"#7a8a98",margin:0}}>

            {/* ─── New Password Mode (after clicking reset link) ─── */}
            {authMode==="newpassword" ? (
              <div style={{display:"flex",flexDirection:"column",gap:10}}>

                <input type="password" placeholder="New password" value={newPassword} onChange={e=>setNewPassword(e.target.value)}
                  style={{...css.inp,width:"100%",padding:"10px 12px",fontSize:14}}/>
                <input type="password" placeholder="Confirm new password" value={newPasswordConfirm} onChange={e=>setNewPasswordConfirm(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"){
                    if(!newPassword||newPassword.length<6){setAuthError("Password must be at least 6 characters");return;}
                    if(newPassword!==newPasswordConfirm){setAuthError("Passwords don't match");return;}
                    setAuthBusy(true);setAuthError("");
                    auth.updatePassword(newPassword).then(r=>{
                      setAuthBusy(false);
                      if(r.error){setAuthError(r.error);}
                      else{setAuthMode("login");setAuthError("");setNewPassword("");setNewPasswordConfirm("");alert("Password updated! Please sign in with your new password.");auth.signOut();}
                    });
                  }}}
                  style={{...css.inp,width:"100%",padding:"10px 12px",fontSize:14}}/>
                {authError && <div style={{fontSize:12,color:"#c04040",padding:"6px 10px",background:"#fce8e8",borderRadius:6,border:"1px solid #e8c0c0"}}>{authError}</div>}
                <button onClick={()=>{
                  if(!newPassword||newPassword.length<6){setAuthError("Password must be at least 6 characters");return;}
                  if(newPassword!==newPasswordConfirm){setAuthError("Passwords don't match");return;}
                  setAuthBusy(true);setAuthError("");
                  auth.updatePassword(newPassword).then(r=>{
                    setAuthBusy(false);
                    if(r.error){setAuthError(r.error);}
                    else{setAuthMode("login");setAuthError("");setNewPassword("");setNewPasswordConfirm("");alert("Password updated! Please sign in with your new password.");auth.signOut();}

                }} disabled={authBusy}
                  style={{...css.btn(true),width:"100%",padding:"11px 16px",fontSize:14,fontWeight:700,opacity:authBusy?0.6:1}}>
                  {authBusy ? "Updating…" : "Update Password"}

              <div style={{display:"flex",flexDirection:"column",gap:10}}>

                    <div style={{fontSize:13,color:"#1a6030",padding:"12px 14px",background:"#e8f8e8",borderRadius:8,border:"1px solid #a0d8a0",lineHeight:1.5}}>

                    </div>
                    <button onClick={()=>{setAuthMode("login");setResetSent(false);setResetEmail("");setAuthError("");}}
                      style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline",textAlign:"center"}}>

                    <input type="email" placeholder="Email address" value={resetEmail} onChange={e=>setResetEmail(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"&&resetEmail){
                        setAuthBusy(true);setAuthError("");
                        auth.resetPassword(resetEmail).then(r=>{
                          setAuthBusy(false);
                          if(r.error){setAuthError(r.error);}
                          else{setResetSent(true);}
                        });
                      }}}
                      style={{...css.inp,width:"100%",padding:"10px 12px",fontSize:14}}/>
                    {authError && <div style={{fontSize:12,color:"#c04040",padding:"6px 10px",background:"#fce8e8",borderRadius:6,border:"1px solid #e8c0c0"}}>{authError}</div>}
                    <button onClick={()=>{
                      if(!resetEmail){setAuthError("Please enter your email");return;}
                      setAuthBusy(true);setAuthError("");
                      auth.resetPassword(resetEmail).then(r=>{
                        setAuthBusy(false);
                        if(r.error){setAuthError(r.error);}
                        else{setResetSent(true);}
                      });
                    }} disabled={authBusy}
                      style={{...css.btn(true),width:"100%",padding:"11px 16px",fontSize:14,fontWeight:700,opacity:authBusy?0.6:1}}>
                      {authBusy ? "Sending…" : "Send Reset Link"}
                    </button>
                    <div style={{textAlign:"center",marginTop:4}}>
                      <button onClick={()=>{setAuthMode("login");setAuthError("");setResetEmail("");}}
                        style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline"}}>
                        Back to Sign In
                      </button>
                    </div>
                  </>

              <div style={{display:"flex",flexDirection:"column",gap:10}}>

                style={{...css.inp,width:"100%",padding:"10px 12px",fontSize:14}}/>
              <input type="password" placeholder="Password" value={authPassword} onChange={e=>setAuthPassword(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleAuthSubmit()}

              {authMode==="signup" && (

                  {/* ADMIN is deliberately NOT self-selectable — signup is open

                      route to role:"admin". Admin accounts are provisioned in
                      the DB. */}
                  <optgroup label="Surgeons">
                    {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}

              <button onClick={handleAuthSubmit} disabled={authBusy}
                style={{...css.btn(true),width:"100%",padding:"11px 16px",fontSize:14,fontWeight:700,opacity:authBusy?0.6:1}}>
                {authBusy ? "Please wait…" : authMode==="login" ? "Sign In" : "Create Account"}
              </button>
              <div style={{textAlign:"center",marginTop:4}}>

                  style={{background:"none",border:"none",color:"#1a6fa8",fontSize:12,cursor:"pointer",fontFamily:font,textDecoration:"underline"}}>
                  {authMode==="login" ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                </button>

                  <div style={{marginTop:8}}>
                    <button onClick={()=>{setAuthMode("reset");setAuthError("");}}

                      Forgot your password?
                    </button>
                  </div>
                )}
              </div>
            </div>
            )}
          </div>
        </div>
      ) : needsProfile ? (
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",minHeight:"80vh",padding:20}}>
          <div style={{...css.card,maxWidth:380,width:"100%",padding:28}}>

              <h2 style={{fontSize:18,fontWeight:700,color:dkText,margin:"0 0 4px"}}>Welcome!</h2>

              </optgroup>
            </select>
            {authError && <div style={{fontSize:12,color:"#c04040",padding:"6px 10px",background:"#fce8e8",borderRadius:6,border:"1px solid #e8c0c0",marginBottom:8}}>{authError}</div>}
            <button onClick={handleSetProfile} disabled={authBusy||!signupPersonId}
              style={{...css.btn(true),width:"100%",padding:"11px 16px",fontSize:14,fontWeight:700,opacity:authBusy||!signupPersonId?0.6:1}}>
              {authBusy ? "Saving…" : "Continue"}

          </div>

      ) : <>

      {/* ─── Header ─── */}
      <div style={{...css.hdr,background:dkHdr,borderBottom:`1px solid ${dkCardBorder}`}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:8,background:"linear-gradient(135deg,#1a6fa8,#2488c8)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:"0 2px 6px rgba(26,111,168,0.25)"}}>
            <span style={{color:"#fff",fontSize:15,fontWeight:800,letterSpacing:-0.5,fontFamily:font}}>DSG</span>
          </div>
          <div>
            <h1 style={css.h1}>{isPublicMode ? "DSG Call Schedule" : "Davenport Surgical Group"}</h1>

              {isPublicMode ? (
                <>
                  <span style={{color:"#7a8a98"}}>{isOrView ? "OR board · read-only" : "Read-only view"}</span>
                  {lastSyncRef.current && <> · Last updated: {new Date(lastSyncRef.current).toLocaleString(undefined, {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}</>}
                  {!lastSyncRef.current && <> · Loading schedule…</>}
                  {schedLineKind === "loadFailed" && <span style={{color:"#c04040",fontWeight:700}}> · ⚠ The schedule didn't load — retrying. What's shown may be incomplete.</span>}
                  {schedStaleShown && <span role="status" style={{color:"#8a5a10",fontWeight:700}}> · ⚠ The schedule on the server has fewer weeks than this screen — reload to resync <button onClick={reloadToResync} style={{marginLeft:4,background:"#fdf0e0",border:"1px solid #e0b070",color:"#8a5a10",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>Reload</button></span>}
                  {schedStalledShown && <span role="status" style={{color:"#c04040",fontWeight:700}}> · ⚠ Sync stalled — reload to resync <button onClick={reloadToResync} style={{marginLeft:4,background:"#fce8e8",border:"1px solid #e8c0c0",color:"#a83232",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>Reload</button></span>}
                </>
              ) : (
                <>
                  Call Schedule · Surgeons + APPs
                  {saveStatusShown && <span role="status" aria-live="polite" style={{marginLeft:8,color:saveError?"#c04040":"#1a8040",fontWeight:600,fontSize:11}}>{saveError?"⚠":"☁"} {saveStatus}</span>}
                  {/* The schedule's own save state (sync v2): ONE line, the kind
                      schedSyncLine picks (A16). "Saving" is neutral — every edit is
                      pending for a moment; red only when sign-in is needed, an
                      attempt failed or was rejected, deletes are blocked, the sync
                      stalled, or the schedule never loaded. */}
                  {schedLineKind === "auth" && <span role="status" aria-live="polite" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ {schedLine.n ? `${schedLine.n} week${schedLine.n === 1 ? "" : "s"} not saved — sign in again` : "Sign-in expired — sign in again"}</span>}
                  {schedLineKind === "loadFailed" && <span role="status" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ Schedule didn't load — retrying (edits paused)</span>}
                  {schedLineKind === "notSaved" && <span role="status" aria-live="polite" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ {schedLine.n} week{schedLine.n === 1 ? "" : "s"} not saved — {schedSync.noPermission.length === schedLine.n ? "no permission" : "retrying"}</span>}
                  {schedLineKind === "rejected" && <span role="status" aria-live="polite" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ {schedLine.n} week{schedLine.n === 1 ? "" : "s"} couldn't be saved ({schedSync.rejectCodes.join(", ")}) — reload/update the app <button onClick={reloadToResync} style={{marginLeft:4,background:"#fce8e8",border:"1px solid #e8c0c0",color:"#a83232",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>Reload</button></span>}
                  {schedLineKind === "blocked" && <span role="status" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ {schedLine.n} week deletion{schedLine.n === 1 ? "" : "s"} blocked — reload to resync</span>}
                  {schedStalledShown && <span role="status" aria-live="polite" style={{marginLeft:8,color:"#c04040",fontWeight:700,fontSize:11}}>⚠ Sync stalled — reload to resync <button onClick={reloadToResync} style={{marginLeft:4,background:"#fce8e8",border:"1px solid #e8c0c0",color:"#a83232",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>Reload</button></span>}
                  {schedLineKind === "busy" && <span role="status" style={{marginLeft:8,color:"#8a6a10",fontWeight:600,fontSize:11}}>{schedSync.busy === "restore" ? "Restoring…" : schedSync.busy === "clear" || schedSync.busy === "reset" ? "Clearing…" : schedSync.busy === "publish" ? "Publishing…" : "Saving…"} keep the app open</span>}
                  {schedStaleShown && <span role="status" style={{marginLeft:8,color:"#8a5a10",fontWeight:700,fontSize:11}}>⚠ The schedule on the server has fewer weeks than this screen — reload to resync <button onClick={reloadToResync} style={{marginLeft:4,background:"#fdf0e0",border:"1px solid #e0b070",color:"#8a5a10",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>Reload</button></span>}
                  {schedLineKind === "conflicts" && <button onClick={()=>{ showToast(`Changed by someone else (your edit was replaced — reapply it if it's still needed): week${schedSync.conflicts.length === 1 ? "" : "s"} of ${schedSync.conflicts.map(c => c.k).join(", ")}.`, "error"); schedSyncRef.current.dismissConflicts(); }} style={{marginLeft:8,background:"#fdf0e0",border:"1px solid #e0b070",color:"#8a5a10",borderRadius:5,padding:"1px 8px",fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:font}}>⚠ {schedLine.n} week{schedLine.n === 1 ? "" : "s"} replaced by someone else's change — tap for details</button>}
                  {schedLineKind === "saving" && <span style={{marginLeft:8,color:"#6a7a88",fontSize:10}}>Saving {schedLine.n} week{schedLine.n === 1 ? "" : "s"}…</span>}
                  {schedSyncedShown && <span style={{marginLeft:8,color:"#a0a8b0",fontSize:10}}>☁ Synced</span>}
                  {!loaded && <span style={{marginLeft:8,color:"#6a7a88",fontSize:10}}>Connecting…</span>}
                </>
              )}
            </p>
          </div>
        </div>
        {!isPublicMode && <div style={css.nav}>
          {(() => {
            const allTabs = [["setup","Setup"],["generate","Generate"],["calendar","Calendar"],["myschedule","Mine"],["requests","Requests"],["stats","Stats"],["totals","Totals"],["settings","Settings"]];
            const isAdmin = userProfile?.role === "admin";
            const canAssignApps = userProfile?.can_assign_apps === true;
            const canSeeSetup = isScheduler || isAdmin || canAssignApps;
            const canGenerate = isScheduler || isAdmin;
            let tabs = canSeeSetup ? allTabs : allTabs.filter(([k]) => k !== "setup");
            if (!canGenerate) tabs = tabs.filter(([k]) => k !== "generate");
            if (!isScheduler) tabs = tabs.filter(([k]) => k !== "totals");
            if (isAdmin) tabs = tabs.filter(([k]) => k !== "myschedule");
            return tabs.map(([k,l]) =>
              <button key={k} style={{...css.tab(view===k),position:"relative"}} onClick={()=>setView(k)}>
                {l}
                {k==="requests" && (myVacRequests.filter(r=>r.status==="pending").length + myTradeRequests.filter(r=>r.status==="pending").length) > 0 && (
                  <span style={{position:"absolute",top:-4,right:-4,background:"#e04040",color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{myVacRequests.filter(r=>r.status==="pending").length + myTradeRequests.filter(r=>r.status==="pending").length}</span>
                )}
              </button>
            );
          })()}
          {/* Notification Bell */}
          <button onClick={()=>{setShowNotifs(p=>!p); if(!showNotifs) markNotifsSeen();}}
            style={{...css.tab(showNotifs),position:"relative",fontSize:15,padding:"4px 10px"}}>
            🔔
            {myUnreadCount > 0 && (
              <span style={{position:"absolute",top:-4,right:-4,background:"#e04040",color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{myUnreadCount}</span>
            )}
          </button>
          {scheduleHistory.length > 0 && (
            <button onClick={undoLastChange} style={{...css.tab(false),fontSize:12,padding:"4px 10px",color:"#c09030"}} title={`Undo (${scheduleHistory.length} steps)`}>
              ↩ Undo
            </button>
          )}
        </div>}
      </div>

      <div style={{maxWidth:1020,margin:"0 auto",padding:"18px 14px 60px",position:"relative"}}>

        {/* ─── Notification Panel ─── */}
        {!isPublicMode && showNotifs && (
          <div style={{position:"absolute",top:0,right:14,width:340,maxHeight:400,overflowY:"auto",background:"#fff",border:"1px solid #dce2e8",borderRadius:10,boxShadow:"0 4px 20px rgba(0,0,0,0.12)",zIndex:100,padding:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:14,fontWeight:700,color:"#1a2a3a"}}>Notifications</span>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {myNotifications.length > 0 && (
                  <button onClick={clearAllNotifications} style={{background:"none",border:"1px solid #e8c0c0",color:"#904040",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:font}}>Clear All</button>
                )}
                <button aria-label="Close notifications" onClick={()=>setShowNotifs(false)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer",color:"#8a94a0"}}>✕</button>
              </div>
            </div>
            {myNotifications.length === 0 ? (
              <p style={{color:"#8a94a0",fontSize:13,textAlign:"center",padding:20}}>No notifications yet</p>
            ) : myNotifications.map(n => {
              const tabMap = {vacation_submitted:"requests",vacation_approved:"requests",vacation_denied:"requests",schedule_published:"calendar",schedule_changed:"calendar",trade_submitted:"requests",trade_accepted:"requests",trade_declined:"requests"};

            surgeons.forEach(s => {

              const total = (p.dc||0)+(p.dcB||0) + (p.nights||0)+(p.nightsB||0) + (p.wknd||0)+(p.wkndB||0);
              if (total === 0) {
                issues.push({ sev: "warn", msg: `${s.name || s.id} has no multi-year shift counts entered` });
              }
            });

            // 3. Surgeon burden score >50% off group median (likely data-entry error)
            const burdens = surgeons.map(s => {
              const p = priorCounts[s.id] || {};
              return {
                name: s.name,
                score: ((p.dc||0)+(p.dcB||0))*7 + (p.nights||0)+(p.nightsB||0) + ((p.wknd||0)+(p.wkndB||0))*3
              };
            });
            const nonZero = burdens.map(b => b.score).filter(s => s > 0).sort((a,b) => a-b);
            const median = nonZero.length ? nonZero[Math.floor(nonZero.length/2)] : 0;
            if (median > 0) {
              burdens.forEach(b => {
                if (b.score > 0 && Math.abs(b.score - median) / median > 0.5) {
                  issues.push({ sev: "warn", msg: `${b.name} multi-year total is ${b.score < median ? "much lower" : "much higher"} than the rest — verify the entries` });
                }
              });

            // 4. Pending vacation requests
            const pendingCount = (vacRequests || []).filter(r => r.status === "pending").length;

              };

              // Filter each person's ranges per the toggle. A range is "past"

              const visiblePeople = peopleWithVac

                  const all = vacations[p.id]||[];

          {/* APP Days Off — display-only weekday-off tracking (paper-calendar

          <Collapsible css={css} ck="setup_app_dayoff" defaultOpen={false}
            title={<>🗓 APP Days Off <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— weekday off rotation (display-only)</span></>}>

                  const daysIn = new Date(dayOffMonth.y, dayOffMonth.m + 1, 0).getDate();
                  const firstDow = first.getDay();
                  const lead = (firstDow === 0 || firstDow === 6) ? 0 : firstDow - 1;
                  for (let i = 0; i < lead; i++) cells.push(null);
                  for (let day = 1; day <= daysIn; day++) {
                    const d = new Date(dayOffMonth.y, dayOffMonth.m, day);
                    if (d.getDay() === 0 || d.getDay() === 6) continue;
                    cells.push(d);

                    const ds = fmt(d);

                        <div style={{display:"flex",flexWrap:"wrap",gap:3}}>

                            return (
                              <button key={a.id} onClick={()=>toggleAppDayOff(ds, a.id)} disabled={!appDayOffLoaded}
                                title={appDayOffLoaded ? `${a.name} ${on ? "is" : "not"} off ${ds} — tap to toggle` : "Editing disabled until day-offs load"}
                                style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,cursor:appDayOffLoaded?"pointer":"not-allowed",fontFamily:font,
                                  background:on?pal.tx:"transparent",color:on?"#fff":pal.tx,
                                  border:`1px solid ${on?pal.tx:pal.bd}`,opacity:!appDayOffLoaded?0.35:on?1:0.6}}>
                                {a.name}

                        </div>
                      </div>

                  });
                })()}
              </div>
            </div>
          </Collapsible>

          {(isScheduler || userProfile?.role === "admin") && <>
          {/* Backup Weeks */}
          <div style={css.card}>
            <div style={css.cardT}>Backup Weeks <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>(Fierce = Primary)</span></div>
            <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 10px",lineHeight:1.5}}>

            </p>

            <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:12}}>
              <div>
                <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Add manually — Week Starting (Monday)</label>
                <input type="date" value={bkMonday} onChange={e=>setBkMonday(e.target.value)} style={{...css.inp,width:160}}/>

              <button onClick={markBackupWeek} style={css.btn(true)}>+ Mark Backup</button>
            </div>
            {[...backupMondaySet].sort().map(m=>(
              <div key={m} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>

                <span style={css.backupBanner}>⚡ BACKUP — Fierce Primary</span>
                <button onClick={()=>unmarkBackupWeek(m)} style={{background:"none",border:"none",color:"#904040",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            ))}

            {/* Fierce Backup weeks — label only, no schedule change */}
            <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #e0e4ea"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#6090a8",marginBottom:6}}>Fierce Backup Weeks <span style={{fontWeight:400,color:"#7a8a98"}}>— Regular schedule, Fierce backs up the group</span></div>
              <div style={{display:"flex",gap:6,alignItems:"end",flexWrap:"wrap",marginBottom:10}}>
                <div>
                  <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:2}}>Week Starting (Monday)</label>
                  <input type="date" value={bkMonday} onChange={e=>setBkMonday(e.target.value)} style={{...css.inp,width:160}}/>
                </div>
                <button onClick={markFierceBackupWeek} style={{...css.btn(true),background:"linear-gradient(135deg,#e0ecf8,#d0e0f0)",borderColor:"#a0c0e0",color:"#1a6fa8",padding:"7px 16px",fontSize:12}}>+ Mark Fierce Backup</button>

          {/* Holiday Assignments */}
          <div style={css.card}>

            <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 10px",lineHeight:1.5}}>
              Generate yearly holiday assignments. Each holiday gets 2 surgeons who alternate 24h blocks.
              The eve is a regular night shift worked by the card's "Night Before" surgeon; the holiday day and days after switch to 24h.
            </p>
            <div style={{fontSize:11,color:"#5a6a78",background:"#fef8f0",border:"1px solid #e8d8c0",borderRadius:6,padding:"8px 12px",marginBottom:12,lineHeight:1.7}}>
              <strong>Pattern:</strong> Surgeon B → Night Before (the eve night shift) + Day After 24h · Surgeon A → Holiday 24h · alternating through Sat<br/>
              <strong>Monday holidays (Memorial Day, Labor Day):</strong> Surgeon A covers Monday 24h, Surgeon B covers night before (Sun). Service week doctor starts Tuesday — no day-after override.<br/>
              <strong>Friday holidays:</strong> Fri (A) + Sat (B)<br/>
              <strong>Exception:</strong> FAK covers Christmas Eve night and Christmas Day (standing rule), and the generator also gives FAK that week's service week and weekend<br/>
              <strong style={{color:"#8a4010"}}>Rotation:</strong> FAK takes Christmas Eve + Christmas Day every year — his major and his minor. Every other partner gets one minor holiday a year (Memorial Day, July 4th, Labor Day) and at most one major (New Year's, Thanksgiving — 4 slots for 6 partners, so two sit out a major each year and get one the next). Nobody gets the same holiday as last year; over the years everyone rotates through all five.
            </div>
