            {holidayAssignments[String(holidayYear)] && (()=>{
              const assignments = holidayAssignments[String(holidayYear)];
              const majors = assignments.filter(h=>h.type==="major");
              const minors = assignments.filter(h=>h.type==="minor");

              // Count per surgeon
              const holCounts = {};
              surgeons.forEach(s=>{holCounts[s.id]={major:0,minor:0};});
              assignments.forEach(h=>{
                if(h.surgeonA&&holCounts[h.surgeonA]) holCounts[h.surgeonA][h.type]++;
                if(h.surgeonB&&h.surgeonB!==h.surgeonA&&holCounts[h.surgeonB]) holCounts[h.surgeonB][h.type]++; // A = B (FAK's Christmas) is ONE holiday
              });

              // Build sets of surgeons already used in each group (for dropdown hints)
              const usedInMajor = new Set();
              const usedInMinor = new Set();
              majors.forEach(h => { if(h.surgeonA) usedInMajor.add(h.surgeonA); if(h.surgeonB) usedInMajor.add(h.surgeonB); });
              minors.forEach(h => { if(h.surgeonA) usedInMinor.add(h.surgeonA); if(h.surgeonB) usedInMinor.add(h.surgeonB); });

              const fakIdUI = (surgeons.find(s => (s.name || "").toUpperCase() === "FAK") || {}).id || null;
              const renderCard = (hol, idx) => {
                // Surgeons used in OTHER holidays of the same group (not this one)
                const sameGroup = assignments.filter(h => h.type === hol.type && h.date !== hol.date);
                const usedElsewhere = new Set();
                sameGroup.forEach(h => { if(h.surgeonA) usedElsewhere.add(h.surgeonA); if(h.surgeonB) usedElsewhere.add(h.surgeonB); });

                return (
                <div key={hol.date} style={{background:dk?"#1a2a2e":"#fff",border:`1px solid ${hol.type==="major"?"#e0a868":"#a0c0d8"}`,borderRadius:8,padding:"10px 14px",marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>
                    <div style={{fontSize:14,fontWeight:700,color:hol.type==="major"?"#c06020":"#2868a8"}}>
                      {hol.emoji} {hol.name}
                      <span style={{fontSize:11,fontWeight:400,color:"#8a94a0",marginLeft:8}}>{hol.date} ({["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][parse(hol.date).getDay()]})</span>
                    </div>
                    <span style={{fontSize:10,fontWeight:600,color:hol.type==="major"?"#c06020":"#2868a8",background:hol.type==="major"?"#fef0e0":"#e0f0ff",padding:"2px 8px",borderRadius:4}}>{hol.type.toUpperCase()}</span>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
                    <div>
                      <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:1}}>Surgeon A (Holiday)</label>
                      <select value={hol.surgeonA||""} onChange={e=>swapHolidaySurgeon(holidayYear,idx,"surgeonA",e.target.value)} style={{...css.inp,padding:"3px 6px",fontSize:11,width:110}}>
                        {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}{usedElsewhere.has(s.id)?" ⚠️":""}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={{fontSize:10,color:"#7a8a98",display:"block",marginBottom:1}}>Surgeon B (Day After)</label>
                      <select value={hol.surgeonB||""} onChange={e=>swapHolidaySurgeon(holidayYear,idx,"surgeonB",e.target.value)} style={{...css.inp,padding:"3px 6px",fontSize:11,width:110}}>
                        {surgeons.map(s=><option key={s.id} value={s.id}>{s.name}{usedElsewhere.has(s.id)?" ⚠️":""}</option>)}
                      </select>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {effectiveHolidayCoverage(hol).map((c,j)=>{
                      const isEve = c.isEve;
                      // Eve tag shows Surgeon B (the "Day After / Eve" dropdown value).
                      // Non-eve tag shows whoever that specific coverage row is assigned to.
                      // a weekend eve inside FAK's Christmas design week is his when the cards give him that weekend (decision 3)
                      const displaySurgeon = isEve ? (holidayEveHolder(hol, c.date, holidayAssignments, fakIdUI, takesChristWknd) || hol.surgeonB || c.surgeon) : c.surgeon;
                      const isSurgA = !isEve && c.surgeon === hol.surgeonA;
                      return (
                      <div key={j} style={{padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:600,
                        background: isEve
                          ? (dk?"#2a2420":"#fef8f0")
                          : isSurgA?(dk?"#1a3020":"#e8f8e8"):(dk?"#2a2040":"#f0e8f8"),
                        border:`1px solid ${isEve?"#e0c890":isSurgA?"#a0d0a0":"#c0b0e0"}`,
                        color:isEve?"#8a6820":isSurgA?"#1a6030":"#5030a0",
                        opacity:isEve?0.85:1}}>
                        <span style={{fontWeight:400,marginRight:4}}>{c.day}</span>
                        <Badge id={displaySurgeon} small/>
                        <span style={{fontSize:9,color:isEve?"#b09050":"#8a94a0",marginLeft:4}}>{isEve ? "night before" : "24h"}</span>
                      </div>
                    )})}
                  </div>
                </div>
              )};

              return <>
                <div style={{fontSize:12,fontWeight:700,color:"#c06020",marginBottom:6}}>⭐ Major Holidays</div>
                {majors.map((h,i)=>renderCard(h, assignments.indexOf(h)))}

                <div style={{fontSize:12,fontWeight:700,color:"#2868a8",marginBottom:6,marginTop:14}}>📌 Minor Holidays</div>
                {minors.map((h,i)=>renderCard(h, assignments.indexOf(h)))}

                {/* The rotation rules (owner 2026-10-13) — helpers.js holidayRotationCheck: one holiday per group at most
                    (A = B is ONE), every partner one minor, FAK's are Christmas Eve + Day, nobody without a major two years
                    running, no repeat of last year's; a hand-written preset year is a fact (no rotation issues) */}
                {(()=>{
                  const rc = holidayRotationCheck({ assignments, prior: holidayAssignments[String(holidayYear - 1)] || [], surgeons, year: holidayYear,
                    fakId: surgeons.find(s => (s.name || "").toUpperCase() === "FAK")?.id, preset: typeof HOLIDAY_PRESETS !== "undefined" && !!HOLIDAY_PRESETS[String(holidayYear)] });
                  const nm = (id) => surgeons.find(s => s.id === id)?.name || id;
                  return (
                    <div style={{marginTop:10,display:"flex",gap:8,flexWrap:"wrap"}}>
                      {[rc.major, rc.minor].map(ck => (
                        <div key={ck.label} style={{flex:1,minWidth:180,padding:"8px 12px",borderRadius:6,fontSize:11,
                          background:ck.ok?"#e8f8e8":"#fce8e8",border:`1px solid ${ck.ok?"#a0d8a0":"#e0a0a0"}`,color:ck.ok?"#1a6030":"#903030"}}>
                          <span style={{fontWeight:700}}>{ck.ok?"✓":"⚠"} {ck.label} group:</span>{" "}
                          {ck.ok
                            ? `All ${ck.uniqueCount} surgeons distinct${ck.label === "Major" && ck.none.length ? ` · sitting out a major: ${ck.none.map(nm).join(", ")}` : ""}`
                            : ck.dupes.map(d => `${nm(d.surgeon)} is on both ${d.hol1} & ${d.hol2}`).join("; ")}
                        </div>
                      ))}
                      {rc.issues.length > 0 && (
                        <div style={{flexBasis:"100%",padding:"8px 12px",borderRadius:6,fontSize:11,background:"#fdf3e3",border:"1px solid #e0c080",color:"#7a5010"}}>
                          <span style={{fontWeight:700}}>⚠ Rotation:</span> {rc.issues.join(" · ")}
                        </div>
                      )}
                      {rc.preset && <div style={{flexBasis:"100%",fontSize:11,color:"#5a6a78"}}>ℹ {holidayYear} is the hand-written schedule — the rotation applies from the next generated year.</div>}
                    </div>
                  );
                })()}

                {/* Summary */}
                <div style={{marginTop:14,paddingTop:10,borderTop:"1px solid #e0e4ea"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#5a6a78",marginBottom:6}}>Holiday Coverage per Surgeon — {holidayYear}</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {surgeons.map(s=>{
                      const mc = holCounts[s.id]?.major||0;
                      const mi = holCounts[s.id]?.minor||0;
                      const xmasOnly = mi === 0 && mc === 1 && assignments.some(h => h.name === "Christmas Day" && h.surgeonA === s.id && h.surgeonB === s.id);
                      return (
                        <div key={s.id} style={{...css.badge(sMap[s.id]?.idx||0, sMap[s.id]?.name),padding:"4px 10px",fontSize:11}}>
                          {s.name} <span style={{fontWeight:400}}>— {xmasOnly ? "Christmas Eve + Day" : `${mc} major, ${mi} minor`}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>;
            })()}
          </div>

          </>}

        </>}

        {/* ════════════════ GENERATE ════════════════ */}
        {view==="generate" && !isPublicMode && (isScheduler || userProfile?.role === "admin") && <>


          {/* Period card */}
          <div style={css.card}>
            <div style={css.cardT}>Schedule Period</div>
            {Object.keys(schedule).length > 0 && (() => {
              const ms = Object.keys(schedule).sort();
              const lastSun = addD(parse(ms[ms.length-1]), 6);
              return (
                <p style={{fontSize:12,color:"#5a6a78",margin:"0 0 10px",lineHeight:1.5}}>
                  Current schedule ends <strong style={{fontFamily:mono}}>{fmt(lastSun)}</strong>. Configure the next period below.
                </p>
              );
            })()}

                {MO.map((m,i)=><option key={i} value={i}>{m}</option>)}

              if (!newLockWeek || !newLockSlot || !newLockSurgeon) return;
              // silvisBusy: a lock on FAK for a slot that overlaps a Silvis
              // primary day. TRUTH per slot: a WEEKNIGHT lock bypasses
              // availability in the generator (it overrides the rule); a
              // Service-Week / Weekend lock on a blocked surgeon is DROPPED
              // silently by the generator, so it can only record intent —
              // say exactly that, and doGenerate toasts every dropped lock.
              if (silvisActive) {
                const cur = scheduleRef.current; // the week as the mirror holds it (sync v2 §2.1)
                const r = silvisBlock(newLockSurgeon, newLockWeek, newLockSlot, cur[newLockWeek]);
                const note = (newLockSlot === "dc" || newLockSlot === "wknd")

                  : " — a weeknight lock overrides the rule for this generation";
                if (silvisRefuse(r ? [r + note] : [])) return;

              // Replace any existing lock for this same week+slot
              setPendingLocks(prev => [

            // Sort locks by week, then slot order

            previewMonths.sort((a,b)=>a.year-b.year||a.month-b.month);

            const pmi = Math.min(previewCalMonth, previewMonths.length-1);
            const pm = previewMonths[pmi] || previewMonths[0];
            const pmDays = pm ? new Date(pm.year, pm.month+1, 0).getDate() : 0;
            const pmFirst = pm ? new Date(pm.year, pm.month, 1).getDay() : 0;
            const pmGrid = [];
            for(let i=0;i<pmFirst;i++) pmGrid.push(null);
            for(let d=1;d<=pmDays;d++) pmGrid.push(d);
            while(pmGrid.length%7) pmGrid.push(null);

            // ─── Spacing-exception disclosure (owner request 2026-08-31,
            // follows PR #46). The generator's spacing floor is SOFT by
            // design: a same-surgeon service-week pair ≤ MIN_DC_GAP apart can
            // survive when vacations empty the pool or a holiday
            // pre-assignment / lock claims a week. DISCLOSURE ONLY, no
            // behavior change: list each surviving pair here so the scheduler
            // publishes knowingly. Seam-aware — walks the EXISTING schedule

            // generator seed), so a pair straddling the period boundary (the

            // generator.js global — single source, no copied constant.
            const spacingNotes = (() => {
              try {
                const keys = Object.keys(previewSchedule).sort();
                if (!keys.length) return [];
                const t0 = parse(keys[0]).getTime();
                const last = {}; // id -> { w: week index (negative = before preview), mStr }
                for (let k = 1; k <= 60; k++) {
                  const mStr = fmt(addD(parse(keys[0]), -7 * k));
                  const wk = schedule[mStr];
                  if (wk && wk.dayCall && last[wk.dayCall] === undefined) last[wk.dayCall] = { w: -k, mStr };
                }
                const holA = {}; // holiday date -> assignment (for attribution)
                Object.values(holidayAssignments || {}).forEach(list => (list || []).forEach(h => { if (h && h.date) holA[h.date] = h; }));
                const nice = (mStr) => { const d = parse(mStr); return `${MO[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
                // Why was this week un-free for this surgeon? Mirrors the
                // generator's claim logic: manual lock, Monday-holiday
                // convention (surgeon A owns the PRECEDING week's service),
                // or a Tue–Fri holiday week handed to its surgeon A.
                const reasonFor = (id, mStr) => {
                  if ((pendingLocks || []).some(l => l && l.mondayStr === mStr && (l.slot === "dc" || l.slot === "dayCall") && l.surgeonId === id)) return "a manual lock";
                  const monAfter = holA[fmt(addD(parse(mStr), 7))];
                  if (monAfter && monAfter.surgeonA === id) return `the ${monAfter.name} pre-assignment`;
                  for (let d = 1; d <= 4; d++) {
                    const h = holA[fmt(addD(parse(mStr), d))];
                    if (h && h.surgeonA === id) return `the ${h.name} week`;
                  }
                  return null; // no claim — pool congestion (vacations/no-call)
                };
                // A pair Needs your OK already lists as strain (svcGap — both weeks
                // carried) is not repeated here (owner 2026-10-13): this box keeps
                // the pairs it doesn't count — both weeks fixed by the holiday cards.
                const listedGap = new Set((previewNeedsOk.items || []).filter(it => it.key === "svcGap").map(it => it.who + "|" + it.prevMondayStr + "|" + it.mondayStr));
                const notes = [];
                for (const mStr of keys) {
                  const wk = previewSchedule[mStr];
                  const id = wk && wk.dayCall;
                  if (!id) continue;
                  const w = Math.round((parse(mStr).getTime() - t0) / 604800000);
                  if (last[id] !== undefined && w - last[id].w <= MIN_DC_GAP && !listedGap.has(id + "|" + last[id].mStr + "|" + mStr)) {
                    const reason = reasonFor(id, mStr) || reasonFor(id, last[id].mStr) || "vacations that week";

                  }
                  last[id] = { w, mStr };
                }
                return notes;

                // Fail LOUD in the UI, not just the console — a disclosure
                // that silently vanishes defeats its purpose (conventions #1).
                console.error("spacing disclosure failed:", e);
                return [`⚠ The spacing check itself failed (${e?.message || e}) — verify service-week gaps manually before publishing.`];
              }

            return (

                  <div style={css.cardT}>👁 Schedule Preview{previewOrigin === "json" && <span style={{marginLeft:8,fontSize:11,fontWeight:700,color:dk?"#f0c890":"#8a5020",background:dk?"#3a2a10":"#fef3e6",border:"1px solid #e8c89a",borderRadius:5,padding:"2px 7px"}}>Loaded from JSON — not generated</span>}</div>

                    <button onClick={searchMore} disabled={!!searching || publishing} title="Keep searching from this schedule — it is replaced only by a better one" style={{...css.btn(false),padding:"6px 14px",fontSize:12,opacity:searching||publishing?0.55:1}}>{searching === "more" ? "🔍 Searching…" : "🔍 Search more"}</button>
                    <button onClick={()=>{

                        // Compute month range from preview schedule

                        if (previewMondays.length === 0) return;
                        const firstMon = parse(previewMondays[0]);
                        const lastMon = parse(previewMondays[previewMondays.length-1]);
                        const lastSun = addD(lastMon, 6);

                        w.document.write(html); w.document.close();
                      } catch(e) { alert("Print failed: " + (e?.message||e)); }
                    }} style={{...css.btn(false),padding:"6px 14px",fontSize:12,background:"#fef3e6",borderColor:"#e8c89a",color:"#8a5020"}}>🖨 Print Calendar</button>
                    <button onClick={acceptPreview} disabled={publishing || searching === "publish" || (previewNeedsOk.items.length > 0 && !previewAck)} title={previewNeedsOk.items.length > 0 && !previewAck ? "Review the Needs your OK items below first" : undefined} style={{...css.btn(true),padding:"6px 14px",fontSize:12,background:"linear-gradient(135deg,#1a8040,#30a060)",borderColor:"#1a8040",opacity:previewNeedsOk.items.length > 0 && !previewAck ? 0.45 : 1,cursor:previewNeedsOk.items.length > 0 && !previewAck ? "not-allowed" : "pointer"}}>✓ Accept & Publish</button>
                    <button onClick={discardPreview} style={{background:"none",border:"1px solid #e0c0c0",color:"#904040",borderRadius:6,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:font}}>✕ Discard</button>
                  </div>
                </div>

                {searching === "more" && <SearchProgress searchRef={searchRef} dk={dk} />}
                {searchStats && !searching && <div style={{fontSize:11,color:dk?"#a0c8a0":"#4a7a4a",margin:"-6px 0 10px"}}>
                  {searchStats.purpose === "more"

                {previewNeedsOk.items.length > 0 && (

                    </div> : null; })}
                    <div style={{marginTop:5,fontSize:11,opacity:0.85}}>{previewOrigin === "json"

                      : "The search ranks schedules in this order: no time off and no two nights in a row (designed holiday runs aside — anything left breaking them is under Must fix), FAK's last resort, service weeks even, weekends even, the least strain, the mildest bends, totals even — this is the best it found. Search more looks further; Re-roll starts over."}</div>

                {/* Spacing-exception disclosure — publish knowingly (see computation above) */}
                {spacingNotes.length > 0 && (
                  <div style={{background:dk?"#3a3010":"#fdf6e3",border:"1px solid #d0b050",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:dk?"#e8d080":"#7a5c10"}}>
                    <div style={{fontWeight:700,marginBottom:2}}>⚠ Service-week spacing exception{spacingNotes.length===1?"":"s"}</div>

                    <div style={{marginTop:5,fontSize:11,opacity:0.85}}>{previewOrigin === "json" ? "These are in the loaded file. Accepting publishes them as shown — consider warning the surgeon." : "Fixed by the holiday cards, so Needs your OK doesn't count them as strain (the others are listed there). Accepting publishes them as shown — consider warning the surgeon."}</div>
                  </div>
                )}

                {/* Preview Calendar Grid */}
                {pm && <>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:10}}>
                    <button onClick={()=>setPreviewCalMonth(Math.max(0,pmi-1))} disabled={pmi===0}
                      style={{...css.btn(false),padding:"4px 10px",fontSize:14,opacity:pmi===0?0.3:1}}>◀</button>
                    <span style={{fontSize:15,fontWeight:700,color:"#1a6fa8",minWidth:140,textAlign:"center"}}>{MO[pm.month]} {pm.year}</span>
                    <button onClick={()=>setPreviewCalMonth(Math.min(previewMonths.length-1,pmi+1))} disabled={pmi>=previewMonths.length-1}
                      style={{...css.btn(false),padding:"4px 10px",fontSize:14,opacity:pmi>=previewMonths.length-1?0.3:1}}>▶</button>
                  </div>
                  {/* minmax(0,1fr), like the Calendar tab: a bare 1fr column can't shrink
                      below its content, so on a phone a long vacation list widened its

                      wrap at their space instead of clipping on the narrowest phones. */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1,marginBottom:1}}>
                    {DAY_HDR.map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#8a94a0",padding:"4px 0",letterSpacing:1}}>{d}</div>)}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1,marginBottom:14}}>
                    {pmGrid.map((day,i)=>{
                      if(!day) return <div key={`e${i}`} style={{background:dk?"#162016":"#f0faf0",minHeight:70}}/>;
                      const ds=`${pm.year}-${String(pm.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                      const entries=pCalData[ds]||[];
                      const isWknd=[0,6].includes(new Date(pm.year,pm.month,day).getDay());
                      const vacList = pvOnVac(ds);
                      return (
                        <div key={ds} style={{background:dk?"#162016":isWknd?"#e8f0e8":"#f4faf4",border:"1px solid #a0d0a0",minHeight:70,padding:"2px 2px",borderRadius:2,minWidth:0,overflow:"hidden"}}>
                          <div style={{fontSize:10,fontWeight:600,color:isWknd?"#5a8a5a":"#3a6a3a",fontFamily:mono,marginBottom:1}}>{day}</div>
                          {entries.filter(e=>e.type!=="APP").map((e,j)=>{
                            const isB = e.cls==="backup";
                            const isD = e.type.includes("Svc");
                            const isW = e.type.includes("Wknd");
                            const isH = e.type==="Holiday";
                            const label = isH?"H":isD?"S":isW?"W":"N";
                            const color = isH?"#c06020":isD?"#3080a8":isW?"#908050":"#6850a0";
                            return (
                              <div key={j} style={{fontSize:9,marginBottom:1,padding:"0 1px",borderRadius:2,
                                background:isH?"#fef0e8":isB?"#fef8e8":"transparent",overflowWrap:"anywhere"}}>
                                {isB&&<span style={{color:"#8a6a10",fontWeight:700,fontSize:7,marginRight:1}}>B</span>}
                                <span style={{color,fontWeight:700}}>{label}</span>
                                {" "}
                                <span style={{color:surgeonColors(sMap[e.surgeon]?.name, sMap[e.surgeon]?.idx).tx||"#4a5868",fontWeight:500}}>{sMap[e.surgeon]?.name||"?"}</span>
                              </div>
                            );
                          })}
                          {entries.filter(e=>e.type==="APP").map((e,j)=>(
                            <div key={"a"+j} style={{fontSize:9,marginBottom:1,padding:"0 1px",overflowWrap:"anywhere"}}>
                              <span style={{color:"#c08050",fontWeight:700}}>A</span>
                              {" "}
                              <span style={{color:"#8a6040"}}>{aMap[e.appId]?.name||"?"}</span>
                            </div>
                          ))}
                          {vacList.length>0&&<div style={{fontSize:8,color:"#a07070",marginTop:1,overflowWrap:"anywhere"}}>🏖{vacList.map(v=>v.name).join(", ")}</div>}
                        </div>

                    })}
                  </div>
                </>}

                {/* Boundary-seed diagnostic (scheduler/admin) — temporary */}
                {(isScheduler || userProfile?.role === "admin") && seedDebug && previewOrigin !== "json" && (
                  <div style={{background:dk?"#2a2410":"#fffbe8",border:"1px solid #e0c870",borderRadius:6,padding:"8px 12px",marginBottom:10,fontFamily:mono,fontSize:11,color:dk?"#d8c890":"#7a5a10"}}>
                    <div style={{fontWeight:700,marginBottom:3}}>🔧 boundary seed (debug)</div>
                    {seedDebug.error ? <div>error: {seedDebug.error}</div> : <>
                      <div>first week generated: <strong>{seedDebug.first}</strong></div>
                      <div>looked up prior week: <strong>{seedDebug.prevKey}</strong> → {seedDebug.prevFound ? "FOUND ✓" : "NOT in schedule ✗"}</div>
                      <div>prior service-week surgeon: <strong>{seedDebug.seedDayCall}</strong></div>
                      <div>recentDc surgeons captured: {seedDebug.recentDcCount} · schedule has {seedDebug.scheduleWeeks} weeks</div>
                    </>}
                  </div>
                )}

                {/* Fairness Summary */}
                {(() => {
                  const totals = surgeons.map(s => {
                    const ps = pStats[s.id] || {};
                    return { id: s.id, name: s.name, total: calcRawCount(ps) };
                  });
                  if (totals.length === 0) return null;
                  const sorted = [...totals].sort((a,b) => a.total - b.total);
                  const minT = sorted[0].total;
                  const maxT = sorted[sorted.length-1].total;
                  const median = sorted[Math.floor(sorted.length/2)].total;
                  const spread = maxT - minT;
                  // Per-type COMBINED spread (1st + 2nd call) — the per-category
                  // balance the group actually perceives. The REGULAR columns in
                  // the table below show 1st-call only, which can't beat Δ1 when a
                  // category's regular-week count doesn't divide evenly by 7, so
                  // these combined figures are the honest measure of per-type fairness.
                  const perTypeSpread = (regKey, bkKey) => {
                    const vals = surgeons.map(s => { const ps = pStats[s.id] || {}; return (ps[regKey]||0) + (ps[bkKey]||0); });
                    return vals.length ? (Math.max(...vals) - Math.min(...vals)) : 0;
                  };
                  const svcSpread = perTypeSpread("dc","dcB");
                  const wkndSpread = perTypeSpread("wknd","wkndB");
                  const typeColor = v => v<=1?"#1a8040":v<=2?"#a05010":"#a82020";
                  const outliersHigh = totals.filter(t => t.total > median + 2);
                  const outliersLow = totals.filter(t => t.total < median - 2);

                  return (
                    <div style={{background:dk?"#1a2a1a":"#f4faf4",border:"1px solid #b0d8b0",borderRadius:6,padding:"8px 12px",marginBottom:10}}>
                      <div style={{fontSize:12,fontWeight:700,color:"#3a6a3a",marginBottom:4}}>📊 Fairness Summary</div>
                      <div style={{fontSize:11,color:dk?"#a0b0a0":"#5a6a78"}}>
                        Spread: <strong style={{color:spread<=2?"#1a8040":spread<=4?"#a05010":"#a82020"}}>{spread} shift{spread===1?"":"s"}</strong>
                        {" "}(min {minT}, median {median}, max {maxT})
                      </div>
                      <div style={{fontSize:11,color:dk?"#a0b0a0":"#5a6a78",marginTop:3}}>
                        Service weeks <strong style={{color:typeColor(svcSpread)}}>Δ{svcSpread}</strong>
                        {"  ·  "}Weekends <strong style={{color:typeColor(wkndSpread)}}>Δ{wkndSpread}</strong>
                        {"  "}<span style={{opacity:0.65}}>(1st + 2nd call combined)</span>
                      </div>
                      {(outliersHigh.length > 0 || outliersLow.length > 0) && (
                        <div style={{fontSize:11,color:"#a05010",marginTop:4,lineHeight:1.5}}>
                          Outliers:
                          {outliersHigh.map(o => <span key={"h"+o.id}> 🔺 {o.name} ({o.total})</span>)}
                          {outliersLow.map(o => <span key={"l"+o.id}> 🔻 {o.name} ({o.total})</span>)}
                        </div>
                      )}
                      {spread <= 2 && outliersHigh.length===0 && outliersLow.length===0 && (
                        <div style={{fontSize:11,color:"#1a8040",marginTop:4}}>✓ Tight distribution</div>
                      )}
                    </div>
                  );
                })()}

                {/* Diff vs currently-published schedule */}
                {(() => {
                  if (Object.keys(schedule).length === 0) return null;
                  const diffs = [];
                  Object.keys(previewSchedule).sort().forEach(mStr => {
                    const newWk = previewSchedule[mStr];
                    const oldWk = schedule[mStr];
                    if (!oldWk) return;
                    const wkChanges = [];
                    if ((newWk.dayCall || "") !== (oldWk.dayCall || "")) {
                      wkChanges.push({ slot: "Service Week", oldName: sMap[oldWk.dayCall]?.name || "—", newName: sMap[newWk.dayCall]?.name || "—" });
                    }
                    ["mon","tue","wed","thu","wknd"].forEach(sk => {
                      const o = oldWk.nights?.[sk] || "";
                      const n = newWk.nights?.[sk] || "";
                      if (o !== n) {
                        wkChanges.push({ slot: SHIFT_LABELS[sk] || sk, oldName: sMap[o]?.name || "—", newName: sMap[n]?.name || "—" });
                      }
                    });
                    if (wkChanges.length > 0) diffs.push({ mondayStr: mStr, changes: wkChanges });
                  });

                  if (diffs.length === 0) return null;
                  const totalChanges = diffs.reduce((acc, d) => acc + d.changes.length, 0);

                  return (
                    <details style={{background:dk?"#1a1f2a":"#f4f6f8",border:"1px solid #d0d8e0",borderRadius:6,padding:"6px 10px",marginBottom:10}}>
                      <summary style={{cursor:"pointer",fontSize:12,fontWeight:700,color:dk?"#a0b0c0":"#5a6a78"}}>
                        🔄 Changes vs published ({totalChanges} change{totalChanges===1?"":"s"} across {diffs.length} week{diffs.length===1?"":"s"})
                      </summary>
                      <div style={{fontSize:11,marginTop:8,lineHeight:1.6}}>
                        {diffs.map(d => {
                          const mon = parse(d.mondayStr);
                          const wkLabel = `${MO[mon.getMonth()].slice(0,3)} ${mon.getDate()}`;
                          return (
                            <div key={d.mondayStr} style={{marginBottom:6}}>
                              <div style={{fontWeight:700,color:dk?"#c0c8d0":"#3a4a58"}}>Week of {wkLabel}</div>
                              {d.changes.map((c, j) => (
                                <div key={j} style={{paddingLeft:10,color:dk?"#a0b0c0":"#5a6a78"}}>
                                  {c.slot}: <span style={{color:"#a05010"}}>{c.oldName}</span> → <span style={{color:"#1a8040"}}>{c.newName}</span>
                                </div>
                              ))}
                            </div>
                          );
                        })}
                      </div>
                    </details>
                  );
                })()}

                {/* Counts Table — mirrors the "This Period" table */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:6}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#3a6a3a"}}>Assignment Counts — Preview Period</div>
                  <button onClick={()=>setShowBackupStats(p=>!p)}
                    style={{background:showBackupStats?"#fef8e8":"#f4f6f8",border:`1px solid ${showBackupStats?"#d8c880":"#d0d8e0"}`,color:showBackupStats?"#8a6a10":"#5a6a78",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:font}}>
                    {showBackupStats ? "Hide 2nd Call" : "Show 2nd Call"}
                  </button>
                </div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead>
                      <tr style={{borderBottom:"2px solid #b0d8b0"}}>
                        <th style={thS2}>Surgeon</th>
                        <th style={thS2}><span style={{color:"#1a8040"}}>Total</span></th>
                        <th style={thS2} colSpan={4}><span style={{color:"#1a6fa8"}}>{showBackupStats ? "1st Call" : "Regular"}</span></th>
                        {showBackupStats && <th style={{...thS2,borderLeft:"2px solid #d8c880"}} colSpan={4}><span style={{color:"#8a6a10"}}>2nd Call</span></th>}
                      </tr>
                      <tr style={{borderBottom:"1px solid #c0e0c0"}}>
                        <th style={thS2}></th>
                        <th style={thS2}><span style={{color:"#1a8040"}}>Shifts</span></th>
                        <th style={thS2}>Svc Wk</th><th style={thS2}>Nights</th><th style={thS2}>Wknds</th><th style={thS2}>Off</th>

                      </tr>
                    </thead>
                    <tbody>
                      {surgeons.map(s => {
                        const ps = pStats[s.id]||{};

                            <td style={tdS}>{ps.wknd||0}</td>

                              <td style={tdS}>{ps.nightsB||0}</td>
                              <td style={tdS}>{ps.wkndB||0}</td>
                              <td style={tdS}>{ps.offB||0}</td>
                            </>}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{marginTop:8,fontSize:11,color:"#5a8a5a",lineHeight:1.5}}>
                  <strong style={{color:"#2c5a80"}}>Total</strong> = every assignment counts once — service weeks + week nights + weekends, 1st + 2nd call. The REGULAR columns show 1st call only.
                </div>
                <p style={{fontSize:11,color:"#5a8a5a",marginTop:8}}>Click "Re-roll" to generate a different version. Use ◀ ▶ to browse months. Click "🖨 Print Calendar" for a printable view. Click "Accept" to commit this schedule.</p>
              </div>
            );
          })()}
          </>}

        {/* ════════════════ TOTALS ════════════════ */}
        {view==="totals" && !isPublicMode && <>
          <div style={css.card}>
            <div style={css.cardT}>Running Totals <span style={{fontWeight:400,fontSize:11,color:"#7a8a98"}}>— 1-Year and Multi-Year (Aug 2022 – present)</span></div>
            <p style={{fontSize:12,color:"#7a8a98",margin:"0 0 10px",lineHeight:1.5}}>
              Enter shift counts across three time frames. The generator uses the <strong style={{color:"#7030a8"}}>multi-year</strong> totals for balancing assignments. All three are shown in Stats for tracking.
            </p>

            {/* Template download & upload */}

              <div style={{fontSize:13,fontWeight:600,color:"#1a6fa8",marginBottom:6}}>📄 Import from Spreadsheet</div>

              </div>
            </div>
            {scanMsg && (
              <div style={{fontSize:12,color:scanMsg.includes("Could not")||scanMsg.includes("could not")?"#c06060":"#50a070",marginBottom:10,padding:"6px 10px",background:scanMsg.includes("Could not")||scanMsg.includes("could not")?"#fce8e8":"#e8f8e8",border:`1px solid ${scanMsg.includes("Could not")||scanMsg.includes("could not")?"#e8c0c0":"#b0d8b0"}`,borderRadius:6}}>
                {scanMsg}
              </div>
            )}

            {/* Helper to render an editable totals table */}
            {[
              {label:"1-Year (Current Year)",color:"#1a6fa8",counts:year1Counts,setter:setYear1Counts},
              {label:"Multi-Year",color:"#7030a8",counts:priorCounts,setter:setPriorCounts},

                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead>
                      <tr style={{borderBottom:"1px solid #d0d8e0"}}>
                        <th style={thS2}>Surgeon</th>
                        <th style={thS2}>Svc Wk</th><th style={thS2}>Nights</th><th style={thS2}>Wknds</th>
                        <th style={{...thS2,borderLeft:"1px solid #d8c880"}}>B-SW</th><th style={thS2}>B-Ngt</th><th style={thS2}>B-Wknd</th>
                      </tr>
                    </thead>
                    <tbody>
                      {surgeons.map(s=>{
                        const p = tier.counts[s.id]||{};
                        const total = calcShifts(p);
                        const upd = (field, val) => {
                          const v = parseInt(val)||0;
                          tier.setter(prev=>({...prev,[s.id]:{...(prev[s.id]||{}), [field]:v}}));
                        };
                        const ci = (field) => (
                          <input type="number" min="0" value={p[field]||0}
                            onChange={e=>upd(field,e.target.value)}
                            style={{...css.inp,width:46,padding:"2px 4px",textAlign:"center",fontFamily:mono,fontSize:12}}/>
                        );
                        return (
                          <tr key={s.id} style={{borderBottom:"1px solid #e8ecf0"}}>
                            <td style={{padding:"5px 6px"}}><Badge id={s.id} small/></td>
                            <td style={{padding:"3px 4px"}}>{ci("dc")}</td>
                            <td style={{padding:"3px 4px"}}>{ci("nights")}</td>
                            <td style={{padding:"3px 4px"}}>{ci("wknd")}</td>
                            <td style={{padding:"3px 4px",borderLeft:"1px solid #d8c880"}}>{ci("dcB")}</td>
                            <td style={{padding:"3px 4px"}}>{ci("nightsB")}</td>
                            <td style={{padding:"3px 4px"}}>{ci("wkndB")}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}

            <div style={{fontSize:11,color:"#7a8a98",lineHeight:1.5}}>
              <strong style={{color:"#2c5a80"}}>B-SW</strong> = backup service week days. Type breakdown (Svc Wk, Nights, Wknds) used by generator for balancing.
            </div>
          </div>
        </>}

        {/* ════════════════ CALENDAR ════════════════ */}
        {view==="calendar"&&<>
          {/* ─── On Call Today Banner ─── */}
          {hasCallToday && (
            <div style={{background:"linear-gradient(135deg,#ffffff,#f0f8ff)",border:"1px solid #b0d0f0",borderRadius:12,padding:"14px 18px",marginBottom:14,boxShadow:"0 2px 8px rgba(26,111,168,0.08)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
                <div style={{fontSize:15,fontWeight:700,color:"#1a2a3a"}}>
                  📋 On Call Today — {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][todayDow]} {new Date().getMonth()+1}/{new Date().getDate()}
                </div>
                {!isPublicMode && <button onClick={shareTonightMsg}
                  style={{...css.btn(true),padding:"6px 14px",fontSize:12}}>
                  {copied ? "✓ Copied!" : "📤 Send Notification"}
                </button>}
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {todayCall.dayCall && (
                  <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:"#f0f8ff",borderRadius:8,border:"1px solid #c0d8f0"}}>
                    <span style={{fontSize:16}}>☀️</span>
                    <div>
                      <div style={{fontSize:10,color:"#1a6fa8",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5}}>Service Week</div>
                      <div style={{fontSize:15,fontWeight:700,color:"#1a2a3a"}}>{todayCall.dayCall}</div>
                    </div>
                  </div>
                )}
                {todayCall.night && (
                  <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:"#f8f0ff",borderRadius:8,border:"1px solid #d0c0f0"}}>
                    <span style={{fontSize:16}}>🌙</span>
                    <div>
                      <div style={{fontSize:10,color:"#6030a0",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5}}>Tonight 5p–7a</div>
                      <div style={{fontSize:15,fontWeight:700,color:"#1a2a3a"}}>{todayCall.night}</div>
                    </div>
                  </div>
                )}
                {todayCall.weekend && (

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>

              <button aria-label="Previous month" onClick={()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);}} style={css.btn(false)}>◀</button>
