  // the back-forward cache) with one still held in the radio: no read proves
  // a live one didn't land (it may yet), and settle() keeps it in the ledger,
  // so its row, landing after an Undo the re-read settled, reads as OURS — the
  // Undo is sent over it — never as someone else's to adopt silently. Once
  // done, its outcome is unknown, as a lost answer's: the week stays
  // unconfirmed until a read sent after that tells (keepLive).
  // (Review r6: each is recorded with the token its CAS names — it can land
  // only while the row is still there — and done() stamps the read sequence:
  // a read sent before it settled can't prove what it did.)
  const kaDone = (k, ent, g) => {
    let open = true;
    return () => {
      if (!open) return; open = false;
      if (gen !== g) return; // (another session now: reset() forgot it)
      ent.done = rseq; // settled: a read of k sent from now on tells whether it landed
    };
  };
  const keepaliveRequests = () => {
    if (!seeded || !d.canWrite() || authState() !== "ok") return [];
    const target = d.getState() || {}, by = d.userId ? d.userId() : null, ts = d.now(), g = gen;
    return diff(target).changed.filter(k => known[k] && !inFlight.has(k) && !(rejected[k] && rejected[k].canon === canon(target[k]))).map(k => {
      const ent = { c: canon(target[k]), tok: tokOf(known[k]), done: null };
      (kaLive[k] = kaLive[k] || []).push(ent);
      const kn = known[k];
      addSent(k, canon(target[k]));
      return { url: `${base()}?week_monday=eq.${k}&${cas(kn)}`, init: { method: "PATCH", keepalive: true, headers: wh({ Prefer: "return=minimal" }), body: JSON.stringify({ data: target[k], version: (kn.version || 0) + 1, updated_by: by, updated_at: ts }) }, done: kaDone(k, ent, g) };
    });
  };

  const shownMap = (keys) => { const cur = d.getState() || {}; const m = {}; keys.forEach(k => { m[k] = k in cur ? canon(cur[k]) : DEL; }); return m; };
  const api = {
    canon,
    // First load seeds; a later load (signing in again) is a pull — and then
    // sends what's pending.
    // (A5f: the caller has its answer by the deadline; a load still queued
    // then stays queued, and seeds or pulls when its turn comes.)
    load() { return settleBy(enqueue(async () => { const r = await runLoad(); if (r.ok && seeded && d.canWrite() && pendingKeys().length) await runPush({ mode: "normal" }); return r; }), () => ({ ok: false, reason: "timeout" })); },
    // A push request is reported at once (synchronously): the week it's for
    // counts as pending — "Saving…" — from the moment it's requested, through
    // the debounce, the queue and the write, until its answer (A16).
    push() {
      report();
      if (queuedPush) return queuedPush;
      const p = enqueue(async () => { queuedPush = null; return runPush({ mode: "normal" }); });
      queuedPush = p;
      return p;
    },
    pull() {
      if (queuedPull) return queuedPull;
      const p = enqueue(async () => { queuedPull = null; const r = await runPull(); if (seeded && d.canWrite() && pendingKeys().length) await runPush({ mode: "normal" }); return r; });
      queuedPull = p;
      return p;
    },
    // clear / reset / restore (no keys) and publish (keys). Registered
    // synchronously, so a push or pull that starts after this call (even one
    // queued earlier) defers to it; when it's done it requests one ordinary
    // push for anything edited meanwhile.
    // opts.before (clear / reset / restore): the mirror as it was BEFORE the
    // caller committed `target` — what a refusal or a deadline cancel puts
    // back (showKnown), where the saved copy hasn't moved to someone else's
    // change meanwhile (E7). Without it, what the table holds.
    // opts.late(r): the caller's text for the job's outcome if it ends after
    // the caller stopped waiting (E8, tellLate).
    authoritative(target, grant, what, keysArr, opts) {
      const g0 = gen; // the session it is requested in (reset() moves gen on — G1)
      const t = clone(target || {});
      const keys = keysArr ? new Set(keysArr) : null;
      // E6 (A11): a clear / reset / restore requested while ANOTHER one is
      // still queued or running never trusts `before` — the screen it was
      // taken from shows that job's target, not yet applied (or never: both
      // refused, both cancelled), and putting it back would send it as an
      // ordinary push: a week deleted, a refused restore's copy written. It
      // falls back to what the table holds. (A publish ahead doesn't count:
      // its weeks are on screen, pending, either way — A14.)
      const stacked = !keys && [...owners].some(o => o.withKnown);
      const before = !keys && !stacked && opts && opts.before ? clone(opts.before) : null;
      const late = opts && typeof opts.late === "function" ? opts.late : null;
      const startShown = shownMap([...new Set([...Object.keys(t), ...Object.keys(known), ...(keysArr || []), ...Object.keys(before || {})])]);
      // E7: the saved copy of each of those weeks now — its token, its data,
      // and whether a body of ours is out for it (H1) — and (filled by
      // confirm()) the ones of ours confirmed meanwhile, and the ones taken as
      // "refreshed" on proof (I1).
      const knownAt = before ? { was: Object.keys(startShown).reduce((m, k) => (m[k] = { tok: tokOf(known[k]), canon: known[k] ? known[k].canon : DEL, out: unconfirmed(k) }, m), {}), landed: {}, refreshed: {} } : null;
      // The weeks it owns from now until it's done (A11): a publish, its
      // period's; a clear / reset (an empty target), every week; a restore,
      // its target's and every week the table holds.
      // (Its `before`, `knownAt` and `startShown` live on it: a clear / reset /
      // restore ahead of it that writes nothing hands it ITS put-back — G6.)
      const owner = { what: what || "saving", keys: keys || (Object.keys(t).length ? new Set(Object.keys(t)) : null), withKnown: !keys, state: { started: false, cancelled: false }, knownAt, before, startShown };
      owner.release = () => { if (owners.delete(owner)) authoritativeQueued--; };
      owners.add(owner); authoritativeQueued++;
      const p = enqueue(async () => {
        if (owner.state.cancelled) return { ok: false, wrote: false, skipped: "cancelled", error: "It was cancelled before its turn came — nothing was changed." }; // past its deadline, or a sign-out, before its turn: it never runs
        owner.state.started = true;
        try { return await runAuthoritative(t, !!grant, what, keys, owner.startShown, owner.release, owner.before, owner.knownAt, owner); } finally { owner.release(); }
      });
      report();
      p.then(() => { if (!authoritativeQueued) api.push(); }, () => {});
      // A5(f): the caller has its answer by the deadline. Not started by
      // then: cancelled — it never runs later — and nothing was written (a
      // clear / reset / restore puts the screen back, as when it's refused).
      // Started: "still running" (a job is never cut short mid-write), and
      // its outcome is toasted when it ends — in the caller's words if it
      // gave opts.late (E8).
      return settleBy(p, () => {
        // G1 (review r3): a job reset() already fenced — still queued at a
        // sign-out or a switch to another account (cancelled and released),
        // or running across one — answers as fenced at its deadline too, and
        // does nothing more: no put-back of the previous session's screen into
        // the next one's (showKnown), no "changed by someone else" for every
        // week (E7, against the next session's emptied `known`), no outcome
        // told later (tellLate). Its caller (skipped) says nothing on the next
        // session's screen and adopts nothing.
        if (owner.state.cancelled || gen !== g0) return owner.state.started ? { ok: false, wrote: false, skipped: "reset" } : { ok: false, wrote: false, skipped: "cancelled", error: "It was cancelled before its turn came — nothing was changed." };
        if (!owner.state.started) { owner.state.cancelled = true; owner.release();
          // (A clear / reset / restore cancelled here put the screen back as it was — edits waiting to save included, which a reload would lose: never "reload" — review r2.)
          const out = { ok: false, wrote: false, reason: "timeout", error: keys ? "The sync is stuck behind an earlier save — the new weeks stay on this screen and will be saved automatically once it gets through; keep the app open. Nobody was notified." : "The sync is stuck behind an earlier save — nothing was changed. The schedule on screen is as it was; try again in a minute." };
          if (!keys && !handOver(owner)) tellTheirs(out, showKnown(owner.startShown, null, owner.before, owner.knownAt));
          report(); return out;
        }
        p.then(r => tellLate(owner.what, r, late));
        return { ok: false, wrote: false, running: true, reason: "timeout", error: `${jobLabel(owner.what)} is taking longer than expected. It's still running — keep the app open; you'll see a message when it ends.` };
      });
    },
    // E6: the first clear / reset / restore / publish queued or running
    // ("clear", "reset", "restore", "publish" — what the header's busy line
    // names), or null: the app's one-job-at-a-time gate (P7) asks it.
    jobPending: () => headOwner(),
    // …and the name a message gives it ("Clearing the schedule", "Restoring
    // the snapshot", …): the app's refusal names it as the engine's own do.
    jobLabel: (what) => jobLabel(what),
    // Sign-out / user switch (A8): forget everything — the mirror too — fence
    // jobs in flight, and read the table again (public / OR views refill);
    // nothing is pushed until that load succeeds.
    reset() {
      gen++; known = {}; seeded = false; loadFailed = false; deadToken = null; blocked = 0; lastBlockSig = ""; removalSig = ""; staleRemovals = 0; conflicts = [];
      [...owners].forEach(o => { if (!o.state.started) { o.state.cancelled = true; o.release(); } }); // queued before the boundary: never runs under the next session
      Object.keys(sent).forEach(k => delete sent[k]); Object.keys(rejected).forEach(k => delete rejected[k]); toldCodes.clear();
      failed.clear(); noPermission.clear(); approvedDeletes.clear(); inFlight.clear(); lostIns.clear(); resend.clear(); putBack.clear(); Object.keys(kaLive).forEach(k => delete kaLive[k]); Object.keys(readSeen).forEach(k => delete readSeen[k]);
      d.commit({});
      report();
      return api.load();
    },
    // On resume: a request started before the page was suspended can't time
    // out while timers were frozen — abort any older than its timeout now.
    onResume() { const now = d.nowMs(); [...live].forEach(e => { if (e.ctl && e.ms && now - e.start > e.ms) { try { e.ctl.abort(); } catch (x) { /* already done */ } } }); },
    dismissConflicts() { conflicts = []; report(); },
    isSeeded: () => seeded,
    // Writes are known to be dead for the stored token (a 401 / JWT error was
    // answered for it), or there is no token at all.
    authBlocked: () => authState() !== "ok",
    pending: () => pendingKeys(),
    status,
    report,
    epochOf: (k) => adoptEpoch[k] || 0,
    epochNow: () => epoch,
    // The weeks among `keys` that someone else changed since `sinceEpoch`
    // (a preview, an open editor carries the epoch it was made at).
    changedSince: (keys, sinceEpoch) => (keys || []).filter(k => (adoptEpoch[k] || 0) > sinceEpoch),
    // Undo, all-or-nothing: restore `snap` unless a week it would change was
    // changed by someone else after the snapshot was taken.
    undoPlan(snap, snapEpoch) {
      const cur = d.getState() || {};
      const touched = [...new Set([...Object.keys(snap || {}), ...Object.keys(cur)])].filter(k => canon((snap || {})[k]) !== canon(cur[k])).sort();
      return { next: clone(snap || {}), touched, blocked: touched.filter(k => (adoptEpoch[k] || 0) > snapEpoch) };
    },
    knownData: (k) => (known[k] ? clone(known[k].data) : undefined),
    knownVersion: (k) => (known[k] ? known[k].version : undefined),
    // What the table holds, as last confirmed — for putting the screen back
    // when a clear / restore could write nothing.
    knownSchedule: () => Object.keys(known).sort().reduce((o, k) => (o[k] = clone(known[k].data), o), {}),
    keepaliveRequests,
    idle: () => chain,
  };
  return api;
}

// writeFailReason(error) -> a plain-language reason for a failed write, from the
// error BODY (db.insert / PostgREST), the same classification the autosave uses:
// an RLS / 403 refusal is a permission problem, an expired JWT / 401 is the
// sign-in, a PostgREST client / schema error is the request's CONTENT (A4: the
// server took it and refused what it said — bad input 22xxx, a constraint
// 23xxx, an unknown column 42xxx / PGRST204, a request it can't parse PGRST1xx,
// a trigger's RAISE P0xxx — an out-of-date app, not the connection), anything
// else is the connection. Module scope: pure, no state. It sits inside the
// sync engine's anchors because the engine's rejection toast uses it too (so
// the engine's tests run the real one); the app's submits call it as before.
function writeFailReason(err) {
  const s = typeof err === "string" ? err : (() => { try { return JSON.stringify(err || ""); } catch (e) { return String(err); } })();
  if (/42501|row-level security|\b403\b/i.test(s)) return "you don't have permission to do that (ask the scheduler)";
  if (/JWT expired|PGRST30[0-3]|\b401\b/i.test(s)) return "your sign-in has expired — sign in again";
  const code = err && typeof err === "object" && typeof err.code === "string" ? err.code : "";
  if (/^(PGRST[12]\d\d|2[23][0-9A-Z]{3}|42[0-9A-Z]{3}|P0\d{3})$/.test(code)) return "the server rejected it — this app may be out of date (reload or update it)";
  return "check your connection and try again";
}

// mergeEditorEdits(openCopy, draft, latest, openEpoch, adoptEpochOfWeek, opts)
// — the week editor's save (design §2.6, A17(a)). Pure: no state, no React;
// saveWeekEdits (and the editor's note) call it with no branching of their own.
// ONLY the slots edited in the editor — the service week (dayCall), each
// night, each Service Day override — go onto the LATEST week; every other slot
// keeps what the latest week holds, someone else's change adopted while the
// editor was open included (the editor used to write its whole draft back,
// reverting those). A slot is "edited" when the draft differs from what the
// editor showed when it opened (openCopy.week). The save is refused only when
// someone else's copy of this week was adopted since the editor opened
// (adoptEpochOfWeek > openEpoch — the engine's epochOf / epochNow) AND an
// edited slot moved underneath: the latest differs there from the open copy,
// and from the edit (the same change twice isn't a conflict). The refusal
// names those slots. APP days live in their own table: the days edited against
// what the APP rows showed on open (openCopy.apps) come back as appEdits, for
// the caller to apply onto the latest APP map.
//   openCopy { week (null: it didn't exist when the editor opened), apps }
//   draft    { dayCall, nights, dayCallOverrides, apps }
//   latest   the week as the mirror holds it now (undefined: there is none)
//   opts     { surgeonIds (to recompute `off`), flags ({ isBackup,
//            isFierceBackup }: stamped on a week the save CREATES) }
// → { ok: true, week, creating, appEdits: [[day, appId]] }
//   | { ok: false, slots: [{ kind: "dayCall" | "night" | "override", key }], appEdits }
function mergeEditorEdits(openCopy, draft, latest, openEpoch, adoptEpochOfWeek, opts) {
  const s = (v) => v || "";
  const was = (openCopy && openCopy.week) || {}, dr = draft || {}, lt = latest || null, o = opts || {};
  const wasOv = was.dayCallOverrides || {}, drOv = dr.dayCallOverrides || {}, ltOv = (lt && lt.dayCallOverrides) || {};
  const edits = [];
  if (s(dr.dayCall) !== s(was.dayCall)) edits.push({ kind: "dayCall", key: "dayCall", mine: s(dr.dayCall), then: s(was.dayCall), now: s(lt && lt.dayCall) });
  ["mon", "tue", "wed", "thu", "wknd"].forEach(nk => {
    const mine = s(dr.nights && dr.nights[nk]), then = s(was.nights && was.nights[nk]);
    if (mine !== then) edits.push({ kind: "night", key: nk, mine, then, now: s(lt && lt.nights && lt.nights[nk]) });
  });
  [...new Set([...Object.keys(wasOv), ...Object.keys(drOv)])].sort().forEach(ds => {
    if (s(drOv[ds]) !== s(wasOv[ds])) edits.push({ kind: "override", key: ds, mine: s(drOv[ds]), then: s(wasOv[ds]), now: s(ltOv[ds]) });
  });
  const appsThen = (openCopy && openCopy.apps) || {};
  const appEdits = Object.entries(dr.apps || {}).filter(([ds, aid]) => s(aid) !== s(appsThen[ds]));
  if ((adoptEpochOfWeek || 0) > (openEpoch || 0)) {
    const moved = edits.filter(e => e.now !== e.then && e.now !== e.mine);
    if (moved.length) return { ok: false, slots: moved.map(e => ({ kind: e.kind, key: e.key })), appEdits };
  }
  const creating = !lt;
  const wk = Object.assign({}, lt || {});
  // A brand-new week inherits its backup / fierce flags from the sets, as the
  // generator stamps them; an existing week keeps its own.
  if (creating) { const f = o.flags || {}; wk.isBackup = !!f.isBackup; wk.isFierceBackup = !!f.isFierceBackup; }
  const dc = edits.find(e => e.kind === "dayCall");
  wk.dayCall = dc ? (dc.mine || null) : (wk.dayCall === undefined ? null : wk.dayCall);
  wk.nights = Object.assign({}, wk.nights || {});
  edits.filter(e => e.kind === "night").forEach(e => { wk.nights[e.key] = e.mine; });
  // Overrides: the latest week's, with the edited days set or cleared; one
  // that is blank or equals the service surgeon isn't a real override.
  const ov = Object.assign({}, ltOv);
  edits.filter(e => e.kind === "override").forEach(e => { if (e.mine) ov[e.key] = e.mine; else delete ov[e.key]; });
  Object.keys(ov).forEach(ds => { if (!ov[ds] || ov[ds] === (wk.dayCall || null)) delete ov[ds]; });
  if (Object.keys(ov).length) wk.dayCallOverrides = ov; else delete wk.dayCallOverrides;
  // 'off' — any surgeon not assigned anywhere this week (incl. coverers)
  const assigned = new Set([wk.dayCall, ...Object.values(wk.nights), ...Object.values(ov)].filter(Boolean));
  wk.off = (o.surgeonIds || []).find(id => !assigned.has(id)) || null;
  return { ok: true, week: wk, creating, appEdits };
}
// ═══ END SYNC ENGINE v2 ═══

// The header's ONE schedule-sync line (A16), from the engine's status. The
// first that applies wins:
//   sign in again > not saved (an attempt failed, or its outcome is unknown)
//   > couldn't be saved (the server rejected the content: a client / schema
//   error, A4) > deletions blocked > Sync stalled > Clearing… / Restoring… /
//   Publishing… > fewer weeks on the server (stale removals) > replaced by
//   someone else's change (conflicts) > Saving… > ☁ Synced.
// Two lines aren't in A16's list: "didn't load" ranks right after sign-in
// (nothing can be pending before the first read, so it never hides a save),
// and deletions the wipe guard holds back rank as a refused attempt (with no
// line of their own they would read "Saving…" for ever). A read-only view
// (public / OR board) never writes, so only what can happen there applies:
// didn't load > stalled > stale removals.
// st: the engine's status (the header's schedSync state); o: { loaded,
// readOnly, blobStatus } (blobStatus: the blob leg's own status is showing,
// so "Synced" would be premature). → { kind, n } or null (nothing to say).
function schedSyncLine(st, o) {
  if (!st || !o || !o.loaded) return null;
  const rej = (st.rejected || []).length, notSaved = Math.max(0, (st.failing || 0) - rej), conf = (st.conflicts || []).length;
  const lines = o.readOnly
    ? [["loadFailed", !!st.loadFailed], ["stalled", !!st.stalled], ["stale", st.staleRemovals > 0, st.staleRemovals]]
    : [["auth", !!st.authNeeded, st.pending], ["loadFailed", !!st.loadFailed], ["notSaved", notSaved > 0, notSaved], ["rejected", rej > 0, rej],
      ["blocked", st.blockedDeletes > 0, st.blockedDeletes], ["stalled", !!st.stalled], ["busy", !!st.busy], ["stale", st.staleRemovals > 0, st.staleRemovals],
      ["conflicts", conf > 0, conf], ["saving", st.saving > 0, st.saving], ["synced", !o.blobStatus && !!st.seeded && st.pending === 0]];
  const hit = lines.find(l => l[1]);
  return hit ? { kind: hit[0], n: hit[2] || 0 } : null;
}

  const w = per.worked, s = per.scheduled;
  const all = (k) => w[k] + s[k];
  // An EMPTY Silvis feed (failed or not loaded: sfNotice kinds failed / empty) must never read
  // as "no Silvis call": its cells and the two-site totals show "?" instead of numbers.
  const silvisOut = !!silvisNote && (silvisNote.kind === "failed" || silvisNote.kind === "empty");
  const SILVIS_KEYS = { silvisP: 1, silvisB: 1, total: 1, weighted: 1 };
  const show = (k, v) => (silvisOut && SILVIS_KEYS[k] ? "?" : cell(v));
  // Every number is a count of DAYS (Stats → Billing's units), so the labels say days.
  const ROWS = [
    { k: "dc", label: "DSG day-call days" }, { k: "nights", label: "DSG weeknights" }, { k: "wknd", label: "DSG weekend days" },
    { k: "hol", label: "DSG holiday days" },
    { k: "dsgB", label: "DSG backup-week days", strong: true },
    ...(all("dsgB") > 0 ? [{ k: "dcB", label: "day call", sub: true }, { k: "nightsB", label: "weeknights", sub: true }, { k: "wkndB", label: "weekend days", sub: true }, { k: "holB", label: "holiday days", sub: true }] : []),
    { k: "silvisP", label: "Silvis primary days" }, { k: "silvisB", label: "Silvis backup days" },
    { k: "total", label: "Total call days", strong: true, top: true }, { k: "weighted", label: "Weighted (backup ½)", strong: true },
  ];
  const th = { padding: "5px 4px", fontSize: 10, fontWeight: 700, color: C.sub, textAlign: "right", whiteSpace: "nowrap" };
  const td = { padding: "4px 4px", fontSize: 13, textAlign: "right", color: C.text, fontVariantNumeric: "tabular-nums" };
  const range = totals.range || {};
  const dsgLine = range.dsgFrom ? "DSG " + mdy(range.dsgFrom) + " – " + mdy(range.dsgTo) : "DSG: no published weeks";
  const silLine = range.silvisFrom ? "Silvis " + mdy(range.silvisFrom) + " – " + mdy(range.silvisTo) : "Silvis: no days cached";
  return (
    <div style={box}>
      {title}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
        {PERIODS.map(([k, label]) => (
          <button key={k} onClick={() => setPick(k)} style={{ ...css.tab(pick === k), padding: "5px 9px", background: pick === k ? C.chipOn : C.chipOff, border: "1px solid " + (pick === k ? C.chipOn : C.border), color: pick === k ? "#ffffff" : C.sub }}>{label}</button>
        ))}
      </div>
      <div style={{ fontSize: 11, color: C.faint, marginBottom: 6 }}>{mdy(per.from)} – {mdy(per.to)}</div>
      {silvisNote && <div style={{ fontSize: 11, color: silvisNote.kind === "stale" ? C.warn : C.err, marginBottom: 6 }}>Silvis: {silvisNote.text}</div>}
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead>
          <tr style={{ borderBottom: "1px solid " + C.rule }}>
            <th style={{ ...th, textAlign: "left" }}></th>
            <th style={th}>Worked</th><th style={th}>Scheduled</th><th style={th}>Total</th>
          </tr>
        </thead>
        <tbody>
          {ROWS.map((r) => (
            <tr key={r.k} style={{ borderTop: r.top ? "1px solid " + C.rule : "none" }}>
              <td style={{ ...td, textAlign: "left", fontSize: r.sub ? 11 : 12, paddingLeft: r.sub ? 14 : 4, color: r.sub ? C.sub : C.text, fontWeight: r.strong ? 700 : 400 }}>{r.sub ? "↳ " + r.label : r.label}</td>
              <td style={{ ...td, fontWeight: r.strong ? 700 : 400 }}>{show(r.k, w[r.k])}</td>
              <td style={{ ...td, color: C.sub, fontWeight: r.strong ? 700 : 400 }}>{show(r.k, s[r.k])}</td>
              <td style={{ ...td, fontWeight: 700 }}>{show(r.k, all(r.k))}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <button onClick={() => setShowMonths(v => !v)} style={{ marginTop: 8, background: "none", border: "none", color: C.accent, fontSize: 12, cursor: "pointer", padding: "6px 0", fontFamily: font }}>
        {showMonths ? "▾" : "▸"} Month by month ({totals.today.slice(0, 4)})
      </button>
      {showMonths && (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 300 }}>
            <thead>
              <tr style={{ borderBottom: "1px solid " + C.rule }}>
                <th style={{ ...th, textAlign: "left", position: "sticky", left: 0, background: C.bg }}>Month</th>
                <th style={th}>DSG</th><th style={th}>DSG B</th><th style={th}>Silvis P</th><th style={th}>Silvis B</th><th style={th}>Total</th><th style={th}>Wtd</th>
              </tr>
            </thead>
            <tbody>
              {totals.months.map((m) => {
                const pending = m.scheduled.total > 0;
                const v = (k) => m.worked[k] + m.scheduled[k];
                return (
                  <tr key={m.month} style={{ borderBottom: "1px solid " + C.rule }}>
                    <td style={{ ...td, textAlign: "left", fontSize: 12, position: "sticky", left: 0, background: C.bg }}>{MO[Number(m.month.slice(5, 7)) - 1].slice(0, 3)}{pending ? " *" : ""}</td>
                    {["dsg", "dsgB", "silvisP", "silvisB", "total", "weighted"].map((k) => (
                      <td key={k} style={{ ...td, fontSize: 12, color: v(k) ? (pending ? C.sub : C.text) : C.faint, fontStyle: pending ? "italic" : "normal", fontWeight: k === "total" ? 700 : 400 }}>{show(k, v(k))}</td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ fontSize: 10, color: C.faint, marginTop: 4 }}>* includes scheduled days (after today)</div>
        </div>
      )}
      <div style={{ fontSize: 10, color: C.faint, marginTop: 8, lineHeight: 1.5 }}>
        Data: {dsgLine} · {silLine}. Worked = through today; scheduled = after today. DSG days are counted the way Stats → Billing counts them (a covered holiday = 2 days); backup-week roles are listed apart. Every number is a count of role-days, so one date can count more than once (a service day and a night, or a DSG day and a Silvis day). Weighted: every backup role (DSG backup-week days, Silvis backup days) counts ½.{silvisOut ? " ? = Silvis data missing — the totals would undercount." : ""}
      </div>
    </div>
  );
}

// Reusable collapsible section. Persists open/closed per-device via localStorage
// (keyed by `ck`), so a scheduler's layout choices stick across reloads. Defined
// at module scope so it never remounts on parent re-render. Uses React.* hooks
// because the destructured hook names live inside CallSchedule, not out here.
function Collapsible({ title, ck, defaultOpen = false, summary = null, children, css, right = null, style = null }) {
  const [open, setOpen] = React.useState(() => {
    try {
      const v = localStorage.getItem("dsg_collapse_" + ck);
      if (v === "1") return true;
      if (v === "0") return false;
    } catch (e) { console.warn("Couldn't read panel collapse state:", e); }
    return defaultOpen;
  });
  const toggle = () => setOpen(o => {
    const n = !o;
    try { localStorage.setItem("dsg_collapse_" + ck, n ? "1" : "0"); } catch (e) { console.warn("Couldn't persist panel collapse state:", e); }
    return n;
  });
  return (
    <div style={style ? { ...css.card, ...style } : css.card}>
      <div onClick={toggle} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", userSelect: "none" }}>
        <span style={{ fontSize: 11, color: "#8a94a0", transition: "transform .15s", transform: open ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block", width: 10, flexShrink: 0 }}>▶</span>
        <div style={{ ...css.cardT, marginBottom: 0, flex: 1 }}>{title}</div>
        {right}
      </div>
      {!open && summary != null && <div style={{ marginTop: 10 }}>{summary}</div>}
      {open && <div style={{ marginTop: 12 }}>{children}</div>}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error: error }; }
  componentDidCatch(error, info) { try { console.error("App crashed:", error, info); } catch (e) { /* console unavailable — nothing left to report to */ } }
  render() {
    if (this.state.error) {
      var msg = (this.state.error && this.state.error.message) ? this.state.error.message : String(this.state.error);
      return React.createElement(
        "div",
        { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif"), background: "#f0f2f5", boxSizing: "border-box" } },
        React.createElement(
          "div",
          { style: { maxWidth: 460, width: "100%", background: "#fff", border: "1px solid #e0e4ea", borderRadius: 12, padding: 24, boxShadow: "0 2px 12px rgba(0,0,0,0.06)", textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 34, marginBottom: 8 } }, "⚠️"),
          React.createElement("div", { style: { fontSize: 18, fontWeight: 700, color: "#1a2a3a", marginBottom: 6 } }, "Something went wrong"),
          React.createElement("div", { style: { fontSize: 13, color: "#5a6a78", lineHeight: 1.5, marginBottom: 16 } }, "The app hit an unexpected error and stopped rendering. Your saved schedule is safe — reloading should recover it. If it keeps happening, export a JSON backup from the Settings tab and note what you were doing."),
          React.createElement("div", { style: { fontFamily: (typeof mono !== "undefined" ? mono : "monospace"), fontSize: 11, color: "#a04040", background: "#fcecec", border: "1px solid #f0d0d0", borderRadius: 6, padding: "8px 10px", marginBottom: 16, wordBreak: "break-word", textAlign: "left" } }, msg),
          React.createElement(
            "button",
            { onClick: function () { try { window.location.reload(); } catch (e) { /* reload blocked — user can refresh manually */ } }, style: { background: "linear-gradient(135deg,#1a6fa8,#2488c8)", border: "1px solid #1a6fa8", color: "#fff", borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: (typeof font !== "undefined" ? font : "system-ui, sans-serif") } },
            "Reload app"
          )
        )
      );
    }
    return this.props.children;
  }
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary, null, React.createElement(CallSchedule)));
  </script>
</body>
