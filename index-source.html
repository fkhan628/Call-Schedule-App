  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script type="module">
    // Load the Supabase JS SDK as an ES module. Exposes createClient under
    // window._supabaseSDK so our non-module scripts below can use it,
    // without polluting the global scope with a `supabase` identifier
    // that would collide with our const supabase REST wrapper.
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    window._supabaseSDK = { createClient };
    window.dispatchEvent(new CustomEvent("supabase-sdk-ready"));
  </script>
  <script>
    // ─── Auto-update: bump this version string each deploy ───
    // SINGLE SOURCE OF TRUTH for the app version. The cache-bust script
    // below (line ~102) reads APP_VERSION directly — do not duplicate.
    var APP_VERSION = "2026.10.18b";
    (function() {
      var stored = localStorage.getItem("dsg_app_version");
      var mismatch = stored && stored !== APP_VERSION;

      function nukeAndReload() {
        var promises = [];
        if (window.caches) {
          promises.push(caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }));
        }
        if (navigator.serviceWorker) {
          promises.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            // Preserve OneSignal's service worker — unregistering it kills
            // existing push subscriptions. Only clear app-cache-related SWs.
            return Promise.all(regs.map(function(r) {
              var url = r.active && r.active.scriptURL || "";
              if (/OneSignalSDK/i.test(url)) return null;
              return r.unregister();
            }));
          }));
        }
        Promise.all(promises).then(function() {
          var url = new URL(window.location.href);
          // Unique per reload: reusing the bare APP_VERSION could hit the very
          // cache entry that served THIS (stale) build within max-age.
          url.searchParams.set("_v", APP_VERSION + "-" + Date.now());
          window.location.replace(url.toString());
        }).catch(function() { window.location.reload(true); });
      }

      if (mismatch) {
        localStorage.setItem("dsg_app_version", APP_VERSION);
        nukeAndReload();
      } else {
        localStorage.setItem("dsg_app_version", APP_VERSION);
        window.__dsgHardReset = nukeAndReload;
      }
    })();
  </script>

<body>
  <div id="root"></div>
  <script>
    // Cache-bust uses APP_VERSION (defined at the top of this file).
    // Only ONE version string to bump per deploy — see line ~58.
    var _v = APP_VERSION;
    ['config.js','helpers.js','generator.js','app-styles.js','silvis-feed.js'].forEach(function(f) {
      document.write('<script src="'+f+'?v='+_v+'"><\/script>');
    });
  </script>
  <script type="text/babel">
    /* ═══════════════════════════════════════════════════════════════════
       IN-FILE CONVENTIONS — read before editing (Babel strips this from the
       build; it exists for the next person editing THIS file).

       1. REF-BRIDGE for []-memoized callbacks. Any useCallback with [] deps
          captures its FIRST render's closure forever. Calling a per-render
          helper (logAudit, nameOf, anything reading userProfile/surgeons)
          from inside one silently uses stale state — audit entries
          attributed to "Unknown", decisions made on day-one data. The fix
          is a ref updated every render (auditRef; the day-off flush bridge)
          and calling through ref.current. This idiom was independently
          rediscovered TWICE (PR #30, PR #40); both failure modes were
          silent. If your callback has [] deps and calls anything that isn't
          a setState or a ref, route it through a bridge.

       2. TWO SOURCES OF TRUTH need a same-action writer and a tripwire.
          Before adding any mirror/duplicate of existing state, check
          FACT-OWNERSHIP.md (untracked, repo root). Three drifted copies
          have been found by accident already (year2Counts, the backup-week
          flags, the blob mirrors); each cost a session to unwind.

       3. FAIL LOUD. Every write checks its result and toasts on failure;
          every read distinguishes "failed" from "empty" (an RLS-blocked
          read is HTTP 200 + [] — silent). db.query and .single() THROW on
          HTTP failure. Never add an empty catch; never return [] for a
          failed load. This app's entire incident history is silent
          failures.

          3a. A LOUD-FAILURE CONVERSION MUST NOT GATE AN INDEPENDENT
          DOWNSTREAM WRITE BEHIND ITS THROW. When you turn a discarded
          result into a `throw`, look at what follows it in the same `try`:
          anything that was merely SEQUENTIAL becomes CONDITIONAL, and a
          previously-independent write silently stops happening.
          WORKED EXAMPLE (2026-07-27 → found by field report 2026-08-17):
          the autosave's blob result became `if (saveErr) throw`, and the
          very next statement was `syncSchedWeeks(payload.schedule)` — the
          only steady-state writer of schedule_weeks. For members (whom RLS
          denies the blob) every two-way swap, trade acceptance and undo was
          then applied in the UI, reported "Save failed", and NEVER reached
          the database; schedulers lost the same writes on any transient
          blob 5xx. The hardening was correct; its blast radius was not
          considered. The fix was to run the independent leg FIRST and
          unconditionally. Sequential ≠ dependent — if two writes target
          different tables, neither may sit inside the other's failure path.

       4. GUARD REFS are one-shot grant/consume. everHadRealDataRef,
          allowWipeSaveRef each have pinned grant/consume site COUNTS in
          test/sync-guards.js section E. A new site means updating the
          pinned count in the same PR — the red check is the review prompt,
          not an obstacle. (The schedule_weeks wipe grant is no longer a ref:
          since sync v2 it travels with the engine's authoritative request,
          and section SE pins the authoritative call sites instead.)

       5. SOURCE PINS scan this file for exact substrings. Comments count
          too — write prose in comments, not code patterns, or a comment
          can silently satisfy (or break) a pin. Verify the live build by
          IDENTIFIERS and string literals, never comments (Babel strips
          them).

       6. THE STATE BUNDLE (buildStateBundle) is arguments, not persistence.
          Its schedule/vacations/noCallDays keys feed four consumers and are
          stripped from every blob write — see the comment on the function
          before "simplifying" it.

       7. NEVER round-trip this file through PowerShell 5.1 text cmdlets
          (Get-Content/Set-Content) — it double-encodes UTF-8. build.js
          fails the build on the corruption signatures (the mojibake gate).
       ═══════════════════════════════════════════════════════════════════ */
    const { useState, useMemo, useCallback, useRef, useEffect } = React;

// Calendar Show-bar defaults — the ONE source for the initial state, the Reset
// button and its "differs from defaults" check. Module level on purpose (see
// above). silvis is OFF by default — owner decision 2026-09-24: FAK's Silvis
// days appear only on demand (the 🚑 switch, ?silvis=1, or the device's
// remembered choice — silvis-feed.js sfResolveToggle).
const CAL_FILTER_DEFAULTS = Object.freeze({ svc: true, night: true, wknd: true, app: true, fierce: true, vac: true, appOff: true, silvis: false });
const CAL_SILVIS_STORE_KEY = "dsg-cal-silvis";

function CallSchedule() {
  // ─── Public mode detection ───
  // When the URL contains ?public=1, render a stripped-down read-only
  // calendar view for external schedulers. Skips auth entirely.
  const isPublicMode = useMemo(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("public") === "1";
    } catch(e) { return false; }
  }, []);

  // ─── OR board (?public=1&view=or) — a LAYER on public mode, never a mode ───
  // For the OR charge nurses. It is public mode in every respect — it inherits
  // all four write guards and every render/tab gate automatically, because
  // those key on isPublicMode and this const can only ever ADD to it (note the
  // `isPublicMode &&`: view=or without public=1 is nothing at all). Its ONLY
  // delta is the APP day-off layer, which plain public mode deliberately
  // suppresses for external schedulers. NB APP call shifts (the "A ..."
  // entries) already render under plain ?public=1 — verified live — so they
  // need no flag; day-offs are the whole difference.
  // Access control is link obscurity, identical in kind to the existing public
  // URL: everything shown here is ALREADY anon-readable at the API layer
  // (app_shifts_data SELECT is anon per the pg_policies audit), so this
  // changes DISPLAY, not ACCESS. Accepted by the owner for two named OR
  // charge nurses.
  const isOrView = useMemo(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("public") === "1" && params.get("view") === "or";
    } catch(e) { return false; }
  }, []);
  // One predicate, four call sites (2 fetch, 2 render). Internal sessions are
  // unaffected (!isPublicMode is true for them).
  const appOffVisible = !isPublicMode || isOrView;

  const [view, setView] = useState("calendar");

  const [surgeons, setSurgeons] = useState(INIT_SURGEONS);
  const [apps, setApps] = useState(INIT_APPS);
  const [vacations, setVacations] = useState({});
  const [backupMondaySet, setBackupMondaySet] = useState(new Set());
  const [fierceBackupSet, setFierceBackupSet] = useState(new Set()); // Fierce backs up our group, regular schedule unchanged
  const [schedule, setSchedule] = useState({});
  // THE SCHEDULE MIRROR (sync engine v2, design §2.1). scheduleRef.current is
  // the latest schedule and commitSchedule is its ONLY writer: the mirror
  // first (synchronously), then React state BY VALUE. Every decision about the
  // schedule reads the mirror, never a render closure, and never runs inside a
  // state updater (React 18 may run an updater twice or late). updateSchedule
  // keeps the updater shape for convenience, but runs fn NOW, on the mirror.
  // The sync engine reads the same mirror, so what it saves is always the
  // latest edit. sync-guards SE pins that setSchedule has no other caller.
  // The header's sync line follows the mirror (A16, review r1 app-2): every
  // commit asks the engine to report, so a week edited here reads "Saving…"
  // from the moment it is on screen — through the push's 800 ms debounce, its
  // queue and its write — never the "☁ Synced" of the report before it. In a
  // microtask: after this commit's own synchronous work (an engine commit
  // reports a finished state, not a half-made one), never inside a render or
  // a state updater (setSchedSync can't run there), and still before the
  // browser paints. (schedSyncRef is declared further down; it is only read
  // when the microtask runs, after the render.)
  const scheduleRef = useRef({});
  const commitSchedule = useCallback((next) => { scheduleRef.current = next; setSchedule(next); Promise.resolve().then(() => { if (schedSyncRef.current) schedSyncRef.current.report(); }); }, []);
  const updateSchedule = useCallback((fn) => {
    const cur = scheduleRef.current, next = fn(cur);
    if (next !== cur) commitSchedule(next);
    return next;
  }, [commitSchedule]);
  const [appShifts, setAppShifts] = useState({}); // { "2026-05-06": "a1", ... }
  // WIPE GUARD for the APP call-shift row (2026-10-11, the day-off guard's
  // twin): every APP write upserts the WHOLE map (no CAS, no snapshot, no
  // restore path), so a write from a session whose read FAILED would replace
  // every APP's assignments with the near-empty initial map — and the week
  // editor writes its APP draft back on every save. Any successful read of the
  // main row arms it (a missing row included); only failures leave it disarmed,
  // and the 60-s poll re-arms on its next successful read.
  const [appShiftsLoaded, setAppShiftsLoaded] = useState(false);
  // APP weekday day-offs — DISPLAY-ONLY (never read by assignment/generation;
  // an APP can be off during the day and still take call that night). Stored
  // in app_shifts_data row id="dayoff" as { "2026-05-06": ["a1", ...] } —
  // array per date: the 5-person rotation may put more than one APP off.
  // Entries are APP ids today; ALL readers tolerate {id, note} objects (the
  // planned v2 partial-day shape) via dayOffId() — treat non-strings as x.id.
  const [appDayOff, setAppDayOff] = useState({});
  // WIPE GUARD (review finding, the app's signature decay class): editing is
  // disabled until a dayoff READ has succeeded this session. Without this, a
  // failed mount read leaves state {} — indistinguishable from a genuinely
  // empty grid — and one tap would upsert that near-empty map over months of
  // saved entries (no CAS, no snapshot coverage, no restore path for this
  // row). A genuine missing row IS a successful read (200+[] → data:null) and
  // arms the gate; only failures leave it disarmed, and the 60s poll re-arms
  // on its next successful read.
  const [appDayOffLoaded, setAppDayOffLoaded] = useState(false);
  // ── Day-off sync core: LOCAL-TRUTH model ──
  // Rebuilt after a second adversarial round: timer/in-flight boolean guards
  // raced in ways a point-in-time check can't express. Invariants instead:
  //   • dayOffDirtyRef — set on every tap, cleared ONLY when a confirmed save
  //     commits with nothing further queued. While dirty, server adoption is
  //     skipped everywhere (unsaved local edits are the truth) and a failed
  //     save AUTO-retries — recovery never depends on the user re-tapping.
  //   • dayOffLastWriteTsRef — updated_at of our last confirmed write; a
  //     fetched row is adopted only when STRICTLY NEWER (refreshScheduleRow's
  //     staleness pattern), so a GET that left before our commit can't
  //     resurrect the pre-commit map after dirty clears.
  //   • dayOffSaveChainRef — saves serialize on a promise chain; two upserts
  //     can never be in flight together, so commits can't reorder.
  //   • Audits queue per tap, logged only when the save that CARRIED them
  //     commits. Page-death keepalive flushes are best-effort: the data write
  //     usually lands, its audit entries die with the page (accepted — an
  //     honest gap beats fabricated entries).
  const appDayOffRef = useRef({});          // current-map mirror: toggles compute from this, never a stale render closure
  const dayOffDirtyRef = useRef(false);
  const dayOffLastWriteTsRef = useRef(null);
  const dayOffSaveChainRef = useRef(Promise.resolve());
  const dayOffSaveTimerRef = useRef(null);  // debounce: one enqueue per tap burst
  const dayOffRetryTimerRef = useRef(null); // auto-retry for failed/unconfirmed saves
  const dayOffPendingAuditRef = useRef([]); // audit entries logged only after their save COMMITS
  const dayOffEpochRef = useRef(0);         // the session the unsaved taps were made in (sessionEpochRef at the tap — review r5 fix-1)
  // Latest-closure bridge for the []-deps unload effect (review round 3): the
  // effect pins first-render closures, so calling enqueueDayOffSave directly
  // from it would log audits through a logAudit that captured userProfile at
  // its initial null — misattributing the actor. The ref always holds the
  // CURRENT render's enqueue closure.
  const dayOffEnqueueRef = useRef(() => {});
  // Shared adoption rule for the mount load AND background refresh (a prior
  // hole: the mount path lacked the guard the refresh had, and reloadTrigger
  // re-runs the mount load seconds into an interactive session).
  const adoptDayOffRow = (offRow) => {
    setAppDayOffLoaded(true); // ANY successful read arms the edit gate — missing row included
    if (!offRow?.data || typeof offRow.data !== "object") return;
    if (dayOffDirtyRef.current) return; // unsaved local edits win
    const ts = offRow.updated_at || null;
    if (dayOffLastWriteTsRef.current && ts && ts <= dayOffLastWriteTsRef.current) return; // stale or our own echo
    appDayOffRef.current = offRow.data;
    setAppDayOff(offRow.data);
    // Record the ADOPTED row's ts as the watermark too (the full
    // refreshScheduleRow pattern — review round 3): without this, two foreign
    // commits F1<F2 fetched by unserialized GETs resolving out of order would
    // re-adopt the older F1 over the already-adopted F2. Client-stamped
    // timestamps mean cross-device clock skew can delay adoption of a
    // genuinely-newer foreign row — same accepted semantics as lastSyncRef
    // everywhere else in this app.
    if (ts) dayOffLastWriteTsRef.current = ts;
  };
  const [priorCounts, setPriorCounts] = useState(COUNTS_MULTIYEAR); // Multi-year totals (used by generator)
  const [year1Counts, setYear1Counts] = useState(COUNTS_1YR); // 1-year totals (also feeds the generator's 10% past-year term)
  // (year2Counts, the legacy byte-identical mirror of priorCounts, was
  // RETIRED 2026-08-06 — deep-equality verified against the live blob first.
  // The orphaned key stays in stored blobs as a harmless fossil / rollback.)
  const [startMonth, setStartMonth] = useState(4);
  const [startYear, setStartYear] = useState(2026);
  const [numWeeks, setNumWeeks] = useState(14);
  const [startMondayOverride, setStartMondayOverride] = useState(""); // explicit Monday YYYY-MM-DD; overrides startMonth/startYear when set
  // Calendar view defaults to the current month so users land on what's
  // relevant today, not on the scheduling period's start month.
  const [calMonth, setCalMonth] = useState(() => new Date().getMonth());
  const [calYear, setCalYear] = useState(() => new Date().getFullYear());

  // ─── Printable Calendar Picker ───
  const [printStartMonth, setPrintStartMonth] = useState(() => new Date().getMonth());
  const [printStartYear, setPrintStartYear] = useState(() => new Date().getFullYear());
  const [printNumMonths, setPrintNumMonths] = useState(1);

  // ─── Calendar Filters ───
  const [calFilters, setCalFilters] = useState(() => {
    let param = null, stored = null;
    try { param = new URLSearchParams(window.location.search).get("silvis"); } catch (e) { /* no URL — default */ }
    try { stored = localStorage.getItem(CAL_SILVIS_STORE_KEY); } catch (e) { /* private mode — default */ }
    return { ...CAL_FILTER_DEFAULTS, silvis: sfResolveToggle(param, stored) };
  });
  const [showBackupStats, setShowBackupStats] = useState(false); // Toggle 2nd call columns in Stats
  const [statsScope, setStatsScope] = useState("period"); // "period" | "ytd" — shared by the Counts and Vacation Days cards
  const [statsTab, setStatsTab] = useState("fairness"); // Stats view: which table is shown (fairness|monthly|billing|app)
  const [auditEntries, setAuditEntries] = useState([]); // Activity log rows (scheduler/admin viewer)
  const [auditLoading, setAuditLoading] = useState(false);
  const [seedDebug, setSeedDebug] = useState(null); // boundary-seed diagnostic shown in preview
  const [showAllMyVacs, setShowAllMyVacs] = useState(false); // Mine: expand vacation list beyond first few
  const [showAllMyNoCall, setShowAllMyNoCall] = useState(false); // Mine: expand no-call list beyond first few
  const [showAllMySilvis, setShowAllMySilvis] = useState(false); // Mine (FAK): expand the Silvis list beyond the first few
  const [calSurgeonFilter, setCalSurgeonFilter] = useState(""); // "" = all, or surgeon ID
  const [calAppFilter, setCalAppFilter] = useState("all"); // "all" | "none" | APP id
  const [calDeptFilter, setCalDeptFilter] = useState(""); // "" = no dept filter, "CWM" or "CBH"
  const rememberSilvisToggle = (v) => {
    try { if (v === null) localStorage.removeItem(CAL_SILVIS_STORE_KEY); else localStorage.setItem(CAL_SILVIS_STORE_KEY, String(v)); }
    catch (e) { console.warn("Couldn't remember the Silvis calendar switch:", e); }
  };
  const toggleFilter = (key) => {
    const v = !calFilters[key];
    setCalFilters(p => ({ ...p, [key]: v }));
    if (key === "silvis") rememberSilvisToggle(v);
  };
  const calFiltersDiffer = Object.keys(CAL_FILTER_DEFAULTS).some(k => calFilters[k] !== CAL_FILTER_DEFAULTS[k]);

  // ─── Holiday Assignments ───
  const [holidayAssignments, setHolidayAssignments] = useState({}); // { "2026": [ { name, date, type, surgeonA, surgeonB, coverage } ] }
  const [holidayYear, setHolidayYear] = useState(2026);
  // Set when the Christmas standing-rule lock cannot resolve its designated
  // surgeon (renamed/departed) — the lock must degrade LOUDLY, never silently
  // dissolve into the normal rotation. Cleared at the start of each generation.
  const [holidayLockWarning, setHolidayLockWarning] = useState("");
  const [editingWeek, setEditingWeek] = useState(null);
  const [editShift, setEditShift] = useState(null);

  // ─── Dark Mode ───
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem("dsg-dark-mode") === "true"; } catch(e) { return false; }
  });
  useEffect(() => {
    try { localStorage.setItem("dsg-dark-mode", darkMode); } catch(e) { console.warn("Couldn't persist dark-mode setting:", e); }
  }, [darkMode]);

  // ─── Undo History ───
  const [scheduleHistory, setScheduleHistory] = useState([]);
  // Each step is { sched, epoch, counts }: the schedule MIRROR when it was
  // taken and the sync engine's epoch then (sync v2, R15) — Undo is
  // all-or-nothing: if restoring the snapshot would also revert a week
  // someone else changed since (adopted by a pull or a conflict), it is
  // refused and says which week; it never half-applies, and it never
  // silently reverts the other person's change. A PUBLISH step also carries
  // the counts as they were before it (owner 2026-10-12: publish → ↩ Undo →
  // publish used to count the period twice — Undo put the schedule back but
  // not the counts). Other steps carry none and leave the counts alone.
  // Returns the step, so a caller whose change then doesn't happen (a clear /
  // restore that wrote nothing) can take exactly that step back.
  const pushUndo = useCallback((counts) => {
    const snap = { sched: JSON.parse(JSON.stringify(scheduleRef.current)), epoch: schedSyncRef.current ? schedSyncRef.current.epochNow() : 0, counts: counts ? JSON.parse(JSON.stringify(counts)) : null };
    setScheduleHistory(prev => [...prev.slice(-9), snap]);
    return snap;
  }, []);
  const undoLastChange = () => {
    if (scheduleHistory.length === 0) return;
    if (!schedEditable()) return;
    const step = scheduleHistory[scheduleHistory.length - 1];
    const plan = schedSyncRef.current.undoPlan(step.sched, step.epoch);
    if (plan.blocked.length) {
      showToast(`Can't undo — the week${plan.blocked.length === 1 ? "" : "s"} of ${plan.blocked.join(", ")} ${plan.blocked.length === 1 ? "was" : "were"} changed by someone else since. Nothing was changed.`, "error");
      return;
    }
    commitSchedule(plan.next);
    // A publish step takes its counts back off too — only together with the schedule, never one without the other.
    if (step.counts) { setPriorCounts(step.counts.prior || {}); setYear1Counts(step.counts.y1 || {}); }
    setScheduleHistory(h => h.slice(0, -1));
  };

  // ─── What-If Preview ───
  const [previewSchedule, setPreviewSchedule] = useState(null);
  // The sync engine's epoch a preview is judged from (sync v2, stale intents):
  // a generated one, the CLICK that started its search; a loaded one, the
  // load. Accept & Publish refuses if one of its weeks was adopted since.
  const previewEpochRef = useRef(0);
  // Where the preview came from: "generated" (doGenerate) or "json" (the
  // benchmark loader, 2026-10-12) — the preview header says which.
  const [previewOrigin, setPreviewOrigin] = useState("generated");

        nextPeriodEnd: fmt(nextPeriodEnd),

        deadline: fmt(deadline),

        isUpcoming: daysRemaining >= 0 && daysRemaining <= 42, // within 6 weeks

        setBiometricEnrolled(bioEnrolled);
        const session = auth.getSession();

          setAuthLoading(false);
          return; // Don't auto-login; wait for biometric prompt
        }

        if (session && !bioEnrolled) {
          // Has session but no biometric — auto-login (legacy behavior)
          const { user } = await auth.getUser();
          if (user) {
            auth.bindUser(user.id); // this tab is this account's (review r4 branch-4: another tab's sign-in is no session here)
            setAuthUser(user);
            const profile = await dbAuth.getProfile(user.id);
            if (profile) { setUserProfile(profile); setMySurgeon(profile.person_id); }

            // Same second-pass reload the biometric path gets (line ~525):
            // getUser() may have just REFRESHED a >1h-stale token AFTER the
            // mount data-load already ran with the dead one. Without this
            // bump, auto-login sessions never re-read — vacations stayed
            // empty all session and (pre-PR#14) the first edit autosaved the
            // wiped state into the blob mirror (the digest-poison vector).
            setReloadTrigger(t => t + 1);

      } catch(e) { console.error("Auth check error:", e); }

  // Biometric unlock handler

    setAuthError(""); setAuthBusy(true);

      // Biometric passed — use stored session
      const { user } = await auth.getUser();
      if (user) {
        auth.bindUser(user.id); // (review r4 branch-4)
        setAuthUser(user);
        const profile = await dbAuth.getProfile(user.id);
        if (profile) { setUserProfile(profile); setMySurgeon(profile.person_id); }
        else { setNeedsProfile(true); }

        // WITHOUT reloading the page (a reload would re-trigger the mount
        // auth-gate and loop back to the biometric prompt).
        setReloadTrigger(t => t + 1);
        setAuthBusy(false);
        return;
      } else {

        // preserve the credential so that after the user signs in once
        // with password, Face ID continues to work next time. Wiping the
        // enrollment on every transient session failure forces users to
        // re-enroll repeatedly, which is the bug we're fixing here.
        setBiometricPending(false);
        setAuthError("Session expired. Please sign in with your password to refresh.");

      setAuthError(result.error || "Biometric failed");
    }
    setAuthBusy(false);
  };

  // Biometric enrollment handler (call from Settings)
  // The session at the tap (review r5 fix-1), for both enrolments: the Face
  // ID prompt can stay up. A session change meanwhile — a sign-out (which
  // unenrols), or "Sign in again" on another account — and an enrolment
  // landing after it is undone (this device never keeps the previous
  // account's Face ID sign-in into the next session), nothing said.
  const handleBiometricEnroll = async () => {
    if (!authUser) return;
    const ep = sessionEpochRef.current;
    const result = await biometric.enroll(authUser.id, authUser.email);
    if (sessionEpochRef.current !== ep) { if (result.success) biometric.unenroll(); return; }

    } else {

  // enrollment directly. Useful when isUserVerifyingPlatformAuthenticatorAvailable()
  // returns a false negative (a known iOS quirk on fresh PWA installs).
  // The browser's response gives a real, specific error if enrollment isn't
  // possible — far more actionable than "API said no."
  const handleBiometricForceEnroll = async () => {
    if (!authUser) { alert("Please log in first."); return; }
    const ep = sessionEpochRef.current;
    const result = await biometric.enroll(authUser.id, authUser.email);
    if (sessionEpochRef.current !== ep) { if (result.success) biometric.unenroll(); return; } // (review r5 fix-1 — as handleBiometricEnroll's)
    if (result.success) {
      setBiometricEnrolled(true);
      setBiometricAvail(true);
      setBiometricReason("Enrolled successfully via bypass — the availability check was a false negative.");
    } else {
      setBiometricReason(`Enrollment failed: ${result.error || "(unknown error)"}`);
    }
  };

  const handleBiometricUnenroll = () => {
    biometric.unenroll();
    setBiometricEnrolled(false);
  };

  // Auth handlers
  const handleAuthSubmit = async () => {
    setAuthError(""); setAuthBusy(true);
    try {
      if (authMode === "signup") {

        if (error) { setAuthError(error); setAuthBusy(false); return; }

          // devtools — so signup must be incapable of granting itself anything
          // regardless of what person_id it submits. `role` is omitted; the
          // column defaults to 'member'. Admin/scheduler roles are provisioned
          // in the DB, and the DB's unique index on person_id blocks
          // double-claiming even if this path is called directly.

          setMySurgeon(signupPersonId);
          setNeedsProfile(false);

          // don't clobber an email the scheduler already entered manually.

              // under a fast client clock dbReadHeaders judges the just-issued

              // clobber a scheduler-entered address with the catch never
              // firing. Same-identity read + throw on !res.ok closes that
              // split: an auth/RLS failure lands in the fail-loud catch below
              // instead of masquerading as emptiness. (Same reasoning as
              // snapshots.list keeping dbAuthHeaders in PR #21.) If no session
              // is stored at all, both legs are anon and RLS blocks the WRITE —
              // still no clobber path.
              const gres = await fetch(`${SUPABASE_URL}/rest/v1/notification_preferences?select=email&surgeon_id=eq.${signupPersonId}`, { headers: dbAuthHeaders() });
              if (!gres.ok) throw new Error(`signup email check: HTTP ${gres.status} ${(await gres.text().catch(() => "")).slice(0, 200)}`);
              const grows = await gres.json();

              }
            } catch(e) {
              // REVERSED 2026-07-31 (was populate-on-failure, unchanged from the
              // original April upload; PR #13 only resurrected the dead success-
              // path check above and never touched this branch). The old comment
              // framed "risk clobbering (rare)" vs "fail silently" — the third
              // option is to fail LOUDLY: a clobber silently replaces a
              // scheduler-entered address with no signal to anyone, while an
              // unpopulated email plus a toast is visible to the person at the
              // screen and fixable in Settings in seconds. So a failed check
              // writes NOTHING — populate happens only when the read succeeded

              // empty (the populate-on-empty logic itself is unchanged).
              console.warn("Signup email check failed — not auto-populating:", e);

          setMySurgeon(profile.person_id);

          // Re-run the data-load effect now that the session JWT is stored,
          // without a page reload (which would re-fire the mount auth-gate).
          setReloadTrigger(t => t + 1);
          setAuthEmail(""); setAuthPassword(""); setAuthBusy(false);

        }
      }

    } catch(e) { setAuthError(e.message || "Auth error"); }
    setAuthBusy(false);
  };

  const handleSetProfile = async () => {
    if (!signupPersonId || !authUser) return;
    // The session at the tap (review r5 fix-1): a sign-out from this screen
    // while its reads / its profile write are out — and this account's
    // profile, roles and reload are never taken into the next session
    // (the sign-in screen, then whoever signs in); nothing said there.
    const ep = sessionEpochRef.current;
    const gone = () => { if (sessionEpochRef.current === ep) return false; setAuthBusy(false); return true; };
    setAuthBusy(true); setAuthError("");
    try {
      const profiles = await dbAuth.getAllProfiles();
      if (gone()) return;
      if (profiles.some(p => p.person_id === signupPersonId && p.id !== authUser.id)) {
        setAuthError("This name is already registered to another account");
        setAuthBusy(false); return;
      }
      const personName = allPeople.find(p=>p.id===signupPersonId)?.name || signupPersonId;
      // `role` is deliberately NOT in this payload. merge-duplicates leaves
      // unlisted columns untouched on conflict (and the column defaults to
      // 'member' on a fresh insert), so re-claiming your own name can no longer
      // rewrite a scheduler/admin row to "member" — the silent downgrade that
      // needed only one transient getProfile failure (which drops an existing
      // user onto this screen) plus one tap, and could only be undone in SQL.
      // Adopt the row the DB returns so local state matches persisted truth,
      // and check the previously-discarded error instead of assuming success.
      const { data: savedProfile, error: profileErr } = await dbAuth.upsertProfile({
        id: authUser.id, person_id: signupPersonId, display_name: personName,
      });
      if (gone()) { if (profileErr) console.error("Profile save failed:", profileErr); return; }
      if (profileErr) {
        console.error("Profile save failed:", profileErr);
        setAuthError("Couldn't save your profile — please try again.");
        setAuthBusy(false); return;
      }
      const savedRole = savedProfile?.role || "member";
      setUserProfile(savedProfile || { person_id: signupPersonId, display_name: personName, role: savedRole });
      setMySurgeon(signupPersonId);
      setNeedsProfile(false);
      if (savedRole === "admin" || savedRole === "scheduler") setIsScheduler(true);
      // Re-run the data-load effect now that the session JWT is established,
      // without a page reload.
      setReloadTrigger(t => t + 1);
      setAuthBusy(false);
      return;
    } catch(e) { if (gone()) return; setAuthError(e.message); }
    setAuthBusy(false);
  };

  // The session boundary (sync v2): forget this user's schedule state — the
  // mirror, what the engine knows, the undo steps, an open editor, a search or
  // a preview — so nothing of it can be sent as the next user. Sign-out
  // crosses it, and so does a "Sign in again" that lands on a different
  // account (reauthLanded) — that one without signing out.
  // The roles and the shared setup go too (review r1 app-5 / regress): the
  // scheduler flag is cleared — the next account's profile sets it again
  // (reauthLanded; a password sign-in; the profile effect) — and the setup
  // autosave is disarmed until the next account's setup (the blob) has been
  // read (the load, or a poll that adopts it): nothing this session holds in
  // memory is written as the next account, or as nobody after a sign-out.
  // lastSyncRef forgets this session's row, so that read adopts it. The
  // session's identity moves on (sessionEpochRef, review r3 regress-3): a
  // clear / reset / restore / publish of this session still between its awaits
  // goes no further, and says nothing. This session's unsaved APP day-offs
  // are forgotten (forgetDayOffs, review r6 fix-3): never sent, kept or shown
  // into the next one, the chips refused until the next account's own read.
  const sessionBoundary = () => {
    sessionEpochRef.current++; searchRef.current = null; setSearching(null); setSearchStats(null); setPreviewSchedule(null); setShowPreview(false); // nothing searched, generated or loaded by this user is published as the next one
    schedSyncRef.current.reset();
    setScheduleHistory([]); setEditWeekModal(null); forgetDayOffs(); setReauthNeeded(false); setStaleTokenWarn(false);
    setIsScheduler(false); setupReadRef.current = false; lastSyncRef.current = null;
  };
  const handleSignOut = async () => {
    // Sign-out is a boundary (sync v2): weeks not saved can't be sent without
    // this user's token, so say so first; then cross the session boundary
    // BEFORE signing out.
    const unsaved = schedSyncRef.current.pending().length;
    if (unsaved && !confirm(`${unsaved} week${unsaved === 1 ? "" : "s"} of the schedule ${unsaved === 1 ? "isn't" : "aren't"} saved yet — signing out loses ${unsaved === 1 ? "it" : "them"}.\n\nSign out anyway?`)) return;
    sessionBoundary();
    await auth.signOut(); // (this tab's session only — another account's, stored by another tab, is left alone: review r4 branch-4)
    auth.bindUser(null);  // …and unbound: the sign-in form's requests run as nobody's

    setAuthUser(null); setUserProfile(null); setNeedsProfile(false); setMySurgeon("");
    setBiometricEnrolled(false); setBiometricPending(false);
  };

  // ════════════════════════════════════════════════════════════════
  // TIME-OFF SOURCE (vacations + no-call): the normalized `time_off` table.
  // Each change writes ONE row, so concurrent edits can't clobber each other.
  // This is now the permanent source for everyone — the old per-device blob
  // opt-out has been retired (a stale 'off' would split-brain vacations against
  // the rest of the group), so the flag is hard-wired on.
  const USE_TIME_OFF = true;

  // ─── schedule storage: schedule_weeks, through the sync engine (v2) ───
  // The schedule lives ONLY in the per-week schedule_weeks table, and every
  // read and write of it goes through ONE engine instance (createSchedSync,
  // module scope; wired up below showToast): compare-and-swap writes with
  // read-back, one job at a time, the pull of other people's changes, the
  // wipe guard and the unload keepalive. Nothing else touches the table —
  // except snapshots (config.js), whose capture reads it and whose restore
  // hands its schedule to the engine as an authoritative job.

  // ─── Audit log ───
  // Append-only record of who changed what. Fire-and-forget + try/catch so it
  // never blocks or breaks an action; if the table doesn't exist yet, the insert
  // just fails quietly. Called from the mutation choke points below.
  const nameOf = (id) => surgeons.find(s => s.id === id)?.name || apps.find(a => a.id === id)?.name || id || "?";
  // `hdrs` (review r4 branch-2): written with THOSE headers — the line of an
  // action whose session ended while it ran (a trade accept) is recorded as
  // the account that tapped it, never under the next one's token.
  const logAudit = (action, summary, details, hdrs) => {
    (async () => {
      try {
        const row = {
          actor_id: userProfile?.person_id || null,
          actor_name: userProfile?.display_name || surgeons.find(s => s.id === userProfile?.person_id)?.name || mySurgeon || "Unknown",
          action: action,
          summary: summary,
          details: details || null,
        };
        if (hdrs) {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/audit_log`, { method: "POST", headers: { ...hdrs, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(row) });
          if (!res.ok) throw new Error(`audit_log insert: HTTP ${res.status}`);
        } else await db.insert("audit_log", row);
      } catch (e) { console.error("audit log failed", e); }
    })();
  };
  // Latest-closure bridge for callbacks memoized with [] deps (saveNotifPref):
  // logAudit/nameOf capture userProfile/surgeons per render, so calling them
  // through a first-render closure would attribute every audit to "Unknown".
  // Same idiom as the day-off flush's latest-closure bridge (PR #30).
  const auditRef = useRef({ logAudit, nameOf });
  auditRef.current = { logAudit, nameOf };
  // Load recent activity for the viewer (scheduler/admin only).
  const loadAudit = async () => {
    setAuditLoading(true);
    try {
      const rows = await db.query("audit_log", { order: "created_at.desc", limit: 150 });
      setAuditEntries(Array.isArray(rows) ? rows : []);
    } catch (e) { console.error("audit load failed", e); }
    setAuditLoading(false);
  };
  const fmtAuditTime = (iso) => {
    try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
    catch (e) { return iso; }
  };
  // Load client-version heartbeats (scheduler/admin only). dbAuthHeaders, NOT
  // the expiry-aware read headers: this table is scheduler-read via RLS, so
  // the anon fallback would turn an expired session into HTTP 200 + [] —
  // "nobody has ever signed in" — instead of a visible failure.
  const loadClientVersions = async () => {
    setClientVersionsErr("");
    let rows;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_versions?select=*&order=last_seen.desc`, { headers: dbAuthHeaders() });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text().catch(() => "")).slice(0, 200)}`);
      const body = await res.json();
      rows = Array.isArray(body) ? body : [];
    } catch (e) {
      console.error("client_versions load failed", e);
      // Failure ≠ empty: keep any previously loaded list on screen and say so.
      setClientVersionsErr("Couldn't load client versions — this does NOT mean nobody has signed in. Retry (↻).");
      return;
    }

    // yet") in its OWN try: its failure must not claim the version list failed
    // (review finding: a shared catch painted the couldn't-load banner over a
    // correctly loaded list). Labels only ever come from THIS load's
    // successful fetch — never a stale cache — and getAllProfiles is NOT used
    // because it silently returns [] on HTTP failure; this raw fetch throws.
    let profiles = null;
    try {
      const pres = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?select=*`, { headers: dbAuthHeaders() });
      if (!pres.ok) throw new Error(`HTTP ${pres.status} ${(await pres.text().catch(() => "")).slice(0, 200)}`);
      const pbody = await pres.json();
      if (Array.isArray(pbody)) profiles = pbody;
    } catch (e) {

      // guessing. Console-only: the version list itself loaded fine.
      console.warn("client_versions profiles cross-reference failed", e);
    }

    setCvProfiles(profiles);
    if (profiles?.length) setAllProfiles(profiles);
    setClientVersions(rows);
  };
  // Compare two APP_VERSION strings ("YYYY.MM.DD" + lowercase suffix that
  // rolls z→aa on the 27th same-day push, per bump-version.js). Plain string
  // compare inverts at that rollover ("…z" > "…aa" lexically — review
  // finding); the date part is fixed-width so it compares clean, and suffixes
  // order by length THEN lexically, restoring monotonicity.
  const versionCmp = (a, b) => {
    const da = String(a).slice(0, 10), db2 = String(b).slice(0, 10);
    if (da !== db2) return da < db2 ? -1 : 1;
    const sa = String(a).slice(10), sb = String(b).slice(10);
    if (sa.length !== sb.length) return sa.length - sb.length;
    return sa === sb ? 0 : (sa < sb ? -1 : 1);
  };
  // Condense a user-agent to its "phone or desktop" signal; raw UA is in the DB.
  const uaLabel = (ua) => {
    if (!ua) return "";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Android/i.test(ua)) return "Android";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Mac/i.test(ua)) return "Mac";
    return "other";
  };
  useEffect(() => {
    if (view === "settings" && (isScheduler || userProfile?.role === "admin")) { loadAudit(); loadSnapshots(); loadClientVersions(); }
  }, [view]);

  // Build vacations / noCallDays maps from time_off rows. Ranges carry their
  // row id as a 3rd element [start, end, id] — every reader destructures
  // [vs, ve] and ignores the id, so existing UI is unaffected.
  const buildTimeOffMaps = (rows) => {
    const vac = {}, nc = {};
    (rows || []).forEach(r => {
      const tgt = r.kind === "nocall" ? nc : vac;
      (tgt[r.person_id] = tgt[r.person_id] || []).push([r.start_date, r.end_date, r.id]);
    });
    const byStart = (a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
    Object.values(vac).forEach(a => a.sort(byStart));
    Object.values(nc).forEach(a => a.sort(byStart));

  };

  // Load the whole time_off table and project it into the two maps.
  // quiet=true (the 60s poll) logs failures console-only — a transient outage
  // must not toast once a minute; the initial load and realtime path stay loud.
  const loadTimeOff = async (quiet) => {
    try {
      const rows = await db.query("time_off", { select: "id,person_id,kind,start_date,end_date" });
      const { vac, nc } = buildTimeOffMaps(rows || []);
      setVacations(vac);
      setNoCallDays(nc);
      // Real vacation data confirmed → arm the empty-save wipe guard (the
      // blob-mirror arming path is retired; the real source arms it now).
      if (Array.isArray(rows) && rows.length > 0) everHadRealDataRef.current = true;
    } catch (e) {
      console.error("time_off load failed", e);
      if (!quiet) showToast("Couldn't load vacations — data shown may be incomplete.", "error");
    }
  };

  // Silvis feed cache read (anon-readable). Same contract as loadTimeOff: a
  // failed read keeps the prior rows and warns — it never becomes "no Silvis
  // call". quiet=true on the 60s poll.
  const loadSilvisFeed = async (quiet) => {
    const seq = ++silvisLoadSeqRef.current;
    try {
      const rows = await sfLoadFeed(SUPABASE_URL, dbHeaders);
      if (seq !== silvisLoadSeqRef.current) return true; // superseded by a newer read — drop this response
      // PROBE RULE: an RLS-denied read is 200 + [] — indistinguishable from an
      // empty table, and the cache is never legitimately empty once filled.
      // A zero-row read is therefore a FAILED read: cache kept, error shown,
      // the Warnings panel and the generator gate say the rule is blind.
      if (!rows.length) throw new Error("read returned 0 rows — never filled (sign in and press Refresh) or denied by RLS (looks identical); cache kept");
      silvisRowsRef.current = rows;
      setSilvisRows(rows);
      setSilvisLoadError(null);
      return true;
    } catch (e) {
      if (seq !== silvisLoadSeqRef.current) return false;
      console.error("silvis_feed load failed — cached Silvis days kept", e);
      setSilvisLoadError(String(e?.message || e));
      if (!quiet) showToast("Couldn't load the Silvis feed — the last cached Silvis days are kept (a failed load never means 'no Silvis call'). " + String(e?.message || e).slice(0, 140), "error");
      return false;
    }
  };
  // Refresh = ask the silvis-feed edge function to re-pull Silvis (it writes
  // the cache with the service role; the client cannot), then re-read. Needs
  // a signed-in session (the function 401s the anon key). Runs quietly on
  // app load; loudly from the Refresh button.
  const refreshSilvisFeed = async (quiet) => {
    const h = dbAuthHeaders();
    if (!h.Authorization || h.Authorization === `Bearer ${SUPABASE_ANON_KEY}`) {
      if (!quiet) showToast("Sign in to refresh the Silvis feed (the cached days are still shown).", "error");
      return;
    }
    setSilvisRefreshing(true);
    // (review r5 fix-1) The Refresh button's outcome is never said on the
    // next session's screen (the session at the tap; the re-pull itself went
    // out with its headers, h).
    const ep = sessionEpochRef.current;
    try {
      // quiet (app load / poll) rides the function's 15-min freshness gate;
      // the Refresh button forces a real re-pull.
      const r = await sfRefreshFeed(SUPABASE_URL, h, !quiet);
      const ok = await loadSilvisFeed(quiet);
      if (sessionEpochRef.current !== ep) return;
      if (!quiet) showToast(!ok
        ? "Silvis was re-pulled on the server, but this device could not re-read the cache — still showing the previous days (see the Silvis feed card)."
        : r && r.skipped
          ? `Silvis feed is already fresh (${r.reason || "cache < 15 min old"}) — cache re-read, nothing re-pulled.`
          : `Silvis feed refreshed — ${r.days} days cached, ${silvisRule.code} primary on ${r.fak_primary}, backup on ${r.fak_backup}.`, ok ? "success" : "error");
    } catch (e) {
      console.warn("Silvis feed refresh failed — cache kept", e);
      if (sessionEpochRef.current === ep && !quiet) showToast("Silvis feed refresh FAILED — the cached Silvis days are kept and nothing changed (a failed fetch never means 'no Silvis call'). " + String(e?.message || e).slice(0, 120), "error");
    } finally { setSilvisRefreshing(false); }
  };

  // NOTE (hotfix 2026-09-24, live crash in 2026.09.24a): this block MUST sit
  // above every useCallback/useMemo whose deps name silvisActive/silvisBlock/
  // silvisRefuse — a deps array is evaluated at render, so a later `const`
  // is a temporal-dead-zone read ("Cannot access ... before initialization").
  // Pinned generically in test/sync-guards.js §P (deps declared before use).
  // silvisBusy derived state. FAK is resolved by roster CODE (the generator's
  // own idiom — never a literal id): the Davenport code IS the roster name.
  const silvisFakId = useMemo(() => {
    const want = String(silvisRule.code || "").toUpperCase();
    return want ? (surgeons.find(s => (s.name || "").toUpperCase() === want)?.id || null) : null;
  }, [surgeons, silvisRule.code]);
  // The rule's view (2026-10-11): silvis_feed now keeps Silvis history for the
  // totals card, so every existing reader — the rule, chips, feed card, generate
  // gate, horizon note — goes through sfRuleRows: exactly the rows v6 cached.
  // Only the 📊 totals card reads the full silvisRows.
  const silvisRuleRows = useMemo(() => sfRuleRows(silvisRows), [silvisRows]);
  const silvisDays = useMemo(() => sfDaysFromRows(silvisRuleRows, silvisRule.code), [silvisRuleRows, silvisRule.code]);
  const silvisActive = sfRuleActive(silvisRule) && !!silvisFakId;
  // The one overlap check every app-side mutation point calls (editor, trade
  // accept, two-way swap, one-way swapShift, suggestions). Reason string or null.
  const silvisBlock = useCallback((id, mondayStr, slotKey, wk) => {
    if (!silvisActive || id !== silvisFakId) return null;
    // `wk` (the week row; may be undefined) applies the precedence the
    // Warnings net uses: a holiday 24h held by someone else, or a Service Day
    // overridden to someone else, is not his — no false refusal there.
    const d = sfConflictDay(silvisDays.primary, sfHeldDays(wk, mondayStr, slotKey, id));
    return d ? `${nameOf(id)} is Silvis PRIMARY on ${d} (07:00 → 07:00 next day), which overlaps ${slotLabel(mondayStr, slotKey)}` : null;
  }, [silvisActive, silvisFakId, silvisDays]);
  // Refuse-with-override. Returns true when the caller must STOP. Schedulers
  // and admins may override with the reason on screen (as for other hard
  // rules); a member is refused outright — zero writes.
  const silvisRefuse = useCallback((reasons) => {
    if (!reasons.length) return false;
    const canOverride = isScheduler || userProfile?.role === "admin";
    if (!canOverride) {
      // A member gets a modal (a 4-second toast was a dead end), EVERY
      // reason, and what to do next.
      alert(`⛔ Blocked by rule silvisBusy\n\n${reasons.map(r => "• " + r).join("\n")}\n\nA Silvis primary day (07:00 → 07:00 next day) cannot take Davenport call. Decline the trade, or ask the scheduler to override.`);
      return true;
    }
    const ok = confirm(`⚠️ Silvis conflict (rule silvisBusy)\n\n${reasons.map(r => "• " + r).join("\n")}\n\nThis is a HARD rule: a Silvis primary day (07:00 → 07:00) cannot hold Davenport call. Override anyway?`);
    if (ok) logAudit("silvis.override", "Silvis conflict overridden: " + reasons.join("; "), { reasons });
    return !ok;
  }, [isScheduler, userProfile]);


  // DELETE against time_off. The app's `supabase` object is a hand-rolled fetch
  // wrapper that implements only select/upsert (no .delete()), so we issue the
  // DELETE directly with the same authenticated headers the db.* helpers use —
  // dbAuthHeaders() carries the logged-in user's token so RLS permits it.
  // → { ok } — and `unanswered` when no answer came (the outcome unknown).
  // opts.quiet: its caller tells the failure (the factory reset's one
  // message); otherwise it toasts — never on the next session's screen (the
  // session at the call, checked after the await — review r4 fixes-2).
  const deleteTimeOff = async (filter, opts) => {
    const ep = sessionEpochRef.current, quiet = !!(opts && opts.quiet);
    const tell = () => { if (!quiet && sessionEpochRef.current === ep) showToast("Couldn't remove that — check your connection and try again.", "error"); };
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off?${filter}`, {
        method: "DELETE",
        headers: dbAuthHeaders(),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        console.error("time_off delete failed", res.status, t);
        tell();
        return { ok: false };
      }
      return { ok: true };
    } catch (e) { console.error("time_off delete ex", e); tell(); return { ok: false, unanswered: true }; }
  };

  // ─── Write helpers (the ONLY paths that mutate time_off) ───
  // Each does an optimistic local update + the DB op when ON; when OFF it does
  // the old local-only mutation (the blob autosave persists it, as before).
  const setterFor = (kind) => kind === "nocall" ? setNoCallDays : setVacations;
  // (review r5 fix-1) Each of these writes with the headers of its call (the
  // session at the tap — db.insert / db.update / deleteTimeOff build them
  // there); a failure is never told on the next session's screen (the
  // session at the call, checked after the await — as deleteTimeOff's).

  const toAdd = async (personId, kind, start, end) => {
    if (!personId || !start || !end) return;
    const ep = sessionEpochRef.current;
    const tell = () => { if (sessionEpochRef.current === ep) showToast("Couldn't save that — check your connection and try again.", "error"); };
    setterFor(kind)(p => ({ ...p, [personId]: [...(p[personId] || []), [start, end]] }));
    logAudit(kind + ".add", `Added ${kind === "nocall" ? "no-call" : "vacation"} for ${nameOf(personId)}: ${start}${start !== end ? " → " + end : ""}`, { person_id: personId, kind, start, end });
    if (!USE_TIME_OFF) return;
    try {
      const { error } = await db.insert("time_off", {
        person_id: personId, kind, start_date: start, end_date: end,
        created_by: userProfile?.person_id || null,
      });
      if (error) { console.error("time_off insert error", error); tell(); }
      // realtime reload canonicalizes the optimistic entry (adds its id)
    } catch (e) { console.error("time_off insert ex", e); tell(); }
  };

  const toRemove = async (personId, kind, start, end) => {
    const map = kind === "nocall" ? noCallDays : vacations;
    const arr = map[personId] || [];
    const idx = arr.findIndex(([s, e]) => s === start && e === end);
    const rowId = idx >= 0 ? arr[idx][2] : null;
    setterFor(kind)(p => {
      const a = p[personId] || [];
      const i = a.findIndex(([s, e]) => s === start && e === end);
      if (i < 0) return p;
      const next = [...a]; next.splice(i, 1);
      return { ...p, [personId]: next };
    });
    logAudit(kind + ".remove", `Removed ${kind === "nocall" ? "no-call" : "vacation"} for ${nameOf(personId)}: ${start}${start !== end ? " → " + end : ""}`, { person_id: personId, kind, start, end });
    if (!USE_TIME_OFF) return;
    const q = rowId
      ? `id=eq.${rowId}`
      : `person_id=eq.${encodeURIComponent(personId)}&kind=eq.${kind}&start_date=eq.${start}&end_date=eq.${end}`;
    await deleteTimeOff(q);
  };

  const toEdit = async (personId, kind, oldStart, oldEnd, newStart, newEnd) => {
    if (!newStart || !newEnd) return;
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const tell = () => { if (sessionEpochRef.current === ep) showToast("Couldn't save that change — check your connection and try again.", "error"); };
    const map = kind === "nocall" ? noCallDays : vacations;
    const arr = map[personId] || [];
    const idx = arr.findIndex(([s, e]) => s === oldStart && e === oldEnd);
    const rowId = idx >= 0 ? arr[idx][2] : null;
    setterFor(kind)(p => {
      const a = [...(p[personId] || [])];
      const i = a.findIndex(([s, e]) => s === oldStart && e === oldEnd);
      if (i < 0) return p;
      a[i] = a[i][2] !== undefined ? [newStart, newEnd, a[i][2]] : [newStart, newEnd];
      return { ...p, [personId]: a };
    });
    logAudit(kind + ".edit", `Changed ${kind === "nocall" ? "no-call" : "vacation"} for ${nameOf(personId)}: ${oldStart}→${oldEnd} to ${newStart}→${newEnd}`, { person_id: personId, kind, oldStart, oldEnd, newStart, newEnd });
    if (!USE_TIME_OFF) return;
    try {
      if (rowId) {
        const { error } = await db.update("time_off", rowId, { start_date: newStart, end_date: newEnd });
        if (error) { console.error("time_off update error", error); tell(); }
      } else {
        // No id yet (optimistic): fall back to delete-old + insert-new (delete toasts on its own failure)
        await deleteTimeOff(`person_id=eq.${encodeURIComponent(personId)}&kind=eq.${kind}&start_date=eq.${oldStart}&end_date=eq.${oldEnd}`);
        const row = { person_id: personId, kind, start_date: newStart, end_date: newEnd, created_by: userProfile?.person_id || null };
        if (sessionEpochRef.current === ep) await db.insert("time_off", row);
        else {
          // (review r5 fix-1) Another session now — the old dates were removed
          // as this account, between the two awaits: the new ones are added as
          // it too (the tap's headers), never as the next account (nor refused
          // as anon, the time off lost). Nothing said; a failure is logged (the
          // console, and an audit line as this account) for a manual fix.
          const res = await fetch(`${SUPABASE_URL}/rest/v1/time_off`, { method: "POST", headers: { ...tapH, Prefer: "return=minimal" }, body: JSON.stringify(row) }).catch((e) => ({ ok: false, status: String(e && e.message || e) }));
          if (!res.ok) {
            console.error("time_off edit not finished (the session changed): the old dates were removed, the new ones could NOT be added — needs a manual fix", personId, kind, newStart, newEnd, res.status);
            logAudit(kind + ".edit_unfinished", `Changing ${kind === "nocall" ? "no-call" : "vacation"} for ${nameOf(personId)} ${oldStart}→${oldEnd} to ${newStart}→${newEnd}: the old dates were removed, the new ones could NOT be added (the session changed) — needs a manual fix`, { person_id: personId, kind, newStart, newEnd }, tapH);
          }
        }
      }
    } catch (e) { console.error("time_off edit ex", e); tell(); }
  };

  // Wipe time_off rows + clear local maps. kind omitted = both; else just that
  // kind (the "delete all vacations" button clears vacations only).
  // → { ok, unanswered? } (review r4 fixes-2: the factory reset awaits and
  // checks it). The screen is cleared only once the DELETE has landed: a
  // failed one leaves the time off showing — as the server still holds it —
  // instead of an empty screen until the 60-s poll brings it back.
  // opts.quiet: as deleteTimeOff's.
  // Its audit line (review r5 regress-1; the 21/n open item) is written only
  // once the clear has landed — a failed DELETE logged no "Cleared ALL" — and
  // as the account that tapped (its headers, taken at the call) when the
  // session changed while the DELETE was out (never under the next token).
  const toClearAll = async (kind, opts) => {
    const ep = sessionEpochRef.current, tapH = dbAuthHeaders();
    const clearHere = () => {
      if (!kind || kind === "vacation") setVacations({}); if (!kind || kind === "nocall") setNoCallDays({});
      logAudit("timeoff.clearall", `Cleared ALL ${kind ? (kind === "nocall" ? "no-call days" : "vacations") : "vacations and no-call days"} for everyone`, { kind: kind || "both" }, sessionEpochRef.current === ep ? undefined : tapH);
    };
    if (!USE_TIME_OFF) { clearHere(); return { ok: true }; }
    const r = await deleteTimeOff(`id=not.is.null${kind ? `&kind=eq.${kind}` : ""}`, opts);
    if (r.ok) clearHere();
    return r;
  };

  // ─── Supabase: Load on mount + real-time sync ───
  useEffect(() => {
    (async () => {
      loadFailedRef.current = false; // reset each load attempt
      try {
        const { data: row } = await supabase
          .from("call_schedule_data")
          .select("data,updated_at")
          .eq("id", "main")
          .single();
        setupReadRef.current = true; // .single() throws on failure: this account's setup is read — the autosave may write it (adopted just below, in the same render)
        if (row?.data) {
          const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
          if (row.updated_at) lastSyncRef.current = row.updated_at; // prevent auto-save from re-saving unchanged data
          if (d.surgeons) setSurgeons(d.surgeons);
          if (d.apps) setApps(d.apps);
          if (!USE_TIME_OFF) { if (d.vacations) setVacations(d.vacations); if (d.noCallDays) setNoCallDays(d.noCallDays); }
          if (d.backupMondays) setBackupMondaySet(new Set(d.backupMondays));
          if (d.fierceBackup) setFierceBackupSet(new Set(d.fierceBackup));
          if (d.appShifts) setAppShifts(d.appShifts);
          if (d.priorCounts && Object.values(d.priorCounts).some(c => Object.values(c).some(v => v > 0))) setPriorCounts(d.priorCounts);
          if (d.year1Counts && Object.values(d.year1Counts).some(c => Object.values(c).some(v => v > 0))) setYear1Counts(d.year1Counts);
          if (d.startMonth !== undefined) setStartMonth(d.startMonth);
          if (d.startYear !== undefined) setStartYear(d.startYear);
          if (d.numWeeks) setNumWeeks(d.numWeeks);
          if (d.startMondayOverride !== undefined) setStartMondayOverride(d.startMondayOverride || "");
          if (d.holidayAssignments) setHolidayAssignments(d.holidayAssignments);
          if (Array.isArray(d.pendingLocks)) setPendingLocks(d.pendingLocks);
          if (d.silvisRule) setSilvisRule(sfRule(d.silvisRule));
          if (Array.isArray(d.dismissedWarnings)) setDismissedWarnings(d.dismissedWarnings);
          // Arm the empty-save guard if the loaded row already holds real data.
          if ((d.schedule && Object.keys(d.schedule).length) ||
              (d.vacations && Object.keys(d.vacations).length) ||
              (d.appShifts && Object.keys(d.appShifts).length)) {
            everHadRealDataRef.current = true;
          }
        }
        // Own try/catch (like the app_shifts read below): .single() now throws
        // on HTTP failure, and this read sits mid-way through the outer try —
        // without this, a config-only failure would abort the app_shifts,
        // vacation-request, trade and notification loads that follow. It also
        // must NOT reach the outer catch: this table is authenticated-only, so
        // a stale token's anon fallback is RLS-filtered to an empty result, and
        // a failure here only means "no dispatch URL yet" (the Settings banner
        // says so, the poll repairs it) — not a degraded session that should
        // arm loadFailedRef and suppress saving.
        try {
          const { data: cfgRow } = await supabase
            .from("call_schedule_config")
            .select("edge_function_url")
            .eq("id", "config")
            .single();
          if (cfgRow?.edge_function_url) setEdgeFunctionUrl(cfgRow.edge_function_url);
        } catch(e) { console.error("Edge-function URL load failed:", e); }

        // APP shifts now live in their own table (app_shifts_data) so that an
        // APP-lead with can_assign_apps can write them without touching the
        // schedule blob. If a row exists it is authoritative; otherwise we keep
        // whatever the legacy blob set above (migration safety).
        try {
          const { data: appRow } = await supabase
            .from("app_shifts_data").select("data").eq("id", "main").single();
          setAppShiftsLoaded(true); // .single() throws on failure: reaching here IS a successful read
          if (appRow?.data && typeof appRow.data === "object") setAppShifts(appRow.data);
        } catch(e) { console.error("APP shifts load failed:", e); }

        // APP day-offs (display-only) — second row of the same table
        // (id="dayoff") so they inherit the can_assign_apps write gate with
        // no schema change. A missing row is the normal starting state and a
        // SUCCESSFUL read — it arms the edit gate; a thrown read leaves the
        // gate disarmed so a tap can't overwrite unloaded data. Plain public
        // mode never renders day-offs, so it skips the fetch entirely; the OR
        // board (?public=1&view=or) does render them, so it fetches. Read-only
        // either way — no public path reaches enqueueDayOffSave.
        if (appOffVisible) try {
          const { data: offRow } = await supabase
            .from("app_shifts_data").select("data,updated_at").eq("id", "dayoff").single();
          adoptDayOffRow(offRow); // shared guard: dirty-skip + staleness check + gate arming
        } catch(e) { console.error("APP day-off load failed (editing stays disabled):", e); }

        // Load vacation requests
        try {
          const reqs = await db.query("vacation_requests", { order: "submitted_at.desc", limit: 100 });
          if (Array.isArray(reqs)) setVacRequests(reqs);
        } catch(e) { console.error("Vacation requests load failed:", e); }

        // Load shift trade requests
        try {
          const trades = await db.query("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
          if (Array.isArray(trades)) setTradeRequests(trades);
        } catch(e) { console.error("Trade requests load failed:", e); }

        // Load recent notifications
        try {
          const notifs = await db.query("notifications", { order: "created_at.desc", limit: 50 });
          if (Array.isArray(notifs)) setNotifications(notifs);
        } catch(e) { console.error("Notifications load failed:", e); }
      } catch (e) {
        console.error("Supabase load error:", e);
        loadFailedRef.current = true; // read threw — suppress autosave until a read succeeds
        showToast("Couldn't load the latest data — check your connection and reload.", "error");
      }
      // The schedule: schedule_weeks, read by the sync engine — its own read,
      // independent of the blob above (a blob failure no longer leaves the
      // schedule unread). First pass: seeds the mirror. A later pass (sign-in,
      // biometric unlock, the auto-login bump) is a PULL in the engine's chain,
      // so an edit made in between survives it and is then sent. A failed read
      // leaves the engine unloaded: edits are refused with a reason and the
      // 60-s pull repairs it — never a blank schedule that could be saved over
      // the table.
      {
        const sr = await schedSyncRef.current.load();
        if (sr.ok && Object.keys(scheduleRef.current).length) everHadRealDataRef.current = true;
      }
      if (USE_TIME_OFF) { await loadTimeOff(); } // vacations/no-call come from time_off, not the blob
      await loadSilvisFeed();      // cached Silvis days (anon read) — the generator/editor gates read these
      refreshSilvisFeed(true);     // and ask the function to re-pull Silvis in the background (signed-in only)
      setLoaded(true);
      loadedAtRef.current = Date.now();

      // NOTE: The MAY_AUG_VACATIONS / FIERCE / HAND_SCHEDULE seed blocks that
      // used to live here have been removed (v21d). They were causing edits
      // to revert whenever a new device or browser profile (including
      // incognito mode) loaded the app — the local seed flag doesn't exist
      // on those fresh profiles, so the merge would run, write hardcoded
      // original values back to Supabase, and propagate the revert via
      // Realtime to all connected devices.
      //
      // The seed data is ALREADY in Supabase (it was written during initial
      // population on Apr 20). All devices load from Supabase via the code
      // above, so they inherit the current state — whether original or edited.
      // No code-side seeding is needed anymore.
      //
      // If a fresh Supabase install is ever needed (very unlikely), an
      // admin can manually paste the MAY_AUG_VACATIONS / HAND_SCHEDULE data
      // into the Setup tab, or run a one-time SQL insert.
    })();

    // ─── Realtime subscriptions (preferred) with safety-net poll ───
    // Replaces the old 15-second poll. Supabase Realtime pushes changes
    // via WebSocket the instant they happen. We also run a much slower
    // 60-second poll as a safety net in case the WebSocket drops or misses
    // an event. lastSyncRef still protects against self-echo (we skip our
    // own updates by comparing updated_at timestamps).

    // Helper: re-read the schedule row and apply it to state (shared by
    // Realtime handler and safety-net poll)
    const refreshScheduleRow = async () => {
      try {
        const { data: row } = await supabase.from("call_schedule_data").select("data,updated_at").eq("id", "main").single();
        loadFailedRef.current = false; // a read succeeded — writes are safe again
        if (!row?.data) return;
        if (row.updated_at === lastSyncRef.current) return; // nothing new
        lastSyncRef.current = row.updated_at;
        const d = typeof row.data === "string" ? JSON.parse(row.data) : row.data;
        setupReadRef.current = true; // adopted just below, in the same render (after a session boundary lastSyncRef is null, so the first read lands here)
        if (d.surgeons) setSurgeons(d.surgeons);
        if (d.apps) setApps(d.apps);
        if (!USE_TIME_OFF) { if (d.vacations) setVacations(d.vacations); if (d.noCallDays) setNoCallDays(d.noCallDays); }
        if (d.backupMondays) setBackupMondaySet(new Set(d.backupMondays));
        if (d.fierceBackup) setFierceBackupSet(new Set(d.fierceBackup));
        if (d.priorCounts && Object.values(d.priorCounts).some(c => Object.values(c).some(v => v > 0))) setPriorCounts(d.priorCounts);
        if (d.year1Counts && Object.values(d.year1Counts).some(c => Object.values(c).some(v => v > 0))) setYear1Counts(d.year1Counts);
        if (d.startMonth !== undefined) setStartMonth(d.startMonth);
        if (d.startYear !== undefined) setStartYear(d.startYear);
        if (d.numWeeks) setNumWeeks(d.numWeeks);
        if (d.startMondayOverride !== undefined) setStartMondayOverride(d.startMondayOverride || "");
        if (d.holidayAssignments) setHolidayAssignments(d.holidayAssignments);
        if (Array.isArray(d.pendingLocks)) setPendingLocks(d.pendingLocks);
        if (d.silvisRule) setSilvisRule(sfRule(d.silvisRule)); // rule-as-data follows the blob (poll / realtime)
        if (Array.isArray(d.dismissedWarnings)) setDismissedWarnings(d.dismissedWarnings); // a dismissal reaches every open session within one poll
        if ((d.schedule && Object.keys(d.schedule).length) ||
            (d.vacations && Object.keys(d.vacations).length) ||
            (d.appShifts && Object.keys(d.appShifts).length)) {
          everHadRealDataRef.current = true;
        }
      } catch(e) { console.warn("Background schedule refresh failed:", e); }
    };

    const refreshConfigRow = async () => {
      try {
        const { data: cfgRow2 } = await supabase.from("call_schedule_config").select("edge_function_url").eq("id", "config").single();
        // Truthy guard (not just "defined"): a blank stored row must never
        // blank a working session's in-memory URL mid-flight. Non-empty
        // updates still propagate to live sessions within one poll cycle.
        if (cfgRow2?.edge_function_url) setEdgeFunctionUrl(prev => cfgRow2.edge_function_url !== prev ? cfgRow2.edge_function_url : prev);
      } catch(e) { console.warn("Background config refresh failed:", e); }
    };

    const refreshAppShifts = async () => {
      try {
        const { data: appRow } = await supabase.from("app_shifts_data").select("data").eq("id", "main").single();
        setAppShiftsLoaded(true); // a successful read (re-)arms the APP wipe guard
        if (appRow?.data && typeof appRow.data === "object") setAppShifts(appRow.data);
        // Same table, second row: the realtime subscription and poll both land
        // here, so day-off edits propagate on the same channel. Plain public
        // mode never renders day-offs — skip the fetch; the OR board does.
        // MUST stay in step with the mount fetch above: flipping only one
        // leaves the OR board either blank for 60s or frozen at load state.
        // Adoption goes through the shared adoptDayOffRow guard: local-dirty
        // edits win, and a response older than our last confirmed write is
        // discarded (a slow GET that left before our commit must not
        // resurrect the pre-commit map).
        if (appOffVisible) {
          const { data: offRow } = await supabase.from("app_shifts_data").select("data,updated_at").eq("id", "dayoff").single();
          adoptDayOffRow(offRow);
        }
      } catch(e) { console.warn("Background APP-shifts refresh failed:", e); }
    };

    const refreshVacReqs = async () => {
      try {
        const reqs = await db.query("vacation_requests", { order: "submitted_at.desc", limit: 100 });
        if (Array.isArray(reqs)) setVacRequests(reqs);
      } catch(e) { console.warn("Background vacation-requests refresh failed:", e); }
    };

    const refreshTradeReqs = async () => {
      try {
        const trades = await db.query("shift_trade_requests", { order: "submitted_at.desc", limit: 100 });
        if (Array.isArray(trades)) setTradeRequests(trades);
      } catch(e) { console.warn("Background trade-requests refresh failed:", e); }
    };

    const refreshNotifs = async () => {
      try {
        const notifs = await db.query("notifications", { order: "created_at.desc", limit: 50 });
        if (Array.isArray(notifs)) setNotifications(notifs);
      } catch(e) { console.warn("Background notifications refresh failed:", e); }
    };

    const refreshAll = async () => {
      await Promise.allSettled([
        // Other people's week changes (#69's goal): the engine adopts weeks
        // this session hasn't edited, then sends anything pending — so a
        // failed save retries every minute even when nothing else changes.
        schedSyncRef.current.pull(),
        refreshScheduleRow(),
        refreshConfigRow(),
        refreshAppShifts(),
        refreshVacReqs(),
        refreshTradeReqs(),
        refreshNotifs(),
        // time_off was the ONLY synced table with no poll refresher — a missed
        // initial load stayed missed all session. quiet: poll failures must
        // not toast once a minute (loadTimeOff already catches internally, so
        // allSettled never sees a rejection from it).
        USE_TIME_OFF ? loadTimeOff(true) : Promise.resolve(),
        loadSilvisFeed(true),
      ]);
    };

    // Wire up Realtime subscriptions if the SDK is available.
    // The SDK loads via ES module (async), so we wait for it if needed.
    let rtChannel = null;
    let rtClient = null;
    const setupRealtime = () => {
      try {
        rtClient = (typeof getSupabaseRT === "function") ? getSupabaseRT() : null;
        if (!rtClient) return false;
        rtChannel = rtClient.channel("dsg-schedule-sync")
          .on("postgres_changes", { event: "*", schema: "public", table: "call_schedule_data" }, refreshScheduleRow)
          .on("postgres_changes", { event: "*", schema: "public", table: "call_schedule_config" }, refreshConfigRow)
          .on("postgres_changes", { event: "*", schema: "public", table: "app_shifts_data" }, refreshAppShifts)
          .on("postgres_changes", { event: "*", schema: "public", table: "vacation_requests" }, refreshVacReqs)
          .on("postgres_changes", { event: "*", schema: "public", table: "time_off" }, () => { if (USE_TIME_OFF) loadTimeOff(); })
          // (schedule_weeks has no realtime handler: the sync engine's pull is
          // the one adopter, so adoption can't race a save. Revival = D1.)
          .on("postgres_changes", { event: "*", schema: "public", table: "shift_trade_requests" }, refreshTradeReqs)
          .on("postgres_changes", { event: "*", schema: "public", table: "notifications" }, refreshNotifs)
          .subscribe((status) => {
            // On (re)connect, do one immediate fetch to catch anything we missed
            if (status === "SUBSCRIBED") refreshAll();
          });
        return true;
      } catch(e) { console.warn("Realtime subscribe failed, falling back to poll:", e); return false; }
    };

    // Try immediately; if SDK not ready yet, wait for the ready event (up to 5s)
    if (!setupRealtime()) {
      const onReady = () => { window.removeEventListener("supabase-sdk-ready", onReady); setupRealtime(); };
      window.addEventListener("supabase-sdk-ready", onReady);
      setTimeout(() => { window.removeEventListener("supabase-sdk-ready", onReady); if (!rtChannel) setupRealtime(); }, 5000);
    }

    // Safety-net poll: every 60 seconds, do a full refresh. Runs regardless
    // of Realtime state — if Realtime is working, nothing will actually change
    // state (updated_at check prevents it). If Realtime is broken, this keeps
    // the app usable at 60s latency instead of frozen.
    const pollInterval = setInterval(refreshAll, 60000);

    return () => {
      clearInterval(pollInterval);
      if (rtChannel && rtClient) { try { rtClient.removeChannel(rtChannel); } catch(e) { console.warn("Realtime channel cleanup failed:", e); } }
    };
  }, [reloadTrigger]);

  // ─── Lightweight toast (non-blocking notifications) ───
  // For happy-path confirmations that don't need a blocking dialog. Validation
  // errors and destructive confirms deliberately stay as native dialogs — an
  // auto-dismissing toast would be the wrong tool for "are you sure?" or "fix
  // this field". role=status + aria-live announces it to screen readers.
  const [toast, setToast] = useState(null); // { msg, tone } | null
  const toastTimerRef = useRef(null);
  const showToast = (msg, tone) => {
    setToast({ msg: msg, tone: tone || "info" });
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 4000);
  };

  // ─── Sync engine v2: the ONE reader/writer of schedule_weeks ───
  // Created once (a ref), so its job chain and what it knows of the table
  // survive re-renders. Everything per-render reaches it through
  // schedSyncBridgeRef (the latest-closure bridge, as for the day-off flush),
  // so nothing it calls is stale. Its status drives the header, the load and
  // sign-in gates, and the reload / sign-out guards.
  const [schedSync, setSchedSync] = useState({ seeded: false, loadFailed: false, pending: 0, pendingKeys: [], saving: 0, failing: 0, auth: "ok", authNeeded: false, rejected: [], rejectCodes: [], noPermission: [], blockedDeletes: 0, staleRemovals: 0, conflicts: [], busy: null, stalled: false });
  const schedSyncBridgeRef = useRef(null);
  // onAdopted (A13): the engine just put someone else's copy of these weeks
  // on screen (a pull, a conflict).
  //  - An OPEN week editor on one of them says so at once, and what its Save
